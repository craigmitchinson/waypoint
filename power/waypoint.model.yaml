      - { type: lookup, from: wp_reservation.wp_categoryid, to: wp_listvalue, cascade: { delete: Restrict } }
      - { type: lookup, from: wp_reservation.wp_teamid, to: wp_team, cascade: { delete: RemoveLink }, note: The team the row belongs to. }

