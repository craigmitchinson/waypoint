      - { schemaName: wp_workitemid, displayName: Work item, type: lookup, target: wp_workitem, required: false, source: Assignment.item, description: Blank for a booking against no item, such as BAU. }
      - { schemaName: wp_typeid, displayName: Booking type, type: lookup, target: wp_listvalue, required: false, source: Assignment.type, description: "Reservation category for non-work bookings; blank for work bookings, which carry a work item instead." }
      - { schemaName: wp_from, displayName: From, type: date, required: true, source: Assignment.from }
      - { schemaName: wp_to, displayName: To, type: date, required: true, source: Assignment.to }
