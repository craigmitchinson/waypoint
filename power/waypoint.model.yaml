  - logicalName: wp_request
    displayName: Request
    displayCollectionName: Requests
    source: New. The front door in power/design-front-door.md, section 3.
    primaryColumn: wp_name
    description: >-
      The front door. A request arrives here, a product owner screens it, and it is promoted to a
      work item or declined with a reason. User owned, so a requester reading at user depth sees
      only their own requests. No alternate key, because a request is never addressed by name.
    columns:
      - { schemaName: wp_name, displayName: Title, type: text, maxLength: 200, required: true, source: New, description: A short title for the request. Not unique. }
      - { schemaName: wp_requesterid, displayName: Requester, type: lookup, target: systemuser, required: false, source: New, description: The signed-in user who submitted it. Blank where the row was loaded rather than typed. }
      - { schemaName: wp_requestername, displayName: Requester name, type: text, maxLength: 100, required: true, source: Question 1, description: Pre-filled from the signed-in user, and kept as text so the request reads without the user row. }
      - { schemaName: wp_requesteremail, displayName: Requester email, type: text, format: email, maxLength: 200, required: true, source: Question 1 }
      - { schemaName: wp_businessarea, displayName: Business area, type: text, maxLength: 100, required: true, source: Question 2 }
      - { schemaName: wp_sponsor, displayName: Sponsor, type: text, maxLength: 100, required: true, source: Question 3, description: The person who will back it, and who knows they are being named. }
      - { schemaName: wp_sponsoremail, displayName: Sponsor email, type: text, format: email, maxLength: 200, required: false, source: Question 3 }
      - { schemaName: wp_labid, displayName: Lab, type: lookup, target: wp_lab, required: false, source: Question 4, description: Where the requester thinks it belongs. Blank is an answer. }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: false, source: Question 4, description: Where the requester thinks it belongs. Blank is an answer, and the product owner sets it on screening. }
      - { schemaName: wp_productline, displayName: Product line, type: choice, choiceSet: wp_productline, required: true, source: Question 35, description: Blue Prism, Power Automate, Power Apps, Copilot Studio or Other. }
      - { schemaName: wp_productlineother, displayName: Other product line, type: text, maxLength: 100, required: false, source: Question 35, description: Only where the product line is Other. }
      - { schemaName: wp_problem, displayName: The problem, type: memo, maxLength: 1000, required: true, source: Question 5, description: One sentence. It becomes the spike question on promotion. }
      - { schemaName: wp_desiredoutcome, displayName: What good looks like, type: memo, maxLength: 1000, required: true, source: Question 17 }
      - { schemaName: wp_whobenefits, displayName: Who benefits, type: memo, maxLength: 1000, required: true, source: Question 7 }
      - { schemaName: wp_peopleaffected, displayName: People affected, type: whole, min: 0, required: false, source: Question 7, description: Roughly how many people feel the problem. }
      - { schemaName: wp_currentprocess, displayName: Process today, type: memo, maxLength: 4000, required: true, source: Question 10, description: Step by step, as it runs today. }
      - { schemaName: wp_volume, displayName: Runs per period, type: whole, min: 0, required: false, source: Question 11, description: How many times it runs. The period is the frequency beside it. }
      - { schemaName: wp_frequency, displayName: Frequency, type: choice, choiceSet: wp_frequency, required: false, source: Question 11 }
      - { schemaName: wp_handlingminutes, displayName: Minutes per run, type: whole, min: 0, required: false, source: Question 12, description: How long one run takes a person. With the volume it is the time released estimate. }
      - { schemaName: wp_systems, displayName: Systems touched, type: memo, maxLength: 1000, required: false, source: Question 13, description: Semicolon separated where the requester lists them. }
      - { schemaName: wp_datasensitivity, displayName: Data sensitivity, type: choice, choiceSet: wp_datasensitivity, required: true, source: Question 15 }
      - { schemaName: wp_urgency, displayName: Urgency, type: choice, choiceSet: wp_urgency, required: false, source: Question 21 }
      - { schemaName: wp_deadline, displayName: Live by, type: date, required: false, source: Question 21, description: Date only, time zone independent. }
      - { schemaName: wp_deadlinereason, displayName: What happens if it slips, type: memo, maxLength: 1000, required: false, source: Question 21 }
      - { schemaName: wp_benefittype, displayName: Benefit type, type: choice, choiceSet: wp_benefittype, required: false, source: Question 18, description: The same set the work item and the claims use, so the estimate carries across on promotion. }
      - { schemaName: wp_benefitsize, displayName: Benefit size, type: text, maxLength: 200, required: false, source: Question 19, description: Free text, because a requester estimates in people or in pounds and a guess is fine. }
      - { schemaName: wp_constraints, displayName: Constraints, type: memo, maxLength: 2000, required: true, source: Question 36, description: What could stop this working. Policy, access, a contract, a team that has to agree. }
      - { schemaName: wp_attachments, displayName: Link, type: text, format: url, maxLength: 500, required: false, source: Question 37, description: A link rather than files. Real attachments are deferred. }
      - { schemaName: wp_status, displayName: Request status, type: choice, choiceSet: wp_requeststatus, required: true, source: The lifecycle table, description: New on submit. Only the product owner and the engineering lead move it on. }
      - { schemaName: wp_screeningnotes, displayName: Screening notes, type: memo, maxLength: 4000, required: false, source: The Screen action }
      - { schemaName: wp_screenedbyid, displayName: Screened by, type: lookup, target: wp_person, required: false, source: The Screen action }
      - { schemaName: wp_screenedon, displayName: Screened on, type: date, required: false, source: The Screen action, description: With the created date it is how long a request waited for a decision. }
      - { schemaName: wp_promotedtoid, displayName: Promoted to, type: lookup, target: wp_workitem, required: false, source: The Promote actions, description: The work item the request became. The link is read from the request side, so the register gains no column. }
      - { schemaName: wp_declinecategory, displayName: Decline category, type: text, maxLength: 100, required: false, source: The Decline action, description: Text rather than a choice until the queue has run long enough to say what the categories are. }
      - { schemaName: wp_declinereason, displayName: Decline reason, type: memo, maxLength: 2000, required: false, source: The Decline action, description: Required with the category when the status is Declined. }
    alternateKeys: []
    relationships:
      - { type: lookup, from: wp_request.wp_labid, to: wp_lab, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_request.wp_teamid, to: wp_team, cascade: { assign: Cascade, delete: RemoveLink }, note: A request keeps its history when a team goes. }
      - { type: lookup, from: wp_request.wp_requesterid, to: systemuser, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_request.wp_screenedbyid, to: wp_person, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_request.wp_promotedtoid, to: wp_workitem, cascade: { delete: RemoveLink }, note: Deleting the work item leaves the request, which is how a promotion is undone. }

# ---------------------------------------------------------------------------
# Security roles. Dataverse roles are solution components, not rows; this is the
# privilege matrix the four roles are built from.
#   C create, R read, U write (update), D delete. Depth O is organisation.
#   "-" is no privilege at all.
# ---------------------------------------------------------------------------
securityRoles:
  roles:
    - name: Waypoint Product Owner
      description: Owns the shape of the plan and the benefits. Does not touch the engine's dials.
    - name: Waypoint Engineering lead
      description: Sizes, schedules and closes. The only role that can run a quarter close.
    - name: Waypoint Squad member
      description: Updates their own work and their own absences. Reads everything else.
    - name: Waypoint Viewer
      description: Reads the plan. Writes nothing.

  privileges:
    wp_platform:       { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_lab:            { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_team:           { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_request:        { ProductOwner: "CRUD O", EngineeringLead: "CRU O",  SquadMember: "R O",             Viewer: "R O" }
    wp_person:         { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O, U self",     Viewer: "R O" }
    wp_squad:          { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_workitem:       { ProductOwner: "CRU O",  EngineeringLead: "CRUD O", SquadMember: "R O, U assigned", Viewer: "R O" }
    wp_assignee:       { ProductOwner: "CRUD O", EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_assignment:     { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O, CU self",    Viewer: "R O" }
    wp_absence:        { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O, CRUD self",  Viewer: "R O" }
    wp_benefitclaim:   { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_benefitactual:  { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_reservation:    { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_quarter:        { ProductOwner: "R O",    EngineeringLead: "CRU O",  SquadMember: "R O",             Viewer: "R O" }
    wp_setting:        { ProductOwner: "R O",    EngineeringLead: "RU O",   SquadMember: "R O",             Viewer: "R O" }
    wp_graderate:      { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_gradeblend:     { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_gradeblendline: { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_workstate:      { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_outcome:        { ProductOwner: "CRUD O", EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_epic:           { ProductOwner: "CRUD O", EngineeringLead: "CRU O",  SquadMember: "R O",             Viewer: "R O" }
    wp_bankholiday:    { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_quartersnapshot: { ProductOwner: "R O",    EngineeringLead: "CR O",   SquadMember: "R O",             Viewer: "R O" }
    wp_archiverow:     { ProductOwner: "R O",    EngineeringLead: "CR O",   SquadMember: "R O",             Viewer: "R O" }
    wp_activitylog:    { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "R O",             Viewer: "R O" }
    wp_importprofile:  { ProductOwner: "CRU O",  EngineeringLead: "CRU O",  SquadMember: "R O",             Viewer: "-" }
    wp_importrun:      { ProductOwner: "CR O",   EngineeringLead: "CR O",   SquadMember: "R O",             Viewer: "-" }
    wp_size:           { ProductOwner: "R O",    EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_listvalue:      { ProductOwner: "CRU O",  EngineeringLead: "CRUD O", SquadMember: "R O",             Viewer: "R O" }
    wp_teamgradecost:  { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "-",               Viewer: "-" }
    wp_costline:       { ProductOwner: "R O",    EngineeringLead: "R O",    SquadMember: "-",               Viewer: "-" }

  notes:
    - >-
      Nobody deletes an activity log row, a quarter snapshot or an archive row. Only the system
      administrator can, and that is deliberate.
    - >-
      "U self" and "U assigned" are not Dataverse depths. They are enforced by record ownership plus a
      business rule, or by the app filtering the form to the signed-in user's Person row. The build
      guide says which for each case.
    - >-
      Financials (team grade costs and cost lines) is money the wider team should not see, so the
      Squad member and Viewer roles have no privilege on those two tables.
