    alternateKeys: []
    relationships:
      - { type: lookup, from: wp_assignment.wp_personid, to: wp_person, cascade: { delete: RemoveLink }, note: "reservations.ts already tolerates an assignment naming a person who has gone: it draws nothing down." }
