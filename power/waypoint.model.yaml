      - { schemaName: wp_claimid, displayName: Claim, type: lookup, target: wp_benefitclaim, required: false, source: New, description: Blank for an FTE released actual, which has no claim row. }
      - { schemaName: wp_value, displayName: Actual value, type: decimal, precision: 4, required: true, source: BenefitActual.value, description: "The mock's type allows a string and treats one as zero; Dataverse takes a number, and the form already refuses a blank." }
      - { schemaName: wp_when, displayName: When, type: date, required: true, source: BenefitActual.when, description: The first of the month it landed in. The pro-rating reads month and year only. }
      - { schemaName: wp_note, displayName: Note, type: memo, maxLength: 1000, required: false, source: BenefitActual.note }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: true, source: New, description: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }
