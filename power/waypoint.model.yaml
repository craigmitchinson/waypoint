# Waypoint on Dataverse: the neutral data model.
#
# This file is the single source of truth for the tables. data-model.md explains it, build-guide.md
# builds it. Every column names the field in src/model/types.ts it comes from, so the mock and the
# Dataverse solution can be read side by side.
#
# Conventions
#   - Publisher prefix wp, all logical names lower case, no spaces.
#   - "computedIn: app" means the value is never stored; a Power Fx named formula or user-defined
#     function works it out at read time. "computedIn: dataverse" means a calculated or rollup column.
#     "computedIn: flow" means a Power Automate flow or low-code plugin writes it.
#   - The mock keys records by name (person name, work item title, squad name). Dataverse keys by GUID
#     and keeps the name as an alternate key, so the app can still look a record up by the text the
#     workbook uses.

model:
  name: Waypoint
  version: "2.0"
  publisherPrefix: wp
  publisherName: CCS Intelligent Process Automation
  solution: WaypointCapacityPlanner
  language: en-GB
  ownership: >-
    Every business table is user or team owned except the reference tables (WorkState, GradeRate,
    GradeBlend, Size, ListValue, BankHoliday, Setting), which are organisation owned.

# ---------------------------------------------------------------------------
# Global choice sets. The labels are the literal strings the engine compares against
# (src/store/validate.ts and src/seed/seed.json); the numeric values are ours.
#
# Deviation in the built solution: scripts/build-solution.mjs writes these as local option sets on
# each choice column, not as global choice sets, because the target environment rejects the global
# <optionsets> block. Labels and values are unchanged; a set used by two columns is written twice.
# power/solution/README.md records this and the other import deviations (alternate keys are made by
# hand in the maker portal, and every lookup relationship carries a description).
# ---------------------------------------------------------------------------
choices:
  wp_workkind:
    displayName: Work kind
    source: WorkKind in types.ts; KINDS in validate.ts
    values:
      100000000: Feature
      100000001: Spike
      100000002: Component

  wp_workphase:
    displayName: Work phase
    source: WorkPhase in types.ts; phaseOf() in validate.ts
    values:
      100000000: Shaping
      100000001: Assessment
      100000002: Delivery
      100000003: Release
      100000004: Validated
      100000005: Stopped
    note: >-
      The mock allows "" for an item with no phase. In Dataverse the column is simply empty, and
      phaseOf() still derives the phase from the state for the seven states it names.

  wp_worksource:
    displayName: Work source
    source: wp_source in power/design-work-flow-rev2.md, section 5
    values:
      100000000: Front door
      100000001: Direct
      100000002: Jira

  wp_capacityimpact:
    displayName: Capacity impact
    source: CapacityImpact in types.ts; STATE_ROWS in seed.json
    values:
      100000000: None
      100000001: Reserved
      100000002: Allocated
      100000003: Consumed
      100000004: Historical
      100000005: Hold
      100000006: Removed
    note: >-
      The seed ships no state with the Allocated impact, but counts() tests for it, so the value stays.

  wp_commitment:
    displayName: Commitment
    source: Commitment in types.ts; WorkItem.proposed
    values:
      100000000: Proposed
      100000001: Committed

  wp_spikeoutcome:
    displayName: Spike outcome
    source: SpikeOutcome in types.ts; SPIKE_OUTCOMES in validate.ts
    values:
      100000000: Feasible
      100000001: Not feasible
      100000002: More discovery

  wp_employment:
    displayName: Employment
    source: EMPLOYMENTS in validate.ts
    values:
      100000000: Permanent
      100000001: NPW
      100000002: Open vacancy

  wp_teamgrade:
    displayName: Team grade
    source: TEAM_GRADES in validate.ts
    values:
      100000000: C
      100000001: D
      100000002: E
      100000003: F

  wp_benefittype:
    displayName: Benefit type
    source: BENEFIT_TYPES in validate.ts
    values:
      100000000: FTE released
      100000001: Cost avoidance
      100000002: Cycle-time cut
      100000003: Error reduction
      100000004: Throughput
      100000005: Compliance / risk
      100000006: CX / EX uplift

  wp_claimcolumn:
    displayName: Workbook Benefits column
    source: CLAIM_COLUMN in validate.ts
    values:
      100000000: T
      100000001: U
      100000002: V
      100000003: W
      100000004: X
      100000005: Y
    note: FTE released has no column; it is the claimedFTE field on Work.

  wp_month:
    displayName: Month
    source: MONTHS in src/engine/dates.ts
    values:
      100000001: Jan
      100000002: Feb
      100000003: Mar
      100000004: Apr
      100000005: May
      100000006: Jun
      100000007: Jul
      100000008: Aug
      100000009: Sep
      100000010: Oct
      100000011: Nov
      100000012: Dec
    note: The value is the month number plus 100000000, so claimMonth() is value minus 100000000.

  wp_deliverystatus:
    displayName: Delivery status
    source: DeliveryStatus in src/engine/delivery.ts
    values:
      100000001: On track
      100000002: Done on time
      100000003: Done, sprint unknown
      100000004: Done late
      100000005: At risk
      100000006: At risk (capacity)
      100000007: Late
    note: >-
      The last digit is STATUS_RANK, so the parent roll-up is Max() over the children. Never stored:
      the app works the status out on read.

  wp_listname:
    displayName: Settings list
    source: LISTS in validate.ts
    values:
      100000000: Skill
      100000001: Region
      100000002: Absence type
      100000003: Reservation category
      100000004: Role
    note: >-
      Role is not one of the mock's four editable lists. It is the roster's job titles, each with the
      team grade it maps to in wp_grade, seeded from the people.

  wp_archivekind:
    displayName: Archive row kind
    source: ArchiveRow.kind in types.ts
    values:
      100000000: Work
      100000001: Reservation

  wp_fundingline:
    displayName: Funding line
    source: FUNDING_LINES in validate.ts
    values:
      100000000: Investment
      100000001: Non-investment

  wp_costtable:
    displayName: Cost table
    source: COST_LINE_TABLES in validate.ts
    values:
      100000000: Licences and subscriptions
      100000001: Infrastructure and other

  wp_importsource:
    displayName: Import source
    source: ImportSource in src/import/mapping.ts
    values:
      100000000: Workday
      100000001: Jira

  wp_activityaction:
    displayName: Activity action
    source: New. The mock labels each commit in Dataset.log; Dataverse classifies it as well.
    values:
      100000000: Create
      100000001: Update
      100000002: Delete
      100000003: Import
      100000004: Quarter close
      100000005: Stage action

  wp_productline:
    displayName: Product line
    source: New. The front door form asks which tool the requester has in mind.
    values:
      100000000: Blue Prism
      100000001: Power Automate
      100000002: Power Apps
      100000003: Copilot Studio
      100000004: Other
    note: Other opens the free-text wp_productlineother, which is the only place a fifth tool is named.

  wp_frequency:
    displayName: Frequency
    source: New. Question 11 of the question bank.
    values:
      100000000: Daily
      100000001: Weekly
      100000002: Monthly
      100000003: Quarterly
      100000004: Annually
      100000005: Ad hoc

  wp_datasensitivity:
    displayName: Data sensitivity
    source: New. Question 15 of the question bank.
    values:
      100000000: None personal
      100000001: Personal
      100000002: Special category
      100000003: Financial

  wp_urgency:
    displayName: Urgency
    source: New. Question 21 of the question bank.
    values:
      100000000: No fixed date
      100000001: Next quarter
      100000002: This quarter
      100000003: Immediate

  wp_requeststatus:
    displayName: Request status
    source: New. The front door lifecycle in design-front-door.md.
    values:
      100000000: New
      100000001: Screened
      100000002: Promoted
      100000003: Declined
    note: >-
      The product owner owns every move after New. Promoted means wp_promotedtoid points at a work
      item; Declined means both wp_declinecategory and wp_declinereason are filled in.

# ---------------------------------------------------------------------------
# Tables
# ---------------------------------------------------------------------------
tables:

  - logicalName: wp_platform
    displayName: Platform
    displayCollectionName: Platforms
    source: New. The hierarchy in power/design-front-door.md, section 2.
    primaryColumn: wp_name
    description: >-
      The top of the hierarchy. A platform holds labs, a lab holds teams, a team holds squads. One
      row today, Intelligent Process Automation.
    columns:
      - { schemaName: wp_name, displayName: Platform, type: text, maxLength: 100, required: true, source: New, description: The name the scope selector shows at platform scope. }
      - { schemaName: wp_code, displayName: Code, type: text, maxLength: 20, required: false, source: New, description: A short code for reporting, such as IPA. }
      - { schemaName: wp_description, displayName: Description, type: memo, maxLength: 1000, required: false, source: New }
      - { schemaName: wp_ownerid, displayName: Platform owner, type: lookup, target: wp_person, required: false, source: New, description: The person accountable for the platform. Not the Dataverse record owner. }
      - { schemaName: wp_sequence, displayName: Order, type: whole, required: false, source: New, description: Display order in the scope selector. }
      - { schemaName: wp_active, displayName: Active, type: boolean, required: true, source: New, description: An inactive platform is hidden from the scope selector and kept for history. }
    alternateKeys:
      - { name: wp_platform_name, columns: [wp_name] }
    relationships:
      - { type: lookup, from: wp_platform.wp_ownerid, to: wp_person, cascade: { delete: RemoveLink }, note: A platform without a named owner is allowed. }

  - logicalName: wp_lab
    displayName: Lab
    displayCollectionName: Labs
    source: New. The hierarchy in power/design-front-door.md, section 2.
    primaryColumn: wp_name
    description: A lab inside a platform. It holds teams, and the roll-ups at lab scope sum them.
    columns:
      - { schemaName: wp_name, displayName: Lab, type: text, maxLength: 100, required: true, source: New }
      - { schemaName: wp_platformid, displayName: Platform, type: lookup, target: wp_platform, required: true, source: New, description: The platform the lab sits in. Every lab has one. }
      - { schemaName: wp_leadid, displayName: Lead, type: lookup, target: wp_person, required: false, source: New, description: The person who leads the lab. }
      - { schemaName: wp_description, displayName: Description, type: memo, maxLength: 1000, required: false, source: New }
      - { schemaName: wp_sequence, displayName: Order, type: whole, required: false, source: New }
      - { schemaName: wp_active, displayName: Active, type: boolean, required: true, source: New }
    alternateKeys:
      - { name: wp_lab_name, columns: [wp_name] }
    relationships:
      - { type: lookup, from: wp_lab.wp_platformid, to: wp_platform, cascade: { assign: Cascade, delete: Restrict, reparent: Cascade }, note: A platform cannot be deleted out from under its labs. }
      - { type: lookup, from: wp_lab.wp_leadid, to: wp_person, cascade: { delete: RemoveLink } }

  - logicalName: wp_team
    displayName: Team
    displayCollectionName: Teams
    source: New. The hierarchy in power/design-front-door.md, section 2.
    primaryColumn: wp_name
    description: >-
      The unit the planner plans. A team holds squads, and every row the plan is made of carries the
      team it belongs to. Waypoint as shipped is one team.
    columns:
      - { schemaName: wp_name, displayName: Team, type: text, maxLength: 100, required: true, source: New }
      - { schemaName: wp_labid, displayName: Lab, type: lookup, target: wp_lab, required: true, source: New, description: The lab the team sits in. Every team has one. }
      - { schemaName: wp_leadid, displayName: Lead, type: lookup, target: wp_person, required: false, source: New, description: The person who leads the team. }
      - { schemaName: wp_description, displayName: Description, type: memo, maxLength: 1000, required: false, source: New }
      - { schemaName: wp_productlines, displayName: Product lines, type: memo, maxLength: 400, required: false, source: New, description: Semicolon separated, the tools this team builds with. Matches the wp_productline labels. }
      - { schemaName: wp_sequence, displayName: Order, type: whole, required: false, source: New }
      - { schemaName: wp_active, displayName: Active, type: boolean, required: true, source: New }
    alternateKeys:
      - { name: wp_team_name, columns: [wp_name] }
    relationships:
      - { type: lookup, from: wp_team.wp_labid, to: wp_lab, cascade: { assign: Cascade, delete: Restrict, reparent: Cascade }, note: A lab cannot be deleted out from under its teams. }
      - { type: lookup, from: wp_team.wp_leadid, to: wp_person, cascade: { delete: RemoveLink } }

  - logicalName: wp_person
    displayName: Person
    displayCollectionName: People
    source: Person in types.ts
    primaryColumn: wp_name
    description: A member of the team, and everything capacity needs to know about them.
    columns:
      - { schemaName: wp_name, displayName: Full name, type: text, maxLength: 100, required: true, source: Person.name, description: The name every other table refers to the person by in the mock. }
      - { schemaName: wp_role, displayName: Role, type: text, maxLength: 100, required: false, source: Person.role, description: Job title as the roster writes it. }
      - { schemaName: wp_grade, displayName: Team grade, type: choice, choiceSet: wp_teamgrade, required: false, source: Person.grade, description: C to F. Drives the team cost, not the benefit rate. }
      - { schemaName: wp_squadid, displayName: Squad, type: lookup, target: wp_squad, required: false, source: Person.squad, description: Blank means unsquadded; net capacity only counts people on a squad. }
      - { schemaName: wp_regionid, displayName: Region, type: lookup, target: wp_listvalue, required: true, source: Person.region, description: Decides which bank holidays come off the person. Filtered to list = Region. }
      - { schemaName: wp_employment, displayName: Employment, type: choice, choiceSet: wp_employment, required: true, source: Person.employment, description: An Open vacancy brings zero net MW. }
      - { schemaName: wp_lead, displayName: Lead, type: boolean, required: true, source: Person.lead, description: A lead takes the lead modifier rather than the default. }
      - { schemaName: wp_skills, displayName: Skills, type: memo, maxLength: 400, required: false, source: Person.skills, description: "Semicolon separated, first entry is the primary skill. Alternative: an N:N to ListValue where skills need reporting on." }
      - { schemaName: wp_coreid, displayName: Core ID, type: text, maxLength: 40, required: false, source: Person.coreId, description: Workday Core ID. First thing an import matches on. }
      - { schemaName: wp_fileid, displayName: File ID, type: text, maxLength: 40, required: false, source: Person.fileId, description: Workday File ID, matched alongside the Core ID. }
      - { schemaName: wp_email, displayName: Email, type: text, format: email, maxLength: 200, required: false, source: Person.email, description: Second thing an import matches on. }
      - { schemaName: wp_jiraaccountid, displayName: Jira account ID, type: text, maxLength: 60, required: false, source: Person.jiraAccountId, description: Matched with the IDs, not separately. }
      - { schemaName: wp_daysperweek, displayName: Days per week, type: decimal, precision: 2, min: 0, max: 5, required: false, source: Person.daysPerWeek, description: Empty means the Settings MW days (5). Scales working days, bank holidays and absence alike. }
      - { schemaName: wp_modifieroverride, displayName: Modifier override, type: decimal, precision: 4, min: 0, max: 1, required: false, source: Person.modifierOverride, description: Overrides the default and lead modifiers for this person. }
      - { schemaName: wp_startdate, displayName: Start date, type: date, required: false, source: Person.startDate, description: Date only, time zone independent. }
      - { schemaName: wp_enddate, displayName: End date, type: date, required: false, source: Person.endDate, description: Date only, time zone independent. }
      - { schemaName: wp_systemuserid, displayName: User, type: lookup, target: systemuser, required: false, source: New, description: Links the person to the signed-in user, so "my work" filters and the Squad member role work. }
      - { schemaName: wp_netmw, displayName: Net MW (quarter), type: decimal, precision: 4, required: false, computedIn: app, source: netMW() in capacity.ts, description: Not stored. The close flow writes the squad totals onto the QuarterSnapshot. }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: true, source: New, description: The team the row belongs to. }
    alternateKeys:
      - { name: wp_person_name, columns: [wp_name] }
      - { name: wp_person_coreid, columns: [wp_coreid], note: Only where Core IDs are always present; otherwise match in the flow. }
    relationships:
      - { type: lookup, from: wp_person.wp_squadid, to: wp_squad, cascade: { assign: Cascade, delete: RemoveLink, reparent: Cascade, share: NoCascade, unshare: NoCascade }, note: Deleting a squad must not delete its people. }
      - { type: lookup, from: wp_person.wp_regionid, to: wp_listvalue, cascade: { delete: Restrict }, note: validate.ts refuses to remove a region still used by a person. }
      - { type: lookup, from: wp_person.wp_teamid, to: wp_team, cascade: { delete: Restrict }, note: The team the row belongs to. }

  - logicalName: wp_squad
    displayName: Squad
    displayCollectionName: Squads
    source: Squad in types.ts
    primaryColumn: wp_name
    description: A delivery squad. Capacity, utilisation and reservations are reported per squad.
    columns:
      - { schemaName: wp_name, displayName: Squad name, type: text, maxLength: 100, required: true, source: Squad.name }
      - { schemaName: wp_leadid, displayName: Lead, type: lookup, target: wp_person, required: false, source: Squad.lead, description: The person who leads it. }
      - { schemaName: wp_remit, displayName: Remit, type: memo, maxLength: 1000, required: false, source: Squad.remit }
      - { schemaName: wp_colour, displayName: Palette colour, type: text, maxLength: 40, required: true, source: Squad.colour, description: A palette name, not a literal colour. The app maps it onto a theme token. }
      - { schemaName: wp_netmw, displayName: Net MW, type: decimal, precision: 4, computedIn: app, source: squadNetMW() in capacity.ts, description: Sum of the net MW of its people. Depends on absence, so not a Dataverse rollup. }
      - { schemaName: wp_committedmw, displayName: Committed MW, type: decimal, precision: 4, computedIn: app, source: squadCommittedMW() in work.ts }
      - { schemaName: wp_utilisation, displayName: Utilisation, type: decimal, precision: 6, computedIn: app, source: "compute() squads.rows[].utilisation" }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: true, source: New, description: The team the row belongs to. }
    alternateKeys:
      - { name: wp_squad_name, columns: [wp_name] }
    relationships:
      - { type: lookup, from: wp_squad.wp_leadid, to: wp_person, cascade: { delete: RemoveLink }, note: A squad without a lead is allowed; the Team page says so. }
      - { type: lookup, from: wp_squad.wp_teamid, to: wp_team, cascade: { assign: Cascade, delete: Restrict, reparent: Cascade }, note: The team the row belongs to. }

  - logicalName: wp_workitem
    displayName: Work item
    displayCollectionName: Work items
    source: WorkItem in types.ts
    primaryColumn: wp_title
    description: A feature, spike or component. The register the whole plan hangs off.
    columns:
      - { schemaName: wp_title, displayName: Title, type: text, maxLength: 200, required: true, source: WorkItem.title, description: Unique, case insensitive. validate.ts refuses a duplicate. }
      - { schemaName: wp_kind, displayName: Kind, type: choice, choiceSet: wp_workkind, required: true, source: WorkItem.kind }
      - { schemaName: wp_phase, displayName: Phase, type: choice, choiceSet: wp_workphase, required: false, source: WorkItem.phase, description: Stored, but phaseOf() derives it from the state where the state names one. }
      - { schemaName: wp_source, displayName: Source, type: choice, choiceSet: wp_worksource, required: false, source: New, description: How the item arrived. Front door for a promoted request, Direct for the new-work form, Jira for an import. Editable after creation. }
      - { schemaName: wp_stateid, displayName: State, type: lookup, target: wp_workstate, required: true, source: WorkItem.state, description: A lookup, not a choice, because Settings lets the team edit the state model and its impacts. }
      - { schemaName: wp_parentid, displayName: Part of, type: lookup, target: wp_workitem, required: false, source: WorkItem.parent, description: Self-lookup. One level only, and the parent must be a Feature. }
      - { schemaName: wp_epicid, displayName: Epic, type: lookup, target: wp_epic, required: false, source: WorkItem.epic }
      - { schemaName: wp_squadid, displayName: Squad, type: lookup, target: wp_squad, required: false, source: WorkItem.squad }
      - { schemaName: wp_skillid, displayName: Skill, type: lookup, target: wp_listvalue, required: false, source: WorkItem.skill, description: Filtered to list = Skill. }
      - { schemaName: wp_sizeid, displayName: Size, type: lookup, target: wp_size, required: false, source: WorkItem.size, description: XS to XXL; the band carries the MW. }
      - { schemaName: wp_sizeoverride, displayName: MW override, type: decimal, precision: 2, min: 0, required: false, source: WorkItem.sizeOverride, description: A typed total MW that replaces the band. }
      - { schemaName: wp_priority, displayName: Priority, type: text, maxLength: 40, required: false, source: WorkItem.priority }
      - { schemaName: wp_confidence, displayName: Confidence, type: text, maxLength: 40, required: false, source: WorkItem.confidence }
      - { schemaName: wp_commitment, displayName: Commitment, type: choice, choiceSet: wp_commitment, required: true, source: "WorkItem.proposed, inverted", description: "Stored as a choice because the forms read it as a word. commitment() still overrides it to Proposed when the state is Identified or In discovery." }
      - { schemaName: wp_startsprint, displayName: Start sprint, type: whole, min: 1, required: false, source: WorkItem.startSprint }
      - { schemaName: wp_endsprint, displayName: End sprint, type: whole, min: 1, required: false, source: WorkItem.endSprint }
      - { schemaName: wp_spanstart, displayName: Absolute start sprint, type: whole, required: false, source: "WorkItem.span[0]", description: The sprint number once the seed's quarter offset is applied. The engine reads span, never startSprint. }
      - { schemaName: wp_spanend, displayName: Absolute end sprint, type: whole, required: false, source: "WorkItem.span[1]" }
      - { schemaName: wp_assessedbyid, displayName: Assessed by, type: lookup, target: wp_person, required: false, source: WorkItem.assessedBy }
      - { schemaName: wp_assessedon, displayName: Assessed on, type: date, format: DateAndTime, required: false, source: New, description: Stamped when the assessment is recorded. }
      - { schemaName: wp_validatedon, displayName: Validated on, type: date, format: DateAndTime, required: false, source: New, description: Stamped when every benefit claim has an actual and the item is validated. }
      - { schemaName: wp_productownerid, displayName: Product owner, type: lookup, target: wp_person, required: false, source: WorkItem.productOwner }
      - { schemaName: wp_jira, displayName: Jira key, type: text, maxLength: 40, required: false, source: WorkItem.jira, description: The key a Jira import matches on. Unique where present. }
      - { schemaName: wp_jiraalign, displayName: Jira Align ID, type: text, maxLength: 40, required: false, source: WorkItem.jiraAlign }
      - { schemaName: wp_claimedfte, displayName: FTE released, type: decimal, precision: 2, required: false, source: WorkItem.claimedFTE, description: The primary benefit. Needs a landing month, a landing year and a business grade. }
      - { schemaName: wp_landingmonth, displayName: Landing month, type: choice, choiceSet: wp_month, required: false, source: WorkItem.landingMonth }
      - { schemaName: wp_landingyear, displayName: Landing year, type: whole, min: 2020, max: 2040, required: false, source: WorkItem.landingYear }
      - { schemaName: wp_gradeid, displayName: Business grade, type: lookup, target: wp_graderate, required: false, source: WorkItem.grade, description: The grade whose rate values the released FTE. }
      - { schemaName: wp_gradeblendid, displayName: Grade blend, type: lookup, target: wp_gradeblend, required: false, source: "WorkItem.grade, where the name is a blend", description: At most one of Business grade and Grade blend is set. The mock keeps one text field, which is why validate.ts has to police name collisions between the two lists. }
      - { schemaName: wp_cancelreason, displayName: Cancellation reason, type: memo, maxLength: 1000, required: false, source: WorkItem.cancelReason, description: Required when the state's impact is Removed. }
      - { schemaName: wp_stoppedreason, displayName: Stopped reason, type: memo, maxLength: 1000, required: false, source: New, description: Required when the item is stopped. Cleared on Reopen. }
      - { schemaName: wp_originalestimate, displayName: Original estimate (MW), type: decimal, precision: 2, required: false, source: WorkItem.originalEstimate }
      - { schemaName: wp_actualeffort, displayName: Actual effort (MW), type: decimal, precision: 2, required: false, source: WorkItem.actualEffort }
      - { schemaName: wp_doneinsprint, displayName: Done in sprint, type: whole, required: false, source: WorkItem.doneInSprint }
      - { schemaName: wp_dependsonid, displayName: Depends on, type: lookup, target: wp_workitem, required: false, source: WorkItem.dependsOn, description: Second self-lookup. Cannot be the item itself. }
      - { schemaName: wp_archivedinquarter, displayName: Archived in quarter, type: lookup, target: wp_quarter, required: false, source: WorkItem.archivedInQuarter, description: The close stamps it and reads it as its own guard against archiving twice. }
      - { schemaName: wp_question, displayName: Spike question, type: memo, maxLength: 1000, required: false, source: WorkItem.question }
      - { schemaName: wp_timeboxsprints, displayName: Timebox (sprints), type: whole, min: 1, required: false, source: WorkItem.timeboxSprints }
      - { schemaName: wp_spikeoutcome, displayName: Spike outcome, type: choice, choiceSet: wp_spikeoutcome, required: false, source: WorkItem.spikeOutcome, description: Empty while the spike is still running. }
      - { schemaName: wp_findings, displayName: Findings, type: memo, maxLength: 4000, required: false, source: WorkItem.findings }
      - { schemaName: wp_convertedtoid, displayName: Converted to, type: lookup, target: wp_workitem, required: false, source: WorkItem.convertedTo, description: The feature a feasible spike became. Third self-lookup. }
      - { schemaName: wp_convertedfromid, displayName: Converted from, type: lookup, target: wp_workitem, required: false, source: WorkItem.convertedFrom, description: The spike a feature came out of. Fourth self-lookup, kept because the mock stores both directions and the Close page reads them separately. }
      - { schemaName: wp_notes, displayName: Notes, type: memo, maxLength: 4000, required: false, source: WorkItem.notes }
      - { schemaName: wp_childcount, displayName: Component count, type: whole, computedIn: dataverse, rollup: "COUNT of wp_workitem where wp_parentid = this", source: ctx.kids in context.ts, description: A rollup, so a feature knows whether it has components without reading them. Rollups refresh hourly, so the screens recount from their collection. }
      - { schemaName: wp_ownmw, displayName: Own MW, type: decimal, precision: 2, computedIn: dataverse, calculated: "If(IsNotNull(wp_sizeoverride), wp_sizeoverride, wp_sizeid.wp_mw)", source: ownMW() in work.ts, description: A calculated column can read a related field one hop away, which is all this needs. }
      - { schemaName: wp_totalmw, displayName: Total MW, type: decimal, precision: 2, computedIn: dataverse, rollup: "SUM of child wp_ownmw", source: totalMW() in work.ts, description: Reporting only. The screens use the Power Fx version so the number never lags. }
      - { schemaName: wp_workmw, displayName: MW this quarter, type: decimal, precision: 4, computedIn: app, source: workMW() in work.ts, description: Depends on the sprint grid and the quarter, so it cannot be a Dataverse calculated column. }
      - { schemaName: wp_deliverystatus, displayName: Delivery status, type: choice, choiceSet: wp_deliverystatus, computedIn: app, source: deliveryStatuses() in delivery.ts }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: true, source: New, description: The team the row belongs to. }
    alternateKeys:
      - { name: wp_workitem_title, columns: [wp_title] }
