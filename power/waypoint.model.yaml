      - { type: lookup, from: wp_benefitactual.wp_teamid, to: wp_team, cascade: { delete: Restrict }, note: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }

  - logicalName: wp_reservation
    displayName: Reservation
    displayCollectionName: Reservations
    source: Reservation in types.ts
    primaryColumn: wp_name
    description: Capacity held for a squad, or across the team, before the work is known.
    columns:
