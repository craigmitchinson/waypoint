      - { type: lookup, from: wp_workitem.wp_parentid, to: wp_workitem, cascade: { assign: Cascade, delete: Restrict, reparent: Cascade }, note: Restrict, so a feature cannot be deleted out from under its components. }
      - { type: lookup, from: wp_workitem.wp_dependsonid, to: wp_workitem, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_workitem.wp_convertedtoid, to: wp_workitem, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_workitem.wp_convertedfromid, to: wp_workitem, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_workitem.wp_stateid, to: wp_workstate, cascade: { delete: Restrict } }
      - { type: lookup, from: wp_workitem.wp_squadid, to: wp_squad, cascade: { assign: Cascade, delete: RemoveLink } }
      - { type: lookup, from: wp_workitem.wp_epicid, to: wp_epic, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_workitem.wp_teamid, to: wp_team, cascade: { delete: Restrict }, note: The team the row belongs to. }

  - logicalName: wp_assignee
    displayName: Assignee
    displayCollectionName: Assignees
    source: "WorkItem.assignees, which the workbook holds as asg1 to asg3"
    primaryColumn: wp_name
    description: >-
      The mock keeps up to three assignees in an array on the work item. Dataverse gets a child table,
      so the capacity check reads one row per person and the cap of three is a rule rather than a
      column count. The slot is kept because the workbook's columns are ordered.
    columns:
      - { schemaName: wp_name, displayName: Name, type: text, maxLength: 260, required: true, source: Derived, description: "Work item title and person name, so the row reads in a grid." }
      - { schemaName: wp_workitemid, displayName: Work item, type: lookup, target: wp_workitem, required: true, source: WorkItem.assignees }
      - { schemaName: wp_personid, displayName: Person, type: lookup, target: wp_person, required: true, source: WorkItem.assignees }
      - { schemaName: wp_slot, displayName: Slot, type: whole, min: 1, max: 3, required: true, source: "assignees index; MAX_ASSIGNEES = 3 in validate.ts" }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: false, source: New, description: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }
    alternateKeys:
      - { name: wp_assignee_pair, columns: [wp_workitemid, wp_personid] }
    relationships:
      - { type: lookup, from: wp_assignee.wp_workitemid, to: wp_workitem, cascade: { assign: Cascade, delete: Cascade, reparent: Cascade }, note: Parental. Deleting the item removes its assignee rows. }
      - { type: lookup, from: wp_assignee.wp_personid, to: wp_person, cascade: { delete: Restrict }, note: The mock refuses to remove a person who is still assigned and says why. }
      - { type: lookup, from: wp_assignee.wp_teamid, to: wp_team, cascade: { delete: RemoveLink }, note: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }

