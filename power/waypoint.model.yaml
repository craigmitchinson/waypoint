    primaryColumn: wp_title
    description: >-
      The record of a closed item or a held reservation, stamped with the quarter it closed in.
      Calibration reads it back, so most columns are the values as they stood, not lookups that move.
    columns:
      - { schemaName: wp_title, displayName: Title, type: text, maxLength: 200, required: true, source: ArchiveRow.title, description: The category name on a Reservation row. }
      - { schemaName: wp_quarterid, displayName: Quarter, type: lookup, target: wp_quarter, required: true, source: ArchiveRow.quarter }
      - { schemaName: wp_kind, displayName: Row kind, type: choice, choiceSet: wp_archivekind, required: true, source: ArchiveRow.kind, description: Work or Reservation. The mock leaves it blank for work. }
      - { schemaName: wp_itemid, displayName: Work item, type: lookup, target: wp_workitem, required: false, source: New, description: For navigation only; the text columns stand alone if the item is later deleted. }
      - { schemaName: wp_jira, displayName: Jira key, type: text, maxLength: 40, required: false, source: ArchiveRow.id }
      - { schemaName: wp_epic, displayName: Epic, type: text, maxLength: 200, required: false, source: ArchiveRow.epic }
      - { schemaName: wp_squad, displayName: Squad, type: text, maxLength: 100, required: false, source: ArchiveRow.squad }
      - { schemaName: wp_state, displayName: State, type: text, maxLength: 60, required: false, source: ArchiveRow.state }
      - { schemaName: wp_assignee, displayName: Assignee, type: text, maxLength: 100, required: false, source: ArchiveRow.assignee, description: The first assignee only, as the close writes it. }
      - { schemaName: wp_status, displayName: Close status, type: text, maxLength: 40, required: true, source: ArchiveRow.status, description: "Done on time, Done late, Done, Cancelled, or Reserved on a reservation row." }
      - { schemaName: wp_size, displayName: Size, type: text, maxLength: 10, required: false, source: ArchiveRow.size, description: Text, not a lookup, so recalibrating a band does not rewrite history. }
      - { schemaName: wp_original, displayName: Original MW, type: decimal, precision: 2, required: true, source: ArchiveRow.original }
      - { schemaName: wp_latest, displayName: Latest MW, type: decimal, precision: 2, required: true, source: ArchiveRow.latest }
      - { schemaName: wp_actual, displayName: Actual MW, type: decimal, precision: 2, required: true, source: ArchiveRow.actual }
      - { schemaName: wp_heldmw, displayName: Held MW, type: decimal, precision: 2, required: false, source: ArchiveRow.heldMW, description: Reservation rows only. }
      - { schemaName: wp_drawnmw, displayName: Drawn MW, type: decimal, precision: 2, required: false, source: ArchiveRow.drawnMW }
      - { schemaName: wp_freemw, displayName: Free MW, type: decimal, precision: 2, required: false, source: ArchiveRow.freeMW }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: false, source: New, description: The team the row belongs to. }
    alternateKeys:
      - { name: wp_archiverow_row, columns: [wp_quarterid, wp_title, wp_kind], note: The close already guards itself with archivedInQuarter; the key makes a re-run safe. }
    relationships:
      - { type: lookup, from: wp_archiverow.wp_quarterid, to: wp_quarter, cascade: { delete: Restrict } }
      - { type: lookup, from: wp_archiverow.wp_itemid, to: wp_workitem, cascade: { delete: RemoveLink }, note: RemoveLink, not Cascade. The archive outlives the item. }
      - { type: lookup, from: wp_archiverow.wp_teamid, to: wp_team, cascade: { delete: RemoveLink }, note: The team the row belongs to. }

  - logicalName: wp_activitylog
    displayName: Activity log
    displayCollectionName: Activity log
    source: Dataset.log, an array of LogEntry in src/model/types.ts
    primaryColumn: wp_name
    description: >-
      Who did what, when, and what changed. The mock already keeps this as Dataset.log, a capped
      audit trail of LogEntry rows that every commit appends to, an undo included. Here it is the same
      trail, uncapped, written by a plugin step or a flow on create, update and delete of the business
      tables, and by the import and close flows for the big moves. Read-only in the app.
    columns:
      - { schemaName: wp_name, displayName: Label, type: text, maxLength: 300, required: true, source: LogEntry.label, description: "What was done, as the commit names it: e.g. Commit Statement matching rules v2." }
      - { schemaName: wp_summary, displayName: Summary, type: text, maxLength: 300, required: false, source: LogEntry.summary, description: "What changed, in a phrase: e.g. 3 items committed, 1 deferred. A separate column from the label, as LogEntry keeps them." }
      - { schemaName: wp_action, displayName: Action, type: choice, choiceSet: wp_activityaction, required: true, source: New }
      - { schemaName: wp_tablename, displayName: Table, type: text, maxLength: 60, required: true, source: New, description: Logical name of the table the change landed on. }
      - { schemaName: wp_recordid, displayName: Record, type: text, maxLength: 40, required: true, source: New, description: The GUID as text, so the log survives the record. }
      - { schemaName: wp_recordname, displayName: Record name, type: text, maxLength: 200, required: false, source: New }
      - { schemaName: wp_byuserid, displayName: By, type: lookup, target: systemuser, required: true, source: LogEntry.user }
      - { schemaName: wp_at, displayName: At, type: date, format: DateAndTime, required: true, source: LogEntry.at, description: User local behaviour; the log is read by people, not by the engine. }
      - { schemaName: wp_before, displayName: Before, type: memo, maxLength: 4000, required: false, source: New, description: The changed columns as they were, one per line. Not a full record dump. }
      - { schemaName: wp_after, displayName: After, type: memo, maxLength: 4000, required: false, source: New }
      - { schemaName: wp_quarterid, displayName: Quarter, type: lookup, target: wp_quarter, required: false, source: New, description: The quarter current at the time, so a close reads in context. }
    alternateKeys: []
    relationships:
      - { type: lookup, from: wp_activitylog.wp_quarterid, to: wp_quarter, cascade: { delete: RemoveLink } }

  - logicalName: wp_importprofile
    displayName: Import profile
    displayCollectionName: Import profiles
    source: "MappingProfile in src/import/mapping.ts, stored under waypoint-import-profiles-v1"
    primaryColumn: wp_name
    description: >-
      The saved column mapping for one source. The mock keeps it in localStorage per browser; in
      Dataverse it is shared, so the second person to run an import gets the first person's mapping.
    columns:
      - { schemaName: wp_name, displayName: Name, type: text, maxLength: 100, required: true, source: Derived from the source }
      - { schemaName: wp_source, displayName: Source, type: choice, choiceSet: wp_importsource, required: true, source: MappingProfile.source }
      - { schemaName: wp_columns, displayName: Column mapping, type: memo, maxLength: 8000, required: true, source: MappingProfile.columns, description: "JSON: field key to header, null where the export has no such column. Read with ParseJSON." }
      - { schemaName: wp_valuemaps, displayName: Value maps, type: memo, maxLength: 8000, required: false, source: MappingProfile.valueMaps, description: "JSON: field key to a map of export value onto model value, such as Jira status onto planner state." }
      - { schemaName: wp_savedat, displayName: Saved at, type: date, format: DateAndTime, required: true, source: MappingProfile.savedAt }
      - { schemaName: wp_dateformat, displayName: Date format, type: text, maxLength: 10, required: false, source: DateFormat in workday.ts, description: "iso, dmy or mdy. Detected per file; stored as a hint." }
    alternateKeys:
      - { name: wp_importprofile_source, columns: [wp_source], note: One profile per source, exactly as loadProfiles() keys them. }
    relationships: []

  - logicalName: wp_importrun
    displayName: Import run
    displayCollectionName: Import runs
    source: New. The mock applies an import and forgets it.
    primaryColumn: wp_name
    description: >-
      One execution of the import flow, so an operator can see what a file did and a re-run can be
      recognised. Not in the brief's table list; added because Absence points at it.
    columns:
      - { schemaName: wp_name, displayName: Name, type: text, maxLength: 200, required: true, source: New, description: File name and time. }
      - { schemaName: wp_source, displayName: Source, type: choice, choiceSet: wp_importsource, required: true, source: New }
      - { schemaName: wp_profileid, displayName: Profile used, type: lookup, target: wp_importprofile, required: false, source: New }
      - { schemaName: wp_rowsread, displayName: Rows read, type: whole, required: true, source: New }
      - { schemaName: wp_rowsapplied, displayName: Rows applied, type: whole, required: true, source: New }
      - { schemaName: wp_rowsskipped, displayName: Rows skipped, type: whole, required: true, source: New }
      - { schemaName: wp_log, displayName: Log, type: memo, maxLength: 16000, required: false, source: "the skipped reasons in workday.ts and jira.ts", description: "One line per skipped row: No person matched, No worker name, No start date, Not approved, Already recorded, No issue key, No summary." }
      - { schemaName: wp_byuserid, displayName: Run by, type: lookup, target: systemuser, required: true, source: New }
      - { schemaName: wp_at, displayName: Run at, type: date, format: DateAndTime, required: true, source: New }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: false, source: New, description: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }
    alternateKeys: []
    relationships:
      - { type: lookup, from: wp_importrun.wp_profileid, to: wp_importprofile, cascade: { delete: RemoveLink } }
      - { type: lookup, from: wp_importrun.wp_teamid, to: wp_team, cascade: { delete: RemoveLink }, note: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }

  - logicalName: wp_size
