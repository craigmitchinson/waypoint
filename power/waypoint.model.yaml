  - logicalName: wp_benefitclaim
    displayName: Benefit claim
    displayCollectionName: Benefit claims
    source: "WorkItem.claims, a Record<string, number> keyed by the Benefits column"
    primaryColumn: wp_name
    description: >-
      One row per claim type, instead of the JSON record the mock stores. Three reasons. Dataverse has
      no JSON column that filters or reports, and Value, Money and Close all group by claim type. A
      benefit actual is recorded against a claim type, so a row gives the actual something to point at
      and the "does that item claim it?" rule in validateBenefitActual becomes a lookup rather than a
      string dig. And a claim can later carry its own evidence, owner or confidence without a schema
      change. FTE released stays on the work item, because the engine treats it as the primary benefit
      with its own grade and rate.
    columns:
      - { schemaName: wp_name, displayName: Name, type: text, maxLength: 260, required: true, source: Derived }
      - { schemaName: wp_workitemid, displayName: Work item, type: lookup, target: wp_workitem, required: true, source: The record that owns the claims }
      - { schemaName: wp_benefittype, displayName: Benefit type, type: choice, choiceSet: wp_benefittype, required: true, source: BENEFIT_TYPES in validate.ts, description: FTE released is not valid here. }
      - { schemaName: wp_claimcolumn, displayName: Benefits column, type: choice, choiceSet: wp_claimcolumn, required: true, source: CLAIM_COLUMN in validate.ts, description: T to Y. Kept so a workbook round trip still lands in the right column. }
      - { schemaName: wp_value, displayName: Claimed value, type: decimal, precision: 4, required: true, source: "WorkItem.claims[column]", description: "Units vary by type: T is £M a year, U and V are percentages, W is a multiple." }
      - { schemaName: wp_note, displayName: Note, type: memo, maxLength: 1000, required: false, source: New }
      - { schemaName: wp_teamid, displayName: Team, type: lookup, target: wp_team, required: true, source: New, description: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }
    alternateKeys:
      - { name: wp_benefitclaim_pair, columns: [wp_workitemid, wp_benefittype] }
    relationships:
      - { type: lookup, from: wp_benefitclaim.wp_workitemid, to: wp_workitem, cascade: { assign: Cascade, delete: Cascade, reparent: Cascade }, note: Parental. }
      - { type: lookup, from: wp_benefitclaim.wp_teamid, to: wp_team, cascade: { delete: Restrict }, note: A copy of the parent team, written by the app on create and on reparent so a filter never needs two hops. }

  - logicalName: wp_benefitactual
    displayName: Benefit actual
    displayCollectionName: Benefit actuals
    source: BenefitActual in types.ts
    primaryColumn: wp_name
    description: What was really recorded against a claim, and the month it was recorded in.
    columns:
