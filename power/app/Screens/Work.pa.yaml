# Waypoint canvas app: the Work screen, the quarter's register.
#
# Valid against pa.schema.yaml (v3.0): a Screens map, each screen with a Properties formula map and a
# Children sequence whose items are single-key maps of control name to control instance.
#
# Work is src/pages/Work.tsx: the lifecycle strip over the top, the filters under it, and every item
# in the quarter as one row that leads to its own page. Every rule is the engine's, through the named
# formulas in Formulas.pa.yaml — WorkLifecycle, WorkRegisterRows and the option lists — so nothing
# here works a number out for itself.
#
# The shell is scrCommand's: wkRoot is a vertical GroupContainer the size of the screen, holding the
# 48px header and a horizontal row of the rail and the body. X and Y appear only inside the gallery
# template, which is not auto-layout.
#
# The rail is the cmpRail component, one instance here with its Active property set to this
# screen's key. NavItems keeps the one list of sections the rail reads.
#
# New feature and New spike open wkNewPanel, the person panel's form pattern
# (power/RUNBOOK.md, section 4, "Forms") with the fields each kind is shaped with. A component is
# not made here: it is created from its parent feature on the work item screen.

Screens:
  scrWork:
    Properties:
      Fill: =NeutralCanvas

    Children:

      # ---- the root: one vertical auto-layout container the size of the screen ----
      - wkRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Hide
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:

            # ---- shell: the app header ----
            - wkHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - wkHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  # ---- shell: the scope selector, one cmpScope instance for every screen ----
                  - wkHeaderScope:
                      Control: CanvasComponent
                      ComponentName: cmpScope
                      Properties:
                        Width: =Max(Parent.Width * 0.14, 180)
                        Height: =ControlHeight
                        Visible: =IncludeScope
                  # ---- shell: the header search, one cmpSearch instance for every screen ----
                  - wkHeaderSearch:
                      Control: CanvasComponent
                      ComponentName: cmpSearch
                      Properties:
                        Width: =Max(Parent.Width * 0.24, 280)
                        Height: =ControlHeight
                  - wkHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - wkMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:

                  # ---- shell: the rail, one cmpRail instance for every screen ----
                  - wkRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="Work"

                  # ---- shell: the body everything else sits inside ----
                  - wkBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =Gap
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:

                        # ---- page head: the eyebrow and one h1 on the left, the new buttons on the right ----
                        - wkPageHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - wkHeadText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =0
                                  Children:
                                    - wkEyebrow:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeKickerLine
                                          Visible: =!IsCompact
                                          Text: =CurrentQuarter.Label
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wkTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeDisplayLine
                                          Text: ="Work"
                                          Size: =TypeTitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                              # The split button of the mock, as two real buttons: the primary
                              # action and the one it hides in a menu. Each one opens the panel
                              # under wkNewPanel with the kind it shapes.
                              - wkNewFeature:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =BrandBg
                                    Color: =BrandFg
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =130
                                    Height: =ControlHeight
                                    Text: ="New feature"
                                    AccessibleLabel: ="New feature"
                                    OnSelect: |
                                      =Set(varWorkNewKind, "Feature");
                                       Set(varWorkSaveError, "");
                                       Set(varWorkNewTried, false);
                                       Set(varWorkFormOpen, true);
                                       // every input starts from its Default, not the last open
                                       Reset(wkFieldTitle);
                                       Reset(wkFieldEpic);
                                       Reset(wkFieldSquad);
                                       Reset(wkFieldPriority);
                                       Reset(wkFieldOwner);
                                       Reset(wkFieldNotes);
                                       Reset(wkFieldQuestion);
                                       Reset(wkFieldTimebox);
                                       Reset(wkFieldClaimType);
                                       Reset(wkFieldClaimValue)
                              - wkNewSpike:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =NeutralBg3
                                    Color: =NeutralFg1
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =110
                                    Height: =ControlHeight
                                    Text: ="New spike"
                                    AccessibleLabel: ="New spike"
                                    OnSelect: |
                                      =Set(varWorkNewKind, "Spike");
                                       Set(varWorkSaveError, "");
                                       Set(varWorkNewTried, false);
                                       Set(varWorkFormOpen, true);
                                       // every input starts from its Default, not the last open
                                       Reset(wkFieldTitle);
                                       Reset(wkFieldEpic);
                                       Reset(wkFieldSquad);
                                       Reset(wkFieldPriority);
                                       Reset(wkFieldOwner);
                                       Reset(wkFieldNotes);
                                       Reset(wkFieldQuestion);
                                       Reset(wkFieldTimebox);
                                       Reset(wkFieldClaimType);
                                       Reset(wkFieldClaimValue)

                        # ---- the lifecycle strip: five stages, each one a filter ----
                        # Each cell is a button that sets varWorkPhase, and clears it when it is the
                        # phase already chosen, so the strip doubles as the register's phase filter.
                        # Primary is the chosen one; the label carries the figures, so the state is
                        # never colour alone. Closed is the fifth cell: every Validated and Stopped
                        # item, counted but with no MW, because closed work charges no capacity.
                        - wkLifecycle:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              # Five 240 tiles and four gaps fit the body at 1920 but outrun the
                              # compact one, so the strip wraps to a second row rather than
                              # clipping (the bands' pattern).
                              Height: |
                                =If(Parent.Width < (240 * 5 + Gap * 4),
                                    RowHeight * 2 + Gap, RowHeight)
                              LayoutWrap: =true
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - wkPhaseShaping:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |
                                      =If(varWorkPhase = "Shaping", ButtonAppearance.Primary,
                                          ButtonAppearance.Subtle)
                                    BasePaletteColor: =If(varWorkPhase = "Shaping", BrandBg, NeutralBg1)
                                    Color: =If(varWorkPhase = "Shaping", BrandFg, NeutralFg1)
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    Width: =Max(Parent.Width * 0.12, 240)
                                    Height: =RowHeight
                                    Text: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Shaping") },
                                          p.Name & " " & p.Count & " · "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " MW")
                                    AccessibleLabel: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Shaping") },
                                          "Shaping, " & p.Count & " items, "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " member weeks"
                                          & If(varWorkPhase = "Shaping", ", filtering the register", ""))
                                    OnSelect: =Set(varWorkPhase, If(varWorkPhase = "Shaping", "", "Shaping"))
                              - wkPhaseAssessment:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |
                                      =If(varWorkPhase = "Assessment", ButtonAppearance.Primary,
                                          ButtonAppearance.Subtle)
                                    BasePaletteColor: =If(varWorkPhase = "Assessment", BrandBg, NeutralBg1)
                                    Color: =If(varWorkPhase = "Assessment", BrandFg, NeutralFg1)
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    Width: =Max(Parent.Width * 0.12, 240)
                                    Height: =RowHeight
                                    Text: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Assessment") },
                                          p.Name & " " & p.Count & " · "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " MW")
                                    AccessibleLabel: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Assessment") },
                                          "Assessment, " & p.Count & " items, "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " member weeks"
                                          & If(varWorkPhase = "Assessment", ", filtering the register", ""))
                                    OnSelect: =Set(varWorkPhase, If(varWorkPhase = "Assessment", "", "Assessment"))
                              - wkPhaseDelivery:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |
                                      =If(varWorkPhase = "Delivery", ButtonAppearance.Primary,
                                          ButtonAppearance.Subtle)
                                    BasePaletteColor: =If(varWorkPhase = "Delivery", BrandBg, NeutralBg1)
                                    Color: =If(varWorkPhase = "Delivery", BrandFg, NeutralFg1)
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    Width: =Max(Parent.Width * 0.12, 240)
                                    Height: =RowHeight
                                    Text: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Delivery") },
                                          p.Name & " " & p.Count & " · "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " MW")
                                    AccessibleLabel: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Delivery") },
                                          "Delivery, " & p.Count & " items, "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " member weeks"
                                          & If(varWorkPhase = "Delivery", ", filtering the register", ""))
                                    OnSelect: =Set(varWorkPhase, If(varWorkPhase = "Delivery", "", "Delivery"))
                              - wkPhaseRelease:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |
                                      =If(varWorkPhase = "Release", ButtonAppearance.Primary,
                                          ButtonAppearance.Subtle)
                                    BasePaletteColor: =If(varWorkPhase = "Release", BrandBg, NeutralBg1)
                                    Color: =If(varWorkPhase = "Release", BrandFg, NeutralFg1)
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    Width: =Max(Parent.Width * 0.12, 240)
                                    Height: =RowHeight
                                    Text: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Release") },
                                          p.Name & " " & p.Count & " · "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " MW")
                                    AccessibleLabel: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Release") },
                                          "Release, " & p.Count & " items, "
                                          & Text(p.MW, "[$-en-US]#,##0.0") & " member weeks"
                                          & If(varWorkPhase = "Release", ", filtering the register", ""))
                                    OnSelect: =Set(varWorkPhase, If(varWorkPhase = "Release", "", "Release"))
                              - wkPhaseClosed:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |
                                      =If(varWorkPhase = "Closed", ButtonAppearance.Primary,
                                          ButtonAppearance.Subtle)
                                    BasePaletteColor: =If(varWorkPhase = "Closed", BrandBg, NeutralBg1)
                                    Color: =If(varWorkPhase = "Closed", BrandFg, NeutralFg1)
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    Width: =Max(Parent.Width * 0.12, 240)
                                    Height: =RowHeight
                                    Text: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Closed") },
                                          p.Name & " " & p.Count)
                                    AccessibleLabel: |
                                      =With({ p: LookUp(WorkLifecycle, Name = "Closed") },
                                          "Closed, " & p.Count & " items, validated or stopped"
                                          & If(varWorkPhase = "Closed", ", filtering the register", ""))
                                    OnSelect: =Set(varWorkPhase, If(varWorkPhase = "Closed", "", "Closed"))

                        # ---- the filter row: the kind pivot, four lists and the search box ----
                        # Every control writes its choice into a variable, and WorkRegisterRows reads
                        # the variables; nothing filters off a control reference.
                        - wkFilters:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              # The seven children's minimums and their six gaps outrun the body well
                              # before the compact breakpoint, so the row wraps to a second line
                              # rather than clipping Search and the unassigned count.
                              Height: |
                                =If(Parent.Width < (320 + 180 + 220 + 180 + 220 + 240 + 120 + Gap * 6),
                                    ControlHeight * 2 + Gap, ControlHeight)
                              LayoutWrap: =true
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - wkKinds:
                                  Control: ModernTabList@1.0.1
                                  Properties:
                                    Width: =Max(Parent.Width * 0.16, 320)
                                    Height: =ControlHeight + 8
                                    Items: =Table({Value:"All"}, {Value:"Features"}, {Value:"Spikes"}, {Value:"Components"})
                                    Default: ={Value:"All"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Filter by kind"
                                    OnChange: =Set(varWorkKind, wkKinds.Selected.Value)
                                    FontWeight: =FontWeight.Semibold
                              - wkSquad:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    Width: =180
                                    Height: =ControlHeight
                                    Items: =WorkSquadOptions
                                    ItemDisplayText: =ThisItem.Value
                                    Default: ={Value:"All squads"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Squad"
                                    OnChange: |
                                      =Set(varWorkSquad,
                                           If(wkSquad.Selected.Value = "All squads", "",
                                              wkSquad.Selected.Value))
                                    Appearance: =Appearance.Outline
                                    Fill: =NeutralBg1
                              - wkPerson:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    Width: =220
                                    Height: =ControlHeight
                                    Items: =WorkPersonOptions
                                    ItemDisplayText: =ThisItem.DisplayLabel
                                    Default: ={Value:"", DisplayLabel:"All people"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Person, the assessor or anyone assigned"
                                    OnChange: =Set(varWorkPerson, wkPerson.Selected.Value)
                                    Appearance: =Appearance.Outline
                                    Fill: =NeutralBg1
                              - wkState:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    Width: =180
                                    Height: =ControlHeight
                                    Items: =WorkStateOptions
                                    ItemDisplayText: =ThisItem.Value
                                    Default: ={Value:"All states"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="State"
                                    OnChange: |
                                      =Set(varWorkState,
                                           If(wkState.Selected.Value = "All states", "",
                                              wkState.Selected.Value))
                                    Appearance: =Appearance.Outline
                                    Fill: =NeutralBg1
                              - wkCommitment:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    Width: =Max(Parent.Width * 0.11, 220)
                                    Height: =ControlHeight
                                    Items: =WorkCommitmentOptions
                                    ItemDisplayText: =ThisItem.Value
                                    Default: ={Value:"Proposed and committed"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Commitment"
                                    OnChange: |
                                      =Set(varWorkCommit,
                                           If(wkCommitment.Selected.Value = "Proposed and committed", "",
                                              wkCommitment.Selected.Value))
                                    Appearance: =Appearance.Outline
                                    Fill: =NeutralBg1
                              - wkSearch:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    Width: =Max(Parent.Width * 0.18, 240)
                                    Height: =ControlHeight
                                    Default: =""
                                    Placeholder: ="Search"
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Search the register"
                                    OnChange: =Set(varWorkSearch, wkSearch.Text)
                                    Appearance: =Appearance.Outline
                                    Fill: =NeutralBg1
                              - wkUnassignedCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =Max(Parent.Width * 0.09, 120)
                                    Height: =ControlHeight
                                    Text: =CmdUnassignedCount & " unassigned"
                                    Size: =TypeCaption
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =CmdUnassignedCount > 0
                                    Tooltip: ="Items without a squad"
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    FontWeight: =FontWeight.Normal

                        # ---- the register ----
                        - wkCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =1
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              # The grid inside is never narrower than its own column minimums, so the card
                              # scrolls sideways rather than squeezing a cell (power/RUNBOOK.md, "Tables").
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:
                              # The column heads. Title carries the largest named share, not the
                              # leftover; the ten other columns are the widths in Formulas.pa.yaml,
                              # which the template rows share, so the two read as one grid.
                              - wkHeadRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width, WorkTableMinW)
                                    Height: =RowHeight
                                  Children:
                                    - wkHeadPriority:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * WorkSharePriority, WorkMinPriority) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Priority"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wkHeadTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.Width * WorkSharePriority, WorkMinPriority)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * WorkShareTitle, WorkMinTitle) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Title"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wkHeadType:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.Width * WorkShareTitle, WorkMinTitle) + 8
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * WorkShareKind, WorkMinKind) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Type"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wkHeadSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.Width * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.Width * WorkShareKind, WorkMinKind)
                                          Y: =(RowHeight - TypeLabelLine) / 2
