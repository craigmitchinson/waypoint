                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Claimed value"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            # The one place a fault is said: the rules while the form is open, and whatever
            # Dataverse answered if a save was refused.
            - wkNewError:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 8
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Visible: =varWorkNewTried && wkNewError.Text <> ""
                  Text: |
                    =If(!IsBlank(varWorkSaveError), varWorkSaveError,
                        IsBlank(Trim(wkFieldTitle.Text)), "A title is required.",
                        FormWorkIsSpike && !IsBlank(Trim(wkFieldTimebox.Text))
                        && (!IsNumeric(wkFieldTimebox.Text)
                            || Value(wkFieldTimebox.Text) < 1
                            || Value(wkFieldTimebox.Text) > 6),
                        "A timebox is 1 to 6 sprints.",
                        !FormWorkIsSpike && !IsBlank(Trim(wkFieldClaimValue.Text))
                        && !IsNumeric(wkFieldClaimValue.Text),
                        "A claimed value is a number.",
                        !FormWorkIsSpike && !IsBlank(Trim(wkFieldClaimValue.Text))
                        && IsBlank(wkFieldClaimType.Selected.Value),
                        "A claim needs a benefit type.", "")
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =StatusBad
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - wkNewSave:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =BrandBg
                  Color: =BrandFg
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Create"
                  AccessibleLabel: =FormWorkTitle
                  DisplayMode: |
                    =If(varWorkNewTried && wkNewError.Text <> "",
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =Set(varWorkNewTried, true);
                     If(wkNewError.Text = "",
                     IfError(
                     Patch('Work items', Defaults('Work items'),
                           { Title: Trim(wkFieldTitle.Text),
                             Kind: If(FormWorkIsSpike, 'Kind (Work items)'.Spike,
                                      'Kind (Work items)'.Feature),
                             Phase: 'Phase (Work items)'.Shaping,
                             Source: 'Source (Work items)'.Direct,
                             State: FormWorkInitialState,
                             Commitment: 'Commitment (Work items)'.Proposed,
                             Epic: LookUp(Epics, Epic = wkFieldEpic.Selected.Value),
                             Squad: LookUp(Squads, 'Squad name' = wkFieldSquad.Selected.Value),
                             Priority: wkFieldPriority.Selected.Value,
                             'Product owner': LookUp(People,
                                                     'Full name' = wkFieldOwner.Selected.Value),
                             Notes: Trim(wkFieldNotes.Text),
                             'Spike question': If(FormWorkIsSpike, Trim(wkFieldQuestion.Text), ""),
                             'Timebox (sprints)':
                                 If(FormWorkIsSpike && !IsBlank(Trim(wkFieldTimebox.Text)),
                                    Value(wkFieldTimebox.Text), Blank()) }),
                     // A refused save says what Dataverse answered and leaves the panel open.
                     Set(varWorkSaveError, FirstError.Message),
                     // The collection the screens read is rebuilt from the table, as the work item
                     // actions do, and the new row is what varItem then carries.
                     ClearCollect(colWork, 'Work items');
                     Set(varItem, LookUp('Work items', Title = Trim(wkFieldTitle.Text)));
                     // A feature's first claim is a row of its own, written against the item that
                     // was just created, in the benefits column the item screen reads it back from.
                     If(!FormWorkIsSpike && !IsBlank(Trim(wkFieldClaimValue.Text)),
                        Patch('Benefit claims', Defaults('Benefit claims'),
                              { Name: Trim(wkFieldTitle.Text) & " · "
                                      & Lower(wkFieldClaimType.Selected.Value),
                                'Work item': varItem,
                                'Benefit type':
                                    Switch(wkFieldClaimType.Selected.Value,
                                           "Cost avoidance",
                                           'Benefit type (Benefit claims)'.'Cost avoidance',
                                           "Cycle-time cut",
                                           'Benefit type (Benefit claims)'.'Cycle-time cut',
                                           "Error reduction",
                                           'Benefit type (Benefit claims)'.'Error reduction',
                                           "Throughput",
                                           'Benefit type (Benefit claims)'.Throughput,
                                           "Compliance / risk",
                                           'Benefit type (Benefit claims)'.'Compliance / risk',
                                           'Benefit type (Benefit claims)'.'CX / EX uplift'),
                                'Benefits column':
                                    Switch(wkFieldClaimType.Selected.Value,
                                           "Cost avoidance", 'Benefits column (Benefit claims)'.T,
                                           "Cycle-time cut", 'Benefits column (Benefit claims)'.U,
                                           "Error reduction", 'Benefits column (Benefit claims)'.V,
                                           "Throughput", 'Benefits column (Benefit claims)'.W,
                                           "Compliance / risk", 'Benefits column (Benefit claims)'.X,
                                           'Benefits column (Benefit claims)'.Y),
                                'Claimed value': Value(wkFieldClaimValue.Text) });
                        ClearCollect(colClaims, 'Benefit claims'));
                     Set(varWorkSaveError, "");
                     Set(varWorkFormOpen, false);
                     Notify(Trim(wkFieldTitle.Text) & " created.", NotificationType.Success);
                     // The item has a page of its own, and creating it is the way in.
                     Navigate(scrWorkItem, ScreenTransition.None)))
            - wkNewCancel:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad + (Parent.Width - Pad * 2 - Gap) / 2 + Gap
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
