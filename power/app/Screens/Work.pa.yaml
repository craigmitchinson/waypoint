                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Cancel"
                  AccessibleLabel: ="Close the new work item form without saving"
                  OnSelect: =Set(varWorkFormOpen, false)
