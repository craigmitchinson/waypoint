                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 6 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Visible: =!FormWorkIsSpike
                  Items: |
                    =Table({ Value: "Cost avoidance" }, { Value: "Cycle-time cut" },
                           { Value: "Error reduction" }, { Value: "Throughput" },
                           { Value: "Compliance / risk" }, { Value: "CX / EX uplift" })
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:FormWorkNone}
