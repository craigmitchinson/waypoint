                              - wkRegister:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    TemplatePadding: =0
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Width: =Max(Parent.Width, WorkTableMinW)
                                    ShowScrollbar: =true
                                    FillPortions: =1
                                    Visible: =WorkRegisterCount > 0
                                    Items: =WorkRegisterRows
                                    TemplateSize: =WorkRowH
                                    AccessibleLabel: |
                                      ="Work register: every item in the quarter, with its type, "
                                       & "squad, assessor, delivery team, state, commitment, size, "
                                       & "schedule and Jira key."
                                  Children:
                                    # The priority pill, first in the row: Must, Should or Could,
                                    # and nothing at all while the item has no priority.
                                    - wkRowPriority:
                                        Control: Badge@0.0.24
                                        Properties:
                                          X: =0
                                          Y: =(WorkRowH - TypeLabelLine) / 2
                                          Width: =Min(Max(Len(ThisItem.Priority) * 7 + 20, 56), 200)
                                          Height: =TypeLabelLine
                                          Visible: =!IsBlank(ThisItem.Priority)
                                          Appearance: ='BadgeCanvas.Appearance'.Filled
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |
                                            =Switch(ThisItem.Priority,
                                                    "Must", 'BadgeCanvas.ThemeColor'.Danger,
                                                    "Should", 'BadgeCanvas.ThemeColor'.Warning,
                                                    'BadgeCanvas.ThemeColor'.Subtle)
                                          Content: =ThisItem.Priority
                                          FontSize: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                    # The title is the link: it carries the item to varItem and opens
                                    # its own page, which is what the register is for. The second
                                    # line sits under it: the feature a component or a linked spike
                                    # is part of, then the epic. Both labels, never buttons.
                                    - wkRowTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                          Y: =4
                                          Width: =Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) - 8
                                          Height: =TypeBodyLine
                                          Text: =ThisItem.Title
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Underline: =true
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =BrandText
                                          TabIndex: =0
                                          Tooltip: =ThisItem.Title
                                          OnSelect: |
                                            =Set(varItem, LookUp(colWork, Title = ThisItem.Title));
                                             Navigate(scrWorkItem, ScreenTransition.None)
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wkRowEpic:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                          Y: =4 + TypeBodyLine
                                          Width: =Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) - 8
                                          Height: =TypeLabelLine
                                          Text: =ThisItem.SubtitleText
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                      # What kind of thing the row is, said in the badge rather than by its colour
                                      # alone: Feature, Spike or Component.
                                    - wkRowType:
                                        Control: Badge@0.0.24
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                          Y: =(WorkRowH - TypeLabelLine) / 2
                                          Width: =Min(Max(Len(ThisItem.KindText) * 7 + 20, 56), 200)
                                          Height: =TypeLabelLine
                                          Appearance: ='BadgeCanvas.Appearance'.Filled
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |
                                            =Switch(ThisItem.KindText,
                                                    "Feature", 'BadgeCanvas.ThemeColor'.Brand,
                                                    "Spike", 'BadgeCanvas.ThemeColor'.Informative,
                                                    'BadgeCanvas.ThemeColor'.Subtle)
                                          Content: =ThisItem.KindText
                                          FontSize: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                    - wkRowSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad) - 8
                                          Height: =WorkRowH
                                          Text: =ThisItem.SquadText
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
