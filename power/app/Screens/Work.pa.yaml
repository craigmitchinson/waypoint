                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            # A feature may carry its first benefit claim from here; a claim is required
            # before it can be committed, so the form offers it at the earliest moment.
            - wkLblNewClaimType:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 6
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
