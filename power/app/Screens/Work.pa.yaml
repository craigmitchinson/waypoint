                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor) - 8
                                          Height: =WorkRowH
                                          Text: =ThisItem.AssessorText
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowDelivery:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery) - 8
                                          Height: =WorkRowH
                                          Text: =ThisItem.DeliveryText
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowState:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                             + Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareState, WorkMinState) - 8
                                          Height: =WorkRowH
                                          # A closed row shows which end it reached, Validated or
                                          # Stopped, in place of its underlying work state.
                                          Text: =Coalesce(ThisItem.ClosedOutcome, ThisItem.StateName)
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowCommitment:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                             + Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery)
                                             + Max(Parent.TemplateWidth * WorkShareState, WorkMinState)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareCommitment, WorkMinCommitment) - 8
                                          Height: =WorkRowH
                                          Text: =ThisItem.CommitmentText
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowMW:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                             + Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery)
                                             + Max(Parent.TemplateWidth * WorkShareState, WorkMinState)
                                             + Max(Parent.TemplateWidth * WorkShareCommitment, WorkMinCommitment)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareMW, WorkMinMW) - 8
                                          Height: =WorkRowH
                                          # One shape for the cell: the size letter where the item is
                                          # sized, its member weeks where it is not, and an em dash
                                          # where it has neither.
                                          Text: |
                                            =If(!IsBlank(ThisItem.Size.Size), ThisItem.Size.Size,
                                                IsBlank(ThisItem.WorkMWValue)
                                                || ThisItem.WorkMWValue = 0, "—",
                                                Text(ThisItem.WorkMWValue, "[$-en-US]#,##0.0"))
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowSprints:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                             + Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery)
                                             + Max(Parent.TemplateWidth * WorkShareState, WorkMinState)
                                             + Max(Parent.TemplateWidth * WorkShareCommitment, WorkMinCommitment)
                                             + Max(Parent.TemplateWidth * WorkShareMW, WorkMinMW)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareSprints, WorkMinSprints) - 8
                                          Height: =WorkRowH
                                          Text: |
                                            =If(ThisItem.LastSprintNum < ThisItem.FirstSprintNum, "—",
                                                "S" & ThisItem.FirstSprintNum & " to S" & ThisItem.LastSprintNum)
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wkRowJira:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * WorkSharePriority, WorkMinPriority)
                                             + Max(Parent.TemplateWidth * WorkShareTitle, WorkMinTitle) + 8
                                             + Max(Parent.TemplateWidth * WorkShareKind, WorkMinKind)
                                             + Max(Parent.TemplateWidth * WorkShareSquad, WorkMinSquad)
                                             + Max(Parent.TemplateWidth * WorkShareAssessor, WorkMinAssessor)
                                             + Max(Parent.TemplateWidth * WorkShareDelivery, WorkMinDelivery)
                                             + Max(Parent.TemplateWidth * WorkShareState, WorkMinState)
                                             + Max(Parent.TemplateWidth * WorkShareCommitment, WorkMinCommitment)
                                             + Max(Parent.TemplateWidth * WorkShareMW, WorkMinMW)
                                             + Max(Parent.TemplateWidth * WorkShareSprints, WorkMinSprints)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * WorkShareJira, WorkMinJira) - 8
                                          Height: =WorkRowH
                                          Text: =Coalesce(ThisItem.'Jira key', "—")
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg2
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    # The row is the target: the whole row opens the item's page,
                                    # as the title does (power/RUNBOOK.md, section 4).
                                    - wkRowHit:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          X: =2
                                          Y: =2
                                          Width: =Parent.TemplateWidth - 4
                                          Height: =WorkRowH - 4
                                          Text: =""
                                          Fill: =RGBA(0, 0, 0, 0)
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          FocusedBorderThickness: =2
                                          TabIndex: =0
                                          Tooltip: =ThisItem.Title
                                          FocusedBorderColor: =FocusStroke
                                          OnSelect: |
                                            =Set(varItem, LookUp(colWork, Title = ThisItem.Title));
                                             Navigate(scrWorkItem, ScreenTransition.None)

                              - wkCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeLabelLine
                                    Text: |
                                      =WorkRegisterCount & " of " & WorkTotalCount
                                       & If(WorkTotalCount = 1, " item", " items")
                                    Size: =TypeCaption
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FontWeight: =FontWeight.Normal

      # ---- the new work item form: the scrim, then the panel over the right of the screen ----
      # The person panel's pattern (power/RUNBOOK.md, section 4, "Forms"), with the fields a
      # feature or a spike is shaped with. varWorkNewKind says which of the two the panel is on,
      # and the fields only one kind carries are hidden for the other.
      - wkScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.4)
            Visible: =varWorkFormOpen
          Children:
            # A container takes no OnSelect (Studio PA2108), so the scrim's own dismiss is a
            # transparent button over the whole of it.
            - wkScrimHit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.Width - 4
                  Height: =Parent.Height - 4
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  TabIndex: =0
                  Tooltip: ="Close the new work item form"
                  FocusedBorderColor: =FocusStroke
                  OnSelect: =Set(varWorkFormOpen, false)
      - wkNewPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Width: =Max(Parent.Width * 0.32, 420)
            Height: =Parent.Height - AppHeaderH
            X: =Parent.Width - Max(Parent.Width * 0.32, 420)
            Y: =AppHeaderH
            Fill: =NeutralBg1
            BorderColor: =NeutralStroke1
            BorderThickness: =1
            Visible: =varWorkFormOpen
          Children:
            - wkNewTitle:
