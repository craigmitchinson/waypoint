# Waypoint canvas app: the Financials screen, what the team costs and what it returns.
#
# Valid against pa.schema.yaml (v3.0): a Screens map, each screen with a Properties formula map and a
# Children sequence whose items are single-key maps of control name to control instance.
#
# Financials is src/pages/Financials.tsx: the band of the year's cost-against-value figures, a strip
# of six more, then one pivot over four tables — cost of capacity by squad, by team grade, by
# funding line, and cost per work item. It is Team's shape: the tab list writes varFinTab, one card
# is visible at a time, and that card takes the whole height the body has left, so at 1920x1080 the
# body leaves the card 648px and twelve rows are in view before anything scrolls. Every number is the
# engine's, through the named formulas in
# Formulas.pa.yaml prefixed Fin*, over PeopleTable, SquadTable, WorkStatusTable, colTeamGradeCosts and
# colCostLines. Nothing here works a number out for itself.
#
# The shell is scrTeam's, unchanged: fnRoot is a vertical GroupContainer the size of the screen,
# holding the 48px header and a horizontal row of the rail and the body. X and Y appear only inside
# the gallery templates, which are not auto-layout.
#
# Money stays numeric inside every table column and is formatted at the cell: RUNBOOK.md, "Rules
# learned", says why (a table with a column typed from Text() cannot be bound). The funding-line
# table's "Not split" and grand-total rows are fixed rows under the gallery rather than gallery items,
# for the same reason — a table can't mix a numeric column with a "—" placeholder on some rows.
#
# fnBody carries LayoutOverflowY per power/canvas/CONTROLS.md, "Layout containers" (documented,
# not yet seen written by Studio — a Studio round trip is what confirms it).
#
# What is a placeholder, and says so: the export button raises a Notify. The CSV itself is a later
# unit.

Screens:
  scrFinancials:
    Properties:
      Fill: =NeutralCanvas

    Children:
      # ---- the root: one vertical auto-layout container the size of the screen ----
      - fnRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Hide
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:
            # ---- shell: the app header ----
            - fnHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - fnHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  # ---- shell: the scope selector, one cmpScope instance for every screen ----
                  - fnHeaderScope:
                      Control: CanvasComponent
                      ComponentName: cmpScope
                      Properties:
                        Width: =Max(Parent.Width * 0.14, 180)
                        Height: =ControlHeight
                        Visible: =IncludeScope
                  # ---- shell: the header search, one cmpSearch instance for every screen ----
                  - fnHeaderSearch:
                      Control: CanvasComponent
                      ComponentName: cmpSearch
                      Properties:
                        Width: =Max(Parent.Width * 0.24, 280)
                        Height: =ControlHeight
                  - fnHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - fnMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:
                  # ---- shell: the rail, one cmpRail instance for every screen ----
                  - fnRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="Financials"

                  # ---- shell: the body everything else sits inside, and scrolls on its own ----
                  - fnBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowX: =LayoutOverflow.Hide
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =Gap
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:
                        # ---- page head: the eyebrow and one h1 on the left, export right ----
                        - fnPageHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - fnHeadText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =0
                                  Children:
                                    - fnEyebrow:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeKickerLine
                                          Visible: =!IsCompact
                                          Text: =CurrentQuarter.Label
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeDisplayLine
                                          Text: ="Financials"
                                          Size: =TypeTitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                              # Hidden until the CSV export itself exists.
                              - fnExport:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =BrandBg
                                    Color: =BrandFg
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =Max(Parent.Width * 0.13, 220)
                                    Height: =ControlHeight
                                    # hidden until the CSV export exists
                                    Visible: =false
                                    Text: ="Export these tables as CSV"
                                    AccessibleLabel: ="Export these tables as CSV"
                                    OnSelect: |
                                      =Notify("Export as CSV: arrives in a later unit.",
                                              NotificationType.Information)

                        # ---- the brand band: cost against value this year ----
                        - fnBand:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: |
                                =If(Parent.Width < (Pad * 2 + BandKickerW + 3 * (180 + Gap)), BandH * 2, BandH)
                              LayoutWrap: =true
                              Fill: =BrandBg
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =10
                              PaddingBottom: =10
                            Children:
                              - fnBandKicker:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =BandKickerW
                                    Height: =TypeKickerLine * 2
                                    Text: ="Cost against value this year"
                                    Size: =TypeCaption
                                    FontWeight: =FontWeight.Normal
                                    Font: =FontUI
                                    Color: =ColorFade(BrandFg, -0.2)
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AutoHeight: =true
                              - fnStatTco:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 3) / 3, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Label: ="Cost of ownership"
                                    Value: ="£" & Text(FinTCO, "[$-en-US]#,##0")
                                    Sub: ="People in post plus the running cost lines"
                              - fnStatValue:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 3) / 3, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Label: ="Value returned"
                                    Value: ="£" & Text(FinInYear, "[$-en-US]#,##0")
                                    Sub: ="In-year value of the claims in plan"
                              - fnStatReturn:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 3) / 3, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Tone: ="accent"
                                    Label: ="Return"
                                    Value: =Text(FinReturnOnTco, "[$-en-US]#,##0.00") & "x"
                                    Sub: ="In-year value over a year of cost"

                        # ---- the figures: the six pairs the card carried, as one compact strip ----
                        # A strip, not a card: the table below is what the height is for, so the six figures are
                        # two rows of three key-and-value lines rather than a card of their own (power/RUNBOOK.md,
                        # "Space allocation"). Every figure the card carried is still here, and the band above
                        # names the block. Compact, each row wraps and fnBody is what scrolls.
                        - fnFigures:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: |
                                =If(IsCompact,
                                    (TypeBodyLine * 3 + Gap * 2) * 2 + 4,
                                    TypeBodyLine * 2 + 4)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                            Children:
                              - fnFiguresRowA:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =0
                                    Height: =If(IsCompact, TypeBodyLine * 3 + Gap * 2, TypeBodyLine)
                                    LayoutWrap: =IsCompact
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =Gap
                                  Children:
                                    - fnFigInYear:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigInYearLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Pipeline value in-year"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigInYearValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: ="£" & Text(FinInYear, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    - fnFigRecorded:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigRecordedLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Recorded against the claims"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigRecordedValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: ="£" & Text(FinRecorded, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    - fnFigTco:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigTcoLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Total cost of ownership per year"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigTcoValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: ="£" & Text(FinTCO, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                              - fnFiguresRowB:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =0
                                    Height: =If(IsCompact, TypeBodyLine * 3 + Gap * 2, TypeBodyLine)
                                    LayoutWrap: =IsCompact
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =Gap
                                  Children:
                                    - fnFigQuarter:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigQuarterLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Cost of capacity this quarter"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigQuarterValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: ="£" & Text(FinSquadQuarter, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    - fnFigReturn:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigReturnLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Return on total cost of ownership"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigReturnValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: =Text(FinReturnOnTco, "[$-en-US]#,##0.00") & "x"
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    - fnFigPayback:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =If(IsCompact, Parent.Width, (Parent.Width - Gap * 2) / 3)
                                          Height: =TypeBodyLine
                                        Children:
                                          - fnFigPaybackLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.Width * 0.62 - 8
                                                Height: =TypeBodyLine
                                                Text: ="Payback on a year of cost (months)"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - fnFigPaybackValue:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * 0.62
                                                Y: =0
                                                Width: =Parent.Width * 0.38
                                                Height: =TypeBodyLine
                                                Text: |
                                                  =If(IsBlank(FinPaybackMonths), "—",
                                                      Text(FinPaybackMonths, "[$-en-US]#,##0.0"))
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0

                        # ---- the pivot: one table at a time, at the height the body has left ----
                        # The tab list writes varFinTab, which App.OnStart opens on Squads, and each card's Visible
                        # reads it, so one table is on the page at a time (scrTeam's pattern).
                        - fnPivot:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =ControlHeight + 16
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - fnTabs:
                                  Control: ModernTabList@1.0.1
                                  Properties:
                                    Width: =Max(Parent.Width * 0.28, 520)
                                    Height: =ControlHeight + 8
                                    Items: =Table({Value:"Squads"}, {Value:"Grades"}, {Value:"Funding"}, {Value:"Work"})
                                    Default: ={Value:"Squads"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Financials views"
                                    OnChange: =Set(varFinTab, fnTabs.Selected.Value)
                                    FontWeight: =FontWeight.Semibold

                        # ---- the four tables, one to a tab ----
                        - fnSquadCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              # One table at a time: the card is the tab's, and it takes the whole height
                              # the body has left at every width. Inside it the head and the foot are
                              # static and only the rows between them scroll (power/RUNBOOK.md,
                              # "Space allocation").
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =1
                              Visible: =varFinTab = "Squads"
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              # The grid inside is never narrower than its own column minimums, so the card
                              # scrolls sideways rather than squeezing a cell (power/RUNBOOK.md, "Tables").
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:
                              - fnSquadTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeHeadingLine
                                    Text: ="Cost of capacity by squad"
                                    Size: =TypeSubtitle
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg1
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
