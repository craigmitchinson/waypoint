                                          Height: =RowHeight
                                          Text: ="£" & Text(FinFundingInvestment, "[$-en-US]#,##0")
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - fnFundingFootOther:
                                        Control: Label@2.5.1
                                        Properties:
                                          Width: =Max(Parent.Width * FinFlShareOther, FinFlMinOther)
                                          Height: =RowHeight
                                          Text: ="£" & Text(FinFundingOther, "[$-en-US]#,##0")
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - fnFundingFootSplit:
                                        Control: Label@2.5.1
                                        Properties:
                                          Width: =Max(Parent.Width * FinFlShareSplit, FinFlMinSplit)
                                          Height: =RowHeight
                                          Text: ="£" & Text(FinPeopleAnnual, "[$-en-US]#,##0")
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - fnFundingFootTotal:
                                        Control: Label@2.5.1
                                        Properties:
                                          Width: =Max(Parent.Width * FinFlShareTotal, FinFlMinTotal)
                                          Height: =RowHeight
                                          Text: ="£" & Text(FinTCO, "[$-en-US]#,##0")
                                          Size: =TypeBody
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true

                              - fnFundingNote:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeLabelLine * 2
                                    Text: |
                                      ="The workbook sets funding per person on People; the app model "
                                       & "does not carry it, so the people line is shown whole rather "
                                       & "than split."
                                    Size: =TypeCaption
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FontWeight: =FontWeight.Normal

                        - fnWorkCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              # One table at a time: the card is the tab's, and it takes the whole height
                              # the body has left at every width. Inside it the head and the foot are
                              # static and only the rows between them scroll (power/RUNBOOK.md,
                              # "Space allocation").
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =1
                              Visible: =varFinTab = "Work"
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              # The grid inside is never narrower than its own column minimums, so the card
                              # scrolls sideways rather than squeezing a cell (power/RUNBOOK.md, "Tables").
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:
                              - fnWorkTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeHeadingLine
                                    Text: ="Cost per work item"
                                    Size: =TypeSubtitle
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg1
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AutoHeight: =true

                              # The head: static above the rows, so the column titles are never scrolled away.
                              - fnWiHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width, FinWorkColsW)
                                    Height: =RowHeight
                                  Children:
                                    - fnWiHeadName:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareName, FinWiMinName) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Work item"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnWiHeadSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.Width * FinWiShareName, FinWiMinName)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareSquad, FinWiMinSquad) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Squad"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnWiHeadMW:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FinWiShareName, FinWiMinName)
                                             + Max(Parent.Width * FinWiShareSquad, FinWiMinSquad)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareMW, FinWiMinMW) - 8
                                          Height: =TypeLabelLine
                                          Text: ="MW"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnWiHeadCost:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FinWiShareName, FinWiMinName)
                                             + Max(Parent.Width * FinWiShareSquad, FinWiMinSquad)
                                             + Max(Parent.Width * FinWiShareMW, FinWiMinMW)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareCost, FinWiMinCost) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Delivery cost"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnWiHeadInYear:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FinWiShareName, FinWiMinName)
                                             + Max(Parent.Width * FinWiShareSquad, FinWiMinSquad)
                                             + Max(Parent.Width * FinWiShareMW, FinWiMinMW)
                                             + Max(Parent.Width * FinWiShareCost, FinWiMinCost)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareInYear, FinWiMinInYear) - 8
                                          Height: =TypeLabelLine
                                          Text: ="£ in-year"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fnWiHeadReturn:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FinWiShareName, FinWiMinName)
                                             + Max(Parent.Width * FinWiShareSquad, FinWiMinSquad)
                                             + Max(Parent.Width * FinWiShareMW, FinWiMinMW)
                                             + Max(Parent.Width * FinWiShareCost, FinWiMinCost)
                                             + Max(Parent.Width * FinWiShareInYear, FinWiMinInYear)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FinWiShareReturn, FinWiMinReturn) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Return"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0

                              # The rows, and only the rows: the one thing that scrolls, and only when they do not
                              # fit the space the head and the foot leave it (power/RUNBOOK.md, "Space allocation").
                              - fnWorkList:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    FillPortions: =1
                                    Width: =Max(Parent.Width, FinWorkColsW)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                  Children:
                                    - fnWorkEmpty:
                                        Control: Label@2.5.1
                                        Properties:
                                          Width: =Parent.Width
                                          Height: =TypeBodyLine
                                          Align: =Align.Left
                                          Visible: =CountRows(FinWorkRows) = 0
                                          Text: ="No cost lines for this quarter."
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0

                                    - fnWork:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          TemplatePadding: =0
                                          FillPortions: =0
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Width: =Max(Parent.Width, FinWorkColsW)
                                          ShowScrollbar: =false
                                          Visible: =CountRows(FinWorkRows) > 0
                                          Height: =CountRows(FinWorkRows) * RowHeight
                                          Items: =FinWorkRows
                                          TemplateSize: =RowHeight
                                          AccessibleLabel: |
                                            ="Cost per work item: member weeks this quarter at the squad's "
                                             & "cost per member week, against the in-year value of what it "
                                             & "claims."
                                        Children:
                                          - fnWiRowName:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName) - 8
                                                Height: =RowHeight
                                                Text: =ThisItem.Title
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - fnWiRowSquad:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName)
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareSquad, FinWiMinSquad) - 8
                                                Height: =RowHeight
                                                Text: =If(ThisItem.Squad = "", "—", ThisItem.Squad)
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - fnWiRowMW:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName)
                                                   + Max(Parent.TemplateWidth * FinWiShareSquad, FinWiMinSquad)
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareMW, FinWiMinMW) - 8
                                                Height: =RowHeight
                                                Text: =Text(ThisItem.MW, "[$-en-US]#,##0.0")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - fnWiRowCost:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName)
                                                   + Max(Parent.TemplateWidth * FinWiShareSquad, FinWiMinSquad)
                                                   + Max(Parent.TemplateWidth * FinWiShareMW, FinWiMinMW)
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareCost, FinWiMinCost) - 8
                                                Height: =RowHeight
                                                Text: ="£" & Text(ThisItem.Cost, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - fnWiRowInYear:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName)
                                                   + Max(Parent.TemplateWidth * FinWiShareSquad, FinWiMinSquad)
                                                   + Max(Parent.TemplateWidth * FinWiShareMW, FinWiMinMW)
                                                   + Max(Parent.TemplateWidth * FinWiShareCost, FinWiMinCost)
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareInYear, FinWiMinInYear) - 8
                                                Height: =RowHeight
                                                Text: ="£" & Text(ThisItem.InYear, "[$-en-US]#,##0")
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - fnWiRowReturn:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.TemplateWidth * FinWiShareName, FinWiMinName)
                                                   + Max(Parent.TemplateWidth * FinWiShareSquad, FinWiMinSquad)
                                                   + Max(Parent.TemplateWidth * FinWiShareMW, FinWiMinMW)
                                                   + Max(Parent.TemplateWidth * FinWiShareCost, FinWiMinCost)
                                                   + Max(Parent.TemplateWidth * FinWiShareInYear, FinWiMinInYear)
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth * FinWiShareReturn, FinWiMinReturn) - 8
                                                Height: =RowHeight
                                                Text: |
                                                  =If(IsBlank(ThisItem.Return), "—",
                                                      Text(ThisItem.Return, "[$-en-US]#,##0.00") & "x")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =If(IsBlank(ThisItem.Return), NeutralFg2, NeutralFg1)
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true

                              # The totals: a static block beneath the list, in view whatever the list is showing.
                              - fnWorkFoot:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =0
                                    Height: =RowHeight
                                    Width: =Max(Parent.Width, FinWorkColsW)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                  Children:
                                    - fnWorkFootLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =RowHeight
                                          Text: ="Counted work"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg2
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - fnWorkFootValue:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =RowHeight
                                          Text: |
                                            =Text(FinWorkMW, "[$-en-US]#,##0.0") & " MW, £"
                                             & Text(FinWorkCost, "[$-en-US]#,##0") & " delivery cost, £"
                                             & Text(FinWorkValue, "[$-en-US]#,##0") & " in-year"
                                          Size: =TypeBody
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true

                              - fnWorkNote:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeLabelLine * 2
                                    Text: |
                                      ="A squad with no cost of its own is costed at the blended rate "
                                       & "across every squad."
                                    Size: =TypeCaption
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FontWeight: =FontWeight.Normal
