                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Start sprint"
