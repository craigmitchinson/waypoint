                                                      Default: =Text(ItemClaimY, "[$-en-US]#,##0.0")
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Customer and colleague experience uplift"
                                                - wiHypMonthLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Landing month"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypMonthInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =ItemMonthOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Text(varItem.'Landing month')}
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Landing month"
                                                      Size: =TypeBodyPx
                                                - wiHypYearLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Landing year"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypYearInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =If(IsBlank(varItem.'Landing year'), "", Text(varItem.'Landing year', "[$-en-US]0000"))
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Landing year"
                                    # The actions row. A horizontal container so the button keeps
                                    # its own width instead of stretching to the card.
                                    - wiActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =8
                                        Children:
                                          - wiSave:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                # Secondary, because the forward action on this tab is
                                                # wiSendGo and a tab carries one primary button. A modern
                                                # button works its own hover, pressed and disabled states
                                                # out of the one palette colour.
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Width: =140
                                                Height: =ControlHeight
                                                Text: ="Save draft"
                                                AccessibleLabel: ="Save this work item as a draft"
                                                DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                # One draft save for the whole tab: the Product
                                                # form's fields and the hypothesised value, written
                                                # in one go and never gated. A lookup is patched
                                                # with the record the chosen name reads back to;
                                                # the choice columns on this tab are not edited
                                                # here. The FTE claim and the landing date sit on
                                                # the item; the other six claims are rows on
                                                # Benefit claims, one per benefits column, created
                                                # on first save.
                                                OnSelect: |
                                                  =Set(varProblem, "");
                                                   IfError(
                                                    Patch('Work items', ItemRow,
                                                          { Title: wiTitleInput.Text,
                                                            Epic: LookUp(Epics, Epic = wiEpicInput.Selected.Value),
                                                            'Product owner':
                                                                LookUp(People, 'Full name' = wiOwnerInput.Selected.Value),
                                                            'Jira Align ID': wiJiraInput.Text,
                                                            'Cancellation reason': wiReasonInput.Text,
                                                            Priority: wiShapePriorityInput.Selected.Value,
                                                            Notes: If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                                      varItem.Notes, wiNotesInput.Text),
                                                            'Spike question':
                                                                If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                                   wiNotesInput.Text, varItem.'Spike question'),
                                                            'FTE released': If(IsBlank(wiHypFteInput.Text), Blank(),
                                                                              Value(wiHypFteInput.Text)),
                                                            'Landing month':
                                                                If(IsBlank(wiHypMonthInput.Selected.Value), Blank(),
                                                                   Switch(wiHypMonthInput.Selected.Value,
                                                                       "Jan", 'Landing month (Work items)'.Jan,
                                                                       "Feb", 'Landing month (Work items)'.Feb,
                                                                       "Mar", 'Landing month (Work items)'.Mar,
                                                                       "Apr", 'Landing month (Work items)'.Apr,
                                                                       "May", 'Landing month (Work items)'.May,
                                                                       "Jun", 'Landing month (Work items)'.Jun,
                                                                       "Jul", 'Landing month (Work items)'.Jul,
                                                                       "Aug", 'Landing month (Work items)'.Aug,
                                                                       "Sep", 'Landing month (Work items)'.Sep,
                                                                       "Oct", 'Landing month (Work items)'.Oct,
                                                                       "Nov", 'Landing month (Work items)'.Nov,
                                                                       "Dec", 'Landing month (Work items)'.Dec,
                                                                       Blank())),
                                                            'Landing year': If(IsBlank(wiHypYearInput.Text), Blank(),
                                                                               Value(wiHypYearInput.Text)) }),
                                                    Set(varProblem, FirstError.Message),
                                                    IfError(
                                                     // ItemRow is keyed on the item's id, so a rename saved a moment ago still
                                                     // finds the record and the six claim rows behind it; the new title is read
                                                     // once, before anything is written. A column with nothing typed and no row
                                                     // behind it is left alone, so an item that claims nothing carries no rows.
                                                     If(!IsBlank(wiHypTInput.Text) || !IsBlank(ItemClaimRowT),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowT, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · cost avoidance",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.'Cost avoidance',
                                                                'Benefits column': 'Benefits column (Benefit claims)'.T,
                                                                'Claimed value': If(IsBlank(wiHypTInput.Text), Blank(),
                                                                                    Value(wiHypTInput.Text)) }));
                                                     If(!IsBlank(wiHypUInput.Text) || !IsBlank(ItemClaimRowU),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowU, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · cycle-time cut",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.'Cycle-time cut',
                                                                'Benefits column': 'Benefits column (Benefit claims)'.U,
                                                                'Claimed value': If(IsBlank(wiHypUInput.Text), Blank(),
                                                                                    Value(wiHypUInput.Text)) }));
                                                     If(!IsBlank(wiHypVInput.Text) || !IsBlank(ItemClaimRowV),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowV, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · error reduction",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.'Error reduction',
                                                                'Benefits column': 'Benefits column (Benefit claims)'.V,
                                                                'Claimed value': If(IsBlank(wiHypVInput.Text), Blank(),
                                                                                    Value(wiHypVInput.Text)) }));
                                                     If(!IsBlank(wiHypWInput.Text) || !IsBlank(ItemClaimRowW),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowW, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · throughput",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.Throughput,
                                                                'Benefits column': 'Benefits column (Benefit claims)'.W,
                                                                'Claimed value': If(IsBlank(wiHypWInput.Text), Blank(),
                                                                                    Value(wiHypWInput.Text)) }));
                                                     If(!IsBlank(wiHypXInput.Text) || !IsBlank(ItemClaimRowX),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowX, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · compliance and risk",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.'Compliance / risk',
                                                                'Benefits column': 'Benefits column (Benefit claims)'.X,
                                                                'Claimed value': If(IsBlank(wiHypXInput.Text), Blank(),
                                                                                    Value(wiHypXInput.Text)) }));
                                                     If(!IsBlank(wiHypYInput.Text) || !IsBlank(ItemClaimRowY),
                                                        Patch('Benefit claims',
                                                              Coalesce(ItemClaimRowY, Defaults('Benefit claims')),
                                                              { Name: wiTitleInput.Text & " · experience uplift",
                                                                'Work item': ItemRow,
                                                                'Benefit type': 'Benefit type (Benefit claims)'.'CX / EX uplift',
                                                                'Benefits column': 'Benefits column (Benefit claims)'.Y,
                                                                'Claimed value': If(IsBlank(wiHypYInput.Text), Blank(),
                                                                                    Value(wiHypYInput.Text)) })),
                                                     Set(varProblem, FirstError.Message);
                                                     Concurrent(ClearCollect(colWork, 'Work items'),
                                                                ClearCollect(colClaims, 'Benefit claims'));
                                                     Set(varItem, LookUp('Work items', 'Work item id' = ItemRow.'Work item id')),
                                                     Concurrent(ClearCollect(colWork, 'Work items'),
                                                                ClearCollect(colClaims, 'Benefit claims'));
                                                     Set(varItem, LookUp('Work items', 'Work item id' = ItemRow.'Work item id'));
                                                     Notify("The draft is saved.", NotificationType.Success)))

                                    - wiSentLine:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =If(!ItemShapeEditable && !IsBlank(ItemSentRow.At), TypeBodyLine, 0)
                                          Visible: =!ItemShapeEditable && !IsBlank(ItemSentRow.At)
                                          Text: =ItemSentLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- Stop: the other exit out of Intake, to the product
                                    # owner who holds the item here (power/design-work-flow.md,
                                    # section 9). The same section Assess and Delivery carry,
                                    # reading the same Stop formulas; a secondary action, never
                                    # the primary one on the tab.
                                    - wiIntakeExitSection:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =If(ItemShapeEditable, TypeBodyLine + 48 + 4, 0)
                                          Visible: =ItemShapeEditable
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                        Children:
                                          - wiIntakeExitTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: ="Other exits"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiIntakeExitRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =0
                                                Height: =48
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutJustifyContent: =LayoutJustifyContent.Start
                                                LayoutGap: =8
                                              Children:
                                                - wiIntakeExitNote:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Width: =Max(Parent.Width - 400, 200)
                                                      Height: =48
                                                      Type: =TextInputType.Multiline
                                                      Default: =""
                                                      Placeholder: ="Why (required)"
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: |
                                                        =If(ItemShapeEditable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      AccessibleLabel: ="Why this item is stopping"
                                                - wiIntakeStopItem:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Width: =140
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Secondary
                                                      BasePaletteColor: =NeutralBg1
                                                      Color: =NeutralFg1
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Stop"
                                                      AccessibleLabel: ="Stop this item"
                                                      # The Stop gate, as Send for assessment has
                                                      # it: live only once a reason is typed, with
                                                      # the line beside the button saying so.
                                                      DisplayMode: |
                                                        =If(!ItemCanStop, DisplayMode.View,
                                                            IsBlank(Trim(wiIntakeExitNote.Text)),
                                                            DisplayMode.Disabled,
                                                            DisplayMode.Edit)
                                                      # The refusal is the line above the tabs,
                                                      # which is where Intake puts every other one.
                                                      OnSelect: |
                                                        =Set(varProblem, "");
                                                         If(IsBlank(Trim(wiIntakeExitNote.Text)),
                                                             Set(varProblem, ItemStopRefusal),
                                                             IfError(
                                                              Patch('Work items', ItemRow,
                                                                    { Phase: 'Phase (Work items)'.Stopped,
                                                                      'Stopped reason': Trim(wiIntakeExitNote.Text),
                                                                      State: ItemStoppedState }),
                                                              Set(varProblem, FirstError.Message),
                                                              Patch('Activity log', Defaults('Activity log'),
                                                                    { Label: varItem.Title & " · stopped",
                                                                      Summary: Coalesce(ItemMeName, "Someone")
                                                                               & " stopped this: "
                                                                               & Trim(wiIntakeExitNote.Text),
                                                                      Action: 'Action (Activity log)'.'Stage action',
                                                                      Table: "wp_workitem",
                                                                      Record: Text(ItemRow.'Work item id'),
                                                                      'Record name': varItem.Title,
                                                                      Before: ItemStage,
                                                                      After: "Stopped",
                                                                      At: Now() });
                                                              Concurrent(ClearCollect(colWork, 'Work items'),
                                                                         ClearCollect(colActivity, 'Activity log'),
                                                                         ClearCollect(colItemActivity,
                                                                                      Filter('Activity log',
                                                                                             'Record name' = varItem.Title)));
                                                              Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                              Set(varItemTab, "");
                                                              Reset(wiTabs);
                                                              Reset(wiIntakeExitNote);
                                                              Notify(varItem.Title & " is stopped.",
                                                                     NotificationType.Success)))
                                                - wiIntakeStopMissing:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Width: =200
                                                      Height: =ControlHeight
                                                      Visible: =ItemCanStop && IsBlank(Trim(wiIntakeExitNote.Text))
                                                      Text: =ItemStopRefusal
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =StatusWarn
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0

                              # ---- Assess: the fields Engineering owns, over the capacity check ----
                              - wiAssess:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    FillPortions: =1
                                    Visible: =ItemTab = "Assess"
                                    LayoutMinWidth: =480
                                    Fill: =NeutralBg1
                                    BorderColor: =NeutralStroke1
                                    BorderThickness: =1
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =Gap
                                    PaddingLeft: =Pad
                                    PaddingRight: =Pad
                                    PaddingTop: =Pad
                                    PaddingBottom: =Pad
                                  Children:
                                    - wiAssessTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeHeadingLine
                                          Text: ="Assess"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    # ---- Assessor: who holds the assessment. Naming the person
                                    # is the Assess tab's job, not the submission's
                                    # (power/design-work-flow.md, section 6), and the Commit gate
                                    # asks for it.
                                    - wiAssessorRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =8
                                        Children:
                                          - wiAssessorLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Width: =88
                                                Height: =ControlHeight
                                                Text: ="Assessor"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # The picker holds the id of its choice in
                                          # varItemAssessor, because a combo box's selection is
                                          # not readable until it has been touched and "Assign to
                                          # me" has to write it. The id, not the name: the picker
                                          # selects a person row and the id is what reads it back.
                                          - wiAssessedInput:
                                              Control: ModernCombobox@1.1.1
                                              Properties:
                                                Width: =Max(Parent.Width - 704, 160)
                                                Height: =ControlHeight
                                                Items: =ItemAssigneeOptions
                                                ItemDisplayText: =ThisItem.DisplayLabel
                                                DefaultSelectedItems: |
                                                  =Filter(ItemAssigneeOptions, Id = ItemAssessorId)
                                                SelectMultiple: =false
                                                IsSearchable: =true
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="Who is assessing this item"
                                                Size: =TypeBodyPx
                                                OnChange: =Set(varItemAssessor, wiAssessedInput.Selected.Id)
                                          - wiAssessorMe:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Width: =140
                                                Height: =ControlHeight
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Text: ="Assign to me"
                                                AccessibleLabel: ="Assign the assessment to me"
                                                DisplayMode: |
                                                  =If(!ItemAssessEditable || IsBlank(ItemMeName),
                                                      DisplayMode.Disabled, DisplayMode.Edit)
                                                # The signed-in user's own person row, matched on
                                                # Email; the picker is read again from its Default.
                                                OnSelect: |
                                                  =Set(varItemAssessor, Text(ItemMePerson.'Person id'));
                                                   Reset(wiAssessedInput)
                                          # The squad is chosen here and not at intake
                                          # (power/design-work-flow.md, section 6): who assesses
                                          # and which squad holds the item are one decision, and
                                          # the Commit gate asks for it.
                                          - wiAssessSquadLabel:
                                              Control: Label@2.5.1
                                              Properties:
                                                Width: =56
                                                Height: =ControlHeight
                                                Text: ="Squad"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiAssessSquadInput:
                                              Control: ModernDropdown@1.0.2
                                              Properties:
                                                Width: =180
                                                Height: =ControlHeight
                                                Items: =ItemSquadOptions
                                                ItemDisplayText: =ThisItem.Value
                                                Default: ={Value:Coalesce(varItem.Squad.'Squad name', "")}
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="Squad"
                                                Size: =TypeBodyPx
                                          - wiAssessorSaved:
                                              Control: Label@2.5.1
                                              Properties:
                                                Width: =200
                                                Height: =ControlHeight
                                                Text: =ItemAssessorSaved
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    # The capacity check: what the item charges this quarter against
                                    # what its assignees still have free, or why there is nothing to
                                    # check yet.
                                    - wiCheckCard:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =TypeLabelLine + TypeBodyLine + Pad * 2 + 4
                                          Fill: =NeutralBg2
                                          RadiusTopLeft: =CardR
                                          RadiusTopRight: =CardR
                                          RadiusBottomLeft: =CardR
                                          RadiusBottomRight: =CardR
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          PaddingLeft: =Pad
                                          PaddingRight: =Pad
                                          PaddingTop: =Pad
                                          PaddingBottom: =Pad
                                        Children:
                                          - wiCheckTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeLabelLine
                                                Text: ="Capacity check"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCheckLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: =If(ItemCheckWhyNot = "", ItemCheckLine, ItemCheckWhyNot)
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Color: |
                                                  =If(ItemCheckWhyNot <> "", NeutralFg2,
                                                      ItemCheckFits, StatusGood, StatusBad)
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    # The finish walk: what each assignee owes this item, what
                                    # they have free by the end of its span, and the week their
                                    # running free capacity covers their share. The headline is
                                    # the sprint the item really lands in.
                                    - wiWalkCard:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
