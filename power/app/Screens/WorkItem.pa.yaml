                                                Height: =ItemWalkRowH
                                                Visible: =ItemWalkCount = 0
                                                Text: ="Nobody is assigned, so there is nothing to walk."
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiWalkList:
                                              Control: Gallery@2.15.0
                                              Variant: Vertical
                                              Properties:
                                                TemplatePadding: =0
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                ShowScrollbar: =false
                                                FillPortions: =0
                                                Height: =ItemWalkRowH * Max(1, ItemWalkCount)
                                                Visible: =ItemWalkCount > 0
                                                Items: =ItemWalkFinishByPerson
                                                TemplateSize: =ItemWalkRowH
                                                AccessibleLabel: |
                                                  ="Each assignee's share of this item, the capacity they have free by the end of its span, and the week they finish it."
                                              Children:
                                                - wiWalkRowName:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: =0
                                                      Y: =0
                                                      Width: |
                                                        =Parent.TemplateWidth * ItemWalkColName
                                                      Height: =ItemWalkRowH
                                                      Text: =ThisItem.Person
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =NeutralFg1
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                - wiWalkRowShare:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: |
                                                        =Parent.TemplateWidth * ItemWalkColName
                                                      Y: =0
                                                      Width: |
                                                        =Parent.TemplateWidth * ItemWalkColShare
                                                      Height: =ItemWalkRowH
                                                      Text: |
                                                        =Text(ThisItem.Share, "[$-en-US]#,##0.0") & " MW"
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      Align: =Align.Right
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =NeutralFg1
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                - wiWalkRowFree:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: |
                                                        =Parent.TemplateWidth * (ItemWalkColName
                                                         + ItemWalkColShare)
                                                      Y: =0
                                                      Width: |
                                                        =Parent.TemplateWidth * ItemWalkColFree
                                                      Height: =ItemWalkRowH
                                                      Text: |
                                                        =Text(ThisItem.Available, "[$-en-US]#,##0.0") & " MW"
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      Align: =Align.Right
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: |
                                                        =If(ThisItem.Available < ThisItem.Share,
                                                            StatusBad, NeutralFg1)
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                - wiWalkRowWeek:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: |
                                                        =Parent.TemplateWidth * (ItemWalkColName
                                                         + ItemWalkColShare + ItemWalkColFree)
                                                      Y: =0
                                                      Width: |
                                                        =Parent.TemplateWidth * ItemWalkColWeek
                                                      Height: =ItemWalkRowH
                                                      Text: =ThisItem.FinishText
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      Align: =Align.Right
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: |
                                                        =With({ t: LookUp(NumberTones, Metric = "slip"),
                                                                finishSprint: If(IsBlank(ThisItem.FinishWeek), Blank(),
                                                                    RoundDown(DateDiff(Epoch,
                                                                        DateAdd(TimelineMonday0,
                                                                                (ThisItem.FinishWeek - 1) * 7 + 4,
                                                                                TimeUnit.Days),
                                                                        TimeUnit.Days) / SprintDaysOr1, 0) + 1) },
                                                            With({ v: If(IsBlank(finishSprint), t.BadAt,
                                                                         Max(0, finishSprint - ItemWalkEndSprint)) },
                                                                If(t.HigherIsWorse,
                                                                   If(v >= t.BadAt, ToneBad,
                                                                      If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                                                                   If(v <= t.BadAt, ToneBad,
                                                                      If(v <= t.WarnAt, ToneWarn, ToneNeutral)))))
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                    - wiAssessGrid:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =(TypeLabelLine + ControlHeight) * 4 + 4 * 7
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - wiAssessLeft:
