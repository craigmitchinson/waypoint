                                                      Width: =Parent.Width * ItemWalkColFree
                                                      Height: =TypeLabelLine
                                                      Text: ="Free by S" & ItemWalkEndSprint
                                                      Size: =TypeCaption
                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Align: =Align.Right
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - wiWalkHeadWeek:
