                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Confidence"
                                                      Size: =TypeBodyPx
                                                - wiStartLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Start sprint"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiStartSprint:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
