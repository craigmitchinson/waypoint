                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiSkillInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =ItemSkillOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Coalesce(varItem.Skill.Value, "")}
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Skill"
                                                      Size: =TypeBodyPx
                                                - wiSizeLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Size"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiSizeInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =ItemSizeOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Coalesce(varItem.Size.Size, "")}
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Size"
                                                      Size: =TypeBodyPx
                                                - wiMwLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="MW override"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiMwInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: |
                                                        =If(IsBlank(varItem.'MW override'), "",
                                                            Text(varItem.'MW override', "[$-en-US]#,##0.0"))
                                                      Placeholder: ="Member weeks"
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="MW override"
                                                - wiGradeLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Business grade"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiGradeInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =ItemGradeOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Coalesce(varItem.'Business grade'.'Business grade', "")}
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Business grade"
                                                      Size: =TypeBodyPx
                                          - wiAssessRight:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiConfidenceLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Confidence"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiConfidenceInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =ItemConfidenceOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Coalesce(varItem.Confidence, "Medium")}
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
