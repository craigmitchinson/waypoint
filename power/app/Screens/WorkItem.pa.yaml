                                                          Patch('Activity log', Defaults('Activity log'),
                                                                { Label: varItem.Title & " · validated",
                                                                  Summary: Coalesce(ItemMeName, "Someone")
                                                                           & " validated the benefits on this item.",
                                                                  Action: 'Action (Activity log)'.'Stage action',
                                                                  Table: "wp_workitem",
                                                                  Record: Text(ItemRow.'Work item id'),
                                                                  'Record name': varItem.Title,
                                                                  Before: "Released",
                                                                  After: "Validated",
                                                                  At: Now() });
                                                          Concurrent(ClearCollect(colWork, 'Work items'),
                                                                     ClearCollect(colActivity, 'Activity log'),
                                                                     ClearCollect(colItemActivity,
                                                                                  Filter('Activity log',
                                                                                         'Record name' = varItem.Title)));
                                                          Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                          Set(varItemTab, "");
                                                          Reset(wiTabs);
                                                          Notify(varItem.Title & " is validated.",
                                                                 NotificationType.Success)))))
                                          # What the gate is still waiting for, in the gate's own
                                          # words. Two lines, because the Intake gate can name
                                          # three things at once.
                                          - wiNextGapLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: |
                                                  =If(ItemNextForward && !ItemNextReady,
                                                      TypeBodyLine * 2, 0)
                                                Visible: =ItemNextForward && !ItemNextReady
                                                # ItemNextGap reads the saved record, so on the two
                                                # stages whose gate is a form on this screen the
                                                # line would lag a turn behind what has been typed.
                                                # A named formula cannot read a control, so the
                                                # live text is written here, in the same order and
                                                # the same words as ItemIntakeMissing and
                                                # ItemCommitMissing; the buttons' own OnSelect
                                                # still enforces the gate after the save. Value
                                                # keeps ItemNextGap: its actuals are saved per row.
                                                Text: |
                                                  =Switch(ItemStage,
                                                      "Shaping",
                                                          With({ claimed:
                                                                   If(IsBlank(wiHypFteInput.Text), 0,
                                                                      Value(wiHypFteInput.Text))
                                                                   + If(IsBlank(wiHypTInput.Text), 0,
                                                                        Value(wiHypTInput.Text))
                                                                   + If(IsBlank(wiHypUInput.Text), 0,
                                                                        Value(wiHypUInput.Text))
                                                                   + If(IsBlank(wiHypVInput.Text), 0,
                                                                        Value(wiHypVInput.Text))
                                                                   + If(IsBlank(wiHypWInput.Text), 0,
                                                                        Value(wiHypWInput.Text))
                                                                   + If(IsBlank(wiHypXInput.Text), 0,
                                                                        Value(wiHypXInput.Text))
                                                                   + If(IsBlank(wiHypYInput.Text), 0,
                                                                        Value(wiHypYInput.Text)) },
                                                              With({ gaps:
                                                                       Filter(
                                                                           Table(
                                                                               { Seq: 1, Need: "a product owner",
                                                                                 Show: IsBlank(wiOwnerInput.Selected.Value) },
                                                                               { Seq: 2, Need: "a priority",
