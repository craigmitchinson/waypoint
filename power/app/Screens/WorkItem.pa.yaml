                                                      Height: =TypeLabelLine
                                                      Text: ="Cost avoidance (£M/yr)"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypTInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(ItemClaimT, "[$-en-US]#,##0.0")
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Cost avoidance in £M a year"
                                                - wiHypULabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Cycle-time cut %"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypUInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(ItemClaimU, "[$-en-US]#,##0.0")
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Cycle-time cut, per cent"
                                          - wiHypColB:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiHypVLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Error reduction %"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypVInput:
                                                    Control: ModernTextInput@1.1.1
