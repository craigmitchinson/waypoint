                                                ShowScrollbar: =false
                                                FillPortions: =1
                                                TemplateSize: =RowHeight
                                                Items: |
                                                  =Filter(colWork, 'Converted to'.Title = varItem.Title)
                                                AccessibleLabel: |
                                                  ="Spikes this feature came out of. Each row opens that spike."
                                              Children:
                                                - wiInformedRowTitle:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: =0
                                                      Y: =0
                                                      Width: =Parent.TemplateWidth - 8
                                                      Height: =RowHeight
                                                      Text: =ThisItem.Title
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =NeutralFg1
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                # The row's own hit area, last child so it sits over
                                                # the label: a container takes no OnSelect.
                                                - wiInformedRowHit:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      X: =2
                                                      Y: =2
                                                      Width: =Parent.TemplateWidth - 4
                                                      Height: =RowHeight - 4
                                                      Text: =""
                                                      Fill: =RGBA(0, 0, 0, 0)
                                                      HoverFill: =RGBA(0, 0, 0, 0)
                                                      PressedFill: =RGBA(0, 0, 0, 0)
                                                      BorderThickness: =0
                                                      FocusedBorderThickness: =2
                                                      TabIndex: =0
                                                      Tooltip: ="Open " & ThisItem.Title
                                                      FocusedBorderColor: =FocusStroke
                                                      OnSelect: |
                                                        =Set(varItem, ThisItem);
                                                         Navigate(scrWorkItem, ScreenTransition.None)

      # ---- the Link to feature panel. A scrim over the screen and a panel down its right edge,
      # both outside wiRoot so they sit over the whole page, and both open on varLinking only.
      # Nothing sets varLinking yet: the header action gallery that opened it has gone, and where
      # a concluded spike's Link to feature lives is the next stage-section decision.
      - wiLinkScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.4)
            Visible: =varLinking
          Children:
            # A container takes no OnSelect (Studio PA2108), so the scrim's own dismiss is a
            # transparent button over the whole of it, as scrTeam's tmScrim does.
            - wiLinkScrimHit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Max(Parent.Width - 4, 0) - 4
                  Height: =Parent.Height - 4
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  TabIndex: =0
                  Tooltip: ="Close the link panel"
                  FocusedBorderColor: =FocusStroke
                  OnSelect: =Set(varLinkSaveError, ""); Set(varLinking, false)

      - wiLinkPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =Parent.Width - Max(Parent.Width * 0.32, 420)
            Y: =0
            Width: =Max(Parent.Width * 0.32, 420)
            Height: =Parent.Height
            Fill: =NeutralBg1
            BorderColor: =NeutralStroke1
            BorderThickness: =1
            Visible: =varLinking
          Children:
            - wiLinkTitle:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Pad
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeDisplayLine
                  Text: ="Link to feature"
                  Size: =TypeSubtitle
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg1
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - wiLinkNote:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Pad + TypeDisplayLine
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeBodyLine * 2
                  Text: |
                    ="The feature this spike informed, where that feature already exists. Converting "
                     & "makes a new one instead."
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
                  FontWeight: =FontWeight.Normal
            - wiLinkLabel:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Pad + TypeDisplayLine + TypeBodyLine * 2 + Gap
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Feature"
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  FontWeight: =FontWeight.Semibold
            # check: ModernCombobox carries only AccessibleLabel, BasePaletteColor, Color, Fill and
            # Font on Craig's Studio sample; Items, ItemDisplayText, SelectMultiple, IsSearchable
            # and Selected are the reference's names and are unconfirmed until the next round trip
            # (power/canvas/CONTROLS.md, ModernCombobox@1.1.1).
            - wiLinkCombo:
                Control: ModernCombobox@1.1.1
                Properties:
                  X: =Pad
                  Y: =Pad + TypeDisplayLine + TypeBodyLine * 2 + Gap + TypeLabelLine
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  BasePaletteColor: =BrandBg
                  Color: =NeutralFg1
                  Fill: =NeutralBg1
                  Font: =FontUI
                  Items: |
                    =Filter(WorkStatusTable, Kind = 'Kind (Work items)'.Feature,
                            Title <> varItem.Title)
                  ItemDisplayText: =ThisItem.Title
                  SelectMultiple: =false
                  IsSearchable: =true
                  AccessibleLabel: ="Feature to link this spike to"
                  Size: =TypeBodyPx
                  Appearance: =Appearance.Outline
            # The one place a fault is said: whatever Dataverse answered if the link was refused.
            - wiLinkError:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Parent.Height - FormFootH
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine * 2
                  Visible: =!IsBlank(varLinkSaveError)
                  Text: =varLinkSaveError
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =StatusBad
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - wiLinkCancel:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Parent.Width - Pad - 160 - Gap - 100
                  Y: =Parent.Height - Pad - ControlHeight
                  Width: =100
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Secondary
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Cancel"
                  AccessibleLabel: ="Cancel linking"
                  OnSelect: =Set(varLinkSaveError, ""); Set(varLinking, false)
            # Both directions of the link are written: the model carries Converted to and Converted
            # from as two lookups, and the Close page reads them separately.
            - wiLinkSave:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Parent.Width - Pad - 160
                  Y: =Parent.Height - Pad - ControlHeight
                  Width: =160
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =BrandBg
                  Color: =BrandFg
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Link"
                  AccessibleLabel: ="Link this spike to the chosen feature"
                  DisplayMode: |
                    =If(IsBlank(wiLinkCombo.Selected.Title), DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =IfError(
                     Patch('Work items', ItemRow,
                           { 'Converted to': LookUp('Work items',
                                                    Title = wiLinkCombo.Selected.Title) }),
                     // A refused link says what Dataverse answered and leaves the panel open.
                     Set(varLinkSaveError, FirstError.Message),
                     Patch('Work items',
                           LookUp('Work items', Title = wiLinkCombo.Selected.Title),
                           { 'Converted from': ItemRow });
                     ClearCollect(colWork, 'Work items');
                     Set(varItem, LookUp('Work items', Title = varItem.Title));
                     Set(varLinkSaveError, "");
                     Set(varLinking, false);
                     Notify(varItem.Title & " is linked to " & wiLinkCombo.Selected.Title & ".",
                            NotificationType.Success))
