# Waypoint canvas app: the Work item screen, the proving slice of it.
#
# Valid against pa.schema.yaml (v3.0): a Screens map, each screen with a Properties formula map and a
# Children sequence whose items are single-key maps of control name to control instance.
#
# src/pages/WorkItem.tsx: the shell, the header line, the stepper, the stage actions and all five
# sections of the item's page.
#
# The screen is one auto-layout tree: wiRoot is a vertical GroupContainer the size of the screen,
# holding the 48px header and a horizontal row of the rail and the body. The body is the head row,
# the stage row, the conclusion and cancellation inputs, the tabs and then a horizontal row of the
# five tab panels and a 320px right rail. X and Y appear only inside gallery templates, which are
# not auto-layout.
#
# The item is `varItem`, set before the screen is opened, and `ItemRow` is the live Dataverse record
# behind it: every Patch is aimed at ItemRow and varItem is read again from 'Work items' afterwards.
# The stage row is the stepper alone: every forward action lives in its own stage section on the
# tab that owns it (power/design-work-flow.md, section 10), and each one writes State alongside
# Phase, so the two never disagree. Only one tab panel is visible at a time, on ItemTab.
#
# Every control identifier and property name here was read off Craig's configured sample of every
# modern control, downloaded from Studio (power/canvas/source/Src/Screen1.pa.yaml):
# ModernText@1.0.0, ModernButton@1.0.0, ModernTextInput@1.1.1, ModernDropdown@1.0.2 and
# ModernTabList@1.0.1. Gallery@2.15.0 and GroupContainer@1.5.0 with the Variants Studio wrote stay
# as they are, and so does the header bar: Header@0.0.44 carries no title-text property in the
# sample, so it cannot say what our header says. The two multi-line fields stay
# Classic/TextInput@2.3.2, because `Mode: =TextMode.MultiLine` has no confirmed name on the modern
# input.

Screens:
  scrWorkItem:
    Properties:
      Fill: =NeutralCanvas
      OnVisible: |
        =// Nothing is computed here. The item is read again in case it was written elsewhere, and
        // the form drafts start from it. The screen's own state starts closed: the Shape tab and
        // no refusal.
        Set(varItem, LookUp(colWork, Title = varItem.Title));
        // The log rows for this item alone, on a delegable equality on 'Record name'. Every
        // Item* formula that reads the log wants this item, and the whole log is past the row
        // cap; the unfiltered colActivity stays as it is for the screens that read all of it.
        ClearCollect(colItemActivity, Filter('Activity log', 'Record name' = varItem.Title));
        Set(varProblem, "");
        Set(varItemTab, Blank());
        Set(varItemAssessor, "");
        Set(varAssessMsg, "");
        Set(varLinking, false);
        Set(varLinkSaveError, "");
        // The action a Command decision row handed off. No transition is written here: the stage
        // sections are the only forward actions, so the handoff opens the tab whose section owns
        // the action and leaves the write to it.
        If(!IsBlank(varItemAction),
            Switch(varItemAction,
                "Conclude",
                    Set(varItemTab, "Components"),
                "Assign",
                    Set(varItemTab, "Assess"));
            ClearCollect(colWork, 'Work items');
            Set(varItem, LookUp('Work items', Title = varItem.Title));
            Set(varItemAction, ""))

    Children:

      # ---- the root: one vertical auto-layout container the size of the screen ----
      - wiRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Hide
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:

            # ---- shell: the app header ----
            - wiHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - wiHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  # ---- shell: the scope selector, one cmpScope instance for every screen ----
                  - wiHeaderScope:
                      Control: CanvasComponent
                      ComponentName: cmpScope
                      Properties:
                        Width: =Max(Parent.Width * 0.14, 180)
                        Height: =ControlHeight
                        Visible: =IncludeScope
                  # ---- shell: the header search, one cmpSearch instance for every screen ----
                  - wiHeaderSearch:
                      Control: CanvasComponent
                      ComponentName: cmpSearch
                      Properties:
                        Width: =Max(Parent.Width * 0.24, 280)
                        Height: =ControlHeight
                  - wiHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - wiMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:

                  # ---- shell: the rail, one cmpRail instance for every screen ----
                  - wiRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="Work"

                  # ---- shell: the body ----
                  - wiBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =Gap
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:

                        # ---- the item's head: back, kind, title, state ----
                        - wiHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - wiBack:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    # A modern button works its own hover, pressed and disabled states out of one palette
                                    # colour, so the classic Hover/Pressed/Disabled triples are gone. The palette colour is
                                    # the surface the button sits on, which is how the classic set read: flat on it.
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =NeutralBg3
                                    Color: =NeutralFg1
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =140
                                    Height: =ControlHeight
                                    Text: ="Back"
                                    OnSelect: =Back()
                              - wiKind:
                                  Control: CanvasComponent
                                  ComponentName: cmpPill
                                  Properties:
                                    LayoutMinWidth: =96
                                    Width: =96
                                    Height: =TypeLabelLine
                                    Label: =Text(varItem.Kind)
                                    Tone: ="neutral"
                              # The title takes the room the four fixed cells leave, which is
                              # what FillPortions on a container does; a ModernText has no such
                              # property of its own, so the cell around it carries it.
                              - wiTitleCell:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    # The title sits on the same centre line as the Back button,
                                    # the kind chip and the status badge beside it.
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutGap: =0
                                  Children:
                                    - wiTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeDisplayLine
                                          Text: =varItem.Title
                                          Size: =TypeTitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    # Who owns this record. Only in Jira mode, where the six fields
                                    # below are a sync's and not this app's.
                                    - wiSyncedLine:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Visible: =IsJiraMode
                                          Text: |
                                            ="Synced from Jira · updated "
                                             & Text(varItem.'Modified On', DateTimeFormat.ShortDateTime)
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - wiState:
                                  Control: CanvasComponent
                                  ComponentName: cmpPill
                                  Properties:
                                    LayoutMinWidth: =140
                                    Width: =140
                                    Height: =TypeLabelLine
                                    Label: =varItem.State.State
                                    Tone: ="accent"

                        # ---- the stage row: the stepper ----
                        - wiStage:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =RowHeight + TypeLabelLine + 8 + Pad * 2
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:
                              - wiStepper:
                                  Control: CanvasComponent
                                  ComponentName: cmpStepper
                                  Properties:
                                    # The stepper has the stage row to itself now that no action
                                    # gallery sits beside it: the row's padding, and the finish
                                    # walk's badge when that is showing.
                                    Width: |
                                      =wiHead.Width - Pad * 2
                                       - If(ItemWalkOver, ItemWalkBadgeW + Gap, 0)
                                    Height: =RowHeight + TypeLabelLine + 8
                                    Kind: =Text(varItem.Kind)
                                    Stage: =If(ItemStopped, ItemStoppedFrom, Text(ItemPhaseEffective))
                                    Stopped: =ItemStopped
                                    Label: |
                                      =If(Text(varItem.Kind) = "Component",
                                          varItem.'Part of'.Title, "Lifecycle stage")
                              # The finish walk's verdict beside the Commit button: the item
                              # lands later than the sprint it is planned to end in.
                              - wiCommitWarn:
                                  Control: CanvasComponent
                                  ComponentName: cmpPill
                                  Properties:
                                    Visible: =ItemWalkOver
                                    Label: ="Over capacity"
                                    Width: =Min(Max(Len("Over capacity") * 7 + 20, 56), 200)
                                    Height: =TypeLabelLine
                                    Tone: ="warn"

                        # ---- the stopped reason, under the stepper, and Reopen, the one backward
                        # move out of a terminal stage. Both sit in the header and not on a tab,
                        # because a stopped item's tabs are every one of them read-only
                        # (power/design-work-flow.md, sections 3, 9 and 10).
                        - wiStoppedReason:
                            Control: Label@2.5.1
                            Properties:
                              Height: =TypeBodyLine
                              Visible: =ItemStopped
                              Text: |
                                ="Stopped: "
                                 & Coalesce(varItem.'Stopped reason', "no reason recorded")
                              Size: =TypeBody
                              Font: =FontUI
                              Color: =NeutralFg2
                              Wrap: =true
                              Overflow: =Overflow.Hidden
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              AutoHeight: =true
                        # ---- the tab row: the five sections of the item's page ----
                        - wiTabs:
                            Control: ModernTabList@1.0.1
                            Properties:
                              Height: =ControlHeight + 8
                              # The first tab is labelled Intake and the third Delivery, the
                              # stage names the flow design uses (power/design-work-flow.md,
                              # section 10). Their internal keys stay "Shape" and "Components",
                              # so OnChange maps each label back before anything reads it.
                              # Only a feature is asked to validate benefits, so the Value tab
                              # is there on ItemValueVisible and nowhere else: a spike concludes
                              # at Release without one (section 4). The last branch is Shaping,
                              # Validated and Stopped together; a validated feature still shows
                              # the whole track, because its actuals stand and a correction is a
                              # new one. A stopped item shows the same whole track, read-only,
                              # and opens on Activity, which is where the reason it stopped is
                              # (power/design-work-flow.md, sections 9 and 10); its Value tab is
                              # offered on the kind alone, because ItemValueVisible reads the
                              # phase and a stopped item has left Release.
                              Items: |
                                =Switch(ItemStage,
                                    "Assessment", Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Activity"}),
                                    "Delivery",   Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                         {Value:"Activity"}),
                                    "Realised",   If(ItemValueVisible,
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Value"}, {Value:"Activity"}),
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Activity"})),
                                    "Validated",  If(ItemValueVisible,
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Value"}, {Value:"Activity"}),
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Activity"})),
                                    "Stopped",    If(varItem.Kind = 'Kind (Work items)'.Feature,
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Value"}, {Value:"Activity"}),
                                                     Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                                           {Value:"Activity"})),
                                    If(ItemValueVisible,
                                       Table({Value:"Intake"}, {Value:"Assess"}, {Value:"Delivery"},
                                             {Value:"Value"}, {Value:"Activity"}),
                                       Table({Value:"Intake"}, {Value:"Activity"})))
                              Default: |
                                =Switch(ItemStage,
                                    "Shaping",    {Value:"Intake"},
                                    "Assessment", {Value:"Assess"},
                                    "Delivery",   {Value:"Delivery"},
                                    // A spike has no Value tab, so the default falls back to
                                    // Activity rather than naming a tab that is not in Items.
                                    "Realised",   If(ItemValueVisible, {Value:"Value"}, {Value:"Activity"}),
                                    "Validated",  If(ItemValueVisible, {Value:"Value"}, {Value:"Activity"}),
                                    "Stopped",    {Value:"Activity"},
                                    {Value:"Intake"})
                              Font: =FontUI
                              Size: =TypeBodyPx
                              FontWeight: =FontWeight.Semibold
                              BasePaletteColor: =BrandBg
                              Color: =NeutralFg1
                              AccessibleLabel: ="Work item sections"
                              OnChange: |
                                =Set(varItemTab, Switch(wiTabs.Selected.Value,
                                                        "Intake",   "Shape",
                                                        "Delivery", "Components",
                                                        wiTabs.Selected.Value))

                        # ---- the refusal line: what the screen would not do, and why ----
                        - wiProblem:
                            Control: Label@2.5.1
                            Properties:
                              Height: =TypeBodyLine
                              Visible: =!IsBlank(varProblem)
                              Text: =varProblem
                              Size: =TypeBody
                              Font: =FontUI
                              Color: =StatusBad
                              Wrap: =false
                              Overflow: =Overflow.Hidden
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0

                        # ---- the form, and the 320px rail beside it ----
                        - wiContent:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =1
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =Gap
                            Children:

                              # ---- Shape: the fields the Product Owner owns ----
                              - wiShape:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    FillPortions: =1
                                    Visible: =ItemTab = "Shape"
                                    LayoutMinWidth: =480
                                    Fill: =NeutralBg1
                                    BorderColor: =NeutralStroke1
                                    BorderThickness: =1
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    # The tight gutter: this card holds seven sections, so they
                                    # sit a half gutter apart rather than a full one and the
                                    # card scrolls what is left over.
                                    LayoutGap: =8
                                    PaddingLeft: =Pad
                                    PaddingRight: =Pad
                                    PaddingTop: =Pad
                                    PaddingBottom: =Pad
                                  Children:
                                    - wiShapeTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeHeadingLine
                                          Text: ="Intake"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true

                                    # The two-column grid: two vertical containers, one field per
                                    # label-and-control pair, both at one portion of the width.
                                    - wiGrid:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =(TypeLabelLine + ControlHeight) * 3 + 4 * 5
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - wiGridLeft:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiTitleLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Title"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiTitleInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Height: =ControlHeight
                                                      Default: =varItem.Title
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Title"
                                                - wiEpicLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Outcome or epic"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiEpicInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      Height: =ControlHeight
                                                      Items: =EpicOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:varItem.Epic.Epic}
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Outcome or epic"
                                                      Size: =TypeBodyPx
                                                - wiOwnerLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Product owner"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiOwnerInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      Height: =ControlHeight
                                                      Items: =OwnerOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:varItem.'Product owner'.'Full name'}
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Product owner"
                                                      Size: =TypeBodyPx
                                          - wiGridRight:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiKindLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Kind"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiKindValue:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Text: =Text(varItem.Kind) & " · set when the item is created"
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =NeutralFg1
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                      FontWeight: =FontWeight.Semibold
                                                - wiJiraLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Jira Align ID"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiJiraInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Height: =ControlHeight
                                                      Default: =varItem.'Jira Align ID'
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Jira Align ID"
                                                - wiStateLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="State"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                # State is written by the stage actions and by
                                                # nothing else, so it is shown here and never
                                                # edited: one system of truth for the item's
                                                # journey (power/design-work-flow.md, section 3).
                                                - wiStateValue:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Text: |
                                                        =Coalesce(varItem.State.State, "None")
                                                         & " · set by the stage actions"
                                                      Size: =TypeBody
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =NeutralFg1
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      AutoHeight: =true
                                                      FontWeight: =FontWeight.Semibold
                                          # The third column: what the product owner owes at
                                          # Intake beyond the title and the owner
                                          # (power/design-work-flow.md, section 5). Priority is
                                          # asked for here, where it is decided; the squad is not,
                                          # because it is chosen at Assessment.
                                          - wiGridThird:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiShapePriorityLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Priority"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiShapePriorityInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      Height: =ControlHeight
                                                      Items: =ItemPriorityOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:Coalesce(varItem.Priority, "")}
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Priority"
                                                      Size: =TypeBodyPx
                                                - wiSourceLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Source"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                # How the item arrived, editable after creation.
                                                # The edit needs no note and is not an action of
                                                # its own, but it always writes an Activity row
                                                # (power/decisions.md, decision 16), so it is
                                                # written here rather than by the Save button.
                                                - wiSourceInput:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      Height: =ControlHeight
                                                      Items: =ItemSourceOptions
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:ItemSourceName}
                                                      DisplayMode: |
                                                        =If(!ItemShapeEditable || IsJiraMode,
                                                            DisplayMode.View, DisplayMode.Edit)
                                                      AccessibleLabel: ="Source"
                                                      Size: =TypeBodyPx
                                                      OnChange: |
                                                        =If(wiSourceInput.Selected.Value = ItemSourceName,
                                                            Set(varProblem, ""),
                                                            IfError(
                                                             Patch('Work items', ItemRow,
                                                                   { Source:
                                                                       Switch(wiSourceInput.Selected.Value,
                                                                           "Front door",
                                                                               'Source (Work items)'.'Front door',
                                                                           "Jira", 'Source (Work items)'.Jira,
                                                                           'Source (Work items)'.Direct) }),
                                                             Set(varProblem, FirstError.Message),
                                                             Patch('Activity log', Defaults('Activity log'),
                                                                   { Label: varItem.Title & " · source changed",
                                                                     Summary: Coalesce(ItemMeName, "Someone")
                                                                              & " changed the source from "
                                                                              & ItemSourceName & " to "
                                                                              & wiSourceInput.Selected.Value & ".",
                                                                     Action: 'Action (Activity log)'.Update,
                                                                     Table: "wp_workitem",
                                                                     Record: Text(ItemRow.'Work item id'),
                                                                     'Record name': varItem.Title,
                                                                     Before: ItemSourceName,
                                                                     After: wiSourceInput.Selected.Value,
                                                                     At: Now() });
                                                             Concurrent(ClearCollect(colWork, 'Work items'),
                                                                        ClearCollect(colActivity, 'Activity log'),
                                                                        ClearCollect(colItemActivity,
                                                                                     Filter('Activity log',
                                                                                            'Record name' = varItem.Title)));
                                                             Set(varItem,
                                                                 LookUp('Work items', Title = varItem.Title))))

                                    # The fields that run the width of the card, and the one primary
                                    # action on the screen.
                                    # The two memo fields share one row rather than
                                    # stacking: the card is one screen tall and the
                                    # cancellation cell only appears on a Removed state,
                                    # which is when Notes would be pushed off the card
                                    # (power/RUNBOOK.md, section 4, "Space allocation").
                                    - wiFieldsRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          # The row is as tall as the Components column beside it:
                                          # the label, the add row, the list line and their gaps.
                                          Height: =TypeLabelLine + 4 + ControlHeight + 4 + TypeBodyLine + 6 + TypeBodyLine
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - wiReasonCell:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                Visible: |
                                                  =varItem.State.'Capacity impact'
                                                   = 'Capacity impact (Work states)'.Removed
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiReasonLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Cancellation reason"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiReasonInput:
                                                    Control: Classic/TextInput@2.3.2
                                                    Properties:
                                                      Mode: =TextMode.MultiLine
                                                      Font: =FontUI
                                                      Size: =TypeBody
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      BorderColor: =NeutralStroke1
                                                      HoverFill: =NeutralBg1
                                                      HoverBorderColor: =FocusStroke
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Width: =Parent.Width
                                                      Height: =ControlHeight + 4 + TypeBodyLine + 6 + TypeBodyLine
                                                      Default: =varItem.'Cancellation reason'
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      Tooltip: ="Cancellation reason"
                                          - wiNotesCell:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiNotesLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      # The problem the item states: notes on a
                                                      # feature, the question on a spike
                                                      # (power/design-work-flow.md, section 5).
                                                      Text: |
                                                        =If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                            "Question", "Notes")
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiNotesInput:
                                                    Control: Classic/TextInput@2.3.2
                                                    Properties:
                                                      Mode: =TextMode.MultiLine
                                                      Font: =FontUI
                                                      Size: =TypeBody
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      BorderColor: =NeutralStroke1
                                                      HoverFill: =NeutralBg1
                                                      HoverBorderColor: =FocusStroke
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Width: =Parent.Width
                                                      Height: =ControlHeight + 4 + TypeBodyLine + 6 + TypeBodyLine
                                                      Default: |
                                                        =If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                            varItem.'Spike question', varItem.Notes)
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      Tooltip: |
                                                        =If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                            "Question", "Notes")
                                          # The components a feature is broken into, added from
                                          # Intake onwards (power/design-work-flow.md, section 5).
                                          # A spike has none, so the cell hides itself. The line
                                          # under the input is the list; the Components tab holds
                                          # the full table, and this cell has one row of the card.
                                          - wiShapeCompCell:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                Visible: =varItem.Kind = 'Kind (Work items)'.Feature
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiShapeCompLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="Components"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiShapeCompRow:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      LayoutOverflowX: =LayoutOverflow.Hide
                                                      LayoutOverflowY: =LayoutOverflow.Hide
                                                      FillPortions: =0
                                                      Height: =ControlHeight
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutGap: =8
                                                    Children:
                                                      - wiShapeCompTitle:
                                                          Control: ModernTextInput@1.1.1
                                                          Properties:
                                                            Width: =Max(Parent.Width - 104, 0)
                                                            Height: =ControlHeight
                                                            Default: =""
                                                            Placeholder: ="The component's title"
                                                            Appearance: =Appearance.Outline
                                                            BasePaletteColor: =BrandBg
                                                            Font: =FontUI
                                                            Size: =TypeBodyPx
                                                            Color: =NeutralFg1
                                                            Fill: =NeutralBg1
                                                            DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                            AccessibleLabel: ="The new component's title"
                                                      - wiShapeCompAdd:
                                                          Control: ModernButton@1.0.0
                                                          Properties:
                                                            Width: =96
                                                            Height: =ControlHeight
                                                            Appearance: =ButtonAppearance.Secondary
                                                            BasePaletteColor: =NeutralBg1
                                                            Color: =NeutralFg1
                                                            Font: =FontUI
                                                            Size: =TypeBodyPx
                                                            RadiusTopLeft: =CtrlR
                                                            RadiusTopRight: =CtrlR
                                                            RadiusBottomLeft: =CtrlR
                                                            RadiusBottomRight: =CtrlR
                                                            Text: ="Add"
                                                            DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                            AccessibleLabel: ="Add a component to this item"
                                                            # The Components tab's addComponent,
                                                            # unchanged: the parent is set, and the
                                                            # squad, commitment and state come off
                                                            # the feature.
                                                            OnSelect: |
                                                              =If(IsBlank(wiShapeCompTitle.Text),
                                                                  Set(varProblem, "A component needs a title."),
                                                                  Patch('Work items', Defaults('Work items'),
                                                                        { Title: wiShapeCompTitle.Text,
                                                                          Kind: 'Kind (Work items)'.Component,
                                                                          'Part of': ItemRow,
                                                                          Squad: varItem.Squad,
                                                                          Commitment: varItem.Commitment,
                                                                          State: varItem.State });
                                                                  ClearCollect(colWork, 'Work items');
                                                                  Reset(wiShapeCompTitle);
                                                                  Set(varProblem, ""))
                                                - wiShapeCompList:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeBodyLine + 6
                                                      Text: |
                                                        =If(ItemChildCount = 0, "No components yet",
                                                            Concat(ItemChildren, Title, " · "))
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                    # ---- Hypothesised value: the claim the item is shaped
                                    # around, moved off the Value tab so it is written where it is
                                    # decided (power/design-work-item-stages.md, "Shaping"). Three
                                    # columns rather than the Value tab's two, so the section fits
                                    # the card without scrolling it.
                                    - wiHypTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Text: ="Hypothesised value"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiHypGrid:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =(TypeLabelLine + ControlHeight) * 3 + 4 * 5
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - wiHypColA:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - wiHypFteLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeLabelLine
                                                      Text: ="FTE released"
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      FontWeight: =FontWeight.Semibold
                                                - wiHypFteInput:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =If(IsBlank(varItem.'FTE released'), "", Text(varItem.'FTE released', "[$-en-US]#,##0.0"))
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemShapeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="FTE released"
                                                - wiHypTLabel:
