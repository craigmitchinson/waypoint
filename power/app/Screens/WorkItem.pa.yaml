                                              Properties:
                                                FillPortions: =0
                                                Width: =Parent.Width
                                                Height: =RowHeight
                                              Children:
                                                - wiWalkHeadName:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: =0
                                                      Y: =(RowHeight - TypeLabelLine) / 2
