                                                                 NotificationType.Success))
                                                - wiValidateBtn:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Visible: |
                                                        =ItemPhaseEffective
                                                           = 'Phase (Work items)'.Release
                                                      Width: |
                                                        =If(ItemPhaseEffective
                                                              = 'Phase (Work items)'.Release,
                                                            180, 0)
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Primary
                                                      BasePaletteColor: =BrandBg
                                                      Color: =BrandFg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Validate"
                                                      AccessibleLabel: ="Validate the benefits claimed for this item"
                                                      # The actuals are recorded row by row, so the
                                                      # button is live wherever the stage allows the
                                                      # action and the gate is enforced in OnSelect,
                                                      # against the rows read back there.
                                                      DisplayMode: |
                                                        =If(ItemValueRecordable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      OnSelect: |
                                                        =Set(varActualMsg, "");
                                                         // The actuals are read again before the gate
                                                         // is judged, so a value recorded a moment ago
                                                         // counts.
                                                         Concurrent(ClearCollect(colActuals, 'Benefit actuals'),
                                                                    ClearCollect(colClaims, 'Benefit claims'));
                                                         Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                         With({ rows:
                                                                  ForAll(Filter(colClaims,
                                                                                'Work item'.Title = varItem.Title) As C,
                                                                         { Type: Text(C.'Benefit type'),
                                                                           Actuals:
                                                                               CountRows(
                                                                                   Filter(colActuals,
                                                                                          Claim.'Benefit claim id'
                                                                                            = C.'Benefit claim id')) }) },
                                                          With({ miss:
                                                                   If(CountRows(rows) = 0, "Needs a benefit claim.",
                                                                      CountRows(Filter(rows, Actuals = 0)) = 0, "",
                                                                      "Needs an actual for "
                                                                      & Concat(Filter(rows, Actuals = 0), Type, ", ")
                                                                      & ".") },
                                                           If(!IsBlank(miss),
                                                              Set(varActualMsg, miss),
                                                              IfError(
                                                          Patch('Work items', ItemRow,
                                                                { Phase: 'Phase (Work items)'.Validated,
                                                                  State: LookUp('Work states', State = "Done"),
