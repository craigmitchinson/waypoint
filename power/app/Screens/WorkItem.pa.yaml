                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - wiWalkHeadShare:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      X: =Parent.Width * ItemWalkColName
                                                      Y: =(RowHeight - TypeLabelLine) / 2
                                                      Width: =Parent.Width * ItemWalkColShare
                                                      Height: =TypeLabelLine
                                                      Text: ="Share"
                                                      Size: =TypeCaption
                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Align: =Align.Right
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - wiWalkHeadFree:
