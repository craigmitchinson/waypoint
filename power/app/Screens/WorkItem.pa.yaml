                                                            Text: ="Add"
                                                            DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                            AccessibleLabel: ="Add a component to this item"
                                                            # The Intake tab's add, unchanged: the
                                                            # component inherits the feature's
                                                            # squad, commitment and state.
                                                            OnSelect: |
                                                              =If(IsBlank(wiAssessCompTitle.Text),
                                                                  Set(varAssessMsg, "A component needs a title."),
                                                                  Patch('Work items', Defaults('Work items'),
                                                                        { Title: wiAssessCompTitle.Text,
                                                                          Kind: 'Kind (Work items)'.Component,
                                                                          'Part of': ItemRow,
                                                                          Squad: varItem.Squad,
                                                                          Commitment: varItem.Commitment,
                                                                          State: varItem.State });
                                                                  ClearCollect(colWork, 'Work items');
                                                                  Reset(wiAssessCompTitle);
                                                                  Set(varAssessMsg, ""))
                                                - wiAssessCompList:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =TypeBodyLine + 6
                                                      Text: |
                                                        =If(ItemChildCount = 0, "No components yet",
                                                            Concat(ItemChildren, Title, " · "))
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                    - wiAssessMsg:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =!IsBlank(varAssessMsg)
                                          Text: =varAssessMsg
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =StatusBad
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiAssessActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =8
                                        Children:
                                          - wiAssessSave:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                # Secondary: Commit is the forward action on this tab,
                                                # and a tab carries one primary button.
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Width: =140
                                                Height: =ControlHeight
                                                Text: ="Save draft"
                                                DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="Save the assessment as a draft"
                                                # validate.ts validateEngineering(): an item leaving
                                                # Shaping carries a size or an MW override, and the
                                                # refusal is the line above this row. Saving is what
                                                # stamps Assessed on, which is half the commit gate
                                                # (power/design-work-flow.md, section 6), so the
                                                # stamp goes in the same Patch as the fields.
                                                OnSelect: |
                                                  =Set(varAssessMsg,
                                                       If(IsBlank(LookUp(colSizes, Size = wiSizeInput.Selected.Value))
                                                          && IsBlank(wiMwInput.Text),
                                                          "Give a size or an MW override.", ""));
                                                   If(varAssessMsg = "",
                                                      IfError(
                                                       Patch('Work items', ItemRow,
                                                             { Skill: LookUp('List values',
                                                                             List = 'List (List values)'.Skill
                                                                             && Value = wiSkillInput.Selected.Value),
                                                               Size: LookUp('Size bands', Size = wiSizeInput.Selected.Value),
                                                               'MW override': If(IsBlank(wiMwInput.Text), Blank(),
                                                                                 Value(wiMwInput.Text)),
                                                               'Business grade':
                                                                   LookUp('Business grades',
                                                                          'Business grade' = wiGradeInput.Selected.Value),
                                                               Confidence: wiConfidenceInput.Selected.Value,
                                                               Squad: LookUp(Squads,
                                                                             'Squad name' = wiAssessSquadInput.Selected.Value),
                                                               'Assessed by': ItemAssessorPerson,
                                                               'Jira key': wiJiraKeyInput.Text,
                                                               'Assessed on': Now() }),
                                                       Set(varAssessMsg, FirstError.Message),
                                                       Patch('Activity log', Defaults('Activity log'),
                                                             { Label: varItem.Title & " · assessed",
                                                               Summary: Coalesce(ItemMeName, "Someone")
                                                                        & " saved the assessment"
                                                                        & If(IsBlank(Trim(wiAssessNote.Text)), ".",
                                                                             ": " & Trim(wiAssessNote.Text)),
                                                               Action: 'Action (Activity log)'.Update,
                                                               Table: "wp_workitem",
                                                               Record: Text(ItemRow.'Work item id'),
                                                               'Record name': varItem.Title,
                                                               At: Now() });
                                                       Concurrent(ClearCollect(colWork, 'Work items'),
                                                                  ClearCollect(colActivity, 'Activity log'),
                                                                  ClearCollect(colItemActivity,
                                                                               Filter('Activity log',
                                                                                      'Record name' = varItem.Title)));
                                                       Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                       Reset(wiAssessNote);
                                                       Notify("The draft is saved.", NotificationType.Success)))
                                    - wiCommittedLine:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =If(!ItemAssessEditable && !IsBlank(ItemCommittedRow.At), TypeBodyLine, 0)
                                          Visible: =!ItemAssessEditable && !IsBlank(ItemCommittedRow.At)
                                          Text: =ItemCommittedLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- Commit: the one forward action out of Assessment
                                    # (power/design-work-flow.md, section 6). The gate is the named
                                    # formula Command's commit calls read too, so there is one
                                    # refusal and one write. The sprint span comes off the two
                                    # sprint dropdowns above, which stand in for the commit form
                                    # until the capacity readout is built.
                                    - wiCommitSection:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: |
                                            =If(ItemAssessEditable,
                                                TypeBodyLine + TypeBodyLine + 48 + 4 + 4
                                                + If(ItemCommitOver, TypeBodyLine + 4, 0), 0)
                                          Visible: =ItemAssessEditable
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                        Children:
                                          - wiCommitTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: ="Commit"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # The capacity readout (power/design-work-flow.md,
                                          # section 6): the chosen squad's Net, Committed, this
                                          # item's own estimate and what is left, so the person
                                          # committing can see whether it fits before they do.
                                          - wiCommitCapacity:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: =ItemCommitFigures
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # Over-commitment informs, it never blocks: Commit stays
                                          # enabled (section 6). Tone and words both carry it, so
                                          # colour is never the only signal.
                                          - wiCommitOverNote:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Visible: =ItemCommitOver
                                                Text: =ItemCommitOverLine
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                Color: =StatusBad
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCommitRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =0
                                                Height: =48
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutJustifyContent: =LayoutJustifyContent.Start
                                                LayoutGap: =8
                                              Children:
                                                - wiCommitNote:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Width: =Parent.Width
                                                      Height: =48
                                                      Type: =TextInputType.Multiline
                                                      Default: =""
                                                      Placeholder: ="Note (optional)"
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Note to record with the commitment"
                                    # ---- The other two ways out of Assessment: back to shaping
                                    # with a note, or stopped with a reason. Neither is ever the
                                    # primary button (power/design-work-flow.md, section 6).
                                    - wiExitSection:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =If(ItemAssessEditable, TypeBodyLine + 48 + 4, 0)
                                          Visible: =ItemAssessEditable
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                        Children:
                                          - wiExitTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: ="Other exits"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiExitRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =0
                                                Height: =48
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutJustifyContent: =LayoutJustifyContent.Start
                                                LayoutGap: =8
                                              Children:
                                                - wiExitNote:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Width: =Max(Parent.Width - 580, 200)
                                                      Height: =48
                                                      Type: =TextInputType.Multiline
                                                      Default: =""
                                                      Placeholder: ="Why (required)"
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      AccessibleLabel: ="Why this item is going back or stopping"
                                                - wiReturnShaping:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Width: =180
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Secondary
                                                      BasePaletteColor: =NeutralBg1
                                                      Color: =NeutralFg1
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Return to shaping"
                                                      AccessibleLabel: ="Send this item back to shaping"
                                                      DisplayMode: =If(ItemAssessEditable, DisplayMode.Edit, DisplayMode.View)
                                                      # The note is what the product owner is being
                                                      # asked to act on, so it is required and the
                                                      # refusal is the line above this row.
                                                      OnSelect: |
                                                        =Set(varAssessMsg, "");
                                                         If(IsBlank(Trim(wiExitNote.Text)),
                                                             Set(varAssessMsg, "Say what shaping has to answer."),
                                                             IfError(
                                                              Patch('Work items', ItemRow,
                                                                    { Phase: 'Phase (Work items)'.Shaping,
                                                                      State: LookUp('Work states',
                                                                                    State = "Identified"),
                                                                      // The assessment is left
                                                                      // behind with the stage, so
                                                                      // a re-sent item meets the
                                                                      // Commit gate needing a
                                                                      // fresh one.
                                                                      'Assessed on': Blank() }),
                                                              Set(varAssessMsg, FirstError.Message),
                                                              Patch('Activity log', Defaults('Activity log'),
                                                                    { Label: varItem.Title & " · returned to shaping",
                                                                      Summary: Coalesce(ItemMeName, "Someone")
                                                                               & " sent this back to shaping: "
                                                                               & Trim(wiExitNote.Text),
                                                                      Action: 'Action (Activity log)'.'Stage action',
                                                                      Table: "wp_workitem",
                                                                      Record: Text(ItemRow.'Work item id'),
                                                                      'Record name': varItem.Title,
                                                                      Before: "Assessment",
                                                                      After: "Shaping",
                                                                      At: Now() });
                                                              Concurrent(ClearCollect(colWork, 'Work items'),
                                                                         ClearCollect(colActivity, 'Activity log'),
                                                                         ClearCollect(colItemActivity,
                                                                                      Filter('Activity log',
                                                                                             'Record name' = varItem.Title)));
                                                              Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                              Set(varItemTab, "");
                                                              Reset(wiTabs);
                                                              Reset(wiExitNote);
                                                              Notify(varItem.Title & " is back with shaping.",
                                                                     NotificationType.Success)))
                                                - wiStopItem:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Width: =140
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Secondary
                                                      BasePaletteColor: =NeutralBg1
                                                      Color: =NeutralFg1
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Stop"
                                                      AccessibleLabel: ="Stop this item"
                                                      # The Stop gate, as Commit has it: live only
                                                      # once a reason is typed, with the line
                                                      # beside the button saying so.
                                                      DisplayMode: |
                                                        =If(!ItemCanStop, DisplayMode.View,
                                                            IsBlank(Trim(wiExitNote.Text)),
                                                            DisplayMode.Disabled,
                                                            DisplayMode.Edit)
                                                      # Stopping is terminal until the item is
                                                      # reopened, so the reason is written on the
                                                      # item as well as on the Activity row, and
                                                      # the note this tab holds is the one the
                                                      # gate and the write both read.
                                                      OnSelect: |
                                                        =Set(varAssessMsg, "");
                                                         If(IsBlank(Trim(wiExitNote.Text)),
                                                             Set(varAssessMsg, ItemStopRefusal),
                                                             IfError(
                                                              Patch('Work items', ItemRow,
                                                                    { Phase: 'Phase (Work items)'.Stopped,
                                                                      'Stopped reason': Trim(wiExitNote.Text),
                                                                      State: ItemStoppedState }),
                                                              Set(varAssessMsg, FirstError.Message),
                                                              Patch('Activity log', Defaults('Activity log'),
                                                                    { Label: varItem.Title & " · stopped",
                                                                      Summary: Coalesce(ItemMeName, "Someone")
                                                                               & " stopped this: "
                                                                               & Trim(wiExitNote.Text),
                                                                      Action: 'Action (Activity log)'.'Stage action',
                                                                      Table: "wp_workitem",
                                                                      Record: Text(ItemRow.'Work item id'),
                                                                      'Record name': varItem.Title,
                                                                      Before: ItemStage,
                                                                      After: "Stopped",
                                                                      At: Now() });
                                                              Concurrent(ClearCollect(colWork, 'Work items'),
                                                                         ClearCollect(colActivity, 'Activity log'),
                                                                         ClearCollect(colItemActivity,
                                                                                      Filter('Activity log',
                                                                                             'Record name' = varItem.Title)));
                                                              Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                              Set(varItemTab, "");
                                                              Reset(wiTabs);
                                                              Reset(wiExitNote);
                                                              Notify(varItem.Title & " is stopped.",
                                                                     NotificationType.Success)))
                                                - wiExitStopMissing:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Width: =200
                                                      Height: =ControlHeight
                                                      Visible: =ItemCanStop && IsBlank(Trim(wiExitNote.Text))
                                                      Text: =ItemStopRefusal
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =StatusWarn
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                              # ---- Delivery: who is on this item, and the components it is
                              # broken into (power/design-work-flow.md, section 7) ----
                              - wiComponents:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    FillPortions: =1
                                    Visible: =ItemTab = "Components"
                                    LayoutMinWidth: =480
                                    Fill: =NeutralBg1
                                    BorderColor: =NeutralStroke1
                                    BorderThickness: =1
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =8
                                    PaddingLeft: =Pad
                                    PaddingRight: =Pad
                                    PaddingTop: =Pad
                                    PaddingBottom: =Pad
                                  Children:
                                    # ---- Delivery team: the one place a person is put on work
                                    # (power/decisions.md, 20 September 2026 evening). One
                                    # assignment row per person, over the sprints chosen.
                                    - wiAssignTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Text: ="Delivery team"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiAssignRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =8
                                        Children:
                                          - wiAssignPeople:
                                              Control: ModernCombobox@1.1.1
                                              Properties:
                                                Width: =Max(Parent.Width - 396, 200)
                                                Height: =ControlHeight
                                                Items: =FormAssignPeopleOptions
                                                ItemDisplayText: =ThisItem.DisplayLabel
                                                SelectMultiple: =true
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                Color: =NeutralFg1
                                                BasePaletteColor: =BrandBg
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="People to assign to this item"
                                                Appearance: =Appearance.Outline
                                                Fill: =NeutralBg1
                                          - wiAssignFrom:
                                              Control: ModernDropdown@1.0.2
                                              Properties:
                                                Width: =120
                                                Height: =ControlHeight
                                                Items: =FormAssignSprintOptions
                                                ItemDisplayText: =ThisItem.Value
                                                Default: ={Value:FormAssignFromDefault}
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="From sprint"
                                                Size: =TypeBodyPx
                                          - wiAssignTo:
                                              Control: ModernDropdown@1.0.2
                                              Properties:
                                                Width: =120
                                                Height: =ControlHeight
                                                Items: =FormAssignSprintOptions
                                                ItemDisplayText: =ThisItem.Value
                                                Default: ={Value:FormAssignToDefault}
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="To sprint"
                                                Size: =TypeBodyPx
                                          - wiAssignAdd:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Width: =140
                                                Height: =ControlHeight
                                                # Secondary: Mark released is the forward action on
                                                # this tab, and a tab carries one primary button.
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Text: ="Assign"
                                                AccessibleLabel: ="Assign the chosen people to this item"
                                                DisplayMode: |
                                                  =If(!ItemComponentsEditable, DisplayMode.View,
                                                      CountRows(wiAssignPeople.SelectedItems) = 0
                                                      || Value(Mid(wiAssignTo.Selected.Value, 2))
                                                         < Value(Mid(wiAssignFrom.Selected.Value, 2)),
                                                      DisplayMode.Disabled, DisplayMode.Edit)
                                                # One row per person, from the Monday the From
                                                # sprint opens on to the Friday the To sprint
                                                # closes on.
                                                OnSelect: |
                                                  =IfError(
                                                   // the picks are iterated straight off the combo
                                                   // box, so a name that is the start of another
                                                   // name cannot be matched by mistake
                                                   With({ f: LookUp(FormAssignSprintDates,
                                                                    Num = Value(Mid(wiAssignFrom.Selected.Value, 2))),
                                                          t: LookUp(FormAssignSprintDates,
                                                                    Num = Value(Mid(wiAssignTo.Selected.Value, 2))) },
                                                       ForAll(wiAssignPeople.SelectedItems As P,
                                                           Patch(Assignments, Defaults(Assignments),
                                                                 { Person: LookUp(People, 'Full name' = P.Value),
                                                                   'Work item': ItemRow,
                                                                   From: f.From,
                                                                   To: t.To,
                                                                   Label: varItem.Title }))),
                                                   Set(varAssessMsg, FirstError.Message),
                                                   ClearCollect(colAssignments, Assignments);
                                                   Set(varAssessMsg, "");
                                                   Notify(Text(CountRows(wiAssignPeople.SelectedItems),
                                                               "[$-en-US]#,##0")
                                                          & " people assigned.",
                                                          NotificationType.Success);
                                                   // every input starts from its Default again, so
                                                   // a second Assign is not the same rows twice
                                                   Reset(wiAssignPeople);
                                                   Reset(wiAssignFrom);
                                                   Reset(wiAssignTo))
                                    # What this item already carries, one row a person, with the
                                    # sprints it runs over and a Remove.
                                    - wiAssignList:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          TemplatePadding: =0
                                          FillPortions: =0
                                          Height: =FormAssignListH
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          ShowScrollbar: =true
                                          TemplateSize: =RowHeight
                                          Items: =FormAssignRows
                                          AccessibleLabel: ="Who is assigned to this item, one row each, with the share each carries."
                                        Children:
                                          - wiAssignRowLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.TemplateWidth - 96
                                                Height: =RowHeight
                                                Text: |
                                                  =Coalesce(ThisItem.Person.'Full name', "Somebody")
                                                   & " · " & Text(ThisItem.From, "d mmm")
                                                   & " to " & Text(ThisItem.To, "d mmm")
                                                   & " · " & Text(ItemWalkShare, "[$-en-US]#,##0.0")
                                                   & " MW"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiAssignRowRemove:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                X: =Parent.TemplateWidth - 88
                                                Y: =2
                                                Width: =88
                                                Height: =ControlHeight
                                                Appearance: =ButtonAppearance.Subtle
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Text: ="Remove"
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: |
                                                  ="Remove "
                                                   & Coalesce(ThisItem.Person.'Full name', "this assignment")
                                                   & " from this item"
                                                OnSelect: |
                                                  =IfError(
                                                   Remove(Assignments,
                                                          LookUp(Assignments,
                                                                 'Assignment id' = ThisItem.'Assignment id')),
                                                   Set(varAssessMsg, FirstError.Message),
                                                   ClearCollect(colAssignments, Assignments);
                                                   Set(varAssessMsg, "");
                                                   Notify("Assignment removed.", NotificationType.Success))
                                    - wiCompHead:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =8
                                        Children:
                                          - wiCompTitleText:
                                              Control: Label@2.5.1
                                              Properties:
                                                Width: =Max(Parent.Width * 0.16, 120)
                                                Height: =TypeHeadingLine
                                                Text: ="Components"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiCompTitle:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                Width: =Parent.Width - Max(Parent.Width * 0.16, 120) - 184
                                                Height: =ControlHeight
                                                Default: =""
                                                Placeholder: ="The component's title"
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="The new component's title"
                                          - wiCompAdd:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Width: =160
                                                Height: =ControlHeight
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Text: ="Add component"
                                                DisplayMode: =If(ItemComponentsEditable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: ="Add a component to this item"
                                                # useDataset.ts addComponent(): the parent is set,
                                                # and the squad and the commitment come off it.
                                                OnSelect: |
                                                  =If(IsBlank(wiCompTitle.Text),
                                                      Set(varProblem, "A component needs a title."),
                                                      Patch('Work items', Defaults('Work items'),
                                                            { Title: wiCompTitle.Text,
                                                              Kind: 'Kind (Work items)'.Component,
                                                              'Part of': ItemRow,
                                                              Squad: varItem.Squad,
                                                              Commitment: varItem.Commitment,
                                                              State: varItem.State });
                                                      ClearCollect(colWork, 'Work items');
                                                      Set(varProblem, ""))
                                    # Why Add component is refused: the item has left Delivery
                                    # and has to be reopened first.
                                    - wiCompAddNote:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Visible: =!IsBlank(ItemDeliveryAddNote)
                                          Text: =ItemDeliveryAddNote
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =StatusWarn
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiCompHeadRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Height: =RowHeight
                                        Children:
                                          - wiCompHeadTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Parent.Width * WiCompColTitle
                                                Height: =TypeLabelLine
                                                Text: ="Title"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCompHeadSkill:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * WiCompColTitle
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Parent.Width * WiCompColSkill
                                                Height: =TypeLabelLine
                                                Text: ="Skill"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCompHeadSize:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.Width * (WiCompColTitle + WiCompColSkill)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Parent.Width * WiCompColSize
                                                Height: =TypeLabelLine
                                                Text: ="Size · MW"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCompHeadSprints:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Parent.Width * (WiCompColTitle + WiCompColSkill
                                                   + WiCompColSize)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Parent.Width * WiCompColSprints
                                                Height: =TypeLabelLine
                                                Text: ="Sprints"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiCompHeadStatus:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Parent.Width * (WiCompColTitle + WiCompColSkill
                                                   + WiCompColSize + WiCompColSprints)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Parent.Width * WiCompColStatus
                                                Height: =TypeLabelLine
                                                Text: ="State"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                    - wiCompEmpty:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =ItemChildCount = 0
                                          Text: ="No components yet."
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiCompList:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          TemplatePadding: =0
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          ShowScrollbar: =true
                                          FillPortions: =1
                                          Visible: =ItemChildCount > 0
                                          Items: =ItemDeliveryComponents
                                          TemplateSize: =RowHeight
                                          AccessibleLabel: |
                                            ="The components this item is broken into, with the MW each one charges."
                                        Children:
                                          - wiCompRowTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.TemplateWidth * WiCompColTitle
                                                Height: =RowHeight
                                                Text: =ThisItem.Title
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Underline: =true
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =BrandText
                                                TabIndex: =0
                                                Tooltip: =ThisItem.Title
                                                OnSelect: |
                                                  =Set(varItem, LookUp(colWork, Title = ThisItem.Title));
                                                   Set(varItemTab, "Shape")
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiCompRowSkill:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.TemplateWidth * WiCompColTitle
                                                Y: =0
                                                Width: =Parent.TemplateWidth * WiCompColSkill
                                                Height: =RowHeight
                                                Text: =If(ThisItem.Skill = "", "—", ThisItem.Skill)
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiCompRowSize:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.TemplateWidth * (WiCompColTitle + WiCompColSkill)
                                                Y: =0
                                                Width: =Parent.TemplateWidth * WiCompColSize
                                                Height: =RowHeight
                                                Text: |
                                                  =ThisItem.Size & " · " & Text(ThisItem.MW, "[$-en-US]#,##0.0") & " MW"
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiCompRowSprints:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Parent.TemplateWidth * (WiCompColTitle + WiCompColSkill
                                                   + WiCompColSize)
                                                Y: =0
                                                Width: =Parent.TemplateWidth * WiCompColSprints
                                                Height: =RowHeight
                                                Text: =ThisItem.Sprints
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          # The component's own state: a dropdown while the
                                          # parent is in delivery, the word alone afterwards.
                                          - wiCompRowStatus:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Parent.TemplateWidth * (WiCompColTitle + WiCompColSkill
                                                   + WiCompColSize + WiCompColSprints)
                                                Y: =0
                                                Width: =Parent.TemplateWidth * WiCompColStatus
                                                Height: =RowHeight
                                                Visible: =!ItemComponentsEditable
                                                Text: =ThisItem.StateName
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true
                                          - wiCompRowState:
                                              Control: ModernDropdown@1.0.2
                                              Properties:
                                                X: |
                                                  =Parent.TemplateWidth * (WiCompColTitle + WiCompColSkill
                                                   + WiCompColSize + WiCompColSprints)
                                                Y: =(RowHeight - ControlHeight) / 2
                                                Width: =Parent.TemplateWidth * WiCompColStatus
                                                Height: =ControlHeight
                                                Visible: =ItemComponentsEditable
                                                Items: =StateOptions
                                                ItemDisplayText: =ThisItem.Value
                                                Default: ={Value:ThisItem.StateName}
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                Size: =TypeBodyPx
                                                DisplayMode: |
                                                  =If(ItemComponentsEditable, DisplayMode.Edit,
                                                      DisplayMode.View)
                                                AccessibleLabel: |
                                                  ="The state of " & ThisItem.Title
                                                OnChange: |
                                                  =IfError(
                                                   Patch('Work items',
                                                         LookUp('Work items', Title = ThisItem.Title),
                                                         { State: LookUp('Work states',
                                                                         State = wiCompRowState.Selected.Value) }),
                                                   Set(varAssessMsg, FirstError.Message),
                                                   ClearCollect(colWork, 'Work items');
                                                   Set(varAssessMsg, ""))
                                    - wiCompFoot:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Text: =ItemRollupLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0

                                    - wiDeliveryMsg:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =!IsBlank(varAssessMsg)
                                          Text: =varAssessMsg
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =StatusBad
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- The one forward action out of Delivery: Mark released,
                                    # or Mark concluded on a spike (power/design-work-flow.md,
                                    # section 7). No gate; the line beside it names how many
                                    # components are still open, and releasing anyway is recorded.
                                    - wiReleasedLine:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =If(!ItemComponentsEditable && !IsBlank(ItemReleasedRow.At), TypeBodyLine, 0)
                                          Visible: =!ItemComponentsEditable && !IsBlank(ItemReleasedRow.At)
                                          Text: =ItemReleasedLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- The other way out of Delivery: stopped with a reason,
                                    # never the primary button (section 9). The Assess tab's exit
                                    # section again, with Delivery as the stage left behind.
                                    - wiDelExitSection:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =If(ItemComponentsEditable, TypeBodyLine + 48 + 4, 0)
                                          Visible: =ItemComponentsEditable
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                        Children:
                                          - wiDelExitTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeBodyLine
                                                Text: ="Other exits"
                                                Size: =TypeSubtitle
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiDelExitRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =0
                                                Height: =48
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutJustifyContent: =LayoutJustifyContent.Start
                                                LayoutGap: =8
                                              Children:
                                                - wiDelExitNote:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Width: =Max(Parent.Width - 400, 200)
                                                      Height: =48
                                                      Type: =TextInputType.Multiline
                                                      Default: =""
                                                      Placeholder: ="Why (required)"
                                                      Appearance: =Appearance.Outline
                                                      BasePaletteColor: =BrandBg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      Fill: =NeutralBg1
                                                      DisplayMode: |
                                                        =If(ItemComponentsEditable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      AccessibleLabel: ="Why this item is stopping"
                                                - wiDelStopItem:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Width: =140
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Secondary
                                                      BasePaletteColor: =NeutralBg1
                                                      Color: =NeutralFg1
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Stop"
                                                      AccessibleLabel: ="Stop this item"
                                                      # The Stop gate, as Commit has it: live only
                                                      # once a reason is typed, with the line
                                                      # beside the button saying so.
                                                      DisplayMode: |
                                                        =If(!ItemCanStop, DisplayMode.View,
                                                            IsBlank(Trim(wiDelExitNote.Text)),
                                                            DisplayMode.Disabled,
                                                            DisplayMode.Edit)
                                                      # The reason is written on the item as well
                                                      # as on the Activity row, as it is on Assess,
                                                      # and through the same Stop formulas.
                                                      OnSelect: |
                                                        =Set(varAssessMsg, "");
                                                         If(IsBlank(Trim(wiDelExitNote.Text)),
                                                             Set(varAssessMsg, ItemStopRefusal),
                                                             IfError(
                                                              Patch('Work items', ItemRow,
                                                                    { Phase: 'Phase (Work items)'.Stopped,
                                                                      'Stopped reason': Trim(wiDelExitNote.Text),
                                                                      State: ItemStoppedState }),
                                                              Set(varAssessMsg, FirstError.Message),
                                                              Patch('Activity log', Defaults('Activity log'),
                                                                    { Label: varItem.Title & " · stopped",
                                                                      Summary: Coalesce(ItemMeName, "Someone")
                                                                               & " stopped this: "
                                                                               & Trim(wiDelExitNote.Text),
                                                                      Action: 'Action (Activity log)'.'Stage action',
                                                                      Table: "wp_workitem",
                                                                      Record: Text(ItemRow.'Work item id'),
                                                                      'Record name': varItem.Title,
                                                                      Before: ItemStage,
                                                                      After: "Stopped",
                                                                      At: Now() });
                                                              Concurrent(ClearCollect(colWork, 'Work items'),
                                                                         ClearCollect(colActivity, 'Activity log'),
                                                                         ClearCollect(colItemActivity,
                                                                                      Filter('Activity log',
                                                                                             'Record name' = varItem.Title)));
                                                              Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                              Set(varItemTab, "");
                                                              Reset(wiTabs);
                                                              Reset(wiDelExitNote);
                                                              Notify(varItem.Title & " is stopped.",
                                                                     NotificationType.Success)))
                                                - wiDelStopMissing:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Width: =200
                                                      Height: =ControlHeight
                                                      Visible: =ItemCanStop && IsBlank(Trim(wiDelExitNote.Text))
                                                      Text: =ItemStopRefusal
                                                      Size: =TypeCaption
                                                      Font: =FontUI
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Color: =StatusWarn
                                                      Wrap: =true
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0

                              # ---- Value: what the item claims, and what that is worth in-year ----
                              - wiValue:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    FillPortions: =1
                                    # A stopped feature keeps the tab, read-only: ItemValueVisible
                                    # reads the phase, and a stopped item has left Release.
                                    Visible: =ItemTab = "Value" && (ItemValueVisible || ItemStopped)
                                    LayoutMinWidth: =480
                                    Fill: =NeutralBg1
                                    BorderColor: =NeutralStroke1
                                    BorderThickness: =1
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =Gap
                                    PaddingLeft: =Pad
                                    PaddingRight: =Pad
                                    PaddingTop: =Pad
                                    PaddingBottom: =Pad
                                  Children:
                                    - wiValueTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeHeadingLine
                                          Text: ="What the claim is worth"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wiValueSummary:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Text: =ItemValueLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FontWeight: =FontWeight.Semibold
                                    - wiValueLands:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Text: ="Lands " & ItemLandsText
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- The claims, one row each: what was claimed, the latest
                                    # actual against it, and the controls that record the next one
                                    # (power/design-work-flow.md, section 8). An actual is never
                                    # edited; a later one supersedes it by date and the earlier
                                    # ones stay as the count on the right (decision 17).
                                    - wiClaimHead:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Text: ="Claims and their actuals"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiClaimHint:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =ItemPhaseEffective = 'Phase (Work items)'.Validated
                                          Text: |
                                            ="This item is validated. A correction is a new actual; the earlier ones stand."
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FontWeight: =FontWeight.Normal
                                    # Nothing was claimed, so there is nothing to record against:
                                    # one line stands in for the list
                                    # (power/design-work-flow.md, section 8).
                                    - wiClaimEmpty:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =If(ItemValueClaimCount = 0, TypeBodyLine, 0)
                                          Visible: =ItemValueClaimCount = 0
                                          Text: ="No benefit claimed yet"
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiClaimList:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          TemplatePadding: =0
                                          FillPortions: =0
                                          Visible: =ItemValueClaimCount > 0
                                          Height: =ItemValueListH
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          ShowScrollbar: =true
                                          TemplateSize: =ItemValueRowH
                                          Items: =ItemValueClaimRows
                                          AccessibleLabel: |
                                            ="The item's benefit claims, one row each, with the latest actual against it."
                                        Children:
                                          - wiClaimTypeLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =180
                                                Height: =TypeBodyLine
                                                Text: =ThisItem.Type
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - wiClaimClaimedLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =184
                                                Y: =0
                                                Width: =140
                                                Height: =TypeBodyLine
                                                Text: |
                                                  ="claimed "
                                                   & Text(ThisItem.Claimed, "[$-en-US]#,##0.0")
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiClaimLatestLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =328
                                                Y: =0
                                                Width: =Max(Parent.TemplateWidth - 452, 160)
                                                Height: =TypeBodyLine
                                                Text: |
                                                  =If(ThisItem.Actuals = 0, "No actual yet",
                                                      "actual "
                                                      & Text(ThisItem.Latest, "[$-en-US]#,##0.0")
                                                      & " · "
                                                      & Text(ThisItem.When, "[$-en-US]d mmm yyyy")
                                                      & If(IsBlank(ThisItem.Note), "",
                                                           " · " & ThisItem.Note))
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # The history: nothing is deleted, so the earlier actuals
                                          # are counted here rather than listed.
                                          - wiClaimHistoryLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =Parent.TemplateWidth - 120
                                                Y: =0
                                                Width: =120
                                                Height: =TypeBodyLine
                                                Text: |
                                                  =If(ThisItem.Actuals < 2, "",
                                                      (ThisItem.Actuals - 1) & " superseded")
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - wiClaimValueIn:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                X: =0
                                                Y: =TypeBodyLine + 4
                                                Width: =100
                                                Height: =ControlHeight
                                                Default: =""
                                                Placeholder: ="Value"
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemValueRecordable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: |
                                                  ="The actual value for " & ThisItem.Type
                                          - wiClaimWhenIn:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                X: =108
                                                Y: =TypeBodyLine + 4
                                                Width: =130
                                                Height: =ControlHeight
                                                Default: =ItemValueWhenDefault
                                                Placeholder: ="yyyy-mm-dd"
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemValueRecordable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: |
                                                  ="The date the actual was read, for "
                                                   & ThisItem.Type
                                          - wiClaimNoteIn:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                X: =246
                                                Y: =TypeBodyLine + 4
                                                Width: =Max(Parent.TemplateWidth - 398, 140)
                                                Height: =ControlHeight
                                                Default: =""
                                                Placeholder: ="Note (optional)"
                                                Appearance: =Appearance.Outline
                                                BasePaletteColor: =BrandBg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                Color: =NeutralFg1
                                                Fill: =NeutralBg1
                                                DisplayMode: =If(ItemValueRecordable, DisplayMode.Edit, DisplayMode.View)
                                                AccessibleLabel: |
                                                  ="A note on the actual for " & ThisItem.Type
                                          - wiClaimRecord:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                X: =Parent.TemplateWidth - 144
                                                Y: =TypeBodyLine + 4
                                                Width: =144
                                                Height: =ControlHeight
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Text: ="Record actual"
                                                AccessibleLabel: |
                                                  ="Record an actual against the "
                                                   & ThisItem.Type & " claim"
                                                DisplayMode: |
                                                  =If(!ItemValueRecordable, DisplayMode.View,
                                                      IsBlank(wiClaimValueIn.Text)
                                                      || !IsNumeric(wiClaimValueIn.Text)
                                                      || IsBlank(DateValue(wiClaimWhenIn.Text)),
                                                      DisplayMode.Disabled, DisplayMode.Edit)
                                                # A new row every time: the actual the claim shows
                                                # is the latest by When, and the ones it supersedes
                                                # are neither edited nor removed.
                                                OnSelect: |
                                                  =IfError(
                                                   Patch('Benefit actuals', Defaults('Benefit actuals'),
                                                         { Name: varItem.Title & " · " & ThisItem.Type,
                                                           'Work item': ItemRow,
                                                           'Benefit type':
                                                               Switch(ThisItem.Type,
                                                                   "FTE released", 'Benefit type (Benefit actuals)'.'FTE released',
                                                                   "Cost avoidance", 'Benefit type (Benefit actuals)'.'Cost avoidance',
                                                                   "Cycle-time cut", 'Benefit type (Benefit actuals)'.'Cycle-time cut',
                                                                   "Error reduction", 'Benefit type (Benefit actuals)'.'Error reduction',
                                                                   "Throughput", 'Benefit type (Benefit actuals)'.Throughput,
                                                                   "Compliance / risk", 'Benefit type (Benefit actuals)'.'Compliance / risk',
                                                                   'Benefit type (Benefit actuals)'.'CX / EX uplift'),
                                                           Claim: LookUp('Benefit claims',
                                                                         'Benefit claim id' = ThisItem.ClaimId),
                                                           'Actual value': Value(wiClaimValueIn.Text),
                                                           When: DateValue(wiClaimWhenIn.Text),
                                                           Note: wiClaimNoteIn.Text }),
                                                   Set(varActualMsg, FirstError.Message),
                                                   ClearCollect(colActuals, 'Benefit actuals');
                                                   Set(varActualMsg, "");
                                                   Notify("The actual is recorded.", NotificationType.Success);
                                                   // every input starts from its Default again, so
                                                   // a second Record is not the same row twice
                                                   Reset(wiClaimValueIn);
                                                   Reset(wiClaimWhenIn);
                                                   Reset(wiClaimNoteIn))
                                    - wiActualMsg:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =!IsBlank(varActualMsg)
                                          Text: =varActualMsg
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =StatusBad
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # ---- Validate: the one forward action out of Released, and
                                    # the only primary button on this tab
                                    # (power/design-work-flow.md, sections 8 and 10) ----
                                    - wiValidatedLine:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =If(ItemPhaseEffective = 'Phase (Work items)'.Validated, TypeBodyLine, 0)
                                          Visible: =ItemPhaseEffective = 'Phase (Work items)'.Validated
                                          Text: =ItemValidatedLine
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              # ---- Activity: what has happened to the item, out of its columns ----
                              - wiActivity:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    Visible: =ItemTab = "Activity"
                                    LayoutMinWidth: =480
                                    Fill: =NeutralBg1
                                    BorderColor: =NeutralStroke1
                                    BorderThickness: =1
                                    RadiusTopLeft: =CardR
                                    RadiusTopRight: =CardR
                                    RadiusBottomLeft: =CardR
                                    RadiusBottomRight: =CardR
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =8
                                    PaddingLeft: =Pad
                                    PaddingRight: =Pad
                                    PaddingTop: =Pad
                                    PaddingBottom: =Pad
                                  Children:
                                    - wiActivityTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeHeadingLine
                                          Text: ="Activity"
                                          Size: =TypeSubtitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - wiActivityEmpty:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Visible: =ItemActivityCount = 0
                                          Text: ="Nothing has happened to this item yet."
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - wiActivityList:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          TemplatePadding: =0
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          ShowScrollbar: =true
                                          FillPortions: =1
                                          Visible: =ItemActivityCount > 0
                                          Items: =ItemActivity
                                          TemplateSize: =RowHeight
                                          AccessibleLabel: ="What has happened to this item"
                                        Children:
                                          - wiActivityLine:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =0
                                                Width: =Parent.TemplateWidth
                                                Height: =RowHeight
                                                Text: =ThisItem.Line
                                                Size: =TypeBody
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =true
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                AutoHeight: =true

                              # ---- the right rail: 320px, fixed, whatever the window does ----
                              - wiSideRail:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =0
                                    LayoutMinWidth: =RailW
                                    Width: =RailW
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =Gap
                                  Children:
                                    # ---- Next step: the one forward move this stage offers, on
                                    # its own above At a glance, with what stands in its way
                                    # beneath it (power/design-work-flow.md, section 3). The only
                                    # Primary button on the screen is in here; a terminal stage
                                    # offers Reopen in its place.
                                    - wiNextStep:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: |
                                            =Pad * 2 + TypeLabelLine
                                             + If(ItemNextForward,
                                                  4 + ControlHeight + 4 + TypeBodyLine * 2, 0)
                                             + If(ItemReopenVisible, 4 + 48, 0)
                                          Visible: =ItemNextForward || ItemReopenVisible
                                          Fill: =NeutralBg1
                                          BorderColor: =NeutralStroke1
                                          BorderThickness: =1
                                          RadiusTopLeft: =CardR
                                          RadiusTopRight: =CardR
                                          RadiusBottomLeft: =CardR
                                          RadiusBottomRight: =CardR
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          PaddingLeft: =Pad
                                          PaddingRight: =Pad
                                          PaddingTop: =Pad
                                          PaddingBottom: =Pad
                                        Children:
                                          - wiNextKicker:
                                              Control: Label@2.5.1
                                              Properties:
                                                Height: =TypeLabelLine
                                                Text: ="Next step"
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FontWeight: =FontWeight.Semibold
                                          - wiNextRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =0
                                                Height: =If(ItemNextForward, ControlHeight, 0)
                                                Visible: =ItemNextForward
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutJustifyContent: =LayoutJustifyContent.Start
                                                LayoutGap: =8
                                              Children:
                                                - wiSendGo:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Visible: =ItemShapeEditable
                                                      Width: =If(ItemShapeEditable, 180, 0)
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Primary
                                                      BasePaletteColor: =BrandBg
                                                      Color: =BrandFg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Send for assessment"
                                                      AccessibleLabel: ="Send this item for assessment"
                                                      # The Intake gate: a product owner, a
                                                      # priority, and on a feature at least one
                                                      # benefit claim (power/design-work-flow.md,
                                                      # section 5). The label beside the button
                                                      # names what is missing.
                                                      #
                                                      # The button itself saves what has been
                                                      # typed, so it is live wherever the stage
                                                      # allows the action; the gate is enforced in
                                                      # OnSelect, against the saved record.
                                                      DisplayMode: |
                                                        =If(ItemShapeEditable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      # The move to Assessment: the item's own row
                                                      # first, then one Activity log row for who,
                                                      # when, from, to and the note. The tab list
                                                      # reads ItemStage, so the Assess tab appears
                                                      # as soon as varItem is read again.
                                                      # The log row names the table and the record
                                                      # it landed on, which is what the Settings
                                                      # activity table reads; By stays blank
                                                      # because Users is not a connected table in
                                                      # this app and nothing here can write a
                                                      # systemuser lookup.
                                                      OnSelect: |
                                                        =Set(varProblem, "");
                                                         // The Intake form is saved first, in the
                                                         // Patch the Save button writes, so the
                                                         // gate below reads what the user typed
                                                         // rather than what was last stored.
                                                         IfError(
                                                          Patch('Work items', ItemRow,
                                                                { Title: wiTitleInput.Text,
                                                                  Epic: LookUp(Epics,
                                                                               Epic = wiEpicInput.Selected.Value),
                                                                  'Product owner':
                                                                      LookUp(People,
                                                                             'Full name'
                                                                               = wiOwnerInput.Selected.Value),
                                                                  'Jira Align ID': wiJiraInput.Text,
                                                                  'Cancellation reason': wiReasonInput.Text,
                                                                  Priority: wiShapePriorityInput.Selected.Value,
                                                                  Notes: If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                                            varItem.Notes, wiNotesInput.Text),
                                                                  'Spike question':
                                                                      If(varItem.Kind = 'Kind (Work items)'.Spike,
                                                                         wiNotesInput.Text,
                                                                         varItem.'Spike question') }),
                                                          Set(varProblem, FirstError.Message),
                                                          Set(varItem, LookUp('Work items',
                                                                              'Work item id' = ItemRow.'Work item id'));
                                                          ClearCollect(colWork, 'Work items');
                                                          With({ gaps:
                                                                   Filter(
                                                                       Table(
                                                                           { Seq: 1, Need: "a product owner",
                                                                             Show: IsBlank(varItem.'Product owner') },
                                                                           { Seq: 2, Need: "a priority",
                                                                             Show: IsBlank(varItem.Priority) },
                                                                           { Seq: 3, Need: "a benefit claim",
                                                                             Show: varItem.Kind
                                                                                     = 'Kind (Work items)'.Feature
                                                                                   && !ItemIntakeClaimed }),
                                                                       Show) },
                                                           // The gap line beside the button is
                                                           // the only place a gap is said, so the
                                                           // gate refuses quietly here.
                                                           If(CountRows(gaps) = 0,
                                                              IfError(
                                                               Patch('Work items', ItemRow,
                                                                     { Phase: 'Phase (Work items)'.Assessment,
                                                                       State: LookUp('Work states', State = "Ready") }),
                                                               Set(varProblem, FirstError.Message),
                                                               Patch('Activity log', Defaults('Activity log'),
                                                                     { Label: varItem.Title & " · sent for assessment",
                                                                       Summary: Coalesce(ItemMeName, "Someone")
                                                                                & " sent this for assessment.",
                                                                       Action: 'Action (Activity log)'.'Stage action',
                                                                       Table: "wp_workitem",
                                                                       Record: Text(ItemRow.'Work item id'),
                                                                       'Record name': varItem.Title,
                                                                       Before: "Shaping",
                                                                       After: "Assessment",
                                                                       At: Now() });
                                                               Concurrent(ClearCollect(colWork, 'Work items'),
                                                                          ClearCollect(colActivity, 'Activity log'),
                                                                          ClearCollect(colItemActivity,
                                                                                       Filter('Activity log',
                                                                                              'Record name' = varItem.Title)));
                                                               Set(varItem,
                                                                   LookUp('Work items',
                                                                          'Work item id'
                                                                            = ItemRow.'Work item id'));
                                                               Set(varItemTab, "Assess");
                                                               // The pane and the tab strip move
                                                               // together: Reset sends the tab list
                                                               // back to its Default, which is the
                                                               // Switch on ItemStage and now reads
                                                               // Assess (CONTROLS.md, ModernTabList:
                                                               // Default is the selected tab).
                                                               Reset(wiTabs);
                                                               Notify(varItem.Title
                                                                      & " is sent for assessment.",
                                                                      NotificationType.Success)))))
                                                - wiCommitGo:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Visible: =ItemAssessEditable
                                                      Width: =If(ItemAssessEditable, 180, 0)
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Primary
                                                      BasePaletteColor: =BrandBg
                                                      Color: =BrandFg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: ="Commit"
                                                      AccessibleLabel: ="Commit this item to delivery"
                                                      # The gate: a size, a band or an override,
                                                      # and a saved assessment. The label beside
                                                      # the button names what is missing.
                                                      # The button saves the assessment itself,
                                                      # so it is live wherever the stage allows
                                                      # the action and the gate is enforced in
                                                      # OnSelect, against the saved record.
                                                      DisplayMode: |
                                                        =If(ItemAssessEditable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      # The move to Delivery: the item's own row
                                                      # first, with the span the sprint dropdowns
                                                      # hold, then one Activity log row for who,
                                                      # when, from, to and the note. By stays blank
                                                      # because Users is not a connected table in
                                                      # this app.
                                                      OnSelect: |
                                                        =Set(varAssessMsg, "");
                                                         // The assessment is saved first, in the
                                                         // Patch the Save button writes, so the
                                                         // gate below reads what the user typed,
                                                         // including the stamp this save makes.
                                                         IfError(
                                                          Patch('Work items', ItemRow,
                                                                { Skill: LookUp('List values',
                                                                                List = 'List (List values)'.Skill
                                                                                && Value = wiSkillInput.Selected.Value),
                                                                  Size: LookUp('Size bands',
                                                                               Size = wiSizeInput.Selected.Value),
                                                                  'MW override': If(IsBlank(wiMwInput.Text), Blank(),
                                                                                    Value(wiMwInput.Text)),
                                                                  'Business grade':
                                                                      LookUp('Business grades',
                                                                             'Business grade'
                                                                               = wiGradeInput.Selected.Value),
                                                                  Confidence: wiConfidenceInput.Selected.Value,
                                                                  Squad: LookUp(Squads,
                                                                                'Squad name' = wiAssessSquadInput.Selected.Value),
                                                                  'Assessed by': ItemAssessorPerson,
                                                                  'Jira key': wiJiraKeyInput.Text,
                                                                  'Assessed on': Now() }),
                                                          Set(varAssessMsg, FirstError.Message),
                                                          Set(varItem, LookUp('Work items',
                                                                              'Work item id' = ItemRow.'Work item id'));
                                                          ClearCollect(colWork, 'Work items');
                                                          With({ gaps:
                                                                   Filter(
                                                                       Table(
                                                                           { Seq: 1, Need: "a size",
                                                                             Show: IsBlank(varItem.Size)
                                                                                   && IsBlank(varItem.'MW override') },
                                                                           { Seq: 2, Need: "a saved assessment",
                                                                             Show: IsBlank(varItem.'Assessed on') },
                                                                           { Seq: 3, Need: "an assessor",
                                                                             Show: IsBlank(varItem.'Assessed by') },
                                                                           { Seq: 4, Need: "a squad",
                                                                             Show: IsBlank(varItem.Squad) }),
                                                                       Show) },
                                                           If(CountRows(gaps) = 0,
                                                              IfError(
                                                               Patch('Work items', ItemRow,
                                                                     { Commitment: 'Commitment (Work items)'.Committed,
                                                                       Phase: 'Phase (Work items)'.Delivery,
                                                                       State: LookUp('Work states',
                                                                                     State = "In development"),
                                                                       'Absolute start sprint':
                                                                           If(wiStartSprint.Selected.Value = "Not scheduled",
                                                                              Blank(),
                                                                              Value(Mid(wiStartSprint.Selected.Value, 2))),
                                                                       'Start sprint':
                                                                           If(wiStartSprint.Selected.Value = "Not scheduled",
                                                                              Blank(),
                                                                              Value(Mid(wiStartSprint.Selected.Value, 2))
                                                                              - FirstSprint + 1),
                                                                       'Absolute end sprint':
                                                                           If(wiEndSprint.Selected.Value = "Not scheduled",
                                                                              Blank(),
                                                                              Value(Mid(wiEndSprint.Selected.Value, 2))),
                                                                       'End sprint':
                                                                           If(wiEndSprint.Selected.Value = "Not scheduled",
                                                                              Blank(),
                                                                              Value(Mid(wiEndSprint.Selected.Value, 2))
                                                                              - FirstSprint + 1) }),
                                                               Set(varAssessMsg, FirstError.Message),
                                                               Patch('Activity log', Defaults('Activity log'),
                                                                     { Label: varItem.Title & " · committed",
                                                                       Summary: Coalesce(ItemMeName, "Someone")
                                                                                & " committed this to delivery"
                                                                                & If(IsBlank(Trim(wiCommitNote.Text)), ".",
                                                                                     ": " & Trim(wiCommitNote.Text)),
                                                                       Action: 'Action (Activity log)'.'Stage action',
                                                                       Table: "wp_workitem",
                                                                       Record: Text(ItemRow.'Work item id'),
                                                                       'Record name': varItem.Title,
                                                                       Before: "Assessment",
                                                                       After: "Delivery",
                                                                       At: Now() });
                                                               Concurrent(ClearCollect(colWork, 'Work items'),
                                                                          ClearCollect(colActivity, 'Activity log'),
                                                                          ClearCollect(colItemActivity,
                                                                                       Filter('Activity log',
                                                                                              'Record name' = varItem.Title)));
                                                               Set(varItem, LookUp('Work items', Title = varItem.Title));
                                                               // The pane and the tab strip move
                                                               // together: the variable goes back to
                                                               // blank so ItemTab falls to the new
                                                               // stage's default, and Reset sends
