                                                                           { Seq: 4, Need: "a squad",
                                                                             Show: IsBlank(wiAssessSquadInput.Selected.Value) }),
                                                                       Show) },
                                                              If(CountRows(gaps) = 0, "",
                                                                 "Needs "
                                                                 & Concat(Sort(gaps, Seq), Need, ", ") & ".")),
                                                      ItemNextGap)
                                                Size: =TypeCaption
