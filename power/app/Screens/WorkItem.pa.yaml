                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
