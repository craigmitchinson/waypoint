                                                      Width: =If(ItemComponentsEditable, 180, 0)
                                                      Height: =ControlHeight
                                                      Appearance: =ButtonAppearance.Primary
                                                      BasePaletteColor: =BrandBg
                                                      Color: =BrandFg
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      RadiusTopLeft: =CtrlR
                                                      RadiusTopRight: =CtrlR
                                                      RadiusBottomLeft: =CtrlR
                                                      RadiusBottomRight: =CtrlR
                                                      Text: =ItemDeliveryActionText
                                                      AccessibleLabel: |
                                                        =ItemDeliveryActionText & " this item"
                                                      DisplayMode: |
                                                        =If(ItemComponentsEditable, DisplayMode.Edit,
                                                            DisplayMode.View)
                                                      # The Release phase and the state that goes
                                                      # with it, Released on a feature and Done on
