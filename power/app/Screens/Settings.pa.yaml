                                                Width: =Parent.Width * 0.2
                                                Height: =TypeLabelLine
                                                Text: ="When"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
