                                    - stQuarterNote:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine * 2
                                          Text: |
                                            ="The quarter's own dates, targets and sprint length are held on the quarter; the modifiers, the member week and the thresholds are held on the settings singleton. Save writes both."
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =NeutralFg2
