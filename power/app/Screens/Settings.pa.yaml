                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - stInQSprintDays:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(SprintDays, "[$-en-US]#,##0")
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Sprint days"
                                                      Appearance: =Appearance.Outline
                                                      Fill: =NeutralBg1
                                          - stFldQMwDays:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - stLblQMwDays:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =SetFieldLabelH
                                                      Text: ="Days in one member week"
                                                      Size: =TypeCaption
                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - stInQMwDays:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(MWDays, "[$-en-US]#,##0.0")
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Days in one member week"
                                                      Appearance: =Appearance.Outline
                                                      Fill: =NeutralBg1
                                    - stRowQ3:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =SetFieldRowH
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - stFldQDefMod:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
