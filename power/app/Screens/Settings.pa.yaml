                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                          FontWeight: =FontWeight.Normal
                                    # Validation is inline, as the forms are: one rule per field, in
                                    # field order, and nothing is written while the line reads.
                                    - stQuarterError:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Visible: =varSetTried && stQuarterError.Text <> ""
                                          Text: |
                                            =If(IsBlank(Trim(stInQLabel.Text)), "A quarter label is required.",
                                                IsBlank(DateValue(stInQEpoch.Text)),
                                                "Sprint 1 started must be a date, as yyyy-mm-dd.",
                                                !IsNumeric(stInQSprintDays.Text), "Sprint days must be a number.",
                                                !IsNumeric(stInQMwDays.Text),
                                                "Days in one member week must be a number.",
                                                !IsNumeric(stInQDefMod.Text),
                                                "The default modifier must be a number.",
                                                !IsNumeric(stInQLeadMod.Text), "The lead modifier must be a number.",
                                                !IsNumeric(stInQBenefitYear.Text), "The benefit year must be a number.",
                                                !IsNumeric(stInQTargetFte.Text),
                                                "The target FTE released must be a number.",
                                                !IsNumeric(stInQTargetGbp.Text), "The target benefit must be a number.",
                                                !IsNumeric(stInQAmber.Text),
                                                "The amber utilisation threshold must be a number.",
                                                !IsNumeric(stInQRed.Text),
                                                "The red utilisation threshold must be a number.", "")
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =StatusBad
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    # What Dataverse answered when it refused the save.
                                    - stQuarterProblem:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeLabelLine
                                          Visible: =!IsBlank(varSetProblem)
                                          Text: =varSetProblem
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =StatusBad
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
