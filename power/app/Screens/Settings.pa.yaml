                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(BenefitYear, "[$-en-US]#,##0")
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Benefit year"
                                                      Appearance: =Appearance.Outline
                                                      Fill: =NeutralBg1
                                          - stFldQDeduct:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - stLblQDeduct:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =SetFieldLabelH
                                                      Text: ="Deduct logged absences and bank holidays"
                                                      Size: =TypeCaption
                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - stInQDeduct:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Items: =SettingsYesNo
                                                      ItemDisplayText: =ThisItem.Value
                                                      Default: ={Value:If(LogAbsences, "Yes", "No")}
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
