                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - stInQTargetFte:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =Text(FteTarget, "[$-en-US]#,##0.0")
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Target FTE released"
                                                      Appearance: =Appearance.Outline
