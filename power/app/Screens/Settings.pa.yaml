# Waypoint canvas app: the Settings screen, every number the engine reads and the record of
# what has been changed.
#
# Valid against pa.schema.yaml (v3.0): a Screens map, each screen with a Properties formula map and a
# Children sequence whose items are single-key maps of control name to control instance.
#
# Settings is src/pages/Settings.tsx: nine tabs over one card. Quarter, Money and Links are forms
# read straight off the settings singleton and the current quarter and written back with Patch;
# States, Lists, Grades and blends and Outcomes are galleries over the tables behind them; Data is
# the three operations that are Power Automate flows at work; Activity is the log, newest first,
# with a search over it.
#
# The shell is scrTeam's, unchanged: stRoot is a vertical GroupContainer the size of the screen,
# holding the 48px header and a horizontal row of the rail and the body. X and Y appear only inside
# the gallery templates, which are not auto-layout.
#
# The pivot is one ModernTabList. Its selection lands in varSetTab, and SettingsTab is the formula
# every panel's Visible reads, so the screen opens on Quarter before the tab list is ever touched.
#
# What is hidden, and why: every row's Edit button and every Add button is Visible: false until the
# form behind it exists. The three buttons on the Data tab stay, and say what the operation will do
# at work.
Screens:
  scrSettings:
    Properties:
      Fill: =NeutralCanvas
      OnVisible: |
        =// The screen opens with no refusal on show and no save attempted yet.
        Set(varSetProblem, "");
        Set(varSetTried, false)

    Children:

      # ---- the root: one vertical auto-layout container the size of the screen ----
      - stRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Hide
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:

            # ---- shell: the app header ----
            - stHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - stHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  # ---- shell: the scope selector, one cmpScope instance for every screen ----
                  - stHeaderScope:
                      Control: CanvasComponent
                      ComponentName: cmpScope
                      Properties:
                        Width: =Max(Parent.Width * 0.14, 180)
                        Height: =ControlHeight
                        Visible: =IncludeScope
                  # ---- shell: the header search, one cmpSearch instance for every screen ----
                  - stHeaderSearch:
                      Control: CanvasComponent
                      ComponentName: cmpSearch
                      Properties:
                        Width: =Max(Parent.Width * 0.24, 280)
                        Height: =ControlHeight
                  - stHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - stMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:

                  # ---- shell: the rail, one cmpRail instance for every screen ----
                  - stRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="Settings"

                  # ---- shell: the body everything else sits inside ----
                  - stBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =Gap
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:

                        # ---- page head: the eyebrow and the one h1 ----
                        - stPageHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                            Children:
                              - stEyebrow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeKickerLine
                                    Visible: =!IsCompact
                                    Text: =CurrentQuarter.Label
                                    Size: =TypeCaption
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - stTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeDisplayLine
                                    Text: ="Settings"
                                    Size: =TypeTitle
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg1
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AutoHeight: =true

                        # ---- the pivot: the nine tabs Settings.tsx carries, in its own order ----
                        - stPivot:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =ControlHeight + 16
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =Gap
                            Children:
                              - stTabs:
                                  Control: ModernTabList@1.0.1
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =ControlHeight + 8
                                    Items: |
                                      =Table({Value:"Quarter"}, {Value:"States"}, {Value:"Lists"}, {Value:"Grades and blends"},
                                        {Value:"Financials"}, {Value:"Outcomes"}, {Value:"Links"}, {Value:"Data"}, {Value:"Activity"})
                                    Default: ={Value:"Quarter"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Settings views"
                                    OnChange: =Set(varSetTab, stTabs.Selected.Value)
                                    FontWeight: =FontWeight.Semibold

                        # ---- the card every tab draws inside ----
                        - stCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =1
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:

                              - stQuarter:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    Visible: =SettingsTab = "Quarter"
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =8
                                  Children:
                                    - stRowQ1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =SetFieldRowH
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =Gap
                                        Children:
                                          - stFldQLabel:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - stLblQLabel:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Height: =SetFieldLabelH
                                                      Text: ="Quarter label"
                                                      Size: =TypeCaption
                                                      FontWeight: =FontWeight.Semibold
                                                      Font: =FontUI
                                                      Color: =NeutralFg2
                                                      Wrap: =false
                                                      Overflow: =Overflow.Hidden
                                                      PaddingTop: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                - stInQLabel:
                                                    Control: ModernTextInput@1.1.1
                                                    Properties:
                                                      Height: =ControlHeight
                                                      Default: =CurrentQuarter.Label
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Quarter label"
                                                      Appearance: =Appearance.Outline
                                                      Fill: =NeutralBg1
                                          - stFldQEpoch:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                LayoutOverflowX: =LayoutOverflow.Hide
                                                LayoutOverflowY: =LayoutOverflow.Hide
                                                FillPortions: =1
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutGap: =4
                                              Children:
                                                - stLblQEpoch:
