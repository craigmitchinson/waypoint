                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =1
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =0
                                    - stQuarterActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.End
                                          LayoutGap: =Gap
                                        Children:
                                          - stQuarterSave:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Primary
                                                BasePaletteColor: =BrandBg
                                                Color: =BrandFg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Width: =Max(Parent.Width * 0.13, 220)
                                                Height: =ControlHeight
                                                Text: ="Save"
                                                AccessibleLabel: ="Save"
                                                DisplayMode: |
                                                  =If(varSetTried && stQuarterError.Text <> "",
                                                      DisplayMode.Disabled, DisplayMode.Edit)
                                                OnSelect: |
                                                  =Set(varSetTried, true);
                                                   If(stQuarterError.Text = "",
                                                   IfError(
                                                   Patch([@Settings], First([@Settings]),
                                                         { 'Days in a member week': Value(stInQMwDays.Text),
                                                           'Default modifier': Value(stInQDefMod.Text) / 100,
                                                           'Lead modifier': Value(stInQLeadMod.Text) / 100,
                                                           'Deduct absences': stInQDeduct.Selected.Value = "Yes",
                                                           'Amber utilisation from': Value(stInQAmber.Text) / 100,
                                                           'Red utilisation from': Value(stInQRed.Text) / 100 });
                                                   // The quarter is found by the flag, never by the
                                                   // label this save is rewriting.
                                                   Patch(Quarters, LookUp(Quarters, 'Current quarter' = true),
                                                         { Label: stInQLabel.Text,
                                                           'Sprint 1 started': DateValue(stInQEpoch.Text),
                                                           'Sprint length (days)': Value(stInQSprintDays.Text),
                                                           'Benefit year': Value(stInQBenefitYear.Text),
                                                           'Target FTE released': Value(stInQTargetFte.Text),
                                                           'Target benefit': Value(stInQTargetGbp.Text) }),
                                                   Set(varSetProblem, FirstError.Message),
                                                   Concurrent(ClearCollect(colSettings, [@Settings]),
                                                              ClearCollect(colQuarters, Quarters));
                                                   Set(varSetProblem, "");
                                                   Notify("The quarter and the settings are saved.",
                                                          NotificationType.Success)))

