                                                      Default: =Text(DefaultModifier * 100, "[$-en-US]#,##0")
                                                      Font: =FontUI
                                                      Size: =TypeBodyPx
                                                      Color: =NeutralFg1
                                                      BasePaletteColor: =BrandBg
                                                      AccessibleLabel: ="Default modifier (%)"
                                                      Appearance: =Appearance.Outline
                                                      Fill: =NeutralBg1
                                          - stFldQLeadMod:
