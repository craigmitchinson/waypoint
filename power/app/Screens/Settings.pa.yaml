                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.End
                                          LayoutGap: =Gap
                                        Children:
                                          - stLinksSave:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Primary
                                                BasePaletteColor: =BrandBg
                                                Color: =BrandFg
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Width: =Max(Parent.Width * 0.13, 220)
                                                Height: =ControlHeight
                                                Text: ="Save"
                                                AccessibleLabel: ="Save"
                                                OnSelect: |
                                                  =IfError(
                                                   Patch([@Settings], First([@Settings]),
                                                         { 'Jira Align base URL': stInLAlign.Text,
                                                           'Jira base URL': stInLJira.Text }),
                                                   Set(varSetProblem, FirstError.Message),
                                                   ClearCollect(colSettings, [@Settings]);
                                                   Set(varSetProblem, "");
                                                   Notify("The links are saved.", NotificationType.Success))

                              - stData:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    Visible: =SettingsTab = "Data"
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =8
                                  Children:
                                    - stDataNote:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeBodyLine
                                          Text: |
                                            ="Import a Workday absence report or a Jira issue export. Reading the file is a flow at work."
                                          Size: =TypeCaption
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                          FontWeight: =FontWeight.Normal
                                    - stDataActions:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
                                          FillPortions: =0
                                          Height: =ControlHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutGap: =Gap
                                        Children:
                                          - stDataImport:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                BasePaletteColor: =NeutralBg1
                                                Color: =NeutralFg1
                                                Font: =FontUI
                                                Size: =TypeBodyPx
                                                RadiusTopLeft: =CtrlR
                                                RadiusTopRight: =CtrlR
                                                RadiusBottomLeft: =CtrlR
                                                RadiusBottomRight: =CtrlR
                                                Width: =Max(Len("Import data") * 7 + 24, 120)
                                                Height: =ControlHeight
                                                Text: ="Import data"
                                                AccessibleLabel: ="Import data"
                                                OnSelect: =Navigate(scrImport, ScreenTransition.None)

                              - stActivity:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    FillPortions: =1
                                    Visible: =SettingsTab = "Activity"
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =8
                                  Children:
                                    - stActivitySearchBox:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutOverflowX: =LayoutOverflow.Hide
                                          LayoutOverflowY: =LayoutOverflow.Hide
