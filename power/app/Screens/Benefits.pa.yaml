                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Fill: =If(Mod(6, 2) = 1, NeutralBg2, NeutralBg1)
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - bnCalFootM7:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * BnCalShareTitle, BnCalMinTitle)
                                             + Max(Parent.Width * BnCalShareMonth, BnCalMinMonth) * 6
                                          Y: =0
                                          Width: =Max(Parent.Width * BnCalShareMonth, BnCalMinMonth) - 6
                                          Height: =RowHeight
                                          Text: |
                                            =If(BenefitsMeasure = "FTE",
                                                Text(LookUp(BenefitsCalendarFooter, Num = 7).FteLive, "[$-en-US]#,##0.0"),
                                                "£" & Text(LookUp(BenefitsCalendarFooter, Num = 7).Gbp, "[$-en-US]#,##0"))
                                          Size: =TypeCaption
