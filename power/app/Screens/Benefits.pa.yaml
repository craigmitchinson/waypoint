                                             + Max(Parent.Width * BnCalShareMonth, BnCalMinMonth) * 8
                                          Y: =0
                                          Width: =Max(Parent.Width * BnCalShareMonth, BnCalMinMonth) - 6
                                          Height: =RowHeight
                                          Text: |
                                            =If(BenefitsMeasure = "FTE",
                                                Text(LookUp(BenefitsCalendarFooter, Num = 9).FteLive, "[$-en-US]#,##0.0"),
                                                "£" & Text(LookUp(BenefitsCalendarFooter, Num = 9).Gbp, "[$-en-US]#,##0"))
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
