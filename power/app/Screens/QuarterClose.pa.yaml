                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0

                              - qcOutlookEmpty:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =TypeBodyLine
                                    Align: =Align.Left
                                    Visible: =QcTab = "Outlook" && CountRows(OutlookRows) = 0
                                    Text: ="No squads to show an outlook for."
                                    Size: =TypeBody
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0

                              - qcOutlook:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    TemplatePadding: =0
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Width: =Max(Parent.Width, QcOuMinW)
                                    ShowScrollbar: =true
                                    FillPortions: =1
                                    Visible: =QcTab = "Outlook" && CountRows(OutlookRows) > 0
                                    Items: =OutlookRows
                                    TemplateSize: =RowHeight
                                    AccessibleLabel: |
                                      ="Outlook: each squad's net capacity, what is held and what is "
                                       & "already in the plan, for this quarter and the two after it."
                                  Children:
                                    - qcOuRowSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: |
                                            =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad) - 8
                                          Height: =RowHeight
                                          Text: =ThisItem.Squad
                                          Size: =TypeBody
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcOuRowQuarter:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad)
                                          Y: =0
                                          Width: |
                                            =Max(Parent.TemplateWidth * QcOuShareQuarter, QcOuMinQuarter) - 8
                                          Height: =RowHeight
                                          Text: =ThisItem.Quarter
                                          Size: =TypeBody
                                          Font: =FontUI
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: |
                                            =If(ThisItem.Quarter = CurrentQuarter.Label,
                                                NeutralFg1, NeutralFg2)
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcOuRowNet:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.TemplateWidth * QcOuShareQuarter, QcOuMinQuarter)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * QcOuShareNet, QcOuMinNet) - 8
                                          Height: =RowHeight
                                          Text: =Text(ThisItem.Net, "[$-en-US]#,##0.0")
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcOuRowReserved:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.TemplateWidth * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.TemplateWidth * QcOuShareNet, QcOuMinNet)
                                          Y: =0
                                          Width: |
                                            =Max(Parent.TemplateWidth * QcOuShareReserved, QcOuMinReserved) - 8
                                          Height: =RowHeight
                                          Text: =Text(ThisItem.Reserved, "[$-en-US]#,##0.0")
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcOuRowInPlan:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.TemplateWidth * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.TemplateWidth * QcOuShareNet, QcOuMinNet)
                                             + Max(Parent.TemplateWidth * QcOuShareReserved, QcOuMinReserved)
                                          Y: =0
                                          Width: |
                                            =Max(Parent.TemplateWidth * QcOuShareInPlan, QcOuMinInPlan) - 8
                                          Height: =RowHeight
                                          Text: =Text(ThisItem.InPlan, "[$-en-US]#,##0.0")
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcOuRowRemaining:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.TemplateWidth * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.TemplateWidth * QcOuShareNet, QcOuMinNet)
                                             + Max(Parent.TemplateWidth * QcOuShareReserved, QcOuMinReserved)
                                             + Max(Parent.TemplateWidth * QcOuShareInPlan, QcOuMinInPlan)
                                          Y: =0
                                          Width: |
                                            =Max(Parent.TemplateWidth * QcOuShareRemaining, QcOuMinRemaining) - 8
                                          Height: =RowHeight
                                          Text: |
                                            =Text(ThisItem.Remaining, "[$-en-US]#,##0.0") & " · "
                                             & If(ThisItem.Remaining < 0, "over", "free")
                                          Size: =TypeBody
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          # Toned by the row's own utilisation against NumberTones' "utilisation"
                                          # row (power/RUNBOOK.md, "Number tones"; per-row inline pattern from
                                          # Formulas.pa.yaml's NumberTones region).
                                          Color: |
                                            =With({ t: LookUp(NumberTones, Metric = "utilisation"),
                                                    v: If(Coalesce(ThisItem.Net, 0) = 0, 0,
                                                          (Coalesce(ThisItem.Net, 0) - Coalesce(ThisItem.Remaining, 0)) / ThisItem.Net) },
                                                If(t.HigherIsWorse,
                                                   If(v >= t.BadAt, ToneBad,
                                                      If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                                                   If(v <= t.BadAt, ToneBad,
                                                      If(v <= t.WarnAt, ToneWarn, ToneNeutral))))
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true

                              # ---- Archive: what every close has put on the record ----
                              - qcArchiveHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width, QcArMinW)
