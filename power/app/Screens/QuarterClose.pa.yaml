                                    - qcArHeadStatus:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcArShareTitle, QcArMinTitle)
                                             + Max(Parent.Width * QcArShareQuarter, QcArMinQuarter)
                                             + Max(Parent.Width * QcArShareId, QcArMinId)
                                             + Max(Parent.Width * QcArShareEpic, QcArMinEpic)
                                             + Max(Parent.Width * QcArShareSquad, QcArMinSquad)
                                             + Max(Parent.Width * QcArShareState, QcArMinState)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcArShareStatus, QcArMinStatus) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Delivery status"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcArHeadSize:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcArShareTitle, QcArMinTitle)
                                             + Max(Parent.Width * QcArShareQuarter, QcArMinQuarter)
                                             + Max(Parent.Width * QcArShareId, QcArMinId)
