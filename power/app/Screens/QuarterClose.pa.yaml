                                          Size: =TypeBody
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                                    - qcHiRowPred:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * QcHiShareQuarter, QcHiMinQuarter)
                                             + Max(Parent.TemplateWidth * QcHiShareNet, QcHiMinNet)
                                             + Max(Parent.TemplateWidth * QcHiShareInPlan, QcHiMinInPlan)
                                             + Max(Parent.TemplateWidth * QcHiShareDeliv, QcHiMinDeliv)
                                             + Max(Parent.TemplateWidth * QcHiShareFte, QcHiMinFte)
                                             + Max(Parent.TemplateWidth * QcHiShareGbp, QcHiMinGbp)
                                             + Max(Parent.TemplateWidth * QcHiShareLoad, QcHiMinLoad)
                                          Y: =0
                                          Width: =Max(Parent.TemplateWidth * QcHiSharePred, QcHiMinPred) - 8
                                          Height: =TypeBodyLine + TypeLabelLine + 8
                                          Text: =Round(ThisItem.Predictability * 100, 0) & "%"
                                          Size: =TypeBody
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          # Predictability (delivered against plan) is the History table's
                                          # on-time-style measure: good at 100%, warn under 80%, bad under 60%.
                                          # No NumberTones row fits these thresholds, so the tones are inline
                                          # against the same table's colours (power/RUNBOOK.md, "Number tones").
                                          Color: |
                                            =With({ v: ThisItem.Predictability },
                                                If(v >= 1, ToneGood,
                                                   If(v < 0.6, ToneBad,
                                                      If(v < 0.8, ToneWarn, ToneNeutral))))
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true

                              # ---- Outlook: each squad over this quarter and the two after it ----
                              - qcOutlookHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width, QcOuMinW)
                                    Height: =RowHeight
                                    Visible: =QcTab = "Outlook"
                                  Children:
                                    - qcOuHeadSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Squad"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcOuHeadQuarter:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcOuShareQuarter, QcOuMinQuarter) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Quarter"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcOuHeadNet:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.Width * QcOuShareQuarter, QcOuMinQuarter)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcOuShareNet, QcOuMinNet) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Net MW"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcOuHeadReserved:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.Width * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.Width * QcOuShareNet, QcOuMinNet)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcOuShareReserved, QcOuMinReserved) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Reserved"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcOuHeadInPlan:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.Width * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.Width * QcOuShareNet, QcOuMinNet)
                                             + Max(Parent.Width * QcOuShareReserved, QcOuMinReserved)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcOuShareInPlan, QcOuMinInPlan) - 8
                                          Height: =TypeLabelLine
                                          Text: ="In plan"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcOuHeadRemaining:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcOuShareSquad, QcOuMinSquad)
                                             + Max(Parent.Width * QcOuShareQuarter, QcOuMinQuarter)
                                             + Max(Parent.Width * QcOuShareNet, QcOuMinNet)
                                             + Max(Parent.Width * QcOuShareReserved, QcOuMinReserved)
                                             + Max(Parent.Width * QcOuShareInPlan, QcOuMinInPlan)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: |
                                            =Max(Parent.Width * QcOuShareRemaining, QcOuMinRemaining) - 8
                                          Height: =TypeLabelLine
