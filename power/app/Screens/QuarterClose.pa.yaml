                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcArHeadEpic:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcArShareTitle, QcArMinTitle)
                                             + Max(Parent.Width * QcArShareQuarter, QcArMinQuarter)
                                             + Max(Parent.Width * QcArShareId, QcArMinId)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcArShareEpic, QcArMinEpic) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Epic"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcArHeadSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcArShareTitle, QcArMinTitle)
                                             + Max(Parent.Width * QcArShareQuarter, QcArMinQuarter)
                                             + Max(Parent.Width * QcArShareId, QcArMinId)
                                             + Max(Parent.Width * QcArShareEpic, QcArMinEpic)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcArShareSquad, QcArMinSquad) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Squad"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - qcArHeadState:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * QcArShareTitle, QcArMinTitle)
                                             + Max(Parent.Width * QcArShareQuarter, QcArMinQuarter)
                                             + Max(Parent.Width * QcArShareId, QcArMinId)
                                             + Max(Parent.Width * QcArShareEpic, QcArMinEpic)
                                             + Max(Parent.Width * QcArShareSquad, QcArMinSquad)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * QcArShareState, QcArMinState) - 8
                                          Height: =TypeLabelLine
                                          Text: ="State at close"
