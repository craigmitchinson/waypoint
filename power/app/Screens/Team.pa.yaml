                                                X: =Max(Parent.Width * TeamSqShareName, TeamSqMinName)
                                                Y: =(RowHeight - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamSqShareLead, TeamSqMinLead) - 8
