                                                Y: =2
                                                Width: =Parent.Width - 4
                                                Height: =Parent.Height - 4
                                                Text: =""
                                                Fill: =RGBA(0, 0, 0, 0)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                FocusedBorderThickness: =2
                                                TabIndex: =0
                                                Tooltip: |
                                                  ="Edit " & ThisItem.Name
                                                FocusedBorderColor: =FocusStroke
                                                OnSelect: |
                                                  =Set(varPersonEdit,
                                                       LookUp(People, 'Full name' = ThisItem.Name));
                                                   Set(varPersonSaveError, "");
                                                   Set(varPersonFormOpen, true);
                                                   Set(varTeamFormTried, false);
