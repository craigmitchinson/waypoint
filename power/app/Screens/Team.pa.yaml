            - tmLblModifier:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 6
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Modifier override (per cent)"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldModifier:
                Control: ModernTextInput@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 6 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Default: =FormPersonModifier
                  Placeholder: ="Blank takes the default modifier"
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Modifier override (per cent)"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmLblLead:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 7
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Lead"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldLead:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 7 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =SettingsYesNo
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:FormPersonLead}
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Lead"
                  Appearance: =Appearance.Outline
