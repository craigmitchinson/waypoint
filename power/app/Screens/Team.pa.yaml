                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmSqRowPeople:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamSqShareName, TeamSqMinName)
                                                   + Max(Parent.Width * TeamSqShareLead, TeamSqMinLead)
                                                   + Max(Parent.Width * TeamSqShareRemit, TeamSqMinRemit)
