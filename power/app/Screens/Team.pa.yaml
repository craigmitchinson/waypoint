                                                Width: =Max(Parent.Width * TeamSqShareName, TeamSqMinName) - 8
                                                Height: =TypeBodyLine
                                                Text: =ThisItem.Name
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmSqRowLead:
                                              Control: Label@2.5.1
