                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmAbHeadTo:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                             + Max(Parent.Width * TeamAbShareType, TeamAbMinType)
                                             + Max(Parent.Width * TeamAbShareFrom, TeamAbMinFrom)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamAbShareTo, TeamAbMinTo) - 8
                                          Height: =TypeLabelLine
                                          Text: ="To"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmAbHeadNote:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                             + Max(Parent.Width * TeamAbShareType, TeamAbMinType)
                                             + Max(Parent.Width * TeamAbShareFrom, TeamAbMinFrom)
                                             + Max(Parent.Width * TeamAbShareTo, TeamAbMinTo)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamAbShareNote, TeamAbMinNote) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Note"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - tmAbsencesEmpty:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =Parent.Width
                                    Height: =TypeBodyLine
                                    Align: =Align.Left
                                    Visible: =TeamTab = "Absences" && CountRows(TeamAbsenceRowsAll) = 0
                                    Text: ="No absences recorded."
                                    Size: =TypeBody
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0

                              - tmAbsences:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    TemplatePadding: =0
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Width: =Max(Parent.Width, TeamAbsenceColsW)
                                    ShowScrollbar: =true
                                    FillPortions: =0
                                    Height: =Parent.Height - Pad * 2 - RowHeight - TypeLabelLine - 8 * 2
                                    Visible: =TeamTab = "Absences" && CountRows(TeamAbsenceRowsAll) > 0
                                    Items: =TeamAbsenceRowsAll
                                    TemplateSize: =RowHeight
                                    AccessibleLabel: |
                                      ="Absences: every absence on the record, most recent first, "
                                       & "by person, type and dates."
                                  Children:
                                    - tmAbsenceRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =RowHeight
                                        Children:
                                          - tmAbRowPerson:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: =0
                                                Y: =(RowHeight - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson) - 8
                                                Height: =TypeBodyLine
                                                Text: =ThisItem.PersonName
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmAbRowType:
                                              Control: Badge@0.0.24
                                              Properties:
                                                X: =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Min(Max(Len(ThisItem.TypeName) * 7 + 20, 56), 200)
                                                Height: =TypeLabelLine
                                                Appearance: ='BadgeCanvas.Appearance'.Filled
                                                Shape: ='BadgeCanvas.Shape'.Rounded
                                                ThemeColor: =If(ThisItem.Sick, 'BadgeCanvas.ThemeColor'.Warning, 'BadgeCanvas.ThemeColor'.Subtle)
                                                Content: =ThisItem.TypeName
                                                FontSize: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Center
                                                VerticalAlign: =VerticalAlign.Middle
                                          - tmAbRowFrom:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                                   + Max(Parent.Width * TeamAbShareType, TeamAbMinType)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamAbShareFrom, TeamAbMinFrom) - 8
                                                Height: =TypeLabelLine
                                                Text: =Text(ThisItem.From, "[$-en-US]dd mmm yyyy")
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmAbRowTo:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                                   + Max(Parent.Width * TeamAbShareType, TeamAbMinType)
                                                   + Max(Parent.Width * TeamAbShareFrom, TeamAbMinFrom)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamAbShareTo, TeamAbMinTo) - 8
                                                Height: =TypeLabelLine
                                                Text: =Text(ThisItem.To, "[$-en-US]dd mmm yyyy")
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmAbRowNote:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamAbSharePerson, TeamAbMinPerson)
                                                   + Max(Parent.Width * TeamAbShareType, TeamAbMinType)
                                                   + Max(Parent.Width * TeamAbShareFrom, TeamAbMinFrom)
                                                   + Max(Parent.Width * TeamAbShareTo, TeamAbMinTo)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamAbShareNote, TeamAbMinNote) - 8
                                                Height: =TypeLabelLine
                                                Text: =Coalesce(ThisItem.Note, "—")
                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0

                                          # The row's hit target, last so it draws over the
                                          # cells: a transparent button, the people table's own
                                          # pattern. It opens the panel on this one absence, off
                                          # the table rather than the collection, because Patch
                                          # and Remove take a row of the data source.
                                          - tmAbRowHit:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                X: =2
                                                Y: =2
                                                Width: =Parent.Width - 4
                                                Height: =Parent.Height - 4
                                                Text: =""
                                                Fill: =RGBA(0, 0, 0, 0)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                FocusedBorderThickness: =2
                                                TabIndex: =0
                                                Tooltip: ="Edit this absence"
                                                FocusedBorderColor: =FocusStroke
                                                OnSelect: |
                                                  =Set(varAbsEdit,
                                                       LookUp(Absences,
                                                              'Absence id' = ThisItem.'Absence id'));
                                                   Set(varAbsSaveError, "");
                                                   Set(varAbsFromPicked, false);
                                                   // The week each dropdown opens on, the same
                                                   // default its Default property computes: a
                                                   // named formula cannot read a control, so
                                                   // these are what FormAbsenceFromMonday and
                                                   // FormAbsenceToMonday read instead.
                                                   Set(varAbsFromWeek, FormAbsenceFromWeek);
                                                   Set(varAbsToWeek, FormAbsenceToWeek);
                                                   Set(varAbsOpen, true);
                                                   Set(varTeamFormTried, false);
                                                   // every input starts from its Default, not
                                                   // the last open
                                                   Reset(tmAbsScope);
                                                   Reset(tmAbsPeople);
                                                   Reset(tmAbsType);
                                                   Reset(tmAbsFrom);
                                                   Reset(tmAbsTo);
                                                   Reset(tmAbsNote)

                              # ---- the count under whichever table is showing ----
                              - tmCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeLabelLine
                                    Text: =TeamCountLine
                                    Size: =TypeCaption
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FontWeight: =FontWeight.Normal


      # ---- the person form: the scrim, then the panel over the right of the screen ----
      # The pattern every later form repeats (power/RUNBOOK.md, section 4, "Forms"): a scrim
      # whose transparent button closes the panel, a manual-layout panel whose fields stack at
      # FormFieldStep, one error line, and Save with Cancel beside it.
      - tmScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.4)
            Visible: =varPersonFormOpen
          Children:
            # A container takes no OnSelect (Studio PA2108), so the scrim's own dismiss is a
            # transparent button over the whole of it.
            - tmScrimHit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.Width - 4
                  Height: =Parent.Height - 4
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  TabIndex: =0
                  Tooltip: ="Close the person form"
                  FocusedBorderColor: =FocusStroke
                  OnSelect: =Set(varPersonFormOpen, false)
      - tmPersonPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Width: =Max(Parent.Width * 0.32, 420)
            Height: =Parent.Height
            X: =Parent.Width - Max(Parent.Width * 0.32, 420)
            Y: =0
            Fill: =NeutralBg1
            BorderColor: =NeutralStroke1
            BorderThickness: =1
            Visible: =varPersonFormOpen
          Children:
            - tmPersonTitle:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Pad
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeDisplayLine
                  Text: =FormTitle
                  Size: =TypeSubtitle
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg1
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - tmPersonClose:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Parent.Width - Pad - ControlHeight
                  Y: =Pad
                  Width: =ControlHeight
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Icon: ="Dismiss"
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: =""
                  AccessibleLabel: ="Close"
                  Tooltip: ="Close the person form without saving"
                  Size: =TypeBodyPx
                  OnSelect: =Set(varPersonFormOpen, false)
            - tmLblName:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 0
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Full name"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldName:
                Control: ModernTextInput@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 0 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Default: =FormPersonName
                  Placeholder: ="The name the roster uses"
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Full name"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmLblRole:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 1
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Role"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
