                                                Size: =TypeCaption
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg2
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # Filled, not tinted: on the tinted row a tinted neutral badge has no contrast
                                          # left (power/RUNBOOK.md, "Table columns").
                                          - tmRowLead:
                                              Control: Badge@0.0.24
                                              Properties:
                                                X: =Max(Parent.Width * TeamShareName, TeamMinName)
                                                Y: =(TeamPeopleRowH - TypeLabelLine) / 2
                                                Width: =Min(Max(Len("Lead") * 7 + 20, 56), 200)
                                                Height: =TypeLabelLine
                                                Visible: =ThisItem.Lead
                                                Appearance: ='BadgeCanvas.Appearance'.Filled
                                                Shape: ='BadgeCanvas.Shape'.Rounded
                                                ThemeColor: ='BadgeCanvas.ThemeColor'.Brand
                                                Content: ="Lead"
                                                FontSize: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Center
                                                VerticalAlign: =VerticalAlign.Middle
                                          # A squad is a name, not a command: the row container carries the navigation.
                                          - tmRowSquad:
                                              Control: Label@2.5.1
