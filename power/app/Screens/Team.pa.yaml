                                                X: |
                                                  =Max(Parent.Width * TeamSqShareName, TeamSqMinName)
                                                   + Max(Parent.Width * TeamSqShareLead, TeamSqMinLead)
                                                   + Max(Parent.Width * TeamSqShareRemit, TeamSqMinRemit)
                                                   + Max(Parent.Width * TeamSqSharePeople, TeamSqMinPeople)
                                                Y: =(RowHeight - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamSqShareNet, TeamSqMinNet) - 8
                                                Height: =TypeBodyLine
                                                Text: =Text(ThisItem.Net, "[$-en-US]#,##0.00")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmSqRowCommitted:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamSqShareName, TeamSqMinName)
                                                   + Max(Parent.Width * TeamSqShareLead, TeamSqMinLead)
                                                   + Max(Parent.Width * TeamSqShareRemit, TeamSqMinRemit)
                                                   + Max(Parent.Width * TeamSqSharePeople, TeamSqMinPeople)
                                                   + Max(Parent.Width * TeamSqShareNet, TeamSqMinNet)
                                                Y: =(RowHeight - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamSqShareCommitted, TeamSqMinCommitted) - 8
                                                Height: =TypeBodyLine
                                                Text: =Text(ThisItem.Committed, "[$-en-US]#,##0.00")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: |
                                                  =With({ t: LookUp(NumberTones, Metric = "utilisation"),
                                                          v: If(ThisItem.Net = 0, 0, ThisItem.Committed / ThisItem.Net) },
                                                      If(t.HigherIsWorse,
                                                         If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                                                         If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))))
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          # The utilisation reads as a figure first: the colour is the threshold from
                                          # Settings, never the state on its own. No state word, so the text
                                          # never contradicts NumberTones, the swatch's own source.
                                          - tmSqRowUtil:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamSqShareName, TeamSqMinName)
                                                   + Max(Parent.Width * TeamSqShareLead, TeamSqMinLead)
                                                   + Max(Parent.Width * TeamSqShareRemit, TeamSqMinRemit)
                                                   + Max(Parent.Width * TeamSqSharePeople, TeamSqMinPeople)
                                                   + Max(Parent.Width * TeamSqShareNet, TeamSqMinNet)
                                                   + Max(Parent.Width * TeamSqShareCommitted, TeamSqMinCommitted)
                                                Y: =(RowHeight - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamSqShareUtil, TeamSqMinUtil) - 8
                                                Height: =TypeLabelLine
                                                Text: =Round(ThisItem.Utilisation * 100, 0) & "%"
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: |
                                                  =With({ t: LookUp(NumberTones, Metric = "utilisation"),
                                                          v: ThisItem.Utilisation },
                                                      If(t.HigherIsWorse,
                                                         If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                                                         If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))))
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmSquadRowHit:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                X: =2
                                                Y: =2
                                                Width: =Parent.Width - 4
                                                Height: =Parent.Height - 4
                                                Text: =""
                                                Fill: =RGBA(0, 0, 0, 0)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                FocusedBorderThickness: =2
                                                TabIndex: =0
                                                Tooltip: |
                                                  =ThisItem.Name & ", " & ThisItem.People & " people, "
                                                   & Round(ThisItem.Utilisation * 100, 0) & " per cent committed"
