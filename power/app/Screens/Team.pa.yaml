                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 3
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Team grade"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
