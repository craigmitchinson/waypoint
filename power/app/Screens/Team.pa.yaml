            - tmLblEmployment:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 8
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Employment"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldEmployment:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 8 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormEmploymentOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:FormPersonEmployment}
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Employment"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmLblSkills:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 9
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Skills"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldSkills:
                Control: ModernCombobox@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 9 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =ItemSkillOptions
                  ItemDisplayText: =ThisItem.Value
                  SelectMultiple: =true
                  DefaultSelectedItems: =Filter(ItemSkillOptions, Value in FormPersonSkills)
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Skills"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            # The one place a fault is said: the rules while the form is open, and whatever
            # Dataverse answered if a save was refused.
            - tmPersonError:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 9 + TypeLabelLine + 4 + ControlHeight + Gap
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Visible: =varTeamFormTried && Self.Text <> ""
                  Text: |
                    =If(!IsBlank(varPersonSaveError), varPersonSaveError,
                        IsBlank(Trim(tmFieldName.Text)), "A name is required.",
                        IsBlank(tmFieldRole.Selected.Value), "A role is required.",
                        !IsBlank(Trim(tmFieldDpw.Text))
                        && (!IsNumeric(tmFieldDpw.Text)
                            || Value(tmFieldDpw.Text) < 1 || Value(tmFieldDpw.Text) > 5),
                        "Days per week is 1 to 5.",
                        !IsBlank(Trim(tmFieldModifier.Text))
                        && (!IsNumeric(tmFieldModifier.Text)
                            || Value(tmFieldModifier.Text) < 0 || Value(tmFieldModifier.Text) > 100),
                        "The modifier is 0 to 100 per cent.", "")
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =StatusBad
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - tmPersonSave:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =BrandBg
                  Color: =BrandFg
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Save"
                  AccessibleLabel: =FormTitle
                  DisplayMode: |
                    =If(varTeamFormTried && tmPersonError.Text <> "",
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =Set(varTeamFormTried, true);
                     Set(varPersonSaveError, "");
                     // The rules first: nothing is written while the error line has anything to
                     // say. Only the Patch sits inside the error test, so a refused save cannot
                     // close the panel or say it worked.
                     If(tmPersonError.Text = "",
                        IfError(
                          Patch(People,
                                If(IsBlank(varPersonEdit), Defaults(People), varPersonEdit),
                                { 'Full name': Trim(tmFieldName.Text),
                                  Role: Coalesce(tmFieldRole.Selected.Value, FormPersonRole),
                                  Squad: LookUp(Squads,
                                                'Squad name' = tmFieldSquad.Selected.Value),
                                  'Team grade':
                                      With({ g: Coalesce(tmFieldGrade.Text, FormPersonGrade) },
                                          If(IsBlank(g), Blank(),
                                             Switch(g,
                                                    "C", 'Team grade (People)'.C,
                                                    "D", 'Team grade (People)'.D,
                                                    "E", 'Team grade (People)'.E,
                                                    "F", 'Team grade (People)'.F,
                                                    Blank()))),
                                  Region: LookUp(Filter('List values',
                                                        List = 'List (List values)'.Region),
                                                 Value = tmFieldRegion.Selected.Value),
                                  Employment:
                                      If(IsBlank(tmFieldEmployment.Selected.Value), Blank(),
                                         Switch(tmFieldEmployment.Selected.Value,
                                                "Permanent", 'Employment (People)'.Permanent,
                                                "NPW", 'Employment (People)'.NPW,
                                                "Open vacancy",
                                                'Employment (People)'.'Open vacancy',
                                                Blank())),
                                  Lead: tmFieldLead.Selected.Value = "Yes",
                                  'Days per week': If(IsBlank(Trim(tmFieldDpw.Text)), Blank(),
                                                      Value(tmFieldDpw.Text)),
                                  'Modifier override':
                                      If(IsBlank(Trim(tmFieldModifier.Text)), Blank(),
                                         Value(tmFieldModifier.Text) / 100),
                                  Skills: Concat(tmFieldSkills.SelectedItems, Value, Char(10)) }),
                          // A refused save says what Dataverse answered and leaves the panel open.
                          Set(varPersonSaveError, FirstError.Message),
                          // The collection the screens read is rebuilt from the table, as the work
                          // item actions do, and only then does the panel close.
                          ClearCollect(colPeople, People);
                          Set(varPersonFormOpen, false);
                          Notify(Trim(tmFieldName.Text) & " saved.",
                                 NotificationType.Success)))
            - tmPersonCancel:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad + (Parent.Width - Pad * 2 - Gap) / 2 + Gap
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Cancel"
                  AccessibleLabel: ="Close the person form without saving"
                  OnSelect: =Set(varPersonFormOpen, false)

      # ---- the absence panel: the scrim, then the panel over the right of the screen ----
      # Non-work time of every sort is entered here, for one person or for many at once: the
      # scope dropdown fills the people box, and the save writes one Absences row per person.
      # The person form's pattern, field for field (power/RUNBOOK.md, section 4, "Forms").
      - tmAbsScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.4)
            Visible: =varAbsOpen
          Children:
            # A container takes no OnSelect (Studio PA2108), so the scrim's own dismiss is a
            # transparent button over the whole of it.
            - tmAbsScrimHit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.Width - 4
                  Height: =Parent.Height - 4
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  TabIndex: =0
                  Tooltip: ="Close the absence panel"
                  FocusedBorderColor: =FocusStroke
                  OnSelect: =Set(varAbsEdit, Blank()); Set(varAbsOpen, false)
      - tmAbsPanel:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Width: =Max(Parent.Width * 0.32, 420)
            Height: =Parent.Height
            X: =Parent.Width - Max(Parent.Width * 0.32, 420)
            Y: =0
            Fill: =NeutralBg1
            BorderColor: =NeutralStroke1
            BorderThickness: =1
            Visible: =varAbsOpen
          Children:
            - tmAbsTitle:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Pad
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeDisplayLine
                  Text: =FormAbsenceTitle
                  Size: =TypeSubtitle
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg1
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - tmAbsClose:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Parent.Width - Pad - ControlHeight
                  Y: =Pad
                  Width: =ControlHeight
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Icon: ="Dismiss"
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: =""
                  AccessibleLabel: ="Close"
                  Tooltip: ="Close the absence panel without saving"
                  Size: =TypeBodyPx
                  OnSelect: =Set(varAbsEdit, Blank()); Set(varAbsOpen, false)
            - tmAbsLblScope:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 0
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Who this is for"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            # The scope saves nothing of its own: it fills the box below, which the planner can
            # then add to or take from. Picking one resets that box so the new set is what it
            # opens on.
            - tmAbsScope:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 0 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormAbsenceScopeOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:"Choose people"}
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Who this absence is for"
                  DisplayMode: |
                    =If(FormAbsenceEditing, DisplayMode.View, DisplayMode.Edit)
                  OnChange: =Reset(tmAbsPeople)
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmAbsLblPeople:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 1
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="People"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            # Onshore is England, Wales, Scotland and Northern Ireland, off the Region list value
            # each person carries; offshore is everyone else who has a region at all.
            - tmAbsPeople:
                Control: ModernCombobox@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 1 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormAbsencePeopleOptions
                  ItemDisplayText: =ThisItem.Value
                  SelectMultiple: =true
                  DefaultSelectedItems: |
                    =Switch(tmAbsScope.Selected.Value,
                            "Everyone", FormAbsencePeopleOptions,
                            "Onshore", Filter(FormAbsencePeopleOptions, Onshore),
                            "Offshore", Filter(FormAbsencePeopleOptions, !Onshore),
                            "Choose people", Filter(FormAbsencePeopleOptions,
                                                    Value = FormAbsencePerson),
                            Filter(FormAbsencePeopleOptions,
                                   Squad = tmAbsScope.Selected.Value))
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="People this absence is for"
                  DisplayMode: |
                    =If(FormAbsenceEditing, DisplayMode.View, DisplayMode.Edit)
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmAbsLblType:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 2
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Type"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmAbsType:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 2 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormAbsenceTypeOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:FormAbsenceType}
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Absence type"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmAbsLblFrom:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 3
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="From week"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            # There is no date picker in this build, so the dates are weeks: each row carries its
            # own Monday and the save patches that Monday to the Friday of the To week.
            - tmAbsFrom:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 3 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormAbsenceWeekOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: =LookUp(FormAbsenceWeekOptions, Value = FormAbsenceFromWeek)
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="From week"
                  OnChange: =Set(varAbsFromPicked, true); Set(varAbsFromWeek, tmAbsFrom.Selected.Value); Reset(tmAbsTo)
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmAbsLblTo:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 4
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="To week"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            # To defaults to From: picking a From week resets this one onto it, and a row being
            # edited opens on its own two weeks until From is touched.
            - tmAbsTo:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 4 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormAbsenceWeekOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: |
                    =If(varAbsFromPicked, tmAbsFrom.Selected,
                        LookUp(FormAbsenceWeekOptions, Value = FormAbsenceToWeek))
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="To week"
                  OnChange: =Set(varAbsToWeek, tmAbsTo.Selected.Value)
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmAbsLblNote:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 5
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Note"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmAbsNote:
                Control: ModernTextInput@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 5 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Default: =FormAbsenceNote
                  Placeholder: ="What the time is for"
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Note"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            # The days each person loses: the working days between the two weeks, less the bank
            # holidays of the first person picked, who is the only region the panel can name.
            - tmAbsDays:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormAbsenceDaysY
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: |
                    =With({ f: FormAbsenceFromMonday,
                            t: DateAdd(FormAbsenceToMonday, 4, TimeUnit.Days),
                            rg: LookUp(colPeople,
                                       'Full name'
                                         = First(tmAbsPeople.SelectedItems).Value).Region.Value },
                         With({ wd: CountRows(Filter(DayGrid, IsWork, D >= f, D <= t)),
                                bh: CountRows(Filter(BankHolidayDayRows, RegionName = rg,
                                                     D >= f, D <= t)) },
                             Text(Max(0, wd - bh), "[$-en-US]#,##0")
                             & " working days per person, "
                             & Text(f, "ddd d mmm") & " to " & Text(t, "ddd d mmm")
                             & If(bh > 0,
                                  " · " & Text(bh, "[$-en-US]#,##0") & " bank holiday"
                                  & If(bh = 1, "", "s") & " in " & rg, "")))
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            # A row being edited can be taken off the record here; a new absence has nothing to
            # remove.
            - tmAbsRemove:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =FormAbsenceRemoveY
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =StatusBad
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Visible: =FormAbsenceEditing
                  Text: ="Remove this absence"
                  AccessibleLabel: ="Remove this absence"
                  OnSelect: |
                    =Set(varTeamFormTried, true);
                     Set(varAbsSaveError, "");
                     // Only the Remove is inside the error test: a refused delete leaves the row,
                     // the panel and the message where they are.
                     IfError(
                       Remove(Absences, varAbsEdit),
                       Set(varAbsSaveError, FirstError.Message),
                       ClearCollect(colAbsences, Absences);
                       Set(varAbsEdit, Blank());
                       Set(varAbsOpen, false);
                       Notify("Absence removed.", NotificationType.Success))
            # The one place a fault is said: the rules while the panel is open, and whatever
            # Dataverse answered if a save was refused.
            - tmAbsError:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormAbsenceErrorY
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Visible: =varTeamFormTried && Self.Text <> ""
                  Text: |
                    =If(!IsBlank(varAbsSaveError), varAbsSaveError,
                        CountRows(tmAbsPeople.SelectedItems) = 0,
                        "At least one person is required.",
                        IsBlank(tmAbsType.Selected.Value), "A type is required.",
                        IsBlank(FormAbsenceFromMonday)
                        || IsBlank(FormAbsenceToMonday),
                        "A From week and a To week are required.",
                        FormAbsenceToMonday < FormAbsenceFromMonday,
                        "The To week cannot be before the From week.",
                        "")
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =StatusBad
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - tmAbsSave:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =BrandBg
                  Color: =BrandFg
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Save"
                  AccessibleLabel: =FormAbsenceTitle
                  DisplayMode: |
                    =If(varTeamFormTried && tmAbsError.Text <> "",
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =Set(varTeamFormTried, true);
                     Set(varAbsSaveError, "");
                     // The rules first, then the write on its own inside the error test: a
                     // refused save leaves the panel open and says what Dataverse answered.
                     If(tmAbsError.Text = "",
                      IfError(
                       With({ f: FormAbsenceFromMonday,
                            t: DateAdd(FormAbsenceToMonday, 4, TimeUnit.Days),
                            ty: LookUp(Filter('List values',
                                              List = 'List (List values)'.'Absence type'),
                                       Value = tmAbsType.Selected.Value) },
                         // A row being edited is one Patch; a new absence is one per person
                         // picked. The two are separate statements: a record and a table cannot
                         // be the two arms of one If.
                         If(FormAbsenceEditing,
                            Patch(Absences, varAbsEdit,
                                  { Name: FormAbsencePerson & " " & Text(f, "d mmm")
                                          & " to " & Text(t, "d mmm"),
                                    Person: LookUp(People,
                                                   'Full name' = FormAbsencePerson),
                                    'Absence type': ty,
                                    From: f,
                                    To: t,
                                    Note: Trim(tmAbsNote.Text) }));
                         If(!FormAbsenceEditing,
                            ForAll(tmAbsPeople.SelectedItems As P,
                                   Patch(Absences, Defaults(Absences),
                                         { Name: P.Value & " " & Text(f, "d mmm")
                                                 & " to " & Text(t, "d mmm"),
                                           Person: LookUp(People, 'Full name' = P.Value),
                                           'Absence type': ty,
                                           From: f,
                                           To: t,
                                           Note: Trim(tmAbsNote.Text) })))),
                       Set(varAbsSaveError, FirstError.Message),
                       // The collection the screens read is rebuilt from the table, as the person
                       // form does, and only then does the panel close.
                       ClearCollect(colAbsences, Absences);
                       Notify(If(FormAbsenceEditing, "1",
                                 Text(CountRows(tmAbsPeople.SelectedItems), "[$-en-US]#,##0"))
                              & If(!FormAbsenceEditing
                                   && CountRows(tmAbsPeople.SelectedItems) <> 1,
                                   " absences saved.", " absence saved."),
                              NotificationType.Success);
                       Set(varAbsEdit, Blank());
                       Set(varAbsOpen, false)))
            - tmAbsCancel:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad + (Parent.Width - Pad * 2 - Gap) / 2 + Gap
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Cancel"
                  AccessibleLabel: ="Close the absence panel without saving"
                  OnSelect: =Set(varAbsEdit, Blank()); Set(varAbsOpen, false)
