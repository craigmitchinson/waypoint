                                                  =Max(Parent.Width * TeamShareName, TeamMinName)
                                                   + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                                   + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                                   + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                                   + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                                   + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                                   + Max(Parent.Width * TeamShareRegion, TeamMinRegion)
                                                   + Max(Parent.Width * TeamShareModifier, TeamMinModifier)
                                                   + Max(Parent.Width * TeamShareNet, TeamMinNet)
                                                Y: =(TeamPeopleRowH - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamShareBooked, TeamMinBooked) - 8
                                                Height: =TypeBodyLine
                                                Text: =Text(ThisItem.Booked, "[$-en-US]#,##0.00")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmRowFree:
                                              Control: Label@2.5.1
                                              Properties:
                                                X: |
                                                  =Max(Parent.Width * TeamShareName, TeamMinName)
                                                   + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                                   + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                                   + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                                   + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                                   + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                                   + Max(Parent.Width * TeamShareRegion, TeamMinRegion)
                                                   + Max(Parent.Width * TeamShareModifier, TeamMinModifier)
                                                   + Max(Parent.Width * TeamShareNet, TeamMinNet)
                                                   + Max(Parent.Width * TeamShareBooked, TeamMinBooked)
                                                Y: =(TeamPeopleRowH - TypeBodyLine) / 2
                                                Width: =Max(Parent.Width * TeamShareFree, TeamMinFree) - 8
