                                                   + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                                   + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                                   + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                                   + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                                   + Max(Parent.Width * TeamShareRegion, TeamMinRegion)
                                                   + Max(Parent.Width * TeamShareModifier, TeamMinModifier)
