                                                Y: =(TeamPeopleRowH - TypeBodyLine - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamShareName, TeamMinName) - TeamNameX - 8
                                                Height: =TypeBodyLine
                                                Text: =ThisItem.Name
                                                Size: =TypeBody
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmRowRole:
                                              Control: Label@2.5.1
                                              Properties:
