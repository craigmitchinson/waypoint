                                                X: |
                                                  =Max(Parent.Width * TeamShareName, TeamMinName)
                                                   + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                                Y: =(TeamPeopleRowH - TypeLabelLine) / 2
                                                Width: =Max(Parent.Width * TeamShareSquad, TeamMinSquad) - 8
                                                Height: =TypeLabelLine
                                                Text: =Coalesce(ThisItem.Squad, "No squad")
                                                Size: =TypeCaption
                                                FontWeight: =FontWeight.Semibold
                                                Font: =FontUI
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =BrandText
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmRowGrade:
