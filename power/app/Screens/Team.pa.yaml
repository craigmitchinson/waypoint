# Waypoint canvas app: the Team screen, the people and the capacity they really bring.
#
# Valid against pa.schema.yaml (v3.0): a Screens map, each screen with a Properties formula map and a
# Children sequence whose items are single-key maps of control name to control instance.
#
# Team is src/pages/Team.tsx: the band of the quarter's headline people figures, then one pivot over
# three tables — the roster, the squads and the non-work time booked inside the quarter. Every
# number is the engine's, through the named formulas in Formulas.pa.yaml: PeopleTable, SquadTable
# and colAbsences, with the sorted views TeamPeopleRows, TeamSquadRows and TeamAbsenceRowsAll
# over them. Nothing here works a number out for itself. The squad-level capacity holds the
# workbook calls reservations stay engine data and have no surface here
# (power/decisions.md, "Product decisions, 20 September 2026 evening").
#
# The shell is scrWork's, unchanged: tmRoot is a vertical GroupContainer the size of the screen,
# holding the 48px header and a horizontal row of the rail and the body. X and Y appear only inside
# the gallery templates, which are not auto-layout.
#
# The pivot is one ModernTabList. Its selection lands in varTeamTab, and TeamTab is the formula
# every gallery's Visible reads, so the screen opens on People before the tab list is ever touched.
#
# What is hidden, and why: the add button on the Squads tab is still to come, so the page head
# carries one button for a person and one for an absence, each shown on its own tab.

Screens:
  scrTeam:
    Properties:
      Fill: =NeutralCanvas

    Children:

      # ---- the root: one vertical auto-layout container the size of the screen ----
      - tmRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutOverflowY: =LayoutOverflow.Hide
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutGap: =0
          Children:

            # ---- shell: the app header ----
            - tmHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutOverflowY: =LayoutOverflow.Hide
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - tmHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  # ---- shell: the scope selector, one cmpScope instance for every screen ----
                  - tmHeaderScope:
                      Control: CanvasComponent
                      ComponentName: cmpScope
                      Properties:
                        Width: =Max(Parent.Width * 0.14, 180)
                        Height: =ControlHeight
                        Visible: =IncludeScope
                  # ---- shell: the header search, one cmpSearch instance for every screen ----
                  - tmHeaderSearch:
                      Control: CanvasComponent
                      ComponentName: cmpSearch
                      Properties:
                        Width: =Max(Parent.Width * 0.24, 280)
                        Height: =ControlHeight
                  - tmHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - tmMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutOverflowY: =LayoutOverflow.Hide
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutGap: =0
                Children:

                  # ---- shell: the rail, one cmpRail instance for every screen ----
                  - tmRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="Team"

                  # ---- shell: the body everything else sits inside ----
                  - tmBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutGap: =Gap
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:

                        # ---- page head: the eyebrow and one h1 on the left, the add button right ----
                        - tmPageHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutGap: =Gap
                            Children:
                              - tmHeadText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutOverflowY: =LayoutOverflow.Hide
                                    LayoutOverflowX: =LayoutOverflow.Hide
                                    LayoutGap: =0
                                  Children:
                                    - tmEyebrow:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeKickerLine
                                          Visible: =!IsCompact
                                          Text: =CurrentQuarter.Label
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =TypeDisplayLine
                                          Text: ="Team"
                                          Size: =TypeTitle
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          Wrap: =true
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          AutoHeight: =true
                              # The add button for the roster, whose label follows the pivot.
                              # It shows on the People tab and opens the person panel empty.
                              - tmAdd:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =BrandBg
                                    Color: =BrandFg
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =Max(Parent.Width * 0.08, 160)
                                    Height: =ControlHeight
                                    # the squad form is still to come; absences have
                                    # their own button beside this one
                                    Visible: =TeamTab = "People"
                                    Text: =TeamAddLabel
                                    AccessibleLabel: =TeamAddLabel
                                    OnSelect: |
                                      =Set(varPersonEdit, Blank());
                                       Set(varPersonSaveError, "");
                                       Set(varPersonFormOpen, true);
                                       Set(varTeamFormTried, false);
                                       // every input starts from its Default, not the last open
                                       Reset(tmFieldName);
                                       Reset(tmFieldRole);
                                       Reset(tmFieldSquad);
                                       Reset(tmFieldRegion);
                                       Reset(tmFieldDpw);
                                       Reset(tmFieldModifier);
                                       Reset(tmFieldLead);
                                       Reset(tmFieldEmployment);
                                       Reset(tmFieldSkills)
                              # Absences are typed here and nowhere else: the button beside the
                              # person's opens the panel on nobody, for the planner to pick a
                              # scope or a few names.
                              - tmAddAbsence:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =BrandBg
                                    Color: =BrandFg
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    RadiusTopLeft: =CtrlR
                                    RadiusTopRight: =CtrlR
                                    RadiusBottomLeft: =CtrlR
                                    RadiusBottomRight: =CtrlR
                                    Width: =Max(Parent.Width * 0.08, 160)
                                    Height: =ControlHeight
                                    Visible: =TeamTab = "Absences"
                                    Text: ="Add absence"
                                    AccessibleLabel: ="Add an absence"
                                    OnSelect: |
                                      =Set(varAbsEdit, Blank());
                                       Set(varAbsSaveError, "");
                                       Set(varAbsFromPicked, false);
                                       // The week each dropdown opens on, the same default its
                                       // Default property computes: a named formula cannot read
                                       // a control, so these are what FormAbsenceFromMonday and
                                       // FormAbsenceToMonday read instead.
                                       Set(varAbsFromWeek, FormAbsenceFromWeek);
                                       Set(varAbsToWeek, FormAbsenceToWeek);
                                       Set(varAbsOpen, true);
                                       Set(varTeamFormTried, false);
                                       // every input starts from its Default, not the last open
                                       Reset(tmAbsScope);
                                       Reset(tmAbsPeople);
                                       Reset(tmAbsType);
                                       Reset(tmAbsFrom);
                                       Reset(tmAbsTo);
                                       Reset(tmAbsNote)

                        # ---- the brand band: the quarter's headline people figures ----
                        - tmBand:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: |
                                =If(App.Width < (4 * 200 + BandKickerW), BandH * 2, BandH)
                              LayoutWrap: =true
                              Fill: =BrandBg
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutGap: =Gap
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =10
                              PaddingBottom: =10
                            Children:
                              - tmBandKicker:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =BandKickerW
                                    Height: =TypeKickerLine * 2
                                    Text: ="The team this quarter"
                                    Size: =TypeCaption
                                    FontWeight: =FontWeight.Normal
                                    Font: =FontUI
                                    Color: =ColorFade(BrandFg, -0.2)
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AutoHeight: =true
                              - tmStatPeople:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 4) / 4, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Label: ="People"
                                    Value: =Text(TeamPeopleCount, "[$-en-US]#,##0")
                                    Sub: =TeamInSquadCount & " in a squad"
                              - tmStatSquads:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 4) / 4, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Label: ="Squads"
                                    Value: =Text(TeamSquadCount, "[$-en-US]#,##0")
                                    Sub: =TeamLedCount & " with a lead"
                              - tmStatNet:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 4) / 4, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Label: ="Net capacity"
                                    Value: =Text(NetTotal, "[$-en-US]#,##0.0")
                                    Unit: ="MW"
                                    Sub: ="Net member weeks across every squad"
                              - tmStatAbsence:
                                  Control: CanvasComponent
                                  ComponentName: cmpStat
                                  Properties:
                                    Width: =Max((Parent.Width - Pad * 2 - BandKickerW - Gap * 4) / 4, 180)
                                    LayoutMinWidth: =180
                                    Height: =BandH - 20
                                    OnBrand: =true
                                    Tone: ="accent"
                                    Label: ="Absence days"
                                    Value: =Text(TeamAbsenceDays, "[$-en-US]#,##0.0")
                                    Sub: ="Absences"

                        # ---- the pivot: three views over the same team ----
                        # The tab list writes varTeamTab; TeamTab is what the three galleries and
                        # their header rows read, so People is the view the screen opens on.
                        - tmPivot:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =ControlHeight + 16
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutGap: =Gap
                            Children:
                              - tmTabs:
                                  Control: ModernTabList@1.0.1
                                  Properties:
                                    Width: =Max(Parent.Width * 0.24, 460)
                                    Height: =ControlHeight + 8
                                    Items: =Table({Value:"People"}, {Value:"Squads"}, {Value:"Absences"})
                                    Default: ={Value:"People"}
                                    Font: =FontUI
                                    Size: =TypeBodyPx
                                    Color: =NeutralFg1
                                    BasePaletteColor: =BrandBg
                                    AccessibleLabel: ="Team views"
                                    OnChange: =Set(varTeamTab, tmTabs.Selected.Value)
                                    FontWeight: =FontWeight.Semibold

                        # ---- the card the three tables share ----
                        - tmCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              # The grid inside is never narrower than its own column minimums, so the card
                              # scrolls sideways rather than squeezing a cell (power/RUNBOOK.md, "Tables").
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Hide
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:

                              # ---- the squad filter chip: shown while the roster is narrowed to one squad ----
                              # Command navigates here with varTeamSquad set, and the Squads tab sets it too.
                              # Clear puts it back to blank and the whole roster returns.
                              - tmChipRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Parent.Width
                                    Height: =ControlHeight
                                    Visible: =TeamSquadFilter && TeamTab = "People"
                                  Children:
                                    - tmChipLabel:
                                        Control: CanvasComponent
                                        ComponentName: cmpPill
                                        Properties:
                                          X: =0
                                          Y: =(ControlHeight - TypeLabelLine) / 2
                                          Label: |
                                            ="Squad: " & varTeamSquad
                                          Width: |
                                            =With({t: "Squad: " & varTeamSquad}, Min(Max(Len(t) * 7 + 20, 56), 200))
                                          Height: =TypeLabelLine
                                          Tone: ="brand"
                                    - tmChipClear:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =NeutralBg1
                                          Color: =NeutralFg1
                                          Font: =FontUI
                                          Size: =TypeBodyPx
                                          RadiusTopLeft: =CtrlR
                                          RadiusTopRight: =CtrlR
                                          RadiusBottomLeft: =CtrlR
                                          RadiusBottomRight: =CtrlR
                                          X: =Max(Parent.Width * 0.16, 200) + 8
                                          Y: =0
                                          Width: =Max(Parent.Width * 0.04, 80)
                                          Height: =ControlHeight
                                          Text: ="Clear"
                                          AccessibleLabel: ="Clear the squad filter"
                                          OnSelect: =Set(varTeamSquad, Blank())

                              # ---- People: the column heads, then the roster ----
                              # Every column is a named share of the container that holds the cells, with a
                              # pixel minimum (Formulas.pa.yaml), and the head cells and the row cells read the
                              # same share and minimum, so the head row and the rows read as one grid.
                              - tmPeopleHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width, TeamPeopleColsW)
                                    Height: =RowHeight
                                    Visible: =TeamTab = "People"
                                  Children:
                                    - tmHeadName:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =TeamNameX
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareName, TeamMinName) - TeamNameX - 8
                                          Height: =TypeLabelLine
                                          Text: ="Name"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadLead:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.Width * TeamShareName, TeamMinName)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareLead, TeamMinLead) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Lead"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Center
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadSquad:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareSquad, TeamMinSquad) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Squad"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadGrade:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareGrade, TeamMinGrade) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Grade"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadSkills:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                             + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareSkills, TeamMinSkills) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Skills"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadDpw:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                             + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                             + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareDpw, TeamMinDpw) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Days per week"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadRegion:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                             + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                             + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                             + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareRegion, TeamMinRegion) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Region"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadModifier:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                             + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                             + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                             + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                             + Max(Parent.Width * TeamShareRegion, TeamMinRegion)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareModifier, TeamMinModifier) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Modifier"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadNet:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
                                             + Max(Parent.Width * TeamShareLead, TeamMinLead)
                                             + Max(Parent.Width * TeamShareSquad, TeamMinSquad)
                                             + Max(Parent.Width * TeamShareGrade, TeamMinGrade)
                                             + Max(Parent.Width * TeamShareSkills, TeamMinSkills)
                                             + Max(Parent.Width * TeamShareDpw, TeamMinDpw)
                                             + Max(Parent.Width * TeamShareRegion, TeamMinRegion)
                                             + Max(Parent.Width * TeamShareModifier, TeamMinModifier)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * TeamShareNet, TeamMinNet) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Net MW"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Right
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - tmHeadBooked:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * TeamShareName, TeamMinName)
