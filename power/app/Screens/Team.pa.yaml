                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldDpw:
                Control: ModernTextInput@1.1.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 5 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Default: =FormPersonDpw
