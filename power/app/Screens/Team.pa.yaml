                                                Width: =Max(Parent.Width * TeamShareDpw, TeamMinDpw) - 8
                                                Height: =TypeBodyLine
                                                Text: =Text(ThisItem.Dpw, "[$-en-US]#,##0.0")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: =NeutralFg1
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                          - tmRowRegion:
