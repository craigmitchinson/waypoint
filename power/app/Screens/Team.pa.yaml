                              - tmPeople:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    TemplatePadding: =0
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Width: =Max(Parent.Width, TeamPeopleColsW)
                                    ShowScrollbar: =true
                                    FillPortions: =0
                                    Height: =Parent.Height - Pad * 2 - RowHeight - TypeLabelLine - 8 * 2 - If(TeamSquadFilter, ControlHeight + 8, 0)
                                    Visible: =TeamTab = "People" && CountRows(TeamPeopleRows) > 0
                                    Items: =TeamPeopleRows
                                    TemplateSize: =TeamPeopleRowH
                                    AccessibleLabel: |
                                      ="People: every person on the roster, with the contracted week, "
                                       & "the modifier and the member weeks they bring."
                                  Children:
                                    # The row is the target, not a control inside it: a name is a name, and the
                                    # container carries the navigation (power/RUNBOOK.md, "Table columns").
                                    - tmPeopleRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =TeamPeopleRowH
                                        Children:
                                          # The avatar takes its initials from the name it is given; no picture is held
                                          # against a person in this model.
                                          - tmRowAvatar:
                                              Control: ModernAvatar@1.1.0
                                              Properties:
                                                X: =0
                                                Y: =(TeamPeopleRowH - TeamAvatarSize) / 2
                                                Width: =TeamAvatarSize
                                                Height: =TeamAvatarSize
                                                Size: =TeamAvatarSize
                                                Shape: =AvatarShape.Circular
                                                Name: =ThisItem.Name
                                                AccessibleLabel: =ThisItem.Name
                                          - tmRowName:
                                              Control: Label@2.5.1
                                              Properties:
