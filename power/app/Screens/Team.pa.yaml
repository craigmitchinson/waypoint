                                                Text: =Text(ThisItem.Free, "[$-en-US]#,##0.00")
                                                Size: =TypeBody
                                                Font: =FontUI
                                                Align: =Align.Right
                                                VerticalAlign: =VerticalAlign.Middle
                                                Color: |
                                                  =With({ t: LookUp(NumberTones, Metric = "freeMW"),
                                                          v: ThisItem.Free },
                                                      If(t.HigherIsWorse,
                                                         If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                                                         If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))))
                                                Wrap: =false
                                                Overflow: =Overflow.Hidden
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0

                                          # The row is the target: the whole row opens the person
