                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Region"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - tmFieldRegion:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 4 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FormRegionOptions
                  ItemDisplayText: =ThisItem.Value
                  Default: ={Value:FormPersonRegion}
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Region"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - tmLblDpw:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =FormFieldTop + FormFieldStep * 5
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
