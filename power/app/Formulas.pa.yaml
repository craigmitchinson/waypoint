# Waypoint canvas app: the engine as Power Fx.
#
# This file is `../../src/engine` written as named formulas, in the order the engine files run:
# dates, context, capacity, work, value, delivery, reservations, sprintPlan, compute. Every rule
# carries the source function it came from in the comment above it. The numbers it has to land on
# are in `../tests/expected.json`.
#
# NO USER-DEFINED FUNCTIONS. Studio answers "'X' is an unknown or unsupported function" for every
# one of them, because user-defined functions are a preview feature and the target environment will
# not have it switched on. Every rule that used to be a function is now one of two things: a named
# formula that is a table with the computed column already on it, so a screen reads a column; or the
# same expression written inline at its single use. The comment above each one names the function it
# replaces. Nothing below defines a function, and nothing below calls one.
#
# Valid against ../../pa.schema.yaml (v3.0): one App entity, one Properties map, and the whole engine
# inside the single Formulas property. Every property value begins with "=".
#
# Packing note. `App.pa.yaml` and this file are two halves of one App entity: that one holds the
# theme, OnStart and StartScreen, this one holds the engine. A name may be defined once only, and
# where a rule appears in both this file is the authority.
#
# CHOICE COLUMNS. A Dataverse choice is an enum, not a record. It is read for display with Text(),
# and compared and patched with the enum named for the column and its table's plural display name:
# 'Kind (Work items)', 'Commitment (Work items)', 'Phase (Work items)', 'Landing month (Work items)',
# 'Employment (People)', 'Capacity impact (Work states)', 'Benefit type (Benefit claims)'. A lookup
# is a record and does carry columns: State, Region, Absence type, Booking type and Category all
# compare on the lookup's own primary column, which for List values is Value.
#
# DELEGATION. Nothing below is delegable. The named formulas run in the app over the collections
# App.OnStart loads, so every rule assumes each table is under the 2,000 row local limit.
#
# GUARDS. Settings and Quarters can still be loading when the first screen paints, so every
# denominator that comes out of them (sprint days, member-week days, the quarter's working days)
# has a floored twin below and the divisions use the twin. Without them Studio reports a runtime
# "division by zero" on the Command eyebrow and the sprint card.
#
# PARKED. The rules no screen binds to yet were all written as user-defined functions with record
# and table parameters: calibration, the archive, the sprint plan matrix and its totals, the
# quarter compare, carry-over and cycle time. They come back, as tables, with the screens that
# need them. The capacity check finish walk has come back already: it is the CapacityWalk region,
# a per-assignee-per-week table over one Sequence, read by the Assess tab of the work item screen.
#
# The work item screen's formulas are back in this file with the screen that reads them:
# ItemStatusRow, ItemSteps, OwnerOptions, StateOptions and EpicOptions came out of
# Formulas.parked.yaml.

App:
  Properties:
    Formulas: |
      =
      // =====================================================================
      // context.ts: the quarter, the day grid, the sprint grid, the timeline weeks.
      // =====================================================================

      // context.ts buildContext(), the settings it is built from.
      Waypoint        = First(colSettings);
      CurrentQuarter  = LookUp(colQuarters, 'Current quarter' = true);
      QuarterStart    = CurrentQuarter.'Quarter start';
      QuarterEnd      = CurrentQuarter.'Quarter end';
      Epoch           = CurrentQuarter.'Sprint 1 started';
      SprintDays      = Coalesce(CurrentQuarter.'Sprint length (days)', 0);
      MWDays          = Coalesce(Waypoint.'Days in a member week', 0);
      DefaultModifier = Coalesce(Waypoint.'Default modifier', 0);
      LeadModifier    = Coalesce(Waypoint.'Lead modifier', 0);
      LogAbsences     = Waypoint.'Deduct absences' = true;
      BenefitYear     = CurrentQuarter.'Benefit year';

      // The floored denominators. Every division by a sprint length or a member week uses these.
      SprintDaysOr1 = If(SprintDays <= 0, 1, SprintDays);
      MWDaysOr1     = If(MWDays <= 0, 1, MWDays);

      // context.ts buildContext(): the first sprint of the quarter, how many of them it holds
      // (never more than eight), the last, and the sprint today falls in.
      FirstSprint   = RoundDown(DateDiff(Epoch, QuarterStart, TimeUnit.Days) / SprintDaysOr1, 0) + 1;
      Sprints       = Max(0, Min(8, RoundDown(DateDiff(Epoch, QuarterEnd, TimeUnit.Days) / SprintDaysOr1, 0) + 1 - FirstSprint + 1));
      LastSprint    = FirstSprint + Sprints - 1;
      CurrentSprint = RoundDown(DateDiff(Epoch, Today(), TimeUnit.Days) / SprintDaysOr1, 0) + 1;

      // context.ts buildContext(): the timeline weeks, Mondays from the ISO Monday on or before
      // 1 January of the timeline year.
      TimelineJan1      = Date(Coalesce(CurrentQuarter.'Timeline year', Year(Today())), 1, 1);
      TimelineMonday0   = DateAdd(TimelineJan1, -(Weekday(TimelineJan1, StartOfWeek.Monday) - 1), TimeUnit.Days);
      TimelineWeekCount = Max(0, Coalesce(CurrentQuarter.'Timeline weeks', 0));

      // TimelineWeeks and WeekCount are with the rest of the timeline's formulas, at the foot of
      // this file, with the screen that reads them.

      // replaces WorkingDays(A, B), dates.ts networkdays(). There is no NETWORKDAYS in Power Fx and
      // a function cannot be defined, so the timeline year is written out one row per day with a
      // weekday flag. A working-day count is then CountRows over this table between two dates.
      DayGrid =
          ForAll(Sequence(TimelineWeekCount * 7, 0) As N,
              With({ d: DateAdd(TimelineMonday0, N.Value, TimeUnit.Days) },
                  { D: d, IsWork: Weekday(d, StartOfWeek.Monday) <= 5 }));

      QuarterWorkingDays    = CountRows(Filter(DayGrid, IsWork, D >= QuarterStart, D <= QuarterEnd));
      QuarterWorkingDaysOr1 = If(QuarterWorkingDays <= 0, 1, QuarterWorkingDays);

      // replaces BankHolidayDays(RegionName, A, B), context.ts bankHolidayCount(). The weekday
      // holidays with the region name flattened onto the row; a count is CountRows over this.
      // Wales reads England's list, which is applied where a person's region is read.
      BankHolidayDayRows =
          ForAll(Filter(colBankHolidays, Weekday(Date, StartOfWeek.Monday) <= 5) As B,
                 { RegionName: B.Region.Value, D: B.Date });

      // replaces SprintStart(Num) and SprintEnd(Num), context.ts sprintStart()/sprintEnd(), plus
      // ctx.sprintWorkingDays. Sprints run from the epoch unbroken, so the quarter's sprints are a
      // table and every other use of a sprint's dates is the same DateAdd written inline.
      SprintGrid =
          ForAll(Sequence(Sprints, FirstSprint) As S,
              With({ from: DateAdd(Epoch, (S.Value - 1) * SprintDays, TimeUnit.Days) },
                  With({ to: DateAdd(from, SprintDays - 1, TimeUnit.Days) },
                      { Num: S.Value,
                        From: from,
                        To: to,
                        WorkDays:
                            CountRows(
                                Filter(DayGrid, IsWork,
                                       D >= If(from > QuarterStart, from, QuarterStart),
                                       D <= If(to < QuarterEnd, to, QuarterEnd))) })));

      // dates.ts MONTHS: the three-letter month names the workbook writes, and the index of one.
      // replaces MonthIndex(MonthName), which is now a LookUp over this table at its one use.
      MonthTable =
          ForAll(Sequence(12, 1) As N,
                 { Num: N.Value, Name: Text(Date(2000, N.Value, 1), "mmm") });

      // =====================================================================
      // capacity.ts
      // =====================================================================

      // replaces DaysPerWeek(P), ModifierOf(P), AbsenceDaysOf(P), NetMW(P) and NetFactor(P). One row
      // per person, with the contracted week, the modifier, the absence days the quarter loses and
      // the net member weeks already worked out, so nothing calls a function per row.
      PeopleTable =
          ForAll(colPeople As P,
              With({ dpw: Coalesce(P.'Days per week', MWDays),
                     mod: Coalesce(P.'Modifier override', If(P.Lead, LeadModifier, DefaultModifier)),
                     region: If(P.Region.Value = "Wales", "England", P.Region.Value),
                     vacancy: P.Employment = 'Employment (People)'.'Open vacancy' },
                  With({ bh: CountRows(Filter(BankHolidayDayRows,
                                              RegionName = region,
                                              D >= QuarterStart, D <= QuarterEnd)),
                         absDays:
                             Coalesce(
                                 Sum(Filter(colAbsences, Person.'Full name' = P.'Full name') As A,
                                     With({ lo: If(A.From > QuarterStart, A.From, QuarterStart),
                                            hi: If(A.To < QuarterEnd, A.To, QuarterEnd) },
                                         Max(0,
                                             CountRows(Filter(DayGrid, IsWork, D >= lo, D <= hi))
                                             - CountRows(Filter(BankHolidayDayRows,
                                                                RegionName = region,
                                                                D >= lo, D <= hi))))),
                                 0) },
                      With({ net:
                                 If(vacancy, 0,
                                    Max(0,
                                        QuarterWorkingDays * dpw / MWDaysOr1
                                        - If(LogAbsences, bh * dpw / MWDaysOr1, 0)
                                        - If(LogAbsences, absDays * dpw / MWDaysOr1, 0))
                                    * (1 - mod) / MWDaysOr1),
                         // capacity.ts bookedDays() over the quarter, as member weeks: the typed
                         // bookings only. The implicit booking a work item's own assignees carry is
                         // a per-week walk, so it stays out until the timeline screen brings it.
                         booked:
                             Coalesce(
                                 Sum(Filter(colAssignments,
                                            Person.'Full name' = P.'Full name') As A,
                                     With({ lo: If(A.From > QuarterStart, A.From, QuarterStart),
                                            hi: If(A.To < QuarterEnd, A.To, QuarterEnd) },
                                         CountRows(Filter(DayGrid, IsWork, D >= lo, D <= hi))
                                         / MWDaysOr1)),
                                 0) },
                          { Name: P.'Full name',
                            Squad: P.Squad.'Squad name',
                            Region: region,
                            Lead: P.Lead,
                            Vacancy: vacancy,
                            Dpw: dpw,
                            Modifier: mod,
                            AbsenceDays: absDays,
                            Net: net,
                            // Team.tsx people table: the roster's own text columns and what the
                            // person still has free after the bookings already made.
                            Role: Coalesce(P.Role, ""),
                            Grade: Text(P.'Team grade'),
                            Skills: Substitute(Coalesce(P.Skills, ""), Char(10), ", "),
                            Booked: booked,
                            Free: Max(0, net - booked),
                            // capacity.ts netFactor(): net MW over gross MW.
                            NetFactor: net / (QuarterWorkingDaysOr1 / MWDaysOr1) }))));

      // One definition of "a person" for every count a screen puts beside a capacity figure:
      // capacity.ts netMW() and sprintPlan.ts personSprintMW() give an open vacancy no capacity, so
      // a vacancy is an open role, not a person, and it is counted as one. Timeline.tsx
      // plannedPeople() is this same filter.
      PlannedPeople      = Filter(PeopleTable, Vacancy <> true, !IsBlank(Name));
      PlannedPeopleCount = CountRows(PlannedPeople);

      // replaces AbsenceRowMW(A, From, To), capacity.ts absenceMW() per row, and IsSickness(). One
      // row per absence, with the productive MW it takes out of the quarter and whether it is
      // sickness. The screens read the columns; nothing here calls a function. The rows are the
      // quarter's rows: an absence that neither starts nor ends inside it charges nothing, so it is
      // not one of this quarter's absences and no grid over this table lists it.
      AbsenceQuarterTable =
          AddColumns(
              Filter(colAbsences, From <= QuarterEnd, To >= QuarterStart),
              PersonName, Person.'Full name',
              TypeName, 'Absence type'.Value,
              Sick, StartsWith(Lower('Absence type'.Value), "sick"),
              MW,
              With({ nm: Person.'Full name',
                     lo: If(From > QuarterStart, From, QuarterStart),
                     hi: If(To < QuarterEnd, To, QuarterEnd) },
                  With({ P: LookUp(PeopleTable, Name = nm) },
                      With({ days: Max(0,
                                       CountRows(Filter(DayGrid, IsWork, D >= lo, D <= hi))
                                       - CountRows(Filter(BankHolidayDayRows,
                                                          RegionName = P.Region,
                                                          D >= lo, D <= hi))) },
                          days * (P.Dpw / MWDaysOr1) * (1 - P.Modifier) / MWDaysOr1))));

      // capacity.ts absenceMW(), the quarter total: absences of people still on the roster only.
      QuarterAbsenceMW =
          Coalesce(Sum(Filter(AbsenceQuarterTable,
                              !IsBlank(LookUp(colPeople, 'Full name' = PersonName))), MW), 0);

      // =====================================================================
      // work.ts, value.ts and delivery.ts, as columns on the work table.
      // =====================================================================

      // replaces ItemFirstSprint(W), ItemLastSprint(W), OwnMW(W), PhaseOf(W), CommitmentOf(W),
      // ItemSized(W), ItemCancellable(W), GradeRateOf(W), CostAvoidanceOf(W) and ClaimMonth(W).
      // The first layer: everything a row can work out from itself and one lookup.
      WorkBase =
          AddColumns(
              colWork,
              // 'Component count' is in the model as a Dataverse rollup but the solution has no
              // such column, so the components are counted here. The parent is the 'Part of' lookup.
              ComponentCount,
              With({ t: Title }, CountRows(Filter(colWork, 'Part of'.Title = t))),
              StateName, State.State,
              Impact, State.'Capacity impact',
              FirstSprintNum, If(IsBlank('Absolute start sprint'), 0, 'Absolute start sprint'),
              LastSprintNum, If(IsBlank('Absolute start sprint'), -1,
                                  Coalesce('Absolute end sprint', 'Absolute start sprint')),
              // work.ts ownMW(): a typed override, else the size band.
              OwnMWValue, Coalesce('MW override', Size.'Member weeks', 0),
              // src/store/validate.ts phaseOf().
              ItemPhase, Switch(State.State,
                                  "Ready", "Assessment",
                                  "In development", "Delivery",
                                  "Released", "Release",
                                  "In validation", "Release",
                                  "Done", "Release",
                                  "Shaping"),
              // work.ts commitment(): the state overrules the flag.
              CommitmentText, If(State.State in ["Identified", "In discovery"]
                                   || Commitment = 'Commitment (Work items)'.Proposed,
                                   "Proposed", "Committed"),
              Sized, !IsBlank(Size) || !IsBlank('MW override'),
              Cancellable, State.'Capacity impact' <> 'Capacity impact (Work states)'.Removed,
              // value.ts gradeRate(): a business grade rate, or a blend's weighted average.
              GradeRate,
              If(!IsBlank('Business grade'), 'Business grade'.'GBP per FTE',
                 !IsBlank('Grade blend'),
                 With({ bn: 'Grade blend'.'Blend name' },
                     With({ lines: Filter(colBlendLines, Blend.'Blend name' = bn) },
                         With({ heads: Coalesce(Sum(lines, Heads), 0) },
                             If(heads = 0, 0,
                                Coalesce(Sum(lines As L, L.Heads * L.'Business grade'.'GBP per FTE'), 0)
                                / heads)))),
                 0),
              // The cost avoidance claim, in £M a year: the T column of the Benefits block.
              CostAvoidance,
              With({ t: Title },
                  Coalesce(
                      LookUp(colClaims,
                             'Work item'.Title = t
                             && 'Benefit type' = 'Benefit type (Benefit claims)'.'Cost avoidance').'Claimed value',
                      0)),
              // value.ts claimMonth(). Landing month is a choice, so it is read with Text() and
              // turned into an index through MonthTable; no landing month at all is 13.
              ClaimMonthNum,
              If(IsBlank('Landing month'), 13,
                 With({ y: Coalesce('Landing year', BenefitYear), mn: Text('Landing month') },
                     If(y < BenefitYear, 1,
                        y > BenefitYear, 13,
                        Coalesce(LookUp(MonthTable, Name = mn).Num, 0)))),
              LandsText,
              If(IsBlank('Landing month'), Blank(),
                 Text('Landing month') & " " & Coalesce('Landing year', BenefitYear)));

      // replaces Counts(W), InPlan(W), WorkMW(W), DeliveryStatusOf(W), ClaimShare(W) and
      // BenefitInYear(W). The second layer reads the first layer's columns, which is why it is a
      // second AddColumns: a column added in one call cannot be read by another in the same call.
      WorkStatusTable =
          AddColumns(
              WorkBase,
              // work.ts counts(): Consumed and Allocated always count, Reserved once committed.
              Counted, Impact in ['Capacity impact (Work states)'.Allocated,
                                    'Capacity impact (Work states)'.Consumed]
                         || (Impact = 'Capacity impact (Work states)'.Reserved
                             && CommitmentText = "Committed"),
              // work.ts inPlan(): committed to, delivering, or delivered.
              InPlanFlag, Impact in ['Capacity impact (Work states)'.Allocated,
                                       'Capacity impact (Work states)'.Consumed,
                                       'Capacity impact (Work states)'.Historical]
                            || (Impact = 'Capacity impact (Work states)'.Reserved
                                && CommitmentText = "Committed"),
              // work.ts workMW(): the item's own MW spread evenly over its sprints, times the share
              // of those sprints' working days that falls inside the quarter.
              WorkMWValue,
              With({ ks: FirstSprintNum, ke: LastSprintNum, own: OwnMWValue, kids: ComponentCount },
                  If(kids > 0 || Max(ks, FirstSprint) > Min(ke, LastSprint),
                     0,
                     (own / Max(1, ke - ks + 1))
                     * Coalesce(Sum(Filter(SprintGrid, Num >= ks, Num <= ke), WorkDays), 0)
                     / (SprintDaysOr1 / 7 * 5))),
              // delivery.ts deliveryStatus(), the ladder before the capacity overlay and roll-up.
              // Not Status: colWork already carries Dataverse's own Status (statecode) column.
              DeliveryStatus,
              With({ endSprint: LastSprintNum,
                     stateName: StateName,
                     impact: Impact,
                     done: 'Done in sprint',
                     kids: ComponentCount },
                  If(kids > 0 || stateName in ["Identified", "Deferred", "Cancelled"], "",
                     !IsBlank(done), If(done <= endSprint, "Done on time", "Done late"),
                     impact = 'Capacity impact (Work states)'.Historical, "Done, sprint unknown",
                     CurrentSprint > endSprint, "Late",
                     (stateName = "In development" && CurrentSprint = endSprint)
                         || (stateName in ["In discovery", "Ready"] && CurrentSprint >= endSprint - 1),
                         "At risk",
                     "On track")),
              // The stage tab a row files under. The two terminal Phase choices win over the
              // State mapping and send the row to Closed, so nothing that leaves the journey
              // drops off the page; every other row keeps the ItemPhase the tabs already used.
              ItemStageName,
              If(Phase = 'Phase (Work items)'.Validated
                 || Phase = 'Phase (Work items)'.Stopped,
                 "Closed", ItemPhase),
              // Which end a closed row reached, shown in the register's State cell in place of
              // the underlying work state. Blank on anything still live.
              ClosedOutcome,
              Switch(Phase,
                     'Phase (Work items)'.Validated, "Validated",
                     'Phase (Work items)'.Stopped, "Stopped",
                     Blank()),
              // value.ts claimShare() and benefitValue(), the in-year half.
              ClaimShareValue, (13 - ClaimMonthNum) / 12,
              BenefitInYearValue,
              (Coalesce('FTE released', 0) * GradeRate + CostAvoidance * 1000000)
              * (13 - ClaimMonthNum) / 12);

      // =====================================================================
      // reservations.ts
      // =====================================================================

      // replaces ReservationDrawn(SquadName, QuarterLabel, Category) and reservationRows(). One row
      // per reservation, with what it has drawn down and what it still holds. Discovery and Spikes
      // share the spike pool; Shaping and refinement is components in Shaping or Assessment;
      // anything else is an assignment of that booking type against the person's net capacity.
      ReservationRows =
          ForAll(colReservations As R,
              With({ sq: If(R.'Held across the team', "Team", R.Squad.'Squad name'),
                     ql: R.Quarter.Label,
                     cat: R.Category.Value },
                  With({ drawn:
                             If(ql <> CurrentQuarter.Label, 0,
                                cat in ["Discovery", "Spikes"],
                                    Coalesce(Sum(Filter(WorkStatusTable,
                                                        sq = "Team" || Squad.'Squad name' = sq,
                                                        Kind = 'Kind (Work items)'.Spike,
                                                        Counted),
                                                 WorkMWValue), 0),
                                cat = "Shaping and refinement",
                                    Coalesce(Sum(Filter(WorkStatusTable,
                                                        sq = "Team" || Squad.'Squad name' = sq,
                                                        Kind = 'Kind (Work items)'.Component,
                                                        Phase in ['Phase (Work items)'.Shaping,
                                                                  'Phase (Work items)'.Assessment],
                                                        Counted),
                                                 WorkMWValue), 0),
                                // an assignment row can outlive the person it names; it draws nothing
                                Coalesce(
                                    Sum(Filter(colAssignments,
                                               'Booking type'.Value = cat,
                                               sq = "Team" || Person.Squad.'Squad name' = sq) As A,
                                        With({ lo: If(A.From > QuarterStart, A.From, QuarterStart),
                                               hi: If(A.To < QuarterEnd, A.To, QuarterEnd),
                                               pn: A.Person.'Full name' },
                                            CountRows(Filter(DayGrid, IsWork, D >= lo, D <= hi)) / 5
                                            * Coalesce(LookUp(PeopleTable, Name = pn).NetFactor, 0))),
                                    0)),
                         covered:
                             sq <> "Team"
                             && !IsBlank(LookUp(colReservations,
                                                Squad.'Squad name' = "Team"
                                                && Quarter.Label = ql
                                                && Category.Value = cat)) },
                      { Squad: sq,
                        Quarter: ql,
                        Category: cat,
                        Note: Coalesce(R.Note, ""),
                        MW: R.'MW reserved',
                        Drawn: drawn,
                        Remaining: If(covered, 0, Max(0, R.'MW reserved' - drawn)) })));

      // reservations.ts squadReservedMW(), the two halves the squad rows read.
      TeamHeldMW =
          Coalesce(Sum(Filter(ReservationRows, Squad = "Team", Quarter = CurrentQuarter.Label),
                       Remaining), 0);

      AllNetMW = Coalesce(Sum(PeopleTable, Net), 0);

      // reservations.ts reservedTotal(): what every reservation still holds this quarter.
      ReservedTotal =
          Coalesce(Sum(Filter(ReservationRows, Quarter = CurrentQuarter.Label), Remaining), 0);

      // =====================================================================
      // compute.ts squads: the Squads sheet, row by row.
      // =====================================================================

      // replaces SquadNetMW(), SquadCommittedMW(), SquadReservedMW() and SquadUtilisation(). The
      // columns are the exact names scrCommand.OnVisible filters and sorts on: Name, Lead, People,
      // Net, Committed, Proposed, Reserved, Remaining and Utilisation.
      SquadTable =
          ForAll(colSquads As S,
              With({ nm: S.'Squad name' },
                  With({ net: Coalesce(Sum(Filter(PeopleTable, Squad = nm), Net), 0),
                         committed: Coalesce(Sum(Filter(WorkStatusTable,
                                                        Squad.'Squad name' = nm,
                                                        Counted),
                                                 WorkMWValue), 0),
                         ownReserved: Coalesce(Sum(Filter(ReservationRows,
                                                          Squad = nm,
                                                          Quarter = CurrentQuarter.Label),
                                                   Remaining), 0),
                         proposed: Coalesce(Sum(Filter(WorkStatusTable,
                                                       Squad.'Squad name' = nm,
                                                       Impact = 'Capacity impact (Work states)'.Reserved,
                                                       CommitmentText = "Proposed"),
                                                WorkMWValue), 0) },
                      With({ reserved: ownReserved
                                       + If(AllNetMW = 0, 0, net / AllNetMW * TeamHeldMW) },
                          { Name: nm,
                            Lead: Coalesce(S.Lead.'Full name', ""),
                            // Team.tsx squads table reads the remit beside the lead.
                            Remit: Coalesce(S.Remit, ""),
                            People: CountRows(Filter(PlannedPeople, Squad = nm)),
                            Net: net,
                            Committed: committed,
                            Proposed: proposed,
                            Reserved: reserved,
                            Remaining: net - committed - reserved,
                            Utilisation: If(net = 0, 0, committed / net) }))));

      // =====================================================================
      // compute.ts: the quarter's headline figures.
      // =====================================================================

      NetTotal       = Coalesce(Sum(Filter(PeopleTable, !IsBlank(Squad)), Net), 0);
      CommittedTotal = Coalesce(Sum(Filter(WorkStatusTable, !IsBlank(Squad), Counted), WorkMWValue), 0);
      // compute.ts: the member weeks in plan and the member weeks already delivered. The Benefits
      // band reads the pair as one reliability figure.
      InPlanMW    = Coalesce(Sum(Filter(WorkStatusTable, InPlanFlag), WorkMWValue), 0);
      DeliveredMW = Coalesce(Sum(Filter(WorkStatusTable,
                                        Impact = 'Capacity impact (Work states)'.Historical),
                                 WorkMWValue), 0);

      // value.ts gbpInYear() and fteClaimed().
      GbpInYear  = Coalesce(Sum(Filter(WorkStatusTable, InPlanFlag), BenefitInYearValue), 0);
      FteClaimed = Coalesce(Sum(Filter(WorkStatusTable,
                                       Counted
                                       || Impact = 'Capacity impact (Work states)'.Historical),
                                'FTE released'), 0);

      // delivery.ts deliverySummary(): items delivered inside the quarter's sprints.
      DeliveredRows =
          Filter(WorkStatusTable,
                 !IsBlank('Done in sprint'),
                 'Done in sprint' >= FirstSprint,
                 'Done in sprint' <= LastSprint,
                 DeliveryStatus <> "");

      DeliveredCount = CountRows(DeliveredRows);
      OnTimeCount    = CountRows(Filter(DeliveredRows, DeliveryStatus = "Done on time"));
      OnTimePct      = If(DeliveredCount = 0, 0, OnTimeCount / DeliveredCount);

      // =====================================================================
      // sprintPlan.ts, for the sprint the Command card reads.
      // =====================================================================

      // Where the quarter is, and the sprint the screens read, clamped into the quarter.
      SprintInQuarter = CurrentSprint - FirstSprint + 1;
      InQuarter       = SprintInQuarter >= 1 && SprintInQuarter <= Sprints;
      SprintNow       = If(CurrentSprint < FirstSprint, FirstSprint,
                           CurrentSprint > LastSprint, LastSprint, CurrentSprint);

      SprintNowStart = DateAdd(Epoch, (SprintNow - 1) * SprintDays, TimeUnit.Days);
      SprintNowEnd   = DateAdd(SprintNowStart, SprintDays - 1, TimeUnit.Days);

      // The sprint's working days on the sprint card: SprintGrid's own count, which is the weekdays
      // of the sprint that fall inside the quarter (sprintPlan.ts sprintWeeks(), and SprintNowDays
      // below). Counted over the whole sprint instead, the card said ten days where the Sprints
      // matrix column for the same sprint said seven.
      SprintNowWorkingDays = Coalesce(LookUp(SprintGrid, Num = SprintNow).WorkDays, 0);

      SprintDaysLeft =
          CountRows(Filter(DayGrid, IsWork,
                           D >= If(Today() > SprintNowStart, Today(), SprintNowStart),
                           D <= SprintNowEnd));

      // replaces SprintWeekShares(Num), sprintPlan.ts sprintWeeks(): the week Mondays this sprint
      // touches and how many of each week's working days it holds inside the quarter. One row per
      // day first, then the distinct Mondays with a count each: GroupBy is not used, so the offline
      // checker (scripts/fxcheck.mjs) can type the table and everything that reads it.
      SprintNowDays =
          Filter(
              ForAll(Sequence(SprintDaysOr1, 0) As D,
                  With({ d: DateAdd(SprintNowStart, D.Value, TimeUnit.Days) },
                      { Day: d,
                        Mon: DateAdd(d, -(Weekday(d, StartOfWeek.Monday) - 1), TimeUnit.Days),
                        Counted: If(Weekday(d, StartOfWeek.Monday) <= 5
                                    && d >= QuarterStart && d <= QuarterEnd, 1, 0) })),
              Counted = 1);

      SprintNowWeeks =
          ForAll(Distinct(SprintNowDays, Mon) As W,
                 { Mon: W.Value,
                   DayCount: CountRows(Filter(SprintNowDays, Mon = W.Value)) });

      // replaces SprintAvailableMW(Name, Num), PersonWeekAvail(P, Mon) and WeekLeave(Name, Mon):
      // the capacity the squadded people bring to this sprint, each week pro-rated by the working
      // days it holds.
      SprintNowAvailable =
          Coalesce(
              Sum(ForAll(Filter(PeopleTable, !IsBlank(Squad), !Vacancy) As P,
                      Coalesce(
                          Sum(SprintNowWeeks As WK,
                              With({ mon: WK.Mon },
                                  With({ fri: DateAdd(mon, 4, TimeUnit.Days) },
                                      With({ lost:
                                                 CountRows(Filter(BankHolidayDayRows,
                                                                  RegionName = P.Region,
                                                                  D >= mon, D <= fri))
                                                 + Coalesce(
                                                       Sum(Filter(AbsenceQuarterTable,
                                                                  PersonName = P.Name,
                                                                  From <= fri, To >= mon) As A,
                                                           With({ lo: If(A.From > mon, A.From, mon),
                                                                  hi: If(A.To < fri, A.To, fri) },
                                                               Max(0, Min(5, DateDiff(lo, hi, TimeUnit.Days) + 1)))),
                                                       0) },
                                          Max(0, P.Dpw - If(LogAbsences, lost * P.Dpw / MWDaysOr1, 0))
                                          * (1 - P.Modifier) / MWDaysOr1
                                          * (WK.DayCount / MWDaysOr1))))),
                          0)) As R,
                  R.Value),
              0);

      // replaces SprintSquadCommitted(): the item's own MW over the sprints it spans, one whole
      // share for every sprint of that span. Not WorkMW: that one is day-weighted for the quarter.
      SprintNowCommitted =
          Coalesce(
              Sum(ForAll(Filter(WorkStatusTable,
                                !IsBlank(Squad),
                                ComponentCount = 0,
                                FirstSprintNum <= SprintNow,
                                LastSprintNum >= SprintNow,
                                Counted) As W,
                      W.OwnMWValue / Max(1, W.LastSprintNum - W.FirstSprintNum + 1)) As R,
                  R.Value),
              0);

      // replaces SprintShare(Num) and SprintSquadReserved(): the held MW split by this sprint's
      // share of the quarter's working days.
      SprintNowShare =
          Coalesce(LookUp(SprintGrid, Num = SprintNow).WorkDays, 0) / QuarterWorkingDaysOr1;

      SprintNowReserved = ReservedTotal * SprintNowShare;

      // replaces SprintSquadRemaining(), summed over the squads.
      OpenMWThisSprint   = SprintNowAvailable - SprintNowCommitted - SprintNowReserved;
      OpenDaysThisSprint = OpenMWThisSprint * MWDays;

      // This sprint's absences, as the Command card reads them.
      SprintAbsences = Filter(AbsenceQuarterTable,
                              !IsBlank(LookUp(colPeople, 'Full name' = PersonName)),
                              From <= SprintNowEnd, To >= SprintNowStart);

      OnSickThisSprint  = CountRows(Filter(SprintAbsences, Sick));
      OnLeaveThisSprint = CountRows(Filter(SprintAbsences, !Sick));

      // Settings the screens read as thresholds and targets.
      GbpTarget       = CurrentQuarter.'Target benefit';
      FteTarget       = CurrentQuarter.'Target FTE released';
      UtilisationWarn = Waypoint.'Amber utilisation from';
      UtilisationBad  = Waypoint.'Red utilisation from';

      // =====================================================================
      // src/pages/Command.tsx: the squads card and the decisions list.
      //
      // Named formulas, not collections built in OnVisible. A collection is a snapshot: it is taken
      // once, before App.OnStart's Concurrent loads have landed, and never at all in Studio's design
      // view, which is why the two cards read empty while the band beside them reads the engine's
      // numbers off these same rules. A named formula is live, so both surfaces repaint as the
      // tables arrive.
      // =====================================================================

      // compute.ts squads, in the order the card reads them.
      SquadRows = SortByColumns(SquadTable, "Utilisation", SortOrder.Descending);

      // Command.tsx attention[]: one table per group, all of the same shape. They are not unioned
      // into one table: Table() takes records rather than tables, and Ungroup is not a function the
      // offline checker (Power Fx Core) carries, so the gallery picks its group's table instead.
      //
      // Every row carries four more columns than the message: Measure, the number that makes the
      // decision, as text; ActionLabel and ActionKind, the one direct action the row offers beside
      // Open; and Squad, which is all the Timeline action needs. The shape is identical across the
      // seven tables because one gallery Switches between them.
      //
      // The action handoff. No transition is written from here: a row's action sets varItem and
      // varItemAction to the action's label ("Defer", "Assign", "Commit", "Conclude") and
      // navigates to scrWorkItem, whose stage sections own every write and open on the tab the
      // named action belongs to.
      // ActionKind "timeline" is the one that stays on this side: it snaps Timeline to the squad.
      // ActionKind "open" means the row has no second action and the button is hidden, which is the
      // At risk group and the Over capacity group.

      // Squads over their red line.
      DecisionSquads =
          ForAll(Filter(SquadTable, Utilisation > UtilisationBad) As S,
                 { Tone: "bad",
                   Group: "Over capacity",
                   Message: S.Name & " is Red: " & Round(S.Utilisation * 100, 0)
                            & "% of its net capacity is committed.",
                   Measure: Round(S.Utilisation * 100, 0) & "% of net",
                   ActionLabel: "Open",
                   ActionKind: "open",
                   Squad: S.Name,
                   Target: "Team",
                   Key: S.Name });

      // Work that will not land. WorkStatusTable carries deliveryStatus() as a column, so the
      // screen never calls a user-defined function. The capacity overlay is not in the ladder:
      // delivery.ts adds "At risk (capacity)" from the per-person-week capacity check, which is
      // still parked, so this table is the ladder's own Late and At risk only.
      DecisionDelivery =
          ForAll(Filter(WorkStatusTable,
                        DeliveryStatus in ["Late", "At risk", "At risk (capacity)"]) As W,
                 { Tone: If(W.DeliveryStatus = "Late", "bad", "warn"),
                   Group: If(W.DeliveryStatus = "Late", "Late", "At risk"),
                   Message: W.Title & " is " & W.DeliveryStatus & ".",
                   // Late is how far past its end sprint the item is. At risk is the reason the
                   // ladder gave it: the end sprint it is still short of, and the state it is in.
                   // There is no MW-over-capacity reason to read; delivery.ts's capacity overlay
                   // is parked, so WorkStatusTable carries the ladder's own Late and At risk only.
                   Measure:
                       If(W.DeliveryStatus = "Late",
                          With({ n: CurrentSprint - W.LastSprintNum },
                              n & If(n = 1, " sprint late", " sprints late")),
                          "ends sprint " & W.LastSprintNum & ", " & Lower(W.StateName)),
                   ActionLabel: If(W.DeliveryStatus = "Late", "Defer", "Open"),
                   ActionKind: If(W.DeliveryStatus = "Late", "defer", "open"),
                   Squad: Coalesce(W.Squad.'Squad name', ""),
                   Target: "WorkItem",
                   Key: W.Title });

      // Committed work with nobody on it.
      DecisionUnassigned =
          ForAll(Filter(WorkStatusTable As X,
                        X.Counted,
                        X.CommitmentText = "Committed",
                        CountRows(Filter(colAssignees, 'Work item'.Title = X.Title)) = 0) As W,
                 { Tone: "warn",
                   Group: "Unassigned",
                   Message: W.Title & " is committed with nobody on it.",
                   Measure: Text(W.WorkMWValue, "[$-en-US]#,##0.0") & " MW",
                   ActionLabel: "Assign",
                   ActionKind: "assign",
                   Squad: Coalesce(W.Squad.'Squad name', ""),
                   Target: "WorkItem",
                   Key: W.Title });

      // Open spikes with no outcome.
      DecisionSpikes =
          ForAll(Filter(colWork,
                        Kind = 'Kind (Work items)'.Spike,
                        IsBlank('Spike outcome'),
                        State.State in ["In discovery", "Ready"]) As W,
                 { Tone: "neutral",
                   Group: "Spikes to conclude",
                   Message: W.Title & " is an open spike with no outcome recorded.",
                   // The timebox runs from the spike's start sprint, so what is left of it is
                   // start + timebox - the sprint we are in.
                   Measure:
                       With({ tb: Coalesce(W.'Timebox (sprints)', 0),
                              s: W.'Absolute start sprint' },
                           If(tb = 0, "no timebox set",
                              IsBlank(s), tb & " sprint timebox, not started",
                              With({ left: s + tb - CurrentSprint },
                                  If(left <= 0, "timebox spent",
                                     left & If(left = 1, " sprint left", " sprints left"))))),
                   ActionLabel: "Conclude",
                   ActionKind: "conclude",
                   Squad: Coalesce(W.Squad.'Squad name', ""),
                   Target: "WorkItem",
                   Key: W.Title });

      // The page's two columns, split by content need rather than in half: the decisions register
      // carries a message a line, the cards beside it carry figures.
      CmdLeftW  = 62;
      CmdRightW = 38;
      // The same split as a width, and as a minimum width that lets go once the page stacks:
      // below IsStacked the two columns are one above the other and each takes the full width.
      CmdLeftMinW  = If(IsStacked, 0, 420);
      CmdRightMinW = If(IsStacked, 0, 360);

      // The squads row's columns, as named widths. A literal is what wrapped "10 people" over two
      // lines in a 60px cell.
      CmdSquadNameW   = 140;
      CmdSquadPeopleW = 96;
      CmdSquadBarW    = 100;
      CmdSquadPctW    = 44;
      CmdSquadPeopleX = CmdSquadNameW + 8;
      CmdSquadBarX    = CmdSquadPeopleX + CmdSquadPeopleW + 8;
      CmdSquadPctX    = CmdSquadBarX + CmdSquadBarW + 8;
      CmdSquadMWX     = CmdSquadPctX + CmdSquadPctW + 8;

      // ---------------------------------------------------------------------
      // Today: the three blocks the screen now asks a decision on. The seven
      // Decision* tables above stay as they are — Sickness and Unassigned are
      // read here as a line and a count rather than as a list.
      // ---------------------------------------------------------------------

      // Block one. Work in Assessment that is still only proposed, the call the
      // day is asking for: the rows that are ready to commit first, then
      // priority, then the biggest MW inside a priority. The rows that are not
      // ready stay in the list, muted, carrying what they are missing, so the
      // product owner sees why the button is refused rather than an empty list.
      //
      // The stage is the item's own Phase choice where it has one, and the
      // State-derived ItemPhase where it does not, because Phase is new
      // (power/design-work-flow.md, section 11) and older rows are blank.
      //
      // CommitMissing and CommitReady are the row's copy of the gate
      // ItemCommitMissing and ItemCommitReady put on the item's Assess tab:
      // the same two-line rule, a size and a saved assessment, in the same
      // order and the same wording. A named formula takes no argument, so the
      // rule cannot be written once and read per row; fxcheck's eval holds a
      // parity case that compares the two, and any change to one belongs in
      // the other.
      //
      // The verdict is a proxy, not the finish walk. ItemWalk* is per varItem
      // alone (the CapacityWalk region) and there is no per-row walk to read,
      // so a row is judged on the window it has asked for — its end sprint
      // against the quarter's last sprint — and on whether anyone is on it.
      CmdCommitCalls =
          SortByColumns(
              AddColumns(
                  AddColumns(
                      Filter(WorkStatusTable,
                             If(IsBlank(Phase),
                                ItemPhase = "Assessment",
                                Phase = 'Phase (Work items)'.Assessment),
                             CommitmentText = "Proposed",
                             ComponentCount = 0),
                      PriorityRank, Switch(Coalesce(Priority, ""),
                                           "Must", 1, "Should", 2, "Could", 3, "Won't", 4, 5),
                      PriorityText, If(IsBlank(Priority), "Unranked", Priority),
                      SquadName, Coalesce(Squad.'Squad name', ""),
                      MW, OwnMWValue,
                      // How far past the horizon the asked-for window ends: the number the
                      // slip row of NumberTones tones the verdict by.
                      EndSlip, LastSprintNum - LastSprint,
                      Assigned, With({ t: Title },
                                     CountRows(Filter(colAssignees, 'Work item'.Title = t))),
                      // The gate, per row. Same rule, same words as ItemCommitMissing.
                      CommitMissing,
                      With({ gaps: Filter(Table({ Seq: 1, Need: "a size", Show: !Sized },
                                                { Seq: 2, Need: "a saved assessment",
                                                  Show: IsBlank('Assessed on') },
                                                { Seq: 3, Need: "an assessor",
                                                  Show: IsBlank('Assessed by') }),
                                          Show) },
                          If(CountRows(gaps) = 0, "",
                             "Needs " & Concat(Sort(gaps, Seq), Need, ", ") & ".")),
                      // The span the commit writes when the item has none of its own:
                      // this sprint, for as long as the item's timebox asks.
                      CommitStart, If(FirstSprintNum > 0, FirstSprintNum, CurrentSprint)),
                  Verdict,
                  With({ e: LastSprintNum, n: Assigned },
                      If(e < FirstSprint, "no sprint window",
                         e > LastSprint, "ends S" & e & ", past the window",
                         n = 0, "fits, nobody on it yet",
                         "fits")),
                  CommitReady, IsBlank(CommitMissing),
                  ReadyRank, If(IsBlank(CommitMissing), 0, 1),
                  CommitEnd,
                  If(LastSprintNum >= CommitStart,
                     LastSprintNum,
                     CommitStart + Max(Coalesce('Timebox (sprints)', 1), 1) - 1)),
              "ReadyRank", SortOrder.Ascending,
              "PriorityRank", SortOrder.Ascending,
              "MW", SortOrder.Descending);

      CmdCommitCount = CountRows(CmdCommitCalls);
      CmdCommitReadyCount = CountRows(Filter(CmdCommitCalls, CommitReady));

      // Block two. The three groups that are already worked out, in one list:
      // late first, then at risk, then the squads over their red line. Table()
      // takes records rather than tables and Ungroup is not a function the
      // offline checker carries, so the three are walked by index instead.
      CmdAttentionLate = Filter(DecisionDelivery, Group = "Late");
      CmdAttentionRisk = Filter(DecisionDelivery, Group = "At risk");
      CmdAttentionOver = DecisionSquads;
      CmdAttentionCount = CountRows(CmdAttentionLate) + CountRows(CmdAttentionRisk)
                          + CountRows(CmdAttentionOver);
      CmdAttentionRows =
          With({ nl: CountRows(CmdAttentionLate), nr: CountRows(CmdAttentionRisk) },
              ForAll(Sequence(CmdAttentionCount, 1) As S,
                  If(S.Value <= nl, Index(CmdAttentionLate, S.Value),
                     S.Value <= nl + nr, Index(CmdAttentionRisk, S.Value - nl),
                     Index(CmdAttentionOver, S.Value - nl - nr))));

      // Block three. The open spikes, as the Decisions region already works them out.
      CmdSpikeRows  = DecisionSpikes;
      CmdSpikeCount = CountRows(CmdSpikeRows);

      // Block zero. The front door queue, which the rail no longer offers as a section
      // (power/design-work-flow.md, section 5): the card reads the same queue scrFrontDoor works,
      // oldest first, and the screen stays as the detail view behind it. Six rows show and the
      // rest are one line, so the card is never taller than the decisions under it.
      CmdFrontDoorCount = FrontDoorScreenCount;
      CmdFrontDoorCap   = 6;
      CmdFrontDoorRows  = FirstN(FrontDoorScreenQueue, CmdFrontDoorCap);
      CmdFrontDoorShown = Min(CmdFrontDoorCount, CmdFrontDoorCap);
      CmdFrontDoorMore  = Max(CmdFrontDoorCount - CmdFrontDoorCap, 0);

      // Nothing to decide: all three blocks empty, and nothing waiting at the front door.
      CmdTodayEmpty = CmdCommitCount + CmdAttentionCount + CmdSpikeCount + AwaitingValidationCount
                      + CmdFrontDoorCount = 0;

      // Sickness, as one line on the This sprint card rather than a list. The days are
      // counted over each absence's overlap with this sprint, the way the sickness rows
      // count theirs.
      CmdSickPeople = CountRows(Filter(SprintAbsences, Sick));
      CmdSickDays =
          Coalesce(
              Sum(ForAll(Filter(SprintAbsences, Sick) As A,
                      With({ lo: If(A.From > SprintNowStart, A.From, SprintNowStart),
                             hi: If(A.To < SprintNowEnd, A.To, SprintNowEnd) },
                          CountRows(Filter(DayGrid, IsWork, D >= lo, D <= hi)))) As R,
                  R.Value),
              0);
      CmdSicknessLine =
          CmdSickPeople & If(CmdSickPeople = 1, " person out · ", " people out · ")
          & CmdSickDays & If(CmdSickDays = 1, " day", " days") & " lost this sprint";

      // Unassigned, as a count for the Work register's filter row rather than a list.
      CmdUnassignedCount = CountRows(DecisionUnassigned);

      // The three blocks' row geometry. Every row is one line high, and the head is the title
      // line plus the card's own LayoutGap of 8, so a card is exactly its content high.
      CmdBlockRowH  = RowHeight;
      CmdBlockHeadH = TypeHeadingLine + 8;
      CmdBtnH       = 28;

      // =====================================================================
      // value.ts benefitCalendar()
      // =====================================================================

      // One row per work item, month by month across the benefit year. A row carries its claimed
      // FTE from the month it lands in to December.
      BenefitCalendarRows =
          ForAll(WorkStatusTable As W,
              With({ idx: W.ClaimMonthNum,
                     fte: Coalesce(W.'FTE released', 0),
                     rate: W.GradeRate,
                     ca: W.CostAvoidance * 1000000 },
                  With({ months: ForAll(Sequence(12, 1) As M,
                                        { Month: M.Value,
                                          Fte: If(fte <> 0 && M.Value >= idx, fte, 0),
                                          Ca:  If(ca <> 0 && M.Value >= idx, ca / 12, 0) }) },
                      { Title: W.Title,
                        Squad: W.Squad.'Squad name',
                        Epic: W.Epic.Epic,
                        FteClaimed: fte,
                        Lands: W.LandsText,
                        GradeRate: rate,
                        Months: months,
                        FteInYear: Coalesce(Sum(months, Fte), 0) / 12,
                        GbpInYear: Coalesce(Sum(months, Fte), 0) / 12 * rate
                                   + Coalesce(Sum(months, Ca), 0),
                        State: W.StateName,
                        Stopped: W.Phase = 'Phase (Work items)'.Stopped,
                        InPlan: W.InPlanFlag })));

      // value.ts benefitCalendar(), the totals block.
      BenefitCalendarTotals =
          ForAll(Sequence(12, 1) As M,
              With({ live: Filter(BenefitCalendarRows, InPlan) },
                  { Month: M.Value,
                    FteLive: Coalesce(Sum(live As R, LookUp(R.Months, Month = M.Value).Fte), 0),
                    FteNew: Coalesce(Sum(Filter(live, !IsBlank(Lands)) As R,
                                         If(LookUp(R.Months, Month = M.Value).Fte > 0
                                            && (M.Value = 1
                                                || LookUp(R.Months, Month = M.Value - 1).Fte = 0),
                                            R.FteClaimed, 0)), 0),
                    Gbp: Coalesce(Sum(live As R,
                                      LookUp(R.Months, Month = M.Value).Fte * R.GradeRate / 12
                                      + LookUp(R.Months, Month = M.Value).Ca), 0),
                    GbpTarget: CurrentQuarter.'Target benefit' * M.Value / 12,
                    FteAll: Coalesce(Sum(BenefitCalendarRows As R,
                                         LookUp(R.Months, Month = M.Value).Fte), 0),
                    GbpAll: Coalesce(Sum(BenefitCalendarRows As R,
                                         LookUp(R.Months, Month = M.Value).Fte * R.GradeRate / 12
                                         + LookUp(R.Months, Month = M.Value).Ca), 0) }));

      BenefitCalendarCumulative =
          ForAll(BenefitCalendarTotals As T,
                 { Month: T.Month,
                   GbpCumulative: Coalesce(Sum(Filter(BenefitCalendarTotals, Month <= T.Month), Gbp), 0),
                   GbpIfAllLands: Coalesce(Sum(Filter(BenefitCalendarTotals, Month <= T.Month), GbpAll), 0) });

      // replaces ActualValueOf(W, Type), ActualShare(W, Type) and BenefitRecorded(W): value.ts
      // benefitValue(), the recorded half, one row per item in the plan. The share runs from the
      // later of the landing month and the month the actual was recorded in. The two halves are
      // kept apart as well as added, because the benefit type table reads FTE released and cost
      // avoidance as separate lines.
      BenefitsRecordedRows =
          ForAll(Filter(WorkStatusTable, InPlanFlag) As W,
              With({ t: W.Title, share: W.ClaimShareValue, m: W.ClaimMonthNum,
                     y: Coalesce(W.'Landing year', BenefitYear) },
                  With({ fteRow: LookUp(colActuals,
                                        'Work item'.Title = t
                                        && 'Benefit type' = 'Benefit type (Benefit actuals)'.'FTE released'),
                         caRow: LookUp(colActuals,
                                       'Work item'.Title = t
                                       && 'Benefit type' = 'Benefit type (Benefit actuals)'.'Cost avoidance') },
                      With({ fte: Coalesce(fteRow.'Actual value', 0) * W.GradeRate
                                  * If(IsBlank(fteRow) || IsBlank(fteRow.When), share,
                                       y < BenefitYear, 1,
                                       Year(fteRow.When) < BenefitYear, share,
                                       Year(fteRow.When) > BenefitYear, 0,
                                       (13 - Max(m, Month(fteRow.When))) / 12),
                             ca: Coalesce(caRow.'Actual value', 0) * 1000000
                                 * If(IsBlank(caRow) || IsBlank(caRow.When), share,
                                      y < BenefitYear, 1,
                                      Year(caRow.When) < BenefitYear, share,
                                      Year(caRow.When) > BenefitYear, 0,
                                      (13 - Max(m, Month(caRow.When))) / 12) },
                          { Title: t,
                            RecordedFte: fte,
                            RecordedCa: ca,
                            Recorded: fte + ca }))));

      RecordedTotal = Coalesce(Sum(BenefitsRecordedRows, Recorded), 0);

      // The twelve months the benefit card draws.
      BenefitMonths =
          ForAll(BenefitCalendarTotals As T,
                 { Month: T.Month,
                   Name: Text(Date(BenefitYear, T.Month, 1), "mmm"),
                   Gbp: T.Gbp,
                   Target: T.GbpTarget,
                   Cumulative: LookUp(BenefitCalendarCumulative, Month = T.Month).GbpCumulative });

      MaxMonthBenefit = Max(Max(BenefitMonths, Gbp), 1);
      MaxMonthLine    = Max(Max(BenefitMonths, Cumulative), Max(BenefitMonths, Target), 1);

      // ---------------------------------------------------------------------
      // The month bars as SVG, a port of src/charts/monthBars.ts. Colours are hex text because
      // Power Fx cannot render a Color as a string, and every number is written with an en-US
      // format, because a decimal comma is not valid in an SVG attribute.
      //
      // replaces SvgNum(N), MonthBarY(V), MonthLineY(V) and MonthMidX(Num): each is now written
      // inline inside the Concat that used to call it.
      // ---------------------------------------------------------------------
      HexBrand     = If(IsDark, "#1E5F6B", "#0B3239");   // BrandBg
      HexBrandSoft = If(IsDark, "#357E8A", "#3E6B72");   // BrandBgSoft
      HexMuted     = If(IsDark, "#A2B4B0", "#5B6B6E");   // NeutralFg2
      HexAccent    = If(IsDark, "#FF6052", "#E0432E");   // AccentFg
      HexCard      = If(IsDark, "#17201F", "#FFFFFF");   // NeutralBg1, the card the chart sits on

      MonthBarsW    = 144;
      MonthBarsH    = 48;
      MonthBarsSlot = MonthBarsW / 12;

      MonthBarsRects =
          Concat(BenefitMonths As M,
              With({ y: MonthBarsH - (Max(0, M.Gbp) / MaxMonthBenefit) * MonthBarsH },
                  "<rect x=""" & Text((M.Month - 1) * MonthBarsSlot + 1.5, "[$-en-US]#,##0.0")
                  & """ y=""" & Text(y, "[$-en-US]#,##0.0")
                  & """ width=""" & Text(Max(MonthBarsSlot - 3, 0.5), "[$-en-US]#,##0.0")
                  & """ height=""" & Text(MonthBarsH - y, "[$-en-US]#,##0.0")
                  & """ fill=""" & HexBrandSoft & """/>"));

      // The month to mark, or none when today is outside the benefit year.
      MonthBarsCurrent = If(Year(Today()) = BenefitYear, Month(Today()), 0);

      MonthBarsNow =
          If(MonthBarsCurrent < 1, "",
             With({ x: Text((MonthBarsCurrent - 1) * MonthBarsSlot + MonthBarsSlot / 2,
                            "[$-en-US]#,##0.0") },
                 "<line x1=""" & x & """ x2=""" & x
                 & """ y1=""0"" y2=""" & Text(MonthBarsH, "[$-en-US]#,##0.0")
                 & """ stroke=""" & HexAccent
                 & """ stroke-width=""1"" vector-effect=""non-scaling-stroke""/>"));

      MonthTargetPoints =
          Concat(BenefitMonths As M,
                 Text((M.Month - 1) * MonthBarsSlot + MonthBarsSlot / 2, "[$-en-US]#,##0.0")
                 & ","
                 & Text(MonthBarsH - 2 - (Max(0, M.Target) / MaxMonthLine) * (MonthBarsH - 4),
                        "[$-en-US]#,##0.0"),
                 " ");

      MonthCumulativePoints =
          Concat(BenefitMonths As M,
                 Text((M.Month - 1) * MonthBarsSlot + MonthBarsSlot / 2, "[$-en-US]#,##0.0")
                 & ","
                 & Text(MonthBarsH - 2 - (Max(0, M.Cumulative) / MaxMonthLine) * (MonthBarsH - 4),
                        "[$-en-US]#,##0.0"),
                 " ");

      MonthBarsSvg =
          "<svg xmlns=""http://www.w3.org/2000/svg"" viewBox=""0 0 "
          & Text(MonthBarsW, "[$-en-US]#,##0.0") & " " & Text(MonthBarsH, "[$-en-US]#,##0.0")
          & """ preserveAspectRatio=""none"">"
          & MonthBarsRects
          & MonthBarsNow
          & "<polyline points=""" & MonthTargetPoints
          & """ fill=""none"" stroke=""" & HexMuted
          & """ stroke-width=""1.5"" vector-effect=""non-scaling-stroke"" stroke-dasharray=""4 3""/>"
          & "<polyline points=""" & MonthCumulativePoints
          & """ fill=""none"" stroke=""" & HexBrand
          & """ stroke-width=""1.5"" vector-effect=""non-scaling-stroke""/>"
          & "</svg>";

      // EncodeUrl is what makes the "#" in a colour safe; without it the picture fails silently.
      MonthBarsImage = "data:image/svg+xml;utf8," & EncodeUrl(MonthBarsSvg);

      // =====================================================================
      // src/pages/Work.tsx: the register, its lifecycle strip and its filters.
      // =====================================================================

      // The same eight sections as cmpRail reads them: a Key the rail matches its Active property
      // against, the Label it writes on the button, and the Fluent icon name for ModernButton.Icon.
      // hidden 20 Sep 2026: unlikely to be used; restore by adding the tab back —
      // { Key: "Import", Label: "Import", Icon: "ArrowDownload" } sat between Team and Benefits.
      // scrImport and its screen stay in the app; the rail no longer lists it.
      // Single-word Fluent names render in the modern Button Icon property; compound names
      // (TaskListSquareLtr, CalendarLtr, ChartMultiple) did not, observed 20 Sep 2026.
      // The front door is no longer a section. Its queue is a card on Command and scrFrontDoor is
      // the detail view behind that card, reached from a row or from Back, so the rail does not
      // list it (power/design-work-flow.md, section 5). IncludeFrontDoor stays: scrFrontDoor is in
      // the build only while includeFrontDoor in power/canvas/flags.json is true, and that flag is
      // what flips it, so the card can gate itself on the same answer. Show is a row's own gate and
      // the Filter drops it; every row below is always on.
      IncludeFrontDoor = false;

      NavItems =
          Filter(
              Table({ Key: "Command",      Label: "Command",       Icon: "Home",
                      Show: true },
                    { Key: "Work",         Label: "Work",          Icon: "DocumentBulletList",
                      Show: true },
                    { Key: "Timeline",     Label: "Timeline",      Icon: "Calendar",
                      Show: true },
                    { Key: "Team",         Label: "Team",          Icon: "People",
                      Show: true },
                    { Key: "Benefits",     Label: "Benefits",      Icon: "CheckmarkCircle",
                      Show: true },
                    { Key: "Financials",   Label: "Financials",    Icon: "Money",
                      Show: true },
                    { Key: "QuarterClose", Label: "Quarter close", Icon: "Flag",
                      Show: true },
                    { Key: "Settings",     Label: "Settings",      Icon: "Settings",
                      Show: true }),
              Show);

      // Work.tsx lifecycle[]: what sits in each phase, and the MW it charges this quarter.
      // Closed is the fifth tile, holding every Validated and Stopped item. Closed work consumes
      // no capacity, so its MW is zero and the strip's Closed label shows the count alone.
      WorkLifecycle =
          ForAll(Table({ Name: "Shaping" }, { Name: "Assessment" },
                       { Name: "Delivery" }, { Name: "Release" }, { Name: "Closed" }) As P,
              With({ rows: Filter(WorkStatusTable, ItemStageName = P.Name) },
                  { Name: P.Name,
                    Count: CountRows(rows),
                    MW: Coalesce(Sum(Filter(rows, Counted), WorkMWValue), 0) }));

      // The kind pivot's tab label, as the Kind a row is tested against. "All" filters nothing.
      WorkKindFilter =
          Switch(varWorkKind, "Features", "Feature", "Spikes", "Spike", "Components", "Component", "");

      // The three filter dropdowns' lists, each with its own "everything" row first. A dropdown's
      // Items must be one flat column, so each is rebuilt as a single Value column and the screen
      // turns the chosen Value back into the filter's variable.
      // Row zero is every squad; row one is TBC, the items no squad has been chosen for yet, which
      // is every item before assessment (power/design-work-flow.md, section 10).
      WorkSquadOptions =
          ForAll(Sequence(CountRows(colSquads) + 2, 0) As N,
                 { Value: If(N.Value = 0, "All squads",
                             N.Value = 1, "TBC",
                             Index(Sort(colSquads, 'Squad name'), N.Value - 1).'Squad name') });

      // The people filter: everyone, each named as the pickers name them, squad before person, in
      // the order the list is read in. The blank Value is the row that filters nothing.
      WorkPersonOptions =
          With({ people:
                 Sort(ForAll(colPeople As P,
                             { Value: P.'Full name',
                               DisplayLabel: If(IsBlank(P.Squad.'Squad name'), P.'Full name',
                                                P.Squad.'Squad name' & " · " & P.'Full name') }),
                      DisplayLabel) },
              ForAll(Sequence(CountRows(people) + 1, 0) As N,
                     { Value: If(N.Value = 0, "", Index(people, N.Value).Value),
                       DisplayLabel: If(N.Value = 0, "All people",
                                        Index(people, N.Value).DisplayLabel) }));

      WorkStateOptions =
          ForAll(Sequence(CountRows(colStates) + 1, 0) As N,
                 { Value: If(N.Value = 0, "All states",
                             Index(Sort(colStates, Order), N.Value).State) });

      WorkCommitmentOptions =
          Table({ Value: "Proposed and committed" }, { Value: "Proposed" }, { Value: "Committed" });

      // Work.tsx rows: the register as the filters leave it, sorted by title. Every filter is off
      // while its variable is blank, which is how the screen opens.
      WorkRegisterRows =
          // SortByColumns takes the column as quoted text, and the rows are Dataverse's, so the
          // logical name is what binds: "Title" is the display name and does not resolve here.
          // PriorityRank is the register's default order, Must first and the unranked last; it is
          // added here so the sort has a number to read, since Priority is stored as text.
          // The Closed tab has no queue to work, so it reads as a record of what has finished:
          // most recently modified first. Every other tab keeps the register's priority order.
          // The squad filter's TBC row matches the items no squad has been chosen for, and the
          // person filter matches the assessor or anyone the item is assigned to; both read the
          // collections the register already reads, so neither adds a query to delegate.
          With({ rows:
                 AddColumns(
                     Filter(WorkStatusTable As W,
                            WorkKindFilter = "" || Text(W.Kind) = WorkKindFilter,
                            IsBlank(varWorkPhase) || W.ItemStageName = varWorkPhase,
                            IsBlank(varWorkState) || W.StateName = varWorkState,
                            IsBlank(varWorkSquad)
                                || If(varWorkSquad = "TBC",
                                      IsBlank(W.Squad.'Squad name'),
                                      W.Squad.'Squad name' = varWorkSquad),
                            IsBlank(varWorkCommit) || W.CommitmentText = varWorkCommit,
                            IsBlank(varWorkPerson)
                                || W.'Assessed by'.'Full name' = varWorkPerson
                                || !IsBlank(LookUp(colAssignments,
                                                   'Work item'.Title = W.Title
                                                   && Person.'Full name' = varWorkPerson)),
                            IsBlank(varWorkSearch)
                                || !IsBlank(Find(Lower(varWorkSearch), Lower(W.Title)))
                                || !IsBlank(Find(Lower(varWorkSearch), Lower(W.Epic.Epic)))),
                     PriorityRank, Switch(Coalesce(Priority, ""),
                                          "Must", 1, "Should", 2, "Could", 3, "Won't", 4, 5),
                     // What the row reads as: the kind it is, who holds it at each stage, and the
                     // feature a component or a linked spike belongs to. TBC is said, never left
                     // blank, so an unanswered question reads as one.
                     KindText, Text(Kind),
                     SquadText, Coalesce(Squad.'Squad name', "TBC"),
                     AssessorText, Coalesce('Assessed by'.'Full name', "TBC"),
                     // The delivery team is the assignment rows: wp_assignment is the one write
                     // path for people. The first name alphabetically, and the rest as a count.
                     DeliveryText,
                     With({ t: Title },
                         With({ names: Distinct(Filter(colAssignments,
                                                       'Work item'.Title = t,
                                                       !IsBlank(Person.'Full name')),
                                                Person.'Full name') },
                             If(CountRows(names) = 0, "TBC",
                                First(Sort(names, Value)).Value
                                & If(CountRows(names) > 1,
                                     " +" & (CountRows(names) - 1), "")))),
                     // The second line under the title. A component names its parent feature and a
                     // spike the feature it was converted to; the epic follows, after a middot.
                     SubtitleText,
                     With({ parent: Switch(Text(Kind),
                                           "Component", 'Part of'.Title,
                                           "Spike", Coalesce('Converted to'.Title, 'Part of'.Title),
                                           Blank()),
                            epic: Coalesce(Epic.Epic, "") },
                         If(IsBlank(parent), Coalesce(Epic.Epic, "—"),
                            "part of " & parent
                            & If(epic = "", "", " · " & epic)))) },
              If(varWorkPhase = "Closed",
                 SortByColumns(rows, "modifiedon", SortOrder.Descending),
                 SortByColumns(rows,
                               "PriorityRank", SortOrder.Ascending,
                               "wp_title", SortOrder.Ascending)));

      WorkRegisterCount = CountRows(WorkRegisterRows);
      WorkTotalCount    = CountRows(colWork);

      // The register's grid, in one place: every column's named share of the container that holds
      // the cells, shares summing to 1 with pixel minimums so no column is a remainder. Title
      // carries the largest share, not the leftover. The header row lays out with the same shares
      // and minimums the template rows offset by, left to right: priority, title, type, squad,
      // assessor, delivery, state, commitment, size and MW, sprints, Jira key. The product owner is
      // not a column: at 1920 the eleven above take the width, and the owner is on the item screen.
      // The widths themselves are worked out in
      // the screen, against the register's own width, never the window's.
      WorkSharePriority   = 0.042;
      WorkShareTitle      = 0.293;
      WorkShareKind       = 0.062;
      WorkShareSquad      = 0.078;
      WorkShareAssessor   = 0.091;
      WorkShareDelivery   = 0.107;
      WorkShareState      = 0.078;
      WorkShareCommitment = 0.075;
      WorkShareMW         = 0.058;
      WorkShareSprints    = 0.058;
      WorkShareJira       = 0.058;
      WorkMinPriority   = 64;
      WorkMinTitle      = 300;
      WorkMinKind       = 90;
      WorkMinSquad      = 110;
      WorkMinAssessor   = 130;
      WorkMinDelivery   = 150;
      WorkMinState      = 110;
      WorkMinCommitment = 110;
      WorkMinMW         = 76;
      WorkMinSprints    = 90;
      WorkMinJira       = 84;
      WorkColsW = WorkMinPriority + WorkMinKind + WorkMinSquad + WorkMinAssessor + WorkMinDelivery
                  + WorkMinState + WorkMinCommitment + WorkMinMW + WorkMinSprints + WorkMinJira;
      // Every column at its pixel minimum. The register scrolls sideways inside its card rather
      // than squeezing a cell below this (power/RUNBOOK.md, "Responsive breakpoints").
      WorkTableMinW = WorkMinTitle + WorkColsW;

      // The row height for a stacked title and epic: one body line, one label line, 8px padding.
      WorkRowH = TypeBodyLine + TypeLabelLine + 8;

      // =====================================================================
      // WorkItem.tsx: the item under varItem, its stage actions and its five tabs.
      // =====================================================================

      // The two rows the screen reads: the live Dataverse record every Patch writes to, and the
      // computed row beside it. varItem is the copy the screen opened with, so a Patch is always
      // aimed at ItemRow and varItem is set again from the table afterwards. The key is the row's
      // own id, not its Title, so a rename saved on the Intake tab does not lose the record.
      ItemRow       = LookUp('Work items', 'Work item id' = varItem.'Work item id');
      ItemStatusRow = LookUp(WorkStatusTable, Title = varItem.Title);

      // The screen's lists. A DropDown's Items must be one flat column, so each list is rebuilt as
      // a single Value column and the screen turns the chosen Value back into a row.
      // Product owner options: people whose Role names them as one, sorted by name; falls back to
      // everyone when nobody's Role matches, so the dropdown is never empty.
      // Row zero is the empty choice every panel dropdown opens on, so the Default is a record the
      // Items carries (power/RUNBOOK.md, "a record from Items").
      OwnerOptions =
          With({ owners: Sort(With({ pos: Filter(colPeople,
                                                 !IsBlank(Find("product owner", Lower(Role)))) },
                                   If(CountRows(pos) > 0, pos, colPeople)), 'Full name') },
               Sort(
                   ForAll(Sequence(CountRows(owners) + 1, 0) As N,
                          With({ P: Index(owners, Max(N.Value, 1)) },
                              { Value: If(N.Value = 0, "", P.'Full name'),
                                DisplayLabel:
                                    If(N.Value = 0, "",
                                       IsBlank(P.Squad.'Squad name'), P.'Full name',
                                       P.Squad.'Squad name' & " · " & P.'Full name') })),
                   DisplayLabel));

      // Work states sort on Order, which is what the model calls wp_sequence; there is no Sequence
      // column on Work states, and Studio answered "Expected Table value" while there was.
      StateOptions = ForAll(Sort(colStates, Order) As S, { Value: S.State });

      // Epics carry their name in the Epic column, not Name. Row zero is the empty choice.
      EpicOptions =
          ForAll(Sequence(CountRows(colEpics) + 1, 0) As N,
                 { Value: If(N.Value = 0, "", Index(Sort(colEpics, Epic), N.Value).Epic) });

      ItemSquadOptions =
          ForAll(Sequence(CountRows(colSquads) + 1, 0) As N,
                 { Value: If(N.Value = 0, "",
                             Index(Sort(colSquads, 'Squad name'), N.Value).'Squad name') });

      ItemSkillOptions =
          With({ skills: Sort(Filter(colListValues, List = 'List (List values)'.Skill), Value) },
               ForAll(Sequence(CountRows(skills) + 1, 0) As N,
                      { Value: If(N.Value = 0, "", Index(skills, N.Value).Value) }));

      ItemSizeOptions =
          ForAll(Sequence(CountRows(colSizes) + 1, 0) As N,
                 { Value: If(N.Value = 0, "", Index(Sort(colSizes, Order), N.Value).Size) });

      ItemGradeOptions = ForAll(Sort(colGrades, 'Business grade') As G,
                                { Value: G.'Business grade' });

      ItemPriorityOptions   = Table({ Value: "" }, { Value: "Must" }, { Value: "Should" },
                                    { Value: "Could" }, { Value: "Won't" });
      ItemConfidenceOptions = Table({ Value: "Low" }, { Value: "Medium" }, { Value: "High" });
      ItemMonthOptions      = ForAll(MonthTable As M, { Value: M.Name });

      // The sprints this quarter runs, by their absolute number; row zero is the empty choice.
      ItemSprintOptions =
          ForAll(Sequence(Sprints + 1, 0) As N,
                 { Value: If(N.Value = 0, "Not scheduled", "S" & (FirstSprint + N.Value - 1)) });

      // power/design-work-item-stages.md, "Screen gating": the tab list is gated by the item's own
      // Phase choice, not the legacy State-derived ItemPhase above (that one files the Work list's
      // stage tabs).
      // Release is this design's fourth stage, "Realised". Validated and Stopped are the two
      // terminal stages added in section 11; without a branch each they both fell to "Shaping",
      // which left a stopped item's Intake tab editable.
      // An item saved before Phase existed has none, and opening it as Shaping filed it at a stage
      // the Work list did not agree with. Where Phase is blank the stage is derived from State by
      // the same mapping the Work list's stage tabs use (the ItemPhase column above), so a row in
      // development opens on Delivery in both places. Every stage read below goes through this.
      ItemPhaseEffective =
          If(IsBlank(varItem.Phase),
             Switch(varItem.State.State,
                    "Ready",          'Phase (Work items)'.Assessment,
                    "In development", 'Phase (Work items)'.Delivery,
                    "Released",       'Phase (Work items)'.Release,
                    "In validation",  'Phase (Work items)'.Release,
                    "Done",           'Phase (Work items)'.Release,
                    'Phase (Work items)'.Shaping),
             varItem.Phase);

      ItemStage =
          Switch(ItemPhaseEffective,
                 'Phase (Work items)'.Shaping,    "Shaping",
                 'Phase (Work items)'.Assessment, "Assessment",
                 'Phase (Work items)'.Delivery,   "Delivery",
                 'Phase (Work items)'.Release,    "Realised",
                 'Phase (Work items)'.Validated,  "Validated",
                 'Phase (Work items)'.Stopped,    "Stopped",
                 "Shaping");

      // Which tab each stage opens on, read by the ItemTab fallback below. wiTabs.Default carries
      // a second copy of this same Switch (returning a record rather than text) and must be kept
      // in step with it by hand.
      ItemDefaultTab =
          Switch(ItemStage,
                 "Shaping",    "Shape",
                 "Assessment", "Assess",
                 "Delivery",   "Components",
                 // A spike has no Value tab, so these fall back to Activity rather than naming a
                 // tab the strip does not carry, exactly as wiTabs.Default does.
                 "Realised",   If(ItemValueVisible, "Value", "Activity"),
                 "Validated",  If(ItemValueVisible, "Value", "Activity"),
                 "Stopped",    "Activity",
                 "Shape");

      // Whether each tab's inputs and save buttons take edits: only the tab for the item's current
      // stage; earlier stages' tabs stay visible but read-only. A stopped or validated item is at
      // neither stage, so all three are false and every tab is read-only; the one exception is the
      // actuals on the Value tab, which ItemValueRecordable keeps open in Validated (section 8).
      ItemShapeEditable      = ItemStage = "Shaping";
      ItemAssessEditable     = ItemStage = "Assessment";
      ItemComponentsEditable = ItemStage = "Delivery";

      // power/design-work-flow.md, section 9: Stop, from Intake, Assessment or Delivery, to the
      // actor who holds the item there. The three exit sections read this one set: whether the
      // button is offered at all, the reason the note input hands over, and the refusal when it
      // is blank. ItemStage is the "from" the Activity row records.
      ItemStopped     = ItemPhaseEffective = 'Phase (Work items)'.Stopped;
      ItemCanStop     = ItemStage in ["Shaping", "Assessment", "Delivery"];
      // The Stop gate, the same shape as Intake and Commit: the button is live only once a reason
      // is typed, and the line beside it names what is missing. A named formula cannot read a
      // control, so each tab's button and missing line read their own note control directly; this
      // is the one wording all three share.
      ItemStopRefusal = "Say why this is stopping.";
      // Stopping leaves every queue and every capacity figure (section 9), and each of those reads
      // State.'Capacity impact', so Stop writes the one state row carrying Removed alongside the
      // Phase. Cancel writes the same row.
      ItemStoppedState = LookUp('Work states', State = "Cancelled");
      // Phase alone cannot say where a stopped item stopped, so the stepper reads it back off the
      // Activity row Stop wrote: the latest "Stopped" transition for this item, and its Before.
      ItemStoppedFrom =
          Coalesce(
              First(Sort(Filter(colItemActivity,
                                'Record name' = varItem.Title,
                                After = "Stopped"),
                         At, SortOrder.Descending)).Before,
              "Shaping");

      // power/design-work-flow.md, section 3: Reopen, the one backward move out of a terminal
      // stage, in the header rather than on a tab because a stopped item's tabs are all read-only.
      // Stopped goes back to Shaping, Validated to Release, and a released item back to Delivery.
      ItemReopenVisible =
          ItemPhaseEffective = 'Phase (Work items)'.Stopped
          || ItemPhaseEffective = 'Phase (Work items)'.Validated
          || ItemPhaseEffective = 'Phase (Work items)'.Release;
      ItemReopenPhase =
          Switch(ItemPhaseEffective,
                 'Phase (Work items)'.Stopped,   'Phase (Work items)'.Shaping,
                 'Phase (Work items)'.Validated, 'Phase (Work items)'.Release,
                 'Phase (Work items)'.Delivery);
      ItemReopenTo =
          Switch(ItemPhaseEffective,
                 'Phase (Work items)'.Stopped,   "Shaping",
                 'Phase (Work items)'.Validated, "Release",
                 "Delivery");
      // Reopening a stopped item has to undo the Removed state Stop wrote, back to the state its
      // target stage starts from, and a released item reopened into Delivery has to leave the
      // Historical state behind or it stays outside every capacity figure; reopening a validated
      // item moves Phase only and keeps the state it has.
      ItemReopenState =
          Switch(ItemPhaseEffective,
                 'Phase (Work items)'.Stopped, LookUp('Work states', State = "Identified"),
                 'Phase (Work items)'.Release, LookUp('Work states', State = "In development"),
                 varItem.State);
      ItemReopenFrom =
          Switch(ItemPhaseEffective,
                 'Phase (Work items)'.Stopped,   "Stopped",
                 'Phase (Work items)'.Validated, "Validated",
                 "Released");
      ItemReopenMissing = "Say why this is being reopened.";

      // power/design-work-flow.md, section 10: a section belongs to its own stage and to no other,
      // so once the stage is left its tab carries one line in the section's place, saying when the
      // move happened. Each reads the Activity row its transition wrote, latest first, and the
      // stamp on the item where there is one.
      ItemSentRow =
          First(Sort(Filter(colItemActivity, 'Record name' = varItem.Title, After = "Assessment"),
                     At, SortOrder.Descending));
      ItemSentLine =
          "Sent for assessment on " & Text(ItemSentRow.At, "[$-en-US]d mmm yyyy")
          & " by " & Coalesce(varItem.'Assessed by'.'Full name', "someone");
      ItemCommittedRow =
          First(Sort(Filter(colItemActivity, 'Record name' = varItem.Title, After = "Delivery"),
                     At, SortOrder.Descending));
      ItemCommittedLine =
          "Committed on " & Text(ItemCommittedRow.At, "[$-en-US]d mmm yyyy");
      ItemReleasedRow =
          First(Sort(Filter(colItemActivity, 'Record name' = varItem.Title,
                            After = "Release" || After = "Concluded"),
                     At, SortOrder.Descending));
      ItemReleasedLine =
          If(varItem.Kind = 'Kind (Work items)'.Spike, "Concluded on ", "Released on ")
          & Text(ItemReleasedRow.At, "[$-en-US]d mmm yyyy");
      ItemValidatedRow =
          First(Sort(Filter(colItemActivity, 'Record name' = varItem.Title, After = "Validated"),
                     At, SortOrder.Descending));
      ItemValidatedLine =
          "Validated on "
          & Text(Coalesce(varItem.'Validated on', ItemValidatedRow.At),
                 "[$-en-US]d mmm yyyy");

      // power/design-work-flow.md, section 5: the one forward action out of Shaping. Sending is a
      // submission and names nobody and no squad: the squad is chosen at assessment. The person
      // row behind the signed-in user is matched on Email, the only column People carries for it;
      // it names who wrote the Activity row.
      ItemMePerson   = LookUp(People, Email = User().Email);
      ItemMeName     = Coalesce(ItemMePerson.'Full name', "");
      // The squad as it is read out rather than chosen: unassigned until assessment, so an item
      // that has none says so in words.
      ItemSquadName  = Coalesce(varItem.Squad.'Squad name', "TBC");

      // How the item arrived, and the options the Intake tab offers for it. The dropdown holds
      // the label, so the name the item carries now is read back the same way.
      ItemSourceName    = Coalesce(Text(varItem.Source), "Direct");
      ItemSourceOptions = Table({ Value: "Front door" }, { Value: "Direct" }, { Value: "Jira" });

      // power/design-work-flow.md, section 5: the Intake gate. Send for assessment is disabled
      // until there is a product owner and a priority, and on a feature until at least one benefit
      // claim has a value. ItemIntakeMissing is the line beside the disabled button and is blank
      // when the item is ready; a spike is never asked for a claim.
      ItemIntakeClaimed =
          ItemClaimT + ItemClaimU + ItemClaimV + ItemClaimW + ItemClaimX + ItemClaimY
          + Coalesce(varItem.'FTE released', 0) > 0;
      ItemIntakeGaps =
          Filter(
              Table(
                  { Seq: 1, Need: "a product owner", Show: IsBlank(varItem.'Product owner') },
                  { Seq: 2, Need: "a priority", Show: IsBlank(varItem.Priority) },
                  { Seq: 3, Need: "a benefit claim",
                    Show: varItem.Kind = 'Kind (Work items)'.Feature && !ItemIntakeClaimed }),
              Show);
      ItemIntakeMissing =
          If(CountRows(ItemIntakeGaps) = 0, "",
             "Needs " & Concat(Sort(ItemIntakeGaps, Seq), Need, ", ") & ".");
      ItemIntakeReady = IsBlank(ItemIntakeMissing);

      // power/design-work-flow.md, section 6: the assessor, named on the Assess tab rather than
      // chosen when the item is sent. varItemAssessor holds the id of the person the picker has
      // been set to, because a combo box's selection is not readable until it has been touched;
      // blank means the saved value stands. The id is the key, not the name: two people with the
      // same name resolve to one row on a name, and a renamed person loses their assessments.
      ItemAssessorId =
          If(IsBlank(varItemAssessor),
             Text(varItem.'Assessed by'.'Person id'), varItemAssessor);
      ItemAssessorPerson =
          If(IsBlank(ItemAssessorId), Blank(),
             LookUp(People, 'Person id' = GUID(ItemAssessorId)));
      // The line beside Assign to me: who the item is saved against, or, with nobody saved and
      // no person row behind the signed-in user, why that button will do nothing for them.
      ItemAssessorSaved =
          If(!IsBlank(varItem.'Assessed by'),
             "Saved as " & varItem.'Assessed by'.'Full name',
             IsBlank(ItemMePerson), "Your account is not in the people list",
             "Nobody assessing yet");

      // power/design-work-flow.md, section 6: the Commit gate. One formula, read twice: by the
      // Commit button on the item's Assess tab and, from unit 7, by Command's commit calls.
      // Commit is refused until the item carries a size, a band or an override, an assessment
      // that has been saved, and a named assessor. ItemCommitMissing is the line beside the disabled
      // button and is blank when the item is ready.
      ItemCommitGaps =
          Filter(
              Table(
                  { Seq: 1, Need: "a size", Show: !ItemSized },
                  { Seq: 2, Need: "a saved assessment",
                    Show: IsBlank(varItem.'Assessed on') },
                  { Seq: 3, Need: "an assessor",
                    Show: IsBlank(varItem.'Assessed by') },
                  // The squad is chosen on the Assess tab, so Commit is the gate that asks for it.
                  { Seq: 4, Need: "a squad", Show: IsBlank(varItem.Squad) }),
              Show);
      ItemCommitMissing =
          If(CountRows(ItemCommitGaps) = 0, "",
             "Needs " & Concat(Sort(ItemCommitGaps, Seq), Need, ", ") & ".");
      ItemCommitReady = IsBlank(ItemCommitMissing);

      // power/design-work-flow.md, section 6: the commit form's capacity readout. Same building
      // blocks SquadTable and Command's commit calls already use — Net and Committed for the
      // item's own squad, this quarter, the only one the planner carries — read against the
      // item's own estimate rather than invented afresh. varItem.Squad is the squad Send for
      // assessment set; CurrentQuarter is the quarter every capacity figure in this app reads.
      ItemCommitSquad = LookUp(SquadTable, Name = Coalesce(varItem.Squad.'Squad name', ""));
      ItemCommitCapacity = Coalesce(ItemCommitSquad.Net, 0);
      ItemCommitLoad = Coalesce(ItemCommitSquad.Committed, 0);
      ItemCommitRemaining = ItemCommitCapacity - ItemCommitLoad - ItemOwnMW;
      ItemCommitOver = ItemCommitRemaining < 0;
      ItemCommitOverBy = Max(0, -ItemCommitRemaining);

      ItemCommitFigures =
          Coalesce(varItem.Squad.'Squad name', "No squad") & " · " & CurrentQuarter.Label
          & " — Capacity " & Text(ItemCommitCapacity, "[$-en-US]#,##0.0") & " MW · Committed "
          & Text(ItemCommitLoad, "[$-en-US]#,##0.0") & " MW · This item "
          & Text(ItemOwnMW, "[$-en-US]#,##0.0") & " MW · Remaining "
          & Text(ItemCommitRemaining, "[$-en-US]#,##0.0") & " MW";

      ItemCommitOverLine =
          "Over commitment: " & Text(ItemCommitOverBy, "[$-en-US]#,##0.0") & " MW";

      // The tab the screen is on. varItemTab is blank until the tab list is touched, and the
      // current stage's tab is the section the screen opens on, so every Visible reads this rather
      // than the variable.
      ItemTab = If(IsBlank(varItemTab), ItemDefaultTab, varItemTab);

      // =====================================================================
      // Source of truth: whether this deployment's work items are the app's own or a Jira sync's
      // (power/decisions.md, "Source of truth flag"). The flag decides which fields the work item
      // form writes and which actions it offers, never what is stored.
      // =====================================================================
      // This environment's own value for wp_SourceOfTruth first, then the definition's default,
      // then "Manual" (RUNBOOK section 7).
      SourceOfTruth = Coalesce(LookUp('Environment Variable Values',
                                      'Environment Variable Definition'.'Schema Name'
                                        = "wp_SourceOfTruth").Value,
                               LookUp('Environment Variable Definitions',
                                      'Schema Name' = "wp_SourceOfTruth").'Default Value',
                               "Manual");

      IsJiraMode = SourceOfTruth = "Jira";

      // Whether the item has been sized, which the Commit gate reads.
      ItemSized = !IsBlank(varItem.Size) || !IsBlank(varItem.'MW override');

      // =====================================================================
      // The At a glance rail, the Components tab and the capacity check.
      // =====================================================================
      ItemMWThisQuarter  = Coalesce(ItemStatusRow.WorkMWValue, 0);
      ItemOwnMW          = Coalesce(ItemStatusRow.OwnMWValue, 0);
      ItemRollupMW       = If(ItemChildCount > 0, ItemChildMW, ItemOwnMW);
      ItemSprintsText =
          If(IsBlank(varItem.'Absolute start sprint'), "Not scheduled",
             "S" & varItem.'Absolute start sprint' & " to S"
             & Coalesce(varItem.'Absolute end sprint', varItem.'Absolute start sprint'));

      // WorkItem.tsx kids: the components this feature is broken into. MW stays numeric in the
      // table and is formatted at the cell.
      ItemChildren =
          SortByColumns(
              ForAll(Filter(WorkStatusTable, 'Part of'.Title = varItem.Title) As K,
                     { Title: K.Title,
                       Skill: Coalesce(K.Skill.Value, ""),
                       Size: Coalesce(K.Size.Size, "No size yet"),
                       MW: K.WorkMWValue,
                       Sprints: If(IsBlank(K.'Absolute start sprint'), "Not scheduled",
                                   "S" & K.'Absolute start sprint' & " to S"
                                   & Coalesce(K.'Absolute end sprint',
                                              K.'Absolute start sprint')),
                       Status: If(Coalesce(K.DeliveryStatus, "") = "", "Not started",
                                  K.DeliveryStatus) }),
              "Title", SortOrder.Ascending);

      ItemChildCount = CountRows(ItemChildren);
      ItemChildMW    = Coalesce(Sum(ItemChildren, MW), 0);

      // The components grid has no fixed pixel columns to gutter against: it splits the full
      // width as fractions, the head row and the template both reading the same named shares.
      WiCompColTitle   = 0.34;
      WiCompColSkill   = 0.16;
      WiCompColSize    = 0.16;
      WiCompColSprints = 0.16;
      WiCompColStatus  = 0.18;

      ItemRollupLine =
          "Roll-up " & Text(ItemRollupMW, "[$-en-US]#,##0.0") & " MW against the item's own "
          & Text(ItemOwnMW, "[$-en-US]#,##0.0") & " MW.";

      // power/design-work-flow.md, section 7: the Delivery tab. Mark released has no gate, but it
      // warns when components are still open and names how many; a component is open until its
      // own state has reached the Release phase. Releasing anyway is allowed and recorded.
      ItemOpenComponents =
          CountRows(Filter(WorkStatusTable, 'Part of'.Title = varItem.Title,
                           ItemPhase <> "Release"));
      ItemDeliveryOpenWarning =
          If(ItemOpenComponents = 0, "",
             Text(ItemOpenComponents, "[$-en-US]#,##0") & " component"
             & If(ItemOpenComponents = 1, "", "s") & " still open.");

      // A spike ends at Concluded and a feature at Released (section 8). Both leave Delivery on
      // the Release phase; the words differ, and so does the state, because a concluded spike is
      // finished work and a released feature still owes its actuals.
      ItemDeliveryIsSpike    = varItem.Kind = 'Kind (Work items)'.Spike;
      ItemDeliveryActionText = If(ItemDeliveryIsSpike, "Mark concluded", "Mark released");
      ItemDeliveryDoneWord   = If(ItemDeliveryIsSpike, "concluded", "released");
      ItemDeliveryAfterStage = If(ItemDeliveryIsSpike, "Concluded", "Release");
      ItemDeliveryState      =
          If(ItemDeliveryIsSpike,
             LookUp('Work states', State = "Done"),
             LookUp('Work states', State = "Released"));

      // Adding a component to an item that has left Delivery is refused; the line beside the
      // button says why.
      ItemDeliveryAddNote =
          If(ItemComponentsEditable, "",
             ItemStage = "Realised",
             "This item is released. Reopen it before adding a component.",
             "Components are added while the item is in delivery.");

      // The components list with each component's own state on the row, which is what the state
      // dropdown on the Delivery tab reads and writes back.
      ItemDeliveryComponents =
          ForAll(ItemChildren As C,
                 { Title: C.Title, Skill: C.Skill, Size: C.Size, MW: C.MW,
                   Sprints: C.Sprints, Status: C.Status,
                   StateName: Coalesce(LookUp(colWork, Title = C.Title).State.State, "") });

      // The assignment rows against one item, one entry a person, oldest booking first:
      // wp_assignment is the single write path for people (design-work-flow-rev2.md section 7).
      ItemAssignees =
          ForAll(Distinct(Sort(Filter(colAssignments,
                                      'Work item'.Title = varItem.Title,
                                      !IsBlank(Person.'Full name')),
                               From),
                          Person.'Full name') As A,
                 { Name: A.Value });
      ItemAssigneeCount   = CountRows(ItemAssignees);
      // Every people picker names the squad before the person, so two people with the same
      // first name are told apart without opening the row. DisplayLabel is the column the
      // pickers bind ItemDisplayText to; Value stays the name every write reads back.
      // The list reads in the order it is shown in, so it is sorted on DisplayLabel and not on the
      // name behind it.
      ItemAssigneeOptions =
          Sort(
              ForAll(colPeople As P,
                     { Value: P.'Full name',
                       Id: Text(P.'Person id'),
                       DisplayLabel: If(IsBlank(P.Squad.'Squad name'), P.'Full name',
                                        P.Squad.'Squad name' & " · " & P.'Full name') }),
              DisplayLabel);

      // capacityCheck.ts, as far as a named formula reaches: what the item charges this quarter
      // against what its assignees still have free. The per-week finish walk stays out.
      ItemCheckFree =
          ForAll(ItemAssignees As A,
                 { Name: A.Name, Free: Coalesce(LookUp(PeopleTable, Name = A.Name).Free, 0) });
      ItemCheckAvailable = Coalesce(Sum(ItemCheckFree, Free), 0);
      ItemCheckRequired  = ItemMWThisQuarter;
      ItemCheckFits      = ItemCheckRequired <= ItemCheckAvailable;
      ItemCheckWhyNot =
          If(IsBlank(varItem.'Absolute start sprint'), "No sprint span yet",
             ItemAssigneeCount = 0, "Nobody assigned yet",
             ItemChildCount > 0, "Its components carry the work.",
             ItemCheckRequired <= 0, "No MW on this item yet",
             "");
      ItemCheckLine =
          Text(ItemCheckRequired, "[$-en-US]#,##0.0") & " MW of work against "
          & Text(ItemCheckAvailable, "[$-en-US]#,##0.0") & " MW free · "
          & If(ItemCheckFits, "fits",
               Text(ItemCheckRequired - ItemCheckAvailable, "[$-en-US]#,##0.0") & " MW short");

      // =====================================================================
      // capacityCheck.ts: the finish walk for varItem, the CapacityWalk region.
      //
      // The walk the PARKED note above said needed a function. It does not: the per-assignee,
      // per-week table is one flat ForAll over a Sequence of assignee x week slots, and the
      // running total is a Sum over that same table filtered to the weeks up to the row's own.
      // Quadratic in the week count and bounded by the timeline's 52, so it stays in the app.
      //
      // Nothing here takes an argument, so it reads varItem alone. The per-row walk a Decisions
      // row wants is a later unit: a precomputed WalkByItem table, one row per work item, if the
      // cost of walking every row proves bearable. Command.pa.yaml is untouched by this.
      // =====================================================================

      // capacityCheck.ts: the unique assignees, and the even share of the item's MW each owes.
      ItemWalkNames = Distinct(Filter(ItemAssignees, Name <> ""), Name);
      ItemWalkCount = CountRows(ItemWalkNames);
      ItemWalkShare = ItemMWThisQuarter / Max(1, ItemWalkCount);

      ItemWalkPeople =
          ForAll(ItemWalkNames As N,
              With({ P: LookUp(PeopleTable, Name = N.Value) },
                  { Name: N.Value,
                    Region: P.Region,
                    Dpw: Coalesce(P.Dpw, MWDays),
                    Modifier: Coalesce(P.Modifier, 0) }));

      // capacityCheck.ts itemSpan() clipped to the quarter, then the timeline weeks it covers:
      // the walk opens on the item's first week and runs to the end of the planning horizon.
      ItemWalkStartSprint = Max(Coalesce(ItemStatusRow.FirstSprintNum, 0), FirstSprint);
      ItemWalkEndSprint   = Coalesce(ItemStatusRow.LastSprintNum, -1);
      ItemWalkStart       = DateAdd(Epoch, (ItemWalkStartSprint - 1) * SprintDays, TimeUnit.Days);
      ItemWalkEnd         = DateAdd(Epoch, Min(ItemWalkEndSprint, LastSprint) * SprintDays - 1,
                                    TimeUnit.Days);
      ItemWalkFirstWeek   = Max(1, CountRows(Filter(TimelineWeeks, Monday <= ItemWalkStart)));
      ItemWalkLastWeek    = Min(WeekCount,
                                Max(ItemWalkFirstWeek,
                                    CountRows(Filter(TimelineWeeks, Monday <= ItemWalkEnd))));
      ItemWalkWeekCount   = Max(0, WeekCount - ItemWalkFirstWeek + 1);

      // capacity.ts freeFor(), a week at a time: the days the person has that week less the days
      // their other bookings take, never more than the capacity they have that week. The week
      // rule is TlQuarterCells' own - contracted days less bank holidays and leave, the bookings
      // as a union capped at five - with the item's own bookings handed back, because the item
      // is not competing with itself. One flat row per assignee per week: a table in a column
      // cannot be filtered, and the running total below has to filter.
      ItemWalkFree =
          ForAll(Sequence(ItemWalkCount * ItemWalkWeekCount, 0) As S,
              With({ P: Index(ItemWalkPeople,
                              RoundDown(S.Value / Max(1, ItemWalkWeekCount), 0) + 1),
                     K: ItemWalkFirstWeek + Mod(S.Value, Max(1, ItemWalkWeekCount)) },
                  With({ mon: DateAdd(TimelineMonday0, (K - 1) * 7, TimeUnit.Days) },
                      With({ fri: DateAdd(mon, 4, TimeUnit.Days) },
                          With({ bh: CountRows(Filter(BankHolidayDayRows,
                                                      RegionName = P.Region,
                                                      D >= mon, D <= fri)),
                                 leave: Coalesce(
                                            Sum(Filter(AbsenceQuarterTable,
                                                       PersonName = P.Name,
                                                       From <= fri, To >= mon) As A,
                                                Max(0, Min(5, DateDiff(
                                                    If(A.From > mon, A.From, mon),
                                                    If(A.To < fri, A.To, fri),
                                                    TimeUnit.Days) + 1))),
                                            0),
                                 booked: Coalesce(
                                             Sum(Filter(TlTypedBookings,
                                                        Person = P.Name,
                                                        From <= fri, To >= mon) As B,
                                                 Max(0, Min(5, DateDiff(
                                                     If(B.From > mon, B.From, mon),
                                                     If(B.To < fri, B.To, fri),
                                                     TimeUnit.Days) + 1))),
                                             0)
                                         + Coalesce(
                                             Sum(Filter(TlLiveAutoBookings,
                                                        Person = P.Name,
                                                        From <= fri, To >= mon) As B,
                                                 Max(0, Min(5, DateDiff(
                                                     If(B.From > mon, B.From, mon),
                                                     If(B.To < fri, B.To, fri),
                                                     TimeUnit.Days) + 1))),
                                             0),
                                 own: Coalesce(
                                          Sum(Filter(TlTypedBookings,
                                                     Person = P.Name, Item = varItem.Title,
                                                     From <= fri, To >= mon) As B,
                                              Max(0, Min(5, DateDiff(
                                                  If(B.From > mon, B.From, mon),
                                                  If(B.To < fri, B.To, fri),
                                                  TimeUnit.Days) + 1))),
                                          0)
                                      + Coalesce(
                                          Sum(Filter(TlLiveAutoBookings,
                                                     Person = P.Name, Item = varItem.Title,
                                                     From <= fri, To >= mon) As B,
                                              Max(0, Min(5, DateDiff(
                                                  If(B.From > mon, B.From, mon),
                                                  If(B.To < fri, B.To, fri),
                                                  TimeUnit.Days) + 1))),
                                          0) },
                              With({ avail: Max(0, P.Dpw
                                                   - If(LogAbsences,
                                                        (bh + leave) * P.Dpw / MWDaysOr1, 0)),
                                     assigned: Min(5, booked) },
                                  { Person: P.Name,
                                    Week: K,
                                    Free: Min(avail,
                                              Max(0, Max(avail, assigned)
                                                     - Max(0, booked - own)))
                                          * (1 - P.Modifier) / MWDaysOr1 }))))));

      // The same rows with the running free capacity on them, week by week, per assignee.
      ItemWalkWeeks =
          ForAll(ItemWalkFree As R,
                 { Person: R.Person,
                   Week: R.Week,
                   Free: R.Free,
                   Cum: Coalesce(Sum(Filter(ItemWalkFree, Person = R.Person, Week <= R.Week),
                                     Free), 0) });

      // capacityCheck.ts: each assignee finishes in the first week their running free capacity
      // covers their share, and never is a blank. Available is what they have by the end of the
      // item's own span, which is the figure the card shows beside the share.
      ItemWalkFinishByPerson =
          ForAll(ItemWalkPeople As P,
              With({ hit: First(Sort(Filter(ItemWalkWeeks,
                                            Person = P.Name, Cum >= ItemWalkShare), Week)) },
                  { Person: P.Name,
                    Share: ItemWalkShare,
                    Available: Coalesce(Sum(Filter(ItemWalkWeeks, Person = P.Name,
                                                   Week <= ItemWalkLastWeek), Free), 0),
                    FinishWeek: hit.Week,
                    FinishText: If(IsBlank(hit.Week), "Never",
                                   "w" & hit.Week & " - "
                                   & Text(DateAdd(TimelineMonday0, (hit.Week - 1) * 7 + 4,
                                                  TimeUnit.Days), "d mmm")) }));

      // The item finishes on the latest of them, and not at all if one of them never does.
      ItemWalkFinishWeek =
          If(ItemWalkCount = 0
             || CountRows(Filter(ItemWalkFinishByPerson, IsBlank(FinishWeek))) > 0,
             Blank(),
             Max(ItemWalkFinishByPerson, FinishWeek));

      // The Friday of the finish week, and the sprint it falls in. The sprint is counted from the
      // epoch rather than read off SprintGrid, because the walk runs past the quarter's last
      // sprint and SprintGrid stops there.
      ItemWalkFinishFriday =
          If(IsBlank(ItemWalkFinishWeek), Blank(),
             DateAdd(TimelineMonday0, (ItemWalkFinishWeek - 1) * 7 + 4, TimeUnit.Days));
      ItemWalkFinishSprint =
          If(IsBlank(ItemWalkFinishWeek), Blank(),
             RoundDown(DateDiff(Epoch, ItemWalkFinishFriday, TimeUnit.Days) / SprintDaysOr1, 0) + 1);
      ItemWalkSlip =
          If(IsBlank(ItemWalkFinishSprint), Blank(),
             Max(0, ItemWalkFinishSprint - ItemWalkEndSprint));
      ItemWalkOver = Coalesce(ItemWalkSlip, 0) > 0;

      ItemWalkSays =
          If(ItemWalkCount = 0, "Nobody assigned yet",
             ItemWalkShare <= 0, "No MW on this item yet",
             IsBlank(ItemWalkFinishSprint), "Never finishes with current assignees",
             ItemWalkOver,
                 "Finishes S" & ItemWalkFinishSprint & " ("
                 & Text(ItemWalkFinishFriday, "d mmm") & "), " & ItemWalkSlip
                 & If(ItemWalkSlip = 1, " sprint late", " sprints late"),
             "Fits: finishes S" & ItemWalkFinishSprint);

      // The card on the Assess tab: its own row height, the four column shares, and the width of
      // the badge that sits beside the Commit button when the walk says the item lands late.
      ItemWalkRowH     = TypeBodyLine + 4;
      ItemWalkColName  = 0.40;
      ItemWalkColShare = 0.18;
      ItemWalkColFree  = 0.20;
      ItemWalkColWeek  = 0.22;
      ItemWalkBadgeW   = 124;

      // power/design-work-flow.md, section 6: the capacity card's heading line. Three figures,
      // not a verdict: what the item's own size charges, what its assignments have taken up
      // between them, and what is left over with nobody against it. The share here is over the
      // item's whole sprint span, the span ItemOwnMW covers, rather than the walk's
      // quarter-clipped one, so the three figures are on the same footing and add up. A parent
      // carries no work of its own, so its split says what the capacity check says.
      ItemOwnShare     = ItemOwnMW / Max(1, ItemWalkCount);
      ItemAssignedMW   = If(ItemWalkCount = 0, 0, ItemOwnShare * ItemWalkCount);
      ItemUnassignedMW = ItemOwnMW - ItemAssignedMW;
      ItemCapacitySplit =
          If(ItemChildCount > 0, "Its components carry the work.",
             ItemOwnMW <= 0, "No size yet",
             Text(ItemOwnMW, "[$-en-US]#,##0.0") & " MW from "
             & If(!IsBlank(varItem.'MW override'), "an override",
                  "size " & varItem.Size.Size)
             & " · " & Text(ItemAssignedMW, "[$-en-US]#,##0.0") & " MW assigned to people"
             & " · " & Text(ItemUnassignedMW, "[$-en-US]#,##0.0") & " MW unassigned");

      // =====================================================================
      // The Value tab: one claim row per benefits column, and what the item is worth in-year.
      // =====================================================================
      ItemClaimRowT = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.T);
      ItemClaimRowU = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.U);
      ItemClaimRowV = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.V);
      ItemClaimRowW = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.W);
      ItemClaimRowX = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.X);
      ItemClaimRowY = LookUp('Benefit claims', 'Work item'.'Work item id' = varItem.'Work item id'
                             && 'Benefits column' = 'Benefits column (Benefit claims)'.Y);

      ItemClaimT = Coalesce(ItemClaimRowT.'Claimed value', 0);
      ItemClaimU = Coalesce(ItemClaimRowU.'Claimed value', 0);
      ItemClaimV = Coalesce(ItemClaimRowV.'Claimed value', 0);
      ItemClaimW = Coalesce(ItemClaimRowW.'Claimed value', 0);
      ItemClaimX = Coalesce(ItemClaimRowX.'Claimed value', 0);
      ItemClaimY = Coalesce(ItemClaimRowY.'Claimed value', 0);

      ItemInYear   = Coalesce(ItemStatusRow.BenefitInYearValue, 0);
      ItemRate     = Coalesce(ItemStatusRow.GradeRate, 0);
      ItemRecorded =
          Coalesce(Sum(Filter(colActuals, 'Work item'.Title = varItem.Title), 'Actual value'), 0);
      ItemLandsText = Coalesce(ItemStatusRow.LandsText, "No month yet");
      ItemValueLine =
          "In-year £" & Text(ItemInYear, "[$-en-US]#,##0") & " · recorded £"
          & Text(ItemRecorded, "[$-en-US]#,##0") & " · rate £"
          & Text(ItemRate, "[$-en-US]#,##0") & " per FTE";

      // power/design-work-flow.md, section 8: the claim rows the Value tab is made of. One row per
      // benefit claim the item carries, each beside its latest actual. An actual is never edited: a
      // new one supersedes by date and the older ones stay as history (power/decisions.md, decision
      // 17), so the row carries the newest When and counts what it supersedes. The figures stay
      // numbers and dates here and are worded in the gallery, because Text() with a format string
      // inside this ForAll loses the row type the Validate gate then filters on.
      //
      // The order the rows read in is the one the Benefits screen names the types in, so the
      // seven claims sit in the same sequence everywhere.
      ItemValueTypeOrder =
          ForAll(Sequence(CountRows(BenefitsTypeList)) As N,
                 { Type: Index(BenefitsTypeList, N.Value).Type, Seq: N.Value });

      // Only the claims that were actually made: a type left at zero and never recorded against is
      // not a claim, so it is not a row here and the Validate gate does not ask for an actual
      // against it.
      ItemValueClaimRows =
          Sort(
              Filter(
              ForAll(Filter(colClaims, 'Work item'.Title = varItem.Title) As C,
                     With({ acts: Sort(Filter(colActuals,
                                              Claim.'Benefit claim id' = C.'Benefit claim id'),
                                       When, SortOrder.Descending) },
                          With({ n: CountRows(acts) },
                               { ClaimId: C.'Benefit claim id',
                                 Type:    Text(C.'Benefit type'),
                                 Claimed: Coalesce(C.'Claimed value', 0),
                                 Actuals: n,
                                 Latest:  Coalesce(First(acts).'Actual value', 0),
                                 When:    First(acts).When,
                                 Note:    Coalesce(First(acts).Note, ""),
                                 Seq:     Coalesce(LookUp(ItemValueTypeOrder,
                                                          Type = Text(C.'Benefit type')).Seq,
                                                   99) }))),
              Claimed <> 0 || Actuals > 0),
              Seq);
      ItemValueClaimCount = CountRows(ItemValueClaimRows);

      // Two lines to a row: what the claim is worth beside its latest actual, then the controls
      // that record the next one.
      ItemValueRowH  = TypeBodyLine + ControlHeight + 12;
      ItemValueListH = ItemValueRowH * Min(ItemValueClaimCount, 4);

      // Which items have a Value tab at all, and when its actuals can be recorded. Only a feature
      // is asked for actuals; a spike concludes instead (section 4). A correction after Validated
      // is a new actual, so recording stays open there as well as in Release.
      ItemValueVisible =
          varItem.Kind = 'Kind (Work items)'.Feature
          && (ItemPhaseEffective = 'Phase (Work items)'.Release
              || ItemPhaseEffective = 'Phase (Work items)'.Validated);
      ItemValueRecordable = ItemValueVisible;
      ItemValueWhenDefault = Text(Today(), "[$-en-US]yyyy-mm-dd");

      // power/design-work-flow.md, section 8: the Validate gate. Every claim needs an actual, and
      // ItemValidateMissing is the line beside the disabled button, naming the claims that lack
      // one. It is blank when the item is ready.
      ItemValidateGaps    = Filter(ItemValueClaimRows, Actuals = 0);
      ItemValidateMissing =
          If(ItemValueClaimCount = 0, "Needs a benefit claim.",
             CountRows(ItemValidateGaps) = 0, "",
             "Needs an actual for " & Concat(ItemValidateGaps, Type, ", ") & ".");
      ItemValidateReady = IsBlank(ItemValidateMissing);

      // power/design-work-flow.md, section 3: the Next step card in the right rail. One forward
      // action is offered at a time, so the card asks whether this stage has one at all and what
      // stands in its way. The words are each gate's own, so the card and the tab never disagree.
      ItemNextForward =
          ItemShapeEditable || ItemAssessEditable || ItemComponentsEditable
          || ItemPhaseEffective = 'Phase (Work items)'.Release;
      ItemNextGap =
          Switch(ItemStage,
                 "Shaping",    ItemIntakeMissing,
                 "Assessment", ItemCommitMissing,
                 "Delivery",   ItemDeliveryOpenWarning,
                 "Realised",   ItemValidateMissing,
                 "");
      ItemNextReady =
          Switch(ItemStage,
                 "Shaping",    ItemIntakeReady,
                 "Assessment", ItemCommitReady,
                 "Delivery",   ItemOpenComponents = 0,
                 "Realised",   ItemValidateReady,
                 true);

      // Reopen is not on this tab: it is in the Next step card, on ItemReopen*, because a stopped
      // item's tabs are all read-only and the Value tab is not one a stopped spike has at all.

      // =====================================================================
      // The Activity tab: what has happened to the item. Two sources: the item's own columns,
      // which carry no time, and the Activity log rows written against it, which do.
      // =====================================================================

      // The log's own rows for this item, newest first. The log holds the item by name, in
      // 'Record name', which is the column scrWorkItem's stage moves write, and the column
      // colItemActivity is collected on: scrWorkItem fills it on open and after every write.
      ItemActivityLog =
          Sort(Filter(colItemActivity, 'Record name' = varItem.Title), At, SortOrder.Descending);

      // What the item's columns say happened, in the order the workbook reads them. None of these
      // carries a time, so they sit under the logged rows rather than among them.
      ItemActivityFacts =
          Filter(
              Table(
                  { Seq: 1,
                    Line: "Converted from the spike "
                          & Coalesce(varItem.'Converted from'.Title, "") & ".",
                    Show: !IsBlank(varItem.'Converted from') },
                  { Seq: 2,
                    Line: "Concluded " & Text(varItem.'Spike outcome')
                          & If(IsBlank(varItem.Findings), ".", ": " & varItem.Findings),
                    Show: !IsBlank(varItem.'Spike outcome') },
                  { Seq: 3,
                    Line: "Converted to the feature "
                          & Coalesce(varItem.'Converted to'.Title, "") & ".",
                    Show: !IsBlank(varItem.'Converted to') },
                  { Seq: 4,
                    Line: "Delivered in sprint S" & varItem.'Done in sprint' & ".",
                    Show: !IsBlank(varItem.'Done in sprint') },
                  { Seq: 5,
                    Line: "Cancelled: " & Coalesce(varItem.'Cancellation reason', ""),
                    Show: !IsBlank(varItem.'Cancellation reason') },
                  { Seq: 6,
                    Line: "Archived in "
                          & Coalesce(varItem.'Archived in quarter'.Label, "") & ".",
                    Show: !IsBlank(varItem.'Archived in quarter') }),
              Show);

      // The two as one list, the logged rows first and each of those already in At order,
      // descending. Table() takes records rather than tables and Ungroup is not a function the
      // offline checker carries, so the two are walked as one Sequence and Index picks the row out
      // of whichever of them the position falls in, the same shape as SearchIndex.
      ItemActivity =
          With({ nl: CountRows(ItemActivityLog) },
              ForAll(Sequence(nl + CountRows(ItemActivityFacts)) As N,
                  If(N.Value <= nl,
                     With({ L: Index(ItemActivityLog, N.Value) },
                         { Seq: 0,
                           At: L.At,
                           Line: Coalesce(L.Summary, L.Label) }),
                     With({ F: Index(ItemActivityFacts, N.Value - nl) },
                         { Seq: F.Seq,
                           At: Blank(),
                           Line: F.Line }))));
      ItemActivityCount = CountRows(ItemActivity);

      // =====================================================================
      // Team.tsx: the people, the squads they sit in, the leave that comes off their capacity and
      // the capacity held back before the detailed work is known.
      // =====================================================================

      // The pivot. varTeamTab is blank until the tab list is touched, and People is the view the
      // screen opens on, so every Visible reads this rather than the variable.
      TeamTab = If(IsBlank(varTeamTab), "People", varTeamTab);

      // The four tables, each sorted on its own first column. Every one of them is an in-memory
      // table built above, so the sort column is the name the record carries.
      // The roster narrows to one squad while varTeamSquad holds a name: Command navigates here
      // with it set, the Squads tab sets it, and the chip above the table clears it.
      TeamSquadFilter = !IsBlank(varTeamSquad);
      TeamPeopleRows      = SortByColumns(Filter(PeopleTable,
                                                 IsBlank(varTeamSquad) || Squad = varTeamSquad),
                                          "Name", SortOrder.Ascending);
      TeamSquadRows       = SortByColumns(SquadTable, "Name", SortOrder.Ascending);
      // AbsenceQuarterTable is the quarter's rows only, which is right for the MW it charges and
      // wrong for a roster grid: an absence booked for next quarter would simply not be listed.
      // The grid reads every absence on the record, most recent first.
      TeamAbsenceRowsAll =
          SortByColumns(AddColumns(colAbsences,
                                   PersonName, Person.'Full name',
                                   TypeName, 'Absence type'.Value,
                                   Sick, StartsWith(Lower('Absence type'.Value), "sick"),
                                   // SortByColumns takes the name as text, so the date is
                                   // projected onto a column of this table's own naming first.
                                   FromDate, From),
                        "FromDate", SortOrder.Descending);
      TeamReservationRows =
          SortByColumns(Filter(ReservationRows, Quarter = CurrentQuarter.Label),
                        "Squad", SortOrder.Ascending);

      // The band's four figures.
      TeamPeopleCount  = PlannedPeopleCount;
      TeamSquadCount   = CountRows(colSquads);
      TeamInSquadCount = CountRows(Filter(PlannedPeople, !IsBlank(Squad)));
      TeamLedCount     = CountRows(Filter(colSquads, !IsBlank(Lead)));
      TeamAbsenceDays  = Coalesce(Sum(PeopleTable, AbsenceDays), 0);

      // What the add button says and records, and the count line under the table, all follow the
      // tab rather than being repeated on four controls.
      TeamAddLabel =
          Switch(TeamTab, "Squads", "Add squad", "Absences", "Add absence",
                 "Reservations", "Add reservation", "Add person");

      TeamCountLine =
          Switch(TeamTab,
                 "Squads", CountRows(TeamSquadRows) & If(CountRows(TeamSquadRows) = 1, " squad", " squads"),
                 "Absences", CountRows(TeamAbsenceRowsAll) & If(CountRows(TeamAbsenceRowsAll) = 1, " absence", " absences"),
                 "Reservations", CountRows(TeamReservationRows) & If(CountRows(TeamReservationRows) = 1, " reservation", " reservations"),
                 // the roster lists its open vacancies, because this is where they are filled, but
                 // it counts them as open roles: only PlannedPeople are people (see PlannedPeople).
                 With({ n: CountRows(Filter(TeamPeopleRows, Vacancy <> true)),
                        v: CountRows(Filter(TeamPeopleRows, Vacancy)) },
                     n & If(n = 1, " person", " people")
                     & If(v = 0, "", " · " & v & If(v = 1, " open role", " open roles"))));

      // The four grids, in one place. Every column is a named share of the container that holds the
      // cells, with a pixel minimum, the shares summing to 1, and the header cells and the row cells
      // read the same share and minimum (power/RUNBOOK.md, "Table columns"). Only the shares and the
      // minimums are named; the widths themselves are worked out in the screen against Parent.Width,
      // so no cell can overshoot the card it sits in.

      // The row a person takes: the name over the role, two lines and the padding between them.
      TeamPeopleRowH = TypeBodyLine + TypeLabelLine + 8;
      TeamAvatarSize = TeamPeopleRowH - 24;
      TeamNameX      = TeamAvatarSize + 8;

      // People: name and role 0.20, lead 0.06, squad 0.10, grade 0.06, skills 0.22, days per week
      // 0.07, region 0.08, modifier 0.06, and the three member-week figures 0.05 each.
      TeamShareName     = 0.20;
      TeamShareLead     = 0.06;
      TeamShareSquad    = 0.10;
      TeamShareGrade    = 0.06;
      TeamShareSkills   = 0.22;
      TeamShareDpw      = 0.07;
      TeamShareRegion   = 0.08;
      TeamShareModifier = 0.06;
      TeamShareNet      = 0.05;
      TeamShareBooked   = 0.05;
      TeamShareFree     = 0.05;
      TeamMinName     = 220;
      TeamMinLead     = 70;
      TeamMinSquad    = 110;
      TeamMinGrade    = 70;
      TeamMinSkills   = 220;
      TeamMinDpw      = 80;
      TeamMinRegion   = 90;
      TeamMinModifier = 80;
      TeamMinNet      = 76;
      TeamMinBooked   = 76;
      TeamMinFree     = 76;
      // Every column at its pixel minimum: below this the roster scrolls sideways inside its card
      // rather than squeezing a cell (power/RUNBOOK.md, "Responsive breakpoints").
      TeamPeopleColsW = TeamMinName + TeamMinLead + TeamMinSquad + TeamMinGrade + TeamMinSkills
                        + TeamMinDpw + TeamMinRegion + TeamMinModifier + TeamMinNet
                        + TeamMinBooked + TeamMinFree;

      // Squads: name 0.20, lead 0.16, remit 0.30, people 0.07, net 0.09, committed 0.09,
      // utilisation 0.09.
      TeamSqShareName      = 0.20;
      TeamSqShareLead      = 0.16;
      TeamSqShareRemit     = 0.30;
      TeamSqSharePeople    = 0.07;
      TeamSqShareNet       = 0.09;
      TeamSqShareCommitted = 0.09;
      TeamSqShareUtil      = 0.09;
      TeamSqMinName      = 200;
      TeamSqMinLead      = 160;
      TeamSqMinRemit     = 260;
      TeamSqMinPeople    = 80;
      TeamSqMinNet       = 90;
      TeamSqMinCommitted = 100;
      TeamSqMinUtil      = 110;
      TeamSquadColsW = TeamSqMinName + TeamSqMinLead + TeamSqMinRemit + TeamSqMinPeople
                       + TeamSqMinNet + TeamSqMinCommitted + TeamSqMinUtil;

      // Absences: person 0.22, type 0.14, from 0.12, to 0.12, note 0.40.
      TeamAbSharePerson = 0.22;
      TeamAbShareType   = 0.14;
      TeamAbShareFrom   = 0.12;
      TeamAbShareTo     = 0.12;
      TeamAbShareNote   = 0.40;
      TeamAbMinPerson = 220;
      TeamAbMinType   = 140;
      TeamAbMinFrom   = 120;
      TeamAbMinTo     = 120;
      TeamAbMinNote   = 260;
      TeamAbsenceColsW = TeamAbMinPerson + TeamAbMinType + TeamAbMinFrom + TeamAbMinTo
                         + TeamAbMinNote;

      // =====================================================================
      // src/pages/Benefits.tsx: the roll-up, the calendar, the actuals and the benefit types.
      // =====================================================================

      // The screen is the calendar alone (power/decisions.md, decision 9 of 20 September 2026
      // evening): the tab list is gone, so the pivot is fixed here and the three hidden tables
      // keep their Visible on a value nothing can now set. The FTE | pounds toggle still writes
      // varBenefitsMeasure, and opens on FTE before it has been touched.
      BenefitsTab     = "Benefits calendar";
      BenefitsMeasure = If(IsBlank(varBenefitsMeasure), "FTE", varBenefitsMeasure);

      // ---------------------------------------------------------------------
      // The band: what the plan claims this year, what has been recorded, and how reliable the plan
      // behind it has been.
      // ---------------------------------------------------------------------
      BenefitsGap       = GbpInYear - RecordedTotal;
      BenefitsFteInPlan = Coalesce(Sum(Filter(WorkStatusTable, InPlanFlag), 'FTE released'), 0);

      // The FTE actually recorded against an item in the plan. An actual against work outside the plan
      // is left out, which is what the page's own filter does.
      BenefitsFteRecorded =
          Coalesce(
              Sum(ForAll(Filter(colActuals,
                                'Benefit type' = 'Benefit type (Benefit actuals)'.'FTE released') As A,
                      With({ t: A.'Work item'.Title },
                          If(IsBlank(LookUp(WorkStatusTable, Title = t && InPlanFlag)), 0,
                             Coalesce(A.'Actual value', 0)))) As R,
                  R.Value),
              0);

      BenefitsReliability = If(Coalesce(InPlanMW, 0) = 0, 0, Coalesce(DeliveredMW, 0) / InPlanMW);

      // ---------------------------------------------------------------------
      // The benefits calendar: the tab's whole content, and the one table the section is built around.
      // One row per work item in the plan, twelve month cells across it, the FTE the product owner
      // claimed carried from the month the item lands in to December.
      //
      // Power Fx has no dynamic column access, so the month a cell prints cannot be picked out of twelve
      // flat M1..M12 columns by index, and a control inside a nested gallery cannot read the enclosing
      // gallery's row. The twelve values therefore travel as a Cells table on the row itself, which is
      // what the inner gallery binds its Items to; each cell carries both readings, already written.
      // ---------------------------------------------------------------------
      // The calendar's rows before any formatting: every column is still a number, a date, a flag or
      // plain text, so this is the table the count line filters and the gallery's order is sorted on.
      // Landing month first, title second; a claim with no landing month falls to the end.
      BenefitsCalendarBase =
          SortByColumns(
              AddColumns(
                  Filter(BenefitCalendarRows,
                         InPlan,
                         FteInYear <> 0 || GbpInYear <> 0 || (IsBlank(Lands) && FteClaimed <> 0)),
                  LandIndex, Coalesce(Min(Filter(Months, Fte <> 0 || Ca <> 0), Month), 13),
                  Dated, !IsBlank(Lands)),
              "LandIndex", SortOrder.Ascending, "Title", SortOrder.Ascending);

      BenefitsCalendarRows =
          ForAll(BenefitsCalendarBase As R,
              With({ ms: R.Months, rate: R.GradeRate },
                  With({ idx: R.LandIndex },
                      With({ cells:
                                 ForAll(ms As M,
                                     With({ live: M.Month >= idx,
                                            money: M.Fte * rate / 12 + M.Ca,
                                            name: LookUp(MonthTable, Num = M.Month).Name },
                                         { Num: M.Month,
                                           Name: name,
                                           Live: live,
                                           Lands: M.Month = idx,
                                           Band: Mod(M.Month, 2) = 1,
                                           CellText:
                                               If(!live, "",
                                                  BenefitsMeasure = "FTE",
                                                  If(Abs(M.Fte) < 0.05, "·",
                                                     Text(M.Fte, "[$-en-US]#,##0.0")),
                                                  If(Abs(money) < 0.5, "·",
                                                     "£" & Text(money, "[$-en-US]#,##0"))),
                                           CellTip:
                                               If(!live,
                                                  name & " " & Text(BenefitYear, "[$-en-US]0000")
                                                  & ": nothing live yet",
                                                  name & " " & Text(BenefitYear, "[$-en-US]0000")
                                                  & " · " & Text(M.Fte, "[$-en-US]#,##0.0")
                                                  & " FTE · £" & Text(money, "[$-en-US]#,##0")
                                                  & " this month · £"
                                                  & Text(R.GbpInYear, "[$-en-US]#,##0")
                                                  & " in-year") })) },
                          { Title: R.Title,
                            Caption: Coalesce(R.Squad, "No squad") & " · "
                                     & If(IsBlank(R.Lands), "not yet dated", "lands " & R.Lands)
                                     & " · £" & Text(R.GbpInYear, "[$-en-US]#,##0"),
                            LandIndex: idx,
                            Dated: R.Dated,
                            FteInYear: R.FteInYear,
                            GbpInYear: R.GbpInYear,
                            State: R.State,
                            Stopped: R.Stopped,
                            Cells: cells }))));

      // The month the calendar marks as now, or none when today sits outside the benefit year.
      BenefitsCalendarNow = If(Year(Today()) = BenefitYear, Month(Today()), 0);

      // The twelve column heads. The current month is named as well as coloured, so the mark is not the
      // colour alone.
      BenefitsCalendarHead =
          ForAll(MonthTable As M,
                 { Num: M.Num,
                   Name: M.Name & If(M.Num = BenefitsCalendarNow, " · now", ""),
                   Now: M.Num = BenefitsCalendarNow,
                   Band: Mod(M.Num, 2) = 1,
                   Label: M.Name & " " & Text(BenefitYear, "[$-en-US]0000")
                          & If(M.Num = BenefitsCalendarNow, ", this month", "") });

      // The totals row under the calendar: the plan by month, both readings on the row. The footer's
      // twelve cells are fixed controls, so each one formats the reading the toggle asks for; the
      // table itself stays numeric, which is what lets the screen look a month up on it.
      BenefitsCalendarFooter =
          ForAll(BenefitCalendarTotals As T,
                 { Num: T.Month,
                   Band: Mod(T.Month, 2) = 1,
                   FteLive: T.FteLive,
                   Gbp: T.Gbp });

      BenefitsCalendarFooterLabel = If(BenefitsMeasure = "FTE", "FTE live", "£ in-year");

      // The year-end reading the calendar is judged against, as one line.
      BenefitsCalendarYearEnd =
          With({ cum: Coalesce(LookUp(BenefitCalendarCumulative, Month = 12).GbpCumulative, 0),
                 target: Coalesce(LookUp(BenefitCalendarTotals, Month = 12).GbpTarget, 0),
                 fte: Coalesce(LookUp(BenefitCalendarTotals, Month = 12).FteLive, 0) },
              "£" & Text(cum, "[$-en-US]#,##0") & " of £" & Text(target, "[$-en-US]#,##0")
              & " by December · gap £" & Text(cum - target, "[$-en-US]#,##0") & " · "
              & Text(fte, "[$-en-US]#,##0.0") & " FTE live, target "
              & Text(FteTarget, "[$-en-US]#,##0.0"));

      BenefitsCalendarTitle = "Benefits calendar " & Text(BenefitYear, "[$-en-US]0000");

      // ---------------------------------------------------------------------
      // The actuals list.
      // ---------------------------------------------------------------------
      BenefitsActualRows =
          SortByColumns(
              ForAll(colActuals As A,
                     { Title: Coalesce(A.'Work item'.Title, "—"),
                       Type: Text(A.'Benefit type'),
                       Value: Coalesce(A.'Actual value', 0),
                       When: A.When,
                       Note: Coalesce(A.Note, "—") }),
              "Title", SortOrder.Ascending);

      // ---------------------------------------------------------------------
      // By benefit type: the Benefits column each type is claimed in, the work claiming it, and what
      // those claims are worth this year. Only FTE released and cost avoidance carry a pound figure;
      // the rest are worded claims, so their money and recorded cells read as a dash.
      // ---------------------------------------------------------------------
      BenefitsTypeList =
          Table({ Type: "FTE released",      Column: "FTE" },
                { Type: "Cost avoidance",    Column: "T" },
                { Type: "Cycle-time cut",    Column: "U" },
                { Type: "Error reduction",   Column: "V" },
                { Type: "Throughput",        Column: "W" },
                { Type: "Compliance / risk", Column: "X" },
                { Type: "CX / EX uplift",    Column: "Y" });

      // The count line under whichever table is showing.
      BenefitsCountLine =
          Switch(BenefitsTab,
              "Benefits calendar",
                  CountRows(BenefitsCalendarBase) & " work items in the plan, "
                  & CountRows(Filter(BenefitsCalendarBase, Dated)) & " of them dated",
              "Benefits actuals",
                  CountRows(BenefitsActualRows) & " actuals recorded");

      // ---------------------------------------------------------------------
      // power/design-work-flow.md, section 8: the awaiting-validation queue. A released feature owes
      // an actual against every benefit claim it carries and sits here until it has one. The
      // claim-to-actual match is the Value tab's, so the queue and ItemValidateMissing agree: an
      // actual belongs to a claim by 'Benefit claim id', and a claim with no actual row is a gap.
      // The wait runs from the Activity row that moved the item to Release, newest first because
      // Reopen sends an item round again, and from the item's own Modified On when the log has no
      // such row. One formula, read by the Benefits block and by Command's attention line.
      // ---------------------------------------------------------------------
      AwaitingValidationRows =
          Sort(
              Filter(
                  ForAll(Filter(colWork,
                                Kind = 'Kind (Work items)'.Feature,
                                Phase = 'Phase (Work items)'.Release) As W,
                      With({ gaps:
                                 Filter(
                                     ForAll(Filter(colClaims, 'Work item'.Title = W.Title) As C,
                                            { Actuals: CountRows(
                                                  Filter(colActuals,
                                                         Claim.'Benefit claim id'
                                                         = C.'Benefit claim id')) }),
                                     Actuals = 0),
                             at: First(Sort(Filter(colActivity,
                                                   'Record name' = W.Title,
                                                   After = "Release"),
                                            At, SortOrder.Descending)).At },
                          { Title:    W.Title,
                            Owner:    Coalesce(W.'Product owner'.'Full name', "Nobody yet"),
                            Released: Coalesce(at, W.'Modified On'),
                            Missing:  CountRows(gaps) })),
                  Missing > 0),
              Released);
      AwaitingValidationCount = CountRows(AwaitingValidationRows);

      // ---------------------------------------------------------------------
      // The four tables' columns. The calendar and the actuals are share-and-minimum grids, the same
      // shape as the Team registers; the two hidden tables still carry fixed widths the first column
      // grows into.
      // ---------------------------------------------------------------------
      // The row stacks the work item's title over its caption: one body line, one label line,
      // 8px padding, the same row as the work register (WorkRowH).
      BenefitsCalRowH = TypeBodyLine + TypeLabelLine + 8;

      // The calendar is a share-and-minimum grid (power/RUNBOOK.md, "Table columns"): the work item
      // and its caption 0.24, the twelve months 0.045 each, then the three in-year columns. The head
      // row, the rows and the totals row all read this pair, so the cells line up.
      BnCalShareTitle = 0.24;
      BnCalShareMonth = 0.045;
      BnCalShareFte   = 0.06;
      BnCalShareGbp   = 0.08;
      BnCalShareState = 0.08;
      BnCalMinTitle = 240;
      BnCalMinMonth = 52;
      BnCalMinFte   = 64;
      BnCalMinGbp   = 84;
      BnCalMinState = 96;
      BnCalMinW = BnCalMinTitle + BnCalMinMonth * 12 + BnCalMinFte + BnCalMinGbp
                  + BnCalMinState;

      // The awaiting-validation block above the calendar: four columns on one line each, the same
      // share-and-minimum grid. Six rows is as tall as the block grows before it scrolls, so the
      // calendar keeps the rest of the body.
      BnAwaitRowH = TypeBodyLine + 8;
      BnAwaitShareTitle    = 0.40;
      BnAwaitShareOwner    = 0.22;
      BnAwaitShareReleased = 0.18;
      BnAwaitShareMissing  = 0.20;
      BnAwaitMinTitle    = 240;
      BnAwaitMinOwner    = 160;
      BnAwaitMinReleased = 120;
      BnAwaitMinMissing  = 120;
      BnAwaitMinW = BnAwaitMinTitle + BnAwaitMinOwner + BnAwaitMinReleased + BnAwaitMinMissing;
      BnAwaitListH = BnAwaitRowH * Min(AwaitingValidationCount, 6);

      // =====================================================================
      // src/pages/Financials.tsx: what the team costs, what it returns, what each item costs to
      // deliver. People are costed at the blended rate for their team grade, never an individual
      // salary; an open vacancy costs nothing. Cost is shown by funding line; value is never split
      // by funding. Quarter cost is the annual rate over four, matching Financials.tsx exactly (the
      // engine carries no separate quarter/year working-day ratio for cost).
      // =====================================================================

      // value.ts/work.ts: FinInYear and FinRecorded are exactly GbpInYear and RecordedTotal, already
      // filtered to the same "counts or historical" set the page reads. Reused, not recomputed.
      FinInYear   = GbpInYear;
      FinRecorded = RecordedTotal;

      // Financials.tsx annualCost(): a person's grade rate, or nothing for an open vacancy.
      FinPeopleCostTable =
          AddColumns(
              PeopleTable,
              AnnualCost,
              If(Vacancy, 0,
                 Coalesce(LookUp(colTeamGradeCosts, 'Team grade' = Grade).'Annual cost', 0)));

      FinPeopleAnnual  = Coalesce(Sum(FinPeopleCostTable, AnnualCost), 0);
      FinRunningAnnual = Coalesce(Sum(colCostLines, 'Annual cost'), 0);
      FinTCO           = FinPeopleAnnual + FinRunningAnnual;

      // Cost of capacity by squad: SquadTable's own Net and Committed, plus the squad's own people
      // costed at their grade rate. Quarter cost is the annual rate over four.
      FinSquadCostTable =
          ForAll(SquadTable As S,
              With({ annual: Coalesce(Sum(Filter(FinPeopleCostTable, Squad = S.Name), AnnualCost), 0) },
                  With({ quarter: annual / 4 },
                      With({ perMW: If(S.Net = 0, 0, quarter / S.Net) },
                          { Name: S.Name,
                            People: S.People,
                            Annual: annual,
                            Quarter: quarter,
                            Net: S.Net,
                            PerMW: perMW,
                            Committed: S.Committed,
                            DeliveryCost: S.Committed * perMW }))));

      FinSquadRows       = SortByColumns(FinSquadCostTable, "Name", SortOrder.Ascending);
      FinSquadQuarter    = Coalesce(Sum(FinSquadCostTable, Quarter), 0);
      FinSquadNet        = Coalesce(Sum(FinSquadCostTable, Net), 0);
      FinBlendedPerMW = If(FinSquadNet = 0, 0, FinSquadQuarter / FinSquadNet);

      // Cost of capacity by team grade: every grade a person is on, whether or not it has its own
      // cost row, costed at that grade's rate.
      FinGradeList = Distinct(Filter(PeopleTable, Grade <> ""), Grade);

      FinGradeCostTable =
          ForAll(FinGradeList As G,
              With({ grade: G.Value, people: Filter(FinPeopleCostTable, Grade = G.Value) },
                  With({ annual: Coalesce(Sum(people, AnnualCost), 0) },
                      { Grade: grade,
                        People: CountRows(people),
                        Rate: Coalesce(LookUp(colTeamGradeCosts, 'Team grade' = grade).'Annual cost', 0),
                        Annual: annual,
                        Quarter: annual / 4 })));

      FinGradeRows = SortByColumns(FinGradeCostTable, "Grade", SortOrder.Ascending);

      // Cost by funding line: the two cost-table categories from Cost lines, split by funding. Both
      // are local choices on Cost lines, so a line is compared to the qualified member directly, the
      // same pattern as vacancy above, never a bare .Value. The "People in post" row and the total
      // are drawn separately, as fixed rows under the gallery, so every column here stays numeric —
      // no "—" placeholder inside a table column.
      FinFundingCategories =
          Table({ Cat: 'Cost table (Cost lines)'.'Licences and subscriptions',
                   Line: "Licences and subscriptions" },
                { Cat: 'Cost table (Cost lines)'.'Infrastructure and other',
                   Line: "Infrastructure and other" });

      FinFundingRows =
          ForAll(FinFundingCategories As C,
              With({ lines: Filter(colCostLines, 'Cost table' = C.Cat) },
                  { Line: C.Line,
                    Investment: Coalesce(Sum(Filter(lines, 'Funding' = 'Funding (Cost lines)'.Investment),
                                             'Annual cost'), 0),
                    NonInvestment: Coalesce(Sum(Filter(lines, 'Funding' <> 'Funding (Cost lines)'.Investment),
                                                'Annual cost'), 0) }));

      FinFundingInvestment = Coalesce(Sum(FinFundingRows, Investment), 0);
      FinFundingOther      = Coalesce(Sum(FinFundingRows, NonInvestment), 0);

      // Cost per work item: member weeks this quarter at the squad's cost per member week, against
      // the in-year value of what it claims. Counted work only, the same set the squad table draws
      // its committed MW from.
      FinWorkTable =
          ForAll(
              Filter(WorkStatusTable, Counted, WorkMWValue > 0) As W,
              With({ sq: W.Squad.'Squad name', mw: W.WorkMWValue },
                  With({ perMW: Coalesce(LookUp(FinSquadCostTable, Name = sq).PerMW, FinBlendedPerMW) },
                      With({ cost: mw * perMW },
                          { Title: W.Title,
                            Squad: Coalesce(sq, ""),
                            MW: mw,
                            Cost: cost,
                            InYear: W.BenefitInYearValue,
                            Return: If(cost = 0, Blank(), W.BenefitInYearValue / cost) }))));

      FinWorkRows  = SortByColumns(FinWorkTable, "Title", SortOrder.Ascending);
      FinWorkMW    = Coalesce(Sum(FinWorkTable, MW), 0);
      FinWorkCost  = Coalesce(Sum(FinWorkTable, Cost), 0);
      FinWorkValue = Coalesce(Sum(FinWorkTable, InYear), 0);

      // Figures card: value against a year of cost.
      FinReturnOnTco = If(FinTCO = 0, 0, FinInYear / FinTCO);
      FinPaybackMonths = If(FinInYear = 0, Blank(), FinTCO / (FinInYear / 12));

      // ---------------------------------------------------------------------
      // The Financials tables' columns (power/RUNBOOK.md, "Table columns"): every column, including
      // the first, is a named share of the container that holds the cells with a pixel minimum, the
      // shares summing to 1 across each table, and the header cells and the row cells read the same
      // share and minimum. Only the shares and the minimums are named; the widths themselves are
      // worked out in the screen against the table's own width, the same basis as Team.
      // ---------------------------------------------------------------------

      // Squad: name 0.30, the six member-week and cost figures 0.08 to 0.11 each.
      FinSqShareName      = 0.30;
      FinSqSharePeople    = 0.08;
      FinSqShareAnnual    = 0.11;
      FinSqShareQuarter   = 0.11;
      FinSqShareNet       = 0.10;
      FinSqSharePerMW     = 0.10;
      FinSqShareCommitted = 0.10;
      FinSqShareDelivery  = 0.10;
      FinSqMinName      = 220;
      FinSqMinPeople    = 90;
      FinSqMinAnnual    = 100;
      FinSqMinQuarter   = 100;
      FinSqMinNet       = 90;
      FinSqMinPerMW     = 100;
      FinSqMinCommitted = 90;
      FinSqMinDelivery  = 100;
      FinSquadColsW = FinSqMinName + FinSqMinPeople + FinSqMinAnnual + FinSqMinQuarter
                      + FinSqMinNet + FinSqMinPerMW + FinSqMinCommitted + FinSqMinDelivery;

      // Grade: only five columns, so the four cost figures run wider than the 0.08-0.12 band a
      // busier table keeps to; name still holds to 0.26-0.34 (power/RUNBOOK.md, "Table columns").
      FinGrShareName    = 0.30;
      FinGrSharePeople  = 0.14;
      FinGrShareRate    = 0.20;
      FinGrShareAnnual  = 0.20;
      FinGrShareQuarter = 0.16;
      FinGrMinName    = 220;
      FinGrMinPeople  = 90;
      FinGrMinRate    = 110;
      FinGrMinAnnual  = 100;
      FinGrMinQuarter = 100;
      FinGradeColsW = FinGrMinName + FinGrMinPeople + FinGrMinRate + FinGrMinAnnual + FinGrMinQuarter;

      // Funding: the same five-column shape as Grade, same reasoning.
      FinFlShareName       = 0.30;
      FinFlShareInvestment = 0.18;
      FinFlShareOther      = 0.20;
      FinFlShareSplit      = 0.16;
      FinFlShareTotal      = 0.16;
      FinFlMinName       = 220;
      FinFlMinInvestment = 100;
      FinFlMinOther      = 100;
      FinFlMinSplit      = 90;
      FinFlMinTotal      = 100;
      FinFundingColsW = FinFlMinName + FinFlMinInvestment + FinFlMinOther + FinFlMinSplit
                        + FinFlMinTotal;

      // Work item: name 0.30, squad 0.14, the four cost and return figures 0.12 to 0.16.
      FinWiShareName   = 0.30;
      FinWiShareSquad  = 0.14;
      FinWiShareMW     = 0.12;
      FinWiShareCost   = 0.14;
      FinWiShareInYear = 0.16;
      FinWiShareReturn = 0.14;
      FinWiMinName   = 220;
      FinWiMinSquad  = 110;
      FinWiMinMW     = 90;
      FinWiMinCost   = 100;
      FinWiMinInYear = 100;
      FinWiMinReturn = 90;
      FinWorkColsW = FinWiMinName + FinWiMinSquad + FinWiMinMW + FinWiMinCost + FinWiMinInYear
                     + FinWiMinReturn;

      // =====================================================================
      // src/pages/QuarterClose.tsx: how the quarter ends, what it leaves on the record, and the
      // view past it. delivery.ts deliverySummary(), calibration.ts calibrationBand(), and the
      // four passes src/store/useDataset.ts closeQuarter() runs: markEndedDone, takeSnapshot,
      // archiveClosed and advanceQuarter.
      // =====================================================================

      // The pivot. varQcTab is blank until the tab list is touched, so Close is what opens.
      QcTab = If(IsBlank(varQcTab), "Close the quarter", varQcTab);

      // delivery.ts deliverySummary(): the three figures the band reads, already in the engine
      // above as DeliveredMW, DeliveredCount, OnTimeCount and OnTimePct.
      DeliverySummary =
          { DeliveredMW: DeliveredMW,
            Delivered: DeliveredCount,
            OnTime: OnTimeCount,
            OnTimePct: OnTimePct };

      // QuarterClose.tsx carrying[]: counted work whose sprints run past the end of the quarter,
      // with the share of its own member weeks that falls after the quarter. A feature with
      // components carries nothing of its own; its components carry it.
      CarryOverRows =
          SortByColumns(
              ForAll(Filter(WorkStatusTable, !IsBlank(Title), Counted, LastSprintNum > LastSprint) As W,
                  With({ span: Max(1, W.LastSprintNum - W.FirstSprintNum + 1) },
                      { Title: W.Title,
                        Squad: Coalesce(W.Squad.'Squad name', ""),
                        LastSprintNum: W.LastSprintNum,
                        Carried: If(W.ComponentCount > 0, 0,
                                    W.OwnMWValue * Max(0, W.LastSprintNum - LastSprint) / span) })),
              "Title", SortOrder.Ascending);

      CarryOverCount = CountRows(CarryOverRows);
      CarryOverMW    = Coalesce(Sum(CarryOverRows, Carried), 0);

      // useDataset.ts markEndedDone(): a counted item whose last sprint is inside the quarter is
      // Done at the close, stamped with the earlier of the quarter's last sprint and today's.
      QcStampSprint = Min(LastSprint, CurrentSprint);

      ToMarkDoneRows =
          SortByColumns(
              ForAll(Filter(WorkStatusTable, !IsBlank(Title), Counted, LastSprintNum <= LastSprint) As W,
                     { Title: W.Title,
                       StateName: W.StateName,
                       Squad: Coalesce(W.Squad.'Squad name', ""),
                       LastSprintNum: W.LastSprintNum,
                       DoneInSprint: Coalesce(W.'Done in sprint', QcStampSprint) }),
              "Title", SortOrder.Ascending);

      // useDataset.ts archiveClosed(), run after the marking: delivered and cancelled rows, plus
      // the rows the marking is about to make Done, each one stamped with the quarter it closed
      // in. closeStatus() is the CloseStatus column.
      ToArchiveRows =
          SortByColumns(
              ForAll(Filter(WorkStatusTable,
                            !IsBlank(Title),
                            Coalesce('Archived in quarter'.Label, "") <> CurrentQuarter.Label,
                            Impact = 'Capacity impact (Work states)'.Historical
                                || Impact = 'Capacity impact (Work states)'.Removed
                                || (Counted && LastSprintNum <= LastSprint)) As W,
                  With({ t: W.Title },
                      { Title: t,
                        StateName: W.StateName,
                        Squad: Coalesce(W.Squad.'Squad name', ""),
                        Epic: Coalesce(W.Epic.Epic, ""),
                        Jira: Coalesce(W.'Jira key', ""),
                        Assignee:
                            Coalesce(First(Filter(colAssignees, 'Work item'.Title = t)).Person.'Full name', ""),
                        CloseStatus:
                            If(W.Phase = 'Phase (Work items)'.Stopped, "Stopped",
                               W.Impact = 'Capacity impact (Work states)'.Removed, "Cancelled",
                               IsBlank(W.'Done in sprint') || W.LastSprintNum < 0, "Done",
                               W.'Done in sprint' <= W.LastSprintNum, "Done on time",
                               "Done late"),
                        Size: Coalesce(W.Size.Size, ""),
                        Original: Coalesce(W.'Original estimate (MW)', 0),
                        Latest: W.WorkMWValue,
                        Actual: Coalesce(W.'Actual effort (MW)', 0) })),
              "Title", SortOrder.Ascending);

      // useDataset.ts takeSnapshot(): the figures a close writes to Quarter snapshots, and the
      // rows already written. Every number stays numeric; the cells format them.
      HistoryRows =
          SortByColumns(
              ForAll(colSnapshots As S,
                  With({ net: Coalesce(S.'Net capacity (MW)', 0),
                         inPlan: Coalesce(S.'In-plan MW', 0),
                         delivered: Coalesce(S.'Delivered MW', 0) },
                      { Quarter: Coalesce(S.Quarter.Label, ""),
                        Seq: Coalesce(S.Quarter.Sequence, 0),
                        Net: net,
                        InPlan: inPlan,
                        Delivered: delivered,
                        Fte: Coalesce(S.'FTE released', 0),
                        Gbp: Coalesce(S.'Benefit in-year', 0),
                        Load: If(net = 0, 0, inPlan / net),
                        Predictability: If(inPlan = 0, 0, delivered / inPlan),
                        TakenOn: S.'Taken on',
                        Note: Coalesce(S.Note, "") })),
              "Seq", SortOrder.Ascending);

      QcSnapshotTaken = !IsBlank(LookUp(HistoryRows, Quarter = CurrentQuarter.Label));

      // Outlook: this quarter and the two after it, each squad's net capacity against what is
      // already held and already in the plan. A later quarter's sprints come from its own epoch
      // and sprint length, the same arithmetic context.ts does for the current one.
      OutlookQuarters =
          ForAll(FirstN(SortByColumns(Filter(colQuarters,
                                             Sequence >= Coalesce(CurrentQuarter.Sequence, 0)),
                                      "wp_sequence", SortOrder.Ascending), 3) As Q,
              With({ sd: If(Coalesce(Q.'Sprint length (days)', 0) <= 0, 1,
                            Q.'Sprint length (days)') },
                  { Label: Q.Label,
                    Seq: Coalesce(Q.Sequence, 0),
                    FirstNum: RoundDown(DateDiff(Q.'Sprint 1 started', Q.'Quarter start',
                                                 TimeUnit.Days) / sd, 0) + 1,
                    LastNum: RoundDown(DateDiff(Q.'Sprint 1 started', Q.'Quarter end',
                                                TimeUnit.Days) / sd, 0) + 1 }));

      OutlookQuarterCount = Max(1, CountRows(OutlookQuarters));
      OutlookSquads       = SortByColumns(SquadTable, "Name", SortOrder.Ascending);

      // One row per squad and quarter, squad by squad: Power Fx has no cross join, so the pair is
      // read off the two tables by index.
      OutlookRows =
          ForAll(Sequence(CountRows(OutlookSquads) * CountRows(OutlookQuarters), 0) As N,
              With({ s: Index(OutlookSquads, RoundDown(N.Value / OutlookQuarterCount, 0) + 1),
                     q: Index(OutlookQuarters, Mod(N.Value, OutlookQuarterCount) + 1) },
                  // reservations.ts squadReservedMW(), by the quarter the column is on: a squad
                  // holds its own reservations plus the share of that quarter's team-held capacity
                  // its net MW earns. Without the second half the column undercounts the team rows
                  // and the Outlook total sits below ReservedTotal on Command.
                  With({ reserved: Coalesce(Sum(Filter(ReservationRows,
                                                       Squad = s.Name, Quarter = q.Label),
                                                Remaining), 0)
                                   + If(AllNetMW = 0, 0,
                                        s.Net / AllNetMW
                                        * Coalesce(Sum(Filter(ReservationRows,
                                                              Squad = "Team", Quarter = q.Label),
                                                       Remaining), 0)),
                         inPlan: Coalesce(
                                     Sum(ForAll(Filter(WorkStatusTable,
                                                       Squad.'Squad name' = s.Name,
                                                       InPlanFlag,
                                                       ComponentCount = 0,
                                                       FirstSprintNum <= q.LastNum,
                                                       LastSprintNum >= q.FirstNum) As W,
                                             W.OwnMWValue
                                             / Max(1, W.LastSprintNum - W.FirstSprintNum + 1)
                                             * Max(0, Min(W.LastSprintNum, q.LastNum)
                                                      - Max(W.FirstSprintNum, q.FirstNum) + 1)) As R,
                                         R.Value),
                                     0) },
                      { Squad: s.Name,
                        Quarter: q.Label,
                        Seq: q.Seq,
                        Net: s.Net,
                        Reserved: reserved,
                        InPlan: inPlan,
                        Remaining: s.Net - reserved - inPlan })));

      // The archive: what every close has put on the record, newest quarter first.
      ArchiveRows =
          SortByColumns(
              ForAll(colArchive As A,
                     { Quarter: Coalesce(A.Quarter.Label, ""),
                       Id: Coalesce(A.'Jira key', ""),
                       Title: A.Title,
                       Epic: Coalesce(A.Epic, ""),
                       Squad: Coalesce(A.Squad, ""),
                       State: Coalesce(A.State, ""),
                       CloseStatus: Coalesce(A.'Close status', ""),
                       Size: Coalesce(A.Size, ""),
                       Original: Coalesce(A.'Original MW', 0),
                       Latest: Coalesce(A.'Latest MW', 0),
                       Actual: Coalesce(A.'Actual MW', 0) }),
              "Quarter", SortOrder.Descending, "Title", SortOrder.Ascending);

      // useDataset.ts advanceQuarter(): the quarter the close moves the app on to, and the guard
      // on closing before this one has ended.
      QcNextQuarter = LookUp(colQuarters, Sequence = Coalesce(CurrentQuarter.Sequence, 0) + 1);
      QcNextLabel   = Coalesce(QcNextQuarter.Label, "");
      QcEarly       = Today() < QuarterEnd;
      QcGuardLine   = CurrentQuarter.Label & " does not end until "
                      & Text(QuarterEnd, "[$-en-US]dd mmm yyyy")
                      & ". Close it from that date, or force the close.";
      QcSnapshotLine =
          If(QcSnapshotTaken,
             CurrentQuarter.Label & " is already in History, so no new snapshot is taken.",
             "A snapshot of " & CurrentQuarter.Label
             & " is written to History before the current quarter moves on.");
      QcCloseLabel = "Close " & CurrentQuarter.Label;

      QcCountLine =
          Switch(QcTab,
                 "History", CountRows(HistoryRows) & If(CountRows(HistoryRows) = 1,
                                                        " quarter closed", " quarters closed"),
                 "Outlook", CountRows(OutlookSquads) & " squads over "
                            & CountRows(OutlookQuarters) & " quarters",
                 "Archive", CountRows(ArchiveRows) & " archived rows",
                 CountRows(ToMarkDoneRows) & " to mark Done, "
                 & CountRows(ToArchiveRows) & " to archive");

      // The grids' columns. History, Outlook, Archive and the two close lists are share-and-minimum
      // grids (power/RUNBOOK.md, "Table columns"); the two hidden tables still carry fixed widths
      // the first column grows into.
      // History: the quarter 0.20, then the seven readings closed against it.
      QcHiShareQuarter = 0.20;
      QcHiShareNet     = 0.10;
      QcHiShareInPlan  = 0.10;
      QcHiShareDeliv   = 0.11;
      QcHiShareFte     = 0.10;
      QcHiShareGbp     = 0.13;
      QcHiShareLoad    = 0.10;
      QcHiSharePred    = 0.16;
      QcHiMinQuarter = 160;
      QcHiMinNet     = 88;
      QcHiMinInPlan  = 88;
      QcHiMinDeliv   = 96;
      QcHiMinFte     = 88;
      QcHiMinGbp     = 112;
      QcHiMinLoad    = 88;
      QcHiMinPred    = 104;
      QcHiMinW = QcHiMinQuarter + QcHiMinNet + QcHiMinInPlan + QcHiMinDeliv + QcHiMinFte
                 + QcHiMinGbp + QcHiMinLoad + QcHiMinPred;

      // Outlook: the squad 0.28, the quarter 0.14, then the four member-week readings.
      QcOuShareSquad     = 0.28;
      QcOuShareQuarter   = 0.14;
      QcOuShareNet       = 0.14;
      QcOuShareReserved  = 0.14;
      QcOuShareInPlan    = 0.14;
      QcOuShareRemaining = 0.16;
      QcOuMinSquad     = 200;
      QcOuMinQuarter   = 112;
      QcOuMinNet       = 96;
      QcOuMinReserved  = 96;
      QcOuMinInPlan    = 96;
      QcOuMinRemaining = 104;
      QcOuMinW = QcOuMinSquad + QcOuMinQuarter + QcOuMinNet + QcOuMinReserved + QcOuMinInPlan
                 + QcOuMinRemaining;

      // Archive: the title 0.20 and the epic 0.12 carry the text, the rest are short enums and
      // member-week figures.
      QcArShareTitle    = 0.20;
      QcArShareQuarter  = 0.08;
      QcArShareId       = 0.08;
      QcArShareEpic     = 0.12;
      QcArShareSquad    = 0.10;
      QcArShareState    = 0.10;
      QcArShareStatus   = 0.10;
      QcArShareSize     = 0.06;
      QcArShareOriginal = 0.06;
      QcArShareLatest   = 0.05;
      QcArShareActual   = 0.05;
      QcArMinTitle    = 200;
      QcArMinQuarter  = 88;
      QcArMinId       = 96;
      QcArMinEpic     = 140;
      QcArMinSquad    = 112;
      QcArMinState    = 112;
      QcArMinStatus   = 120;
      QcArMinSize     = 72;
      QcArMinOriginal = 96;
      QcArMinLatest   = 88;
      QcArMinActual   = 88;
      QcArMinW = QcArMinTitle + QcArMinQuarter + QcArMinId + QcArMinEpic + QcArMinSquad
                 + QcArMinState + QcArMinStatus + QcArMinSize + QcArMinOriginal + QcArMinLatest
                 + QcArMinActual;

      // The two lists on the close itself: the state it closes in 0.22, the title 0.78.
      QcDnShareState = 0.22;
      QcDnShareTitle = 0.78;
      QcDnMinState = 116;
      QcDnMinTitle = 240;
      QcDnMinW = QcDnMinState + QcDnMinTitle;

      // =====================================================================
      // src/pages/Timeline.tsx: four readings of the same bookings.
      //
      // Sprint is the planning grid, a column per working day of one sprint; Quarter is the same
      // people over the quarter's thirteen weeks; Sprints is sprintPlan.ts, a squad per row and a
      // sprint per column; Gaps reads the weeks the other way round, where the free days are.
      // The cell tables carry lower-case column names (kind, label, status, tooltip) because
      // SprintGridJson writes them straight out as the code component's own JSON keys.
      // =====================================================================

      // context.ts buildContext(): the timeline weeks, Mondays from the ISO Monday on or before
      // 1 January of the timeline year.
      TimelineWeeks =
          ForAll(Sequence(TimelineWeekCount, 0) As K,
                 { Index: K.Value + 1, Monday: DateAdd(TimelineMonday0, K.Value * 7, TimeUnit.Days) });

      WeekCount = CountRows(TimelineWeeks);

      // The screen's own state, defaulted so the screen opens before a control is touched.
      // The tab list carries the reading's label; the keys it maps onto are what every
      // Visible on the screen compares against.
      TlReading   = Switch(Coalesce(varTlReading, ""),
                           "This sprint", "Sprint",
                           "Quarter", "Quarter",
                           "Sprint plan", "Sprints",
                           "Availability", "Gaps",
                           "Sprint");
      // The reading's name, the same words the tab carries, for any line that says which reading
      // the screen is on: nothing reads the tab control's own selection, so a rename is one edit.
      TlReadingName = Switch(TlReading,
                             "Quarter", "Quarter",
                             "Sprints", "Sprint plan",
                             "Gaps", "Availability",
                             "This sprint");
      // Coalesce reads an empty string as blank and hands back a blank, and a blank does not
      // equal "", so the All chip fell to the squad filter and drew nothing. Blank is mapped to a
      // real empty string here, which every reader downstream compares against.
      TlSnapSquad = If(IsBlank(varSnapSquad), "", varSnapSquad);
      TlSprintNum = If(IsBlank(varTlSprint), SprintNow,
                       Max(FirstSprint, Min(LastSprint, varTlSprint)));
      TlGapNeed   = If(IsBlank(varTlGapNeed), 3, varTlGapNeed);

      TlSprintStart = DateAdd(Epoch, (TlSprintNum - 1) * SprintDays, TimeUnit.Days);
      TlSprintEnd   = DateAdd(TlSprintStart, SprintDays - 1, TimeUnit.Days);

      // Timeline.tsx sprintColumns(): the sprint's working days, off the same DayGrid rows
      // SprintGrid counts for its WorkDays, clipped to the quarter the same way. The two readings
      // therefore draw the same number of columns for a sprint, and no column falls outside the
      // quarter.
      TlSprintDays =
          ForAll(Filter(DayGrid, IsWork,
                        D >= If(TlSprintStart > QuarterStart, TlSprintStart, QuarterStart),
                        D <= If(TlSprintEnd < QuarterEnd, TlSprintEnd, QuarterEnd)) As X,
                 { Date: X.D,
                   DayName: Upper(Text(X.D, "ddd")),
                   Label: Text(X.D, "d mmm") });

      TlSprintLabel = "S" & TlSprintNum & " · " & Text(TlSprintStart, "d mmm")
                      & " to " & Text(TlSprintEnd, "d mmm");

      // Timeline.tsx quarterWeeks(): thirteen weeks from the Monday the quarter opens in.
      TlQuarterMonday =
          DateAdd(QuarterStart, -(Weekday(QuarterStart, StartOfWeek.Monday) - 1), TimeUnit.Days);

      TlQuarterWeeks =
          ForAll(Sequence(13, 0) As K,
                 With({ mon: DateAdd(TlQuarterMonday, K.Value * 7, TimeUnit.Days) },
                     { Index: K.Value + 1,
                       Mon: mon,
                       Label: "w/c " & Text(mon, "d mmm"),
                       Now: Today() >= mon && Today() <= DateAdd(mon, 6, TimeUnit.Days),
                       // The weeks the picked sprint runs over, which the Quarter reading marks
                       // so the picker has something to show for itself.
                       Picked: mon <= TlSprintEnd
                               && DateAdd(mon, 6, TimeUnit.Days) >= TlSprintStart }));

      TlQuarterLabel = CurrentQuarter.Label & " · " & First(TlQuarterWeeks).Label
                       & " to " & Last(TlQuarterWeeks).Label;

      // Timeline.tsx plannedPeople() and squadGroups(): an open vacancy carries no row, and anyone
      // in no squad falls to a group of their own. The squads read alphabetically, which is the
      // order SortByColumns can give without a position column; Unassigned sorts among them.
      TlPeople =
          SortByColumns(
              ForAll(PlannedPeople As P,
                     { Name: P.Name,
                       GroupName: If(IsBlank(P.Squad), "Unassigned", P.Squad),
                       Role: P.Role,
                       Skills: P.Skills,
                       Region: P.Region,
                       Dpw: P.Dpw,
                       Modifier: P.Modifier,
                       Net: P.Net }),
              "GroupName", SortOrder.Ascending, "Name", SortOrder.Ascending);

      TlPeopleCount = PlannedPeopleCount;

      // The snap chip's own people. Both grids flatten their rows into a Cells column, and a table
      // with a table in it cannot be filtered afterwards, so the squad filter is applied here, on
      // the source, before anything flattens. Blank chip is every squad.
      TlSnapPeople = If(IsBlank(TlSnapSquad), TlPeople, Filter(TlPeople, GroupName = TlSnapSquad));

      // sprintPlan.ts sprintAvailableMW() for the sprint the grid is on, one row per person. The
      // week rule is summed a day at a time, which is the same number: each working day of the week
      // inside the quarter carries one fifth of that week's share.
      TlPersonSprintMW =
          ForAll(TlPeople As P,
                 { Name: P.Name,
                   GroupName: P.GroupName,
                   MW: Coalesce(
                           Sum(ForAll(TlSprintDays As DD,
                                   With({ mon: DateAdd(DD.Date,
                                                       -(Weekday(DD.Date, StartOfWeek.Monday) - 1),
                                                       TimeUnit.Days) },
                                       With({ fri: DateAdd(mon, 4, TimeUnit.Days) },
                                           With({ lost:
                                                      CountRows(Filter(BankHolidayDayRows,
                                                                       RegionName = P.Region,
                                                                       D >= mon, D <= fri))
                                                      + Coalesce(
                                                            Sum(Filter(AbsenceQuarterTable,
                                                                       PersonName = P.Name,
                                                                       From <= fri, To >= mon) As A,
                                                                Max(0, Min(5, DateDiff(
                                                                    If(A.From > mon, A.From, mon),
                                                                    If(A.To < fri, A.To, fri),
                                                                    TimeUnit.Days) + 1))),
                                                            0) },
                                               Max(0, P.Dpw
                                                      - If(LogAbsences, lost * P.Dpw / MWDaysOr1, 0))
                                               * (1 - P.Modifier) / MWDaysOr1 / MWDaysOr1)))) As R,
                               R.Value),
                           0) });

      // Timeline.tsx bookingsOf(), the typed half: the rows on Assignments.
      TlTypedBookings =
          ForAll(Filter(colAssignments, !IsBlank(Person.'Full name')) As A,
                 { Person: A.Person.'Full name',
                   Item: Coalesce(A.'Work item'.Title, ""),
                   Label: If(IsBlank(A.Label), Left(Coalesce(A.'Work item'.Title, ""), 18), A.Label),
                   From: A.From,
                   To: A.To });

      // Timeline.tsx bookingsOf(), the automatic half: the booking Work writes for each assignee of
      // live work with no components, unless that pair already carries a typed row.
      TlAutoBookings =
          ForAll(Filter(colAssignees,
                        !IsBlank(Person.'Full name'), !IsBlank('Work item'.Title)) As A,
                 With({ nm: A.Person.'Full name', ti: A.'Work item'.Title },
                     With({ W: LookUp(WorkStatusTable, Title = ti) },
                         { Person: nm,
                           Item: ti,
                           Label: Left(ti, 18),
                           From: DateAdd(Epoch, (W.FirstSprintNum - 1) * SprintDays, TimeUnit.Days),
                           To: DateAdd(Epoch, W.LastSprintNum * SprintDays - 1, TimeUnit.Days),
                           Live: W.ComponentCount = 0
                                 && W.Impact <> 'Capacity impact (Work states)'.Removed
                                 && IsBlank(LookUp(colAssignments,
                                                   Person.'Full name' = nm
                                                   && 'Work item'.Title = ti).Label) })));

      TlLiveAutoBookings = Filter(TlAutoBookings, Live);

      // One typed cell per person per working day, in the workbook's own order of precedence:
      // a bank holiday, then leave or training, then a booking, then open.
      TlSprintCells =
          ForAll(TlPeople As P,
                 { Name: P.Name,
                   Cells:
                       ForAll(TlSprintDays As DD,
                           With({ bank: CountRows(Filter(BankHolidayDayRows,
                                                         RegionName = P.Region, D = DD.Date)) > 0,
                                  off: LookUp(AbsenceQuarterTable,
                                              PersonName = P.Name
                                              && From <= DD.Date && To >= DD.Date),
                                  tb: LookUp(TlTypedBookings,
                                             Person = P.Name && From <= DD.Date && To >= DD.Date),
                                  ab: LookUp(TlLiveAutoBookings,
                                             Person = P.Name && From <= DD.Date && To >= DD.Date) },
                               With({ item: If(!IsBlank(tb.Item), tb.Item, Coalesce(ab.Item, "")),
                                      what: If(!IsBlank(tb.Item), tb.Label, Coalesce(ab.Label, "")) },
                                   With({ st: Coalesce(LookUp(WorkStatusTable,
                                                              Title = item).DeliveryStatus, "") },
                                       { date: Text(DD.Date, "yyyy-mm-dd"),
                                         // The bare work item title, kept apart from the label the
                                         // cell draws, so the peek card looks the item up by name
                                         // rather than by what is written on the cell.
                                         itemTitle: item,
                                         kind: If(bank, "bankhol",
                                                  !IsBlank(off.TypeName),
                                                      If(off.TypeName = "Training", "training", "leave"),
                                                  item <> "", "work",
                                                  "open"),
                                         label: If(bank, "Bank hol",
                                                   !IsBlank(off.TypeName),
                                                       If(off.Sick, "Sick", off.TypeName),
                                                   item <> "", what,
                                                   "Open"),
                                         status: If(item <> ""
                                                    && (st = "Late" || StartsWith(st, "At risk")),
                                                    st, ""),
                                         tooltip: If(item <> "",
                                                     item & If(st = "", "", ", " & st),
                                                     If(bank, "Bank holiday",
                                                        !IsBlank(off.TypeName), off.TypeName,
                                                        "Open")) })))) });

      // The squad groups the two grids draw, with the figures line each group row carries.
      TlGroups =
          SortByColumns(
              ForAll(Distinct(TlPeople, GroupName) As G,
                  With({ nm: G.Value },
                      With({ S: LookUp(SquadTable, Name = nm) },
                          { Name: nm,
                            People: CountRows(Filter(TlPeople, GroupName = nm)),
                            Net: Coalesce(S.Net, 0),
                            Committed: Coalesce(S.Committed, 0),
                            Utilisation: Coalesce(S.Utilisation, 0),
                            SprintMW: Coalesce(Sum(Filter(TlPersonSprintMW, GroupName = nm), MW),
                                               0) }))),
              "Name", SortOrder.Ascending);

      // The groups the chip leaves standing, so the code component's JSON carries no empty squad.
      TlSnapGroups = If(IsBlank(TlSnapSquad), TlGroups, Filter(TlGroups, Name = TlSnapSquad));

      // The chip tones: the Settings thresholds as one small table, read downwards, so a chip's
      // tint and its ink say how used the squad is and no control names a threshold of its own.
      // LookUp takes the first row the utilisation clears, which is why bad reads before warn.
      TlUtilisationTones =
          Table({ From: UtilisationBad,  Fill: StatusBadFill,  Ink: StatusBad },
                { From: UtilisationWarn, Fill: StatusWarnFill, Ink: StatusWarn },
                { From: -1,              Fill: StatusGoodFill, Ink: StatusGood });

      // The snap chips: every squad with a row in the grid, plus All in front of them. Each
      // carries the squad's utilisation and the tone that percentage takes.
      TlSnapChips =
          ForAll(TlGroups As G,
                 With({ t: LookUp(TlUtilisationTones, G.Utilisation >= From) },
                     { Name: G.Name,
                       Label: G.Name & " · " & Text(Round(G.Utilisation * 100, 0),
                                                    "[$-en-US]#,##0") & "% used",
                       Fill: t.Fill,
                       Ink: t.Ink }));

      // The All chip: every squad in the grid as one figure, toned the same way.
      TlSnapAllUtilisation =
          With({ net: Coalesce(Sum(TlGroups, Net), 0) },
              If(net = 0, 0, Coalesce(Sum(TlGroups, Committed), 0) / net));
      TlSnapAllLabel =
          "All · " & Text(Round(TlSnapAllUtilisation * 100, 0), "[$-en-US]#,##0") & "% used";
      TlSnapAllFill = LookUp(TlUtilisationTones, TlSnapAllUtilisation >= From).Fill;
      TlSnapAllInk  = LookUp(TlUtilisationTones, TlSnapAllUtilisation >= From).Ink;

      // The sprint's own figures line, as Timeline.tsx writes it.
      TlSprintMW     = Coalesce(Sum(TlPersonSprintMW, MW), 0);
      TlSprintSickMW =
          Coalesce(Sum(Filter(AbsenceQuarterTable, Sick,
                              From <= TlSprintEnd, To >= TlSprintStart), MW), 0);
      TlSprintOpenDays =
          Coalesce(Sum(ForAll(TlSprintCells As C,
                          CountRows(Filter(C.Cells, kind = "open"))) As R, R.Value), 0);

      TlSprintFigures =
          TlPeopleCount & " people · " & Text(TlSprintMW, "[$-en-US]#,##0.0") & " MW productive · "
          & Text(TlSprintSickMW, "[$-en-US]#,##0.0") & " MW lost to sickness · "
          & TlSprintOpenDays & " open days";

      // The one tone map every kind reads, legend and grid cell alike: a Badge's ThemeColor comes
      // off it directly, a cell's Fill and text Color come off the same Tone through the theme's
      // own fill and text tokens for that tone. Never a second map, so the legend and the cells can
      // never drift apart the way Leave and Training's shared Brand tone once did.
      TlKindTone =
          Table({ Kind: "open",     Tone: "Subtle" },      { Kind: "leave",  Tone: "Informative" },
                { Kind: "training", Tone: "Important" },   { Kind: "bankhol", Tone: "Holiday" },
                { Kind: "work",     Tone: "Success" },      { Kind: "atrisk", Tone: "Warning" },
                { Kind: "late",     Tone: "Danger" });

      // ---------------------------------------------------------------------
      // The flattened rows both grids are drawn from: a group row, then its people, in one table
      // with a row kind on it, so one vertical gallery draws the lot. A gallery cannot be told to
      // draw two tables, and Ungroup is not a function the offline checker carries, so the rows are
      // walked as two slots per person — the group header the person opens, and the person — and
      // the slots nothing falls in are filtered out.
      // ---------------------------------------------------------------------
      SprintGridRows =
          Filter(
              ForAll(Sequence(CountRows(TlSnapPeople) * 2, 0) As S,
                  With({ i: RoundDown(S.Value / 2, 0) + 1, head: Mod(S.Value, 2) = 0 },
                      With({ P: Index(TlSnapPeople, i) },
                          With({ first: i = 1
                                        || Index(TlSnapPeople, Max(1, i - 1)).GroupName <> P.GroupName,
                                 G: LookUp(TlGroups, Name = P.GroupName),
                                 mw: Coalesce(LookUp(TlPersonSprintMW, Name = P.Name).MW, 0) },
                              { RowKind: If(head, If(first, "group", "skip"), "person"),
                                Name: If(head, P.GroupName, P.Name),
                                Role: If(head, "", P.Role),
                                Meta: If(head,
                                         G.People & " people · "
                                         & Text(G.SprintMW, "[$-en-US]#,##0.0") & " MW sprint · "
                                         & Text(G.Committed, "[$-en-US]#,##0.0") & " / "
                                         & Text(G.Net, "[$-en-US]#,##0.0") & " MW quarter",
                                         "SP " & Text(mw, "[$-en-US]#,##0.0") & " · "
                                         & Text(Round(P.Modifier * 100, 0), "[$-en-US]#,##0") & "%"),
                                GroupName: P.GroupName,
                                // A group row carries the person's own cells and hides them; a
                                // gallery cannot be handed two shapes of table.
                                Cells: LookUp(TlSprintCells, Name = P.Name).Cells }))))
              , RowKind <> "skip");

      // ---------------------------------------------------------------------
      // The code component's one string, wp_Waypoint.SprintGrid's gridJson contract
      // (power/pcf/README.md). The JSON writer is not a function Power Fx Core carries, so the
      // string is built with Concat: every value that could hold a quote or a backslash is escaped
      // here, and the keys are the contract's own.
      // ---------------------------------------------------------------------
      SprintGridDaysJson =
          Concat(TlSprintDays As DD,
                 ",{""date"":""" & Text(DD.Date, "yyyy-mm-dd")
                 & """,""name"":""" & DD.DayName
                 & """,""label"":""" & DD.Label
                 & """,""outside"":false}");

      // Built from the snapped rows, not the whole grid, so the chip moves the code component and
      // the fallback galleries the same way rather than leaving the control to scroll.
      SprintGridGroupsJson =
          Concat(TlSnapGroups As G,
                 ",{""name"":""" & Substitute(G.Name, """", "\""")
                 & """,""meta"":""" & G.People & " people · "
                 & Text(G.SprintMW, "[$-en-US]#,##0.0") & " MW sprint · "
                 & Text(G.Committed, "[$-en-US]#,##0.0") & " / "
                 & Text(G.Net, "[$-en-US]#,##0.0") & " MW quarter"
                 & """,""people"":["
                 & Mid(Concat(Filter(TlSnapPeople, GroupName = G.Name) As P,
                          ",{""name"":""" & Substitute(P.Name, """", "\""")
                          & """,""role"":""" & Substitute(P.Role, """", "\""")
                          & """,""meta"":""SP "
                          & Text(Coalesce(LookUp(TlPersonSprintMW, Name = P.Name).MW, 0),
                                 "[$-en-US]#,##0.0")
                          & " · " & Text(Round(P.Modifier * 100, 0), "[$-en-US]#,##0") & "%"
                          & """,""cells"":["
                          & Mid(Concat(LookUp(TlSprintCells, Name = P.Name).Cells As C,
                                   ",{""kind"":""" & C.kind
                                   & """,""label"":""" & Substitute(Substitute(C.label, "\", "\\"),
                                                                    """", "\""")
                                   & """,""status"":""" & C.status
                                   & """,""tooltip"":""" & Substitute(Substitute(C.tooltip, "\", "\\"),
                                                                      """", "\""")
                                   & """}"), 2)
                          & "]}"), 2)
                 & "]}");

      SprintGridJson =
          "{""days"":[" & Mid(SprintGridDaysJson, 2)
          & "],""groups"":[" & Mid(SprintGridGroupsJson, 2) & "]}";

      // What the code component hands back on selectedCellJson: { "person": ..., "date": ... }.
      // The two values are pulled out of the string by position, so nothing has to parse JSON.
      TlEditPerson =
          With({ s: Coalesce(varEditCell, "") },
              If(Find("""person""", s) = 0, "",
                 With({ from: Find(":", s, Find("""person""", s)) + 2 },
                     Mid(s, from, Find("""", Mid(s, from, Len(s))) - 1))));

      TlEditDate =
          With({ s: Coalesce(varEditCell, "") },
              If(Find("""date""", s) = 0, "",
                 With({ from: Find(":", s, Find("""date""", s)) + 2 },
                     Mid(s, from, Find("""", Mid(s, from, Len(s))) - 1))));

      // ---------------------------------------------------------------------
      // TlPeek: the cell peek card on Timeline. One variable holds the picked cell,
      // varPeekCell { Person, Date, Kind, ItemTitle }, and every line the card draws is read off
      // it here, so the card itself works nothing out. The card is a reading: nothing below
      // writes, and the two buttons only navigate.
      // ---------------------------------------------------------------------
      TlPeekPerson = Coalesce(varPeekCell.Person, "");
      TlPeekDate   = Coalesce(varPeekCell.Date, "");
      TlPeekKind   = Coalesce(varPeekCell.Kind, "");
      // A cell handed back without a usable title reads as no item at all, so a stray separator
      // never becomes the card's heading.
      TlPeekItem   =
          With({ t: Coalesce(varPeekCell.ItemTitle, "") },
              If(Trim(Substitute(t, ",", "")) = "", "", t));

      TlPeekIsWork    = TlPeekKind = "work" && TlPeekItem <> "";
      TlPeekIsAbsence = TlPeekKind = "leave" || TlPeekKind = "training";

      // The cell's date comes back as the contract's "yyyy-mm-dd" text, so it is read by position
      // rather than left to DateValue's locale.
      TlPeekDay =
          If(Len(TlPeekDate) < 10, Blank(),
             Date(Value(Left(TlPeekDate, 4)), Value(Mid(TlPeekDate, 6, 2)),
                  Value(Mid(TlPeekDate, 9, 2))));

      TlPeekTitle =
          If(TlPeekIsEmpty, "Nothing booked",
             TlPeekKind = "work", Coalesce(TlPeekItem, "Work"),
             Switch(TlPeekKind, "leave", "Leave", "training", "Training",
                    "bankhol", "Bank holiday", "open", "Open day", "Cell"));

      TlPeekKindLabel =
          Switch(TlPeekKind, "work", "Work", "leave", "Leave", "training", "Training",
                 "bankhol", "Bank holiday", "open", "Open", "");

      // The one tone map the legend and the grid cells already read.
      TlPeekTone = Coalesce(LookUp(TlKindTone, Kind = TlPeekKind).Tone, "Subtle");

      // The card's own edge and badge read the same ink the legend and the grid cells do: never a
      // tone painted across the whole card (power/RUNBOOK.md, "Cards").
      TlPeekInk =
          Switch(TlPeekTone,
              "Subtle",      TlKindTextSubtle,
              "Holiday",     TlKindTextHoliday,
              "Informative", TlKindTextInformative,
              "Important",   TlKindTextImportant,
              "Success",     TlKindTextSuccess,
              "Warning",     TlKindTextWarning,
              TlKindTextDanger);

      TlPeekWho =
          TlPeekPerson & If(IsBlank(TlPeekDay), "", " · " & Text(TlPeekDay, "ddd d mmm"));

      // The squad the person is in, for the Open person button.
      TlPeekSquad = Coalesce(LookUp(TlPeople, Name = TlPeekPerson).GroupName, "");

      // A work cell: the item's own state, priority and sprint span.
      TlPeekWork = LookUp(WorkStatusTable, Title = TlPeekItem);

      TlPeekStateLine =
          "State: " & If(IsBlank(TlPeekWork.StateName), "—", TlPeekWork.StateName)
          & If(Coalesce(TlPeekWork.DeliveryStatus, "") = "", "",
               " · " & TlPeekWork.DeliveryStatus);

      TlPeekPriorityLine =
          "Priority: " & If(IsBlank(TlPeekWork.Priority), "—", TlPeekWork.Priority);

      TlPeekSpanLine =
          "Sprints: " & If(TlPeekWork.LastSprintNum < TlPeekWork.FirstSprintNum, "—",
                           "S" & TlPeekWork.FirstSprintNum & " to S" & TlPeekWork.LastSprintNum);

      // This sprint's booked days: the person's own work cells for that item across the sprint,
      // which is exactly what the grid drew.
      TlPeekBookedDays =
          If(TlPeekItem = "", 0,
             CountRows(Filter(LookUp(TlSprintCells, Name = TlPeekPerson).Cells,
                              kind = "work", itemTitle = TlPeekItem)));

      TlPeekBookedLine =
          "Booked this sprint: " & TlPeekBookedDays & If(TlPeekBookedDays = 1, " day", " days");

      // An absence cell: the row the grid drew it from.
      TlPeekAbsence =
          LookUp(AbsenceQuarterTable,
                 PersonName = TlPeekPerson && From <= TlPeekDay && To >= TlPeekDay);

      // An empty day: an open cell with no item on it and no absence over it. The card drops to
      // its heading, the person and date, and the two buttons.
      TlPeekIsEmpty =
          (TlPeekKind = "open" || TlPeekKind = "")
          && TlPeekItem = "" && !TlPeekIsAbsence && IsBlank(TlPeekAbsence.TypeName);

      TlPeekAbsTypeLine =
          "Absence: " & If(IsBlank(TlPeekAbsence.TypeName), "—", TlPeekAbsence.TypeName);

      TlPeekAbsDatesLine =
          If(IsBlank(TlPeekAbsence.From), "Dates: —",
             "Dates: " & Text(TlPeekAbsence.From, "d mmm") & " to "
             & Text(TlPeekAbsence.To, "d mmm"));

      // The cell the code component handed back, found by the person and date its JSON carries.
      TlPeekCodeCell =
          LookUp(LookUp(TlSprintCells, Name = TlEditPerson).Cells, date = TlEditDate);

      // The cell carries the bare item title of its own, so the code component's path reads the
      // same name the fallback grid hands the card.
      TlPeekCodeTitle =
          If(Coalesce(TlPeekCodeCell.kind, "") <> "work", "",
             Coalesce(TlPeekCodeCell.itemTitle, ""));

      // The card's own geometry: content-sized, so the detail lines it draws set its height, and
      // anchored at the top of the grid card, which is the body's chrome measured down from the
      // app header.
      // The detail lines: four for a work cell, two for an absence, none for an empty day.
      TlPeekH =
          Pad * 2 + TypeHeadingLine + TypeLabelLine + 4 + TypeLabelLine + 4
          + If(TlPeekIsEmpty, 0, If(TlPeekIsWork, 4, If(TlPeekIsAbsence, 2, 1)))
            * TypeLabelLine + Gap + ControlHeight;

      // tlBody's own children, in order: the page head, the state line, the stepper, the legend
      // row, the snap row, then the card's top padding. Miss one and the card opens over it.
      TlPeekTop =
          AppHeaderH + Pad + PageHeadH + Gap + TypeKickerLine + Gap + ControlHeight + 8
          + Gap + TlLegendRowH + Gap + ControlHeight + Gap + Pad;

      // ---------------------------------------------------------------------
      // Quarter: the same people over the quarter's thirteen weeks, booked and free days a cell.
      // capacity.ts weekDays(): contracted days less bank holidays and leave, then the bookings
      // that week as a union, capped at five. The cell keeps Booked and Free numeric and carries
      // its own Monday; the "Xd booked · Yd free" line is written with Text() at the cell.
      // ---------------------------------------------------------------------
      TlQuarterCells =
          ForAll(TlPeople As P,
                 { Name: P.Name,
                   Cells:
                       ForAll(TlQuarterWeeks As WK,
                           With({ mon: WK.Mon },
                               With({ fri: DateAdd(mon, 4, TimeUnit.Days) },
                                   With({ bh: CountRows(Filter(BankHolidayDayRows,
                                                               RegionName = P.Region,
                                                               D >= mon, D <= fri)),
                                          leave: Coalesce(
                                                     Sum(Filter(AbsenceQuarterTable,
                                                                PersonName = P.Name,
                                                                From <= fri, To >= mon) As A,
                                                         Max(0, Min(5, DateDiff(
                                                             If(A.From > mon, A.From, mon),
                                                             If(A.To < fri, A.To, fri),
                                                             TimeUnit.Days) + 1))),
                                                     0),
                                          booked: Coalesce(
                                                      Sum(Filter(TlTypedBookings,
                                                                 Person = P.Name,
                                                                 From <= fri, To >= mon) As B,
                                                          Max(0, Min(5, DateDiff(
                                                              If(B.From > mon, B.From, mon),
                                                              If(B.To < fri, B.To, fri),
                                                              TimeUnit.Days) + 1))),
                                                      0)
                                                  + Coalesce(
                                                      Sum(Filter(TlLiveAutoBookings,
                                                                 Person = P.Name,
                                                                 From <= fri, To >= mon) As B,
                                                          Max(0, Min(5, DateDiff(
                                                              If(B.From > mon, B.From, mon),
                                                              If(B.To < fri, B.To, fri),
                                                              TimeUnit.Days) + 1))),
                                                      0) },
                                       With({ avail: Max(0, P.Dpw
                                                            - If(LogAbsences,
                                                                 (bh + leave) * P.Dpw / MWDaysOr1,
                                                                 0)),
                                              assigned: Min(5, booked) },
                                           { Week: WK.Index,
                                             Mon: mon,
                                             kind: If(bh + leave >= MWDays, "leave",
                                                      assigned > 0, "work",
                                                      "open"),
                                             Booked: assigned,
                                             Free: Max(0, avail - assigned) }))))) });

      QuarterGridRows =
          Filter(
              ForAll(Sequence(CountRows(TlSnapPeople) * 2, 0) As S,
                  With({ i: RoundDown(S.Value / 2, 0) + 1, head: Mod(S.Value, 2) = 0 },
                      With({ P: Index(TlSnapPeople, i) },
                          With({ first: i = 1
                                        || Index(TlSnapPeople, Max(1, i - 1)).GroupName <> P.GroupName,
                                 G: LookUp(TlGroups, Name = P.GroupName) },
                              { RowKind: If(head, If(first, "group", "skip"), "person"),
                                Name: If(head, P.GroupName, P.Name),
                                Role: If(head, "", P.Role),
                                Meta: If(head,
                                         G.People & " people · "
                                         & Text(G.Committed, "[$-en-US]#,##0.0") & " / "
                                         & Text(G.Net, "[$-en-US]#,##0.0") & " MW quarter",
                                         Text(P.Net, "[$-en-US]#,##0.0") & " MW net"),
                                GroupName: P.GroupName,
                                // A group row carries the person's own cells and hides them; a
                                // gallery cannot be handed two shapes of table.
                                Cells: LookUp(TlQuarterCells, Name = P.Name).Cells }))))
              , RowKind <> "skip");

      TlQuarterNetMW  = Coalesce(Sum(TlPeople, Net), 0);
      TlQuarterFreeDays =
          Coalesce(Sum(ForAll(TlQuarterCells As C,
                          Coalesce(Sum(C.Cells, Free), 0)) As R, R.Value), 0);

      TlQuarterFigures =
          TlPeopleCount & " people · " & Text(TlQuarterNetMW, "[$-en-US]#,##0.0") & " MW available · "
          & Text(CommittedTotal, "[$-en-US]#,##0.0") & " MW committed · "
          & Text(Round(TlQuarterFreeDays, 0), "[$-en-US]#,##0") & " days open";

      // ---------------------------------------------------------------------
      // Sprints: sprintPlan.ts as a matrix, a squad a row and a sprint a column. Capacity takes the
      // share of the quarter's working days the sprint holds; an item's MW is spread evenly over
      // the sprints it spans, and every sprint of that span takes one whole share. Where there is
      // demand and no capacity at all the workbook writes 9.99.
      // ---------------------------------------------------------------------
      TlSprintColumns =
          ForAll(SprintGrid As S,
                 { Num: S.Num,
                   Label: "S" & S.Num,
                   From: S.From,
                   WorkDays: S.WorkDays,
                   Share: S.WorkDays / QuarterWorkingDaysOr1,
                   Now: S.Num = TlSprintNum,
                   Head: "S" & S.Num & " · " & Text(S.From, "d mmm") & " · " & S.WorkDays & "d" });

      SprintsMatrixRows =
          ForAll(SortByColumns(If(IsBlank(TlSnapSquad), SquadTable,
                                  Filter(SquadTable, Name = TlSnapSquad)),
                               "Name", SortOrder.Ascending) As SQ,
                 { Name: SQ.Name,
                   Cells:
                       ForAll(TlSprintColumns As SP,
                           With({ available:
                                      Coalesce(
                                          Sum(ForAll(Filter(PeopleTable,
                                                            Squad = SQ.Name, Vacancy <> true) As P,
                                                  Coalesce(
                                                      Sum(ForAll(Filter(DayGrid, IsWork,
                                                                        D >= SP.From,
                                                                        D <= DateAdd(SP.From,
                                                                                     SprintDays - 1,
                                                                                     TimeUnit.Days),
                                                                        D >= QuarterStart,
                                                                        D <= QuarterEnd) As DY,
                                                              With({ mon: DateAdd(DY.D,
                                                                                  -(Weekday(DY.D,
                                                                                            StartOfWeek.Monday)
                                                                                    - 1),
                                                                                  TimeUnit.Days) },
                                                                  With({ fri: DateAdd(mon, 4,
                                                                                      TimeUnit.Days) },
                                                                      With({ lost:
                                                                                 CountRows(Filter(BankHolidayDayRows,
                                                                                                  RegionName = P.Region,
                                                                                                  D >= mon,
                                                                                                  D <= fri))
                                                                                 + Coalesce(
                                                                                       Sum(Filter(AbsenceQuarterTable,
                                                                                                  PersonName = P.Name,
                                                                                                  From <= fri,
                                                                                                  To >= mon) As A,
                                                                                           Max(0, Min(5, DateDiff(
                                                                                               If(A.From > mon, A.From, mon),
                                                                                               If(A.To < fri, A.To, fri),
                                                                                               TimeUnit.Days) + 1))),
                                                                                       0) },
                                                                          Max(0, P.Dpw
                                                                                 - If(LogAbsences,
                                                                                      lost * P.Dpw / MWDaysOr1,
                                                                                      0))
                                                                          * (1 - P.Modifier)
                                                                          / MWDaysOr1 / MWDaysOr1)))) As R,
                                                          R.Value),
                                                      0)) As Q,
                                              Q.Value),
                                          0),
                                  committed:
                                      Coalesce(
                                          Sum(ForAll(Filter(WorkStatusTable,
                                                            Squad.'Squad name' = SQ.Name,
                                                            ComponentCount = 0,
                                                            FirstSprintNum <= SP.Num,
                                                            LastSprintNum >= SP.Num,
                                                            Counted) As W,
                                                  W.OwnMWValue
                                                  / Max(1, W.LastSprintNum - W.FirstSprintNum + 1)) As R,
                                              R.Value),
                                          0),
                                  reserved: SQ.Reserved * SP.Share },
                               { Num: SP.Num,
                                 Label: SP.Label,
                                 Now: SP.Now,
                                 Available: available,
                                 Committed: committed,
                                 Reserved: reserved,
                                 Remaining: available - committed - reserved,
                                 Utilisation: If(available > 0, committed / available,
                                                 committed > 0, 9.99, 0) })) });

      // The row totals, the column totals and the corner, worked out off the cells above.
      SprintsMatrixTotals =
          ForAll(SprintsMatrixRows As R,
                 With({ available: Coalesce(Sum(R.Cells, Available), 0),
                        committed: Coalesce(Sum(R.Cells, Committed), 0) },
                     { Name: R.Name,
                       Available: available,
                       Committed: committed,
                       Reserved: Coalesce(Sum(R.Cells, Reserved), 0),
                       Remaining: Coalesce(Sum(R.Cells, Remaining), 0),
                       Utilisation: If(available > 0, committed / available,
                                       committed > 0, 9.99, 0) }));

      SprintsColumnTotals =
          ForAll(TlSprintColumns As SP,
                 With({ available: Coalesce(Sum(ForAll(SprintsMatrixRows As R,
                                                    Coalesce(LookUp(R.Cells,
                                                                    Num = SP.Num).Available, 0)) As Q,
                                                Q.Value), 0),
                        committed: Coalesce(Sum(ForAll(SprintsMatrixRows As R,
                                                    Coalesce(LookUp(R.Cells,
                                                                    Num = SP.Num).Committed, 0)) As Q,
                                                Q.Value), 0) },
                     { Num: SP.Num,
                       Label: SP.Label,
                       Available: available,
                       Committed: committed,
                       Utilisation: If(available > 0, committed / available,
                                       committed > 0, 9.99, 0) }));

      SprintsGrandAvailable = Coalesce(Sum(SprintsMatrixTotals, Available), 0);
      SprintsGrandCommitted = Coalesce(Sum(SprintsMatrixTotals, Committed), 0);
      SprintsGrandReserved  = Coalesce(Sum(SprintsMatrixTotals, Reserved), 0);
      SprintsGrandRemaining = Coalesce(Sum(SprintsMatrixTotals, Remaining), 0);

      SprintsFigures =
          Text(SprintsGrandCommitted, "[$-en-US]#,##0.0") & " committed of "
          & Text(SprintsGrandAvailable, "[$-en-US]#,##0.0") & " MW · "
          & Text(SprintsGrandReserved, "[$-en-US]#,##0.0") & " reserved · "
          & Text(SprintsGrandRemaining, "[$-en-US]#,##0.0") & " remaining";

      SprintsLabel = CurrentQuarter.Label & " · " & First(TlSprintColumns).Label
                     & " to " & Last(TlSprintColumns).Label;

      // ---------------------------------------------------------------------
      // Gaps: the free days by skill and by week, and the next window each person has.
      // A person's skills are the memo column, comma separated by PeopleTable.
      // ---------------------------------------------------------------------
      TlSkills =
          SortByColumns(
              ForAll(Filter(colListValues, List = 'List (List values)'.Skill) As L,
                     { Name: L.Value }),
              "Name", SortOrder.Ascending);

      // The next week each person has the days asked for, and how long that run holds.
      NextFreeWindowRows =
          ForAll(TlPeople As P,
                 With({ cells: LookUp(TlQuarterCells, Name = P.Name).Cells },
                     With({ first: Min(Filter(ForAll(cells As C,
                                                  { Index: LookUp(TlQuarterWeeks,
                                                                  Mon = C.Mon).Index,
                                                    Free: C.Free }),
                                              Free >= TlGapNeed),
                                       Index) },
                         With({ brk: Min(Filter(ForAll(cells As C,
                                                    { Index: LookUp(TlQuarterWeeks,
                                                                    Mon = C.Mon).Index,
                                                      Free: C.Free }),
                                                Free < TlGapNeed,
                                                Index > Coalesce(first, 0)),
                                         Index) },
                             { Name: P.Name,
                               Skill: If(P.Skills = "", "—",
                                         First(Split(P.Skills, ", ")).Value),
                               Found: !IsBlank(first),
                               WeekOf: If(IsBlank(first), "none this quarter",
                                          LookUp(TlQuarterWeeks, Index = first).Label),
                               Run: If(IsBlank(first), 0,
                                       IsBlank(brk), 13 - first + 1,
                                       brk - first) }))));

      // ---------------------------------------------------------------------
      // Availability: the same free days read person by person. One table of people, their free
      // days this sprint and the next free window from NextFreeWindowRows, with the skill chips
      // and the per-skill strip over it. The chip's skill is held in varAvailSkill; blank is all.
      // ---------------------------------------------------------------------
      TlAvailSkill = Coalesce(varAvailSkill, "");

      // The base: a person a row, no table in a column, so it can be filtered and sorted. The
      // window's week index comes back through the week label, which is TlQuarterWeeks' own.
      TlAvailPeople =
          ForAll(TlPeople As P,
                 With({ W: LookUp(NextFreeWindowRows, Name = P.Name) },
                     { Name: P.Name,
                       Squad: P.GroupName,
                       Skills: If(P.Skills = "", "—", P.Skills),
                       FreeDays: CountRows(Filter(LookUp(TlSprintCells, Name = P.Name).Cells,
                                                  kind = "open")),
                       Found: W.Found,
                       WeekOf: W.WeekOf,
                       Run: W.Run,
                       WeekIndex: Coalesce(LookUp(TlQuarterWeeks, Label = W.WeekOf).Index, 99) }));

      // Soonest window first, then the most free days. A person with no window sorts last on 99.
      TlAvailRows =
          SortByColumns(
              If(TlAvailSkill = "", TlAvailPeople,
                 Filter(TlAvailPeople, Find(TlAvailSkill, Skills) > 0)),
              "WeekIndex", SortOrder.Ascending, "FreeDays", SortOrder.Descending);

      // The chips and the strip: the skills people actually hold, with the free days this sprint
      // behind each one and how many of its people have a day free at all.
      TlAvailSkillRows =
          ForAll(Filter(ForAll(TlSkills As K,
                            { Name: K.Name,
                              Held: CountRows(Filter(TlPeople, Find(K.Name, Skills) > 0)) }),
                        Held > 0) As S,
                 { Skill: S.Name,
                   People: S.Held,
                   FreeDays: Coalesce(Sum(Filter(TlAvailPeople, Find(S.Name, Skills) > 0),
                                          FreeDays), 0),
                   PeopleFree: CountRows(Filter(TlAvailPeople, Find(S.Name, Skills) > 0,
                                                FreeDays > 0)) });

      TlAvailFigures =
          CountRows(TlAvailRows) & " people · "
          & Coalesce(Sum(TlAvailRows, FreeDays), 0) & " days free this sprint";

      // The table's columns: named shares of the container that holds the cells with a pixel
      // minimum, summing to 1.00. The widths are worked out in the screen against Parent.Width,
      // and the strip above the table reads the same shares.
      TlAvailShareName  = 0.24;
      TlAvailShareSquad = 0.14;
      TlAvailShareSkill = 0.30;
      TlAvailShareFree  = 0.14;
      TlAvailShareWin   = 0.18;
      TlAvailMinName  = 220;
      TlAvailMinSquad = 130;
      TlAvailMinSkill = 240;
      TlAvailMinFree  = 120;
      TlAvailMinWin   = 170;
      TlAvailColsW    = TlAvailMinName + TlAvailMinSquad + TlAvailMinSkill + TlAvailMinFree
                        + TlAvailMinWin;

      TlAvailStripRows     = Min(CountRows(TlAvailSkillRows), 6);

      // ---------------------------------------------------------------------
      // The widths the three grids are laid out on: a name column, then (Sprint and Quarter only) a
      // metrics column, then one column a working day/week/sprint, each a named share of the
      // container that holds it with a pixel minimum, the shares summing to 1.00
      // (power/RUNBOOK.md, "Table columns"). A head row reads Parent.Width, a gallery row reads
      // Parent.TemplateWidth, against the same shares.
      // ---------------------------------------------------------------------
      TlRowH     = 32;

      // A cell draws one line and is clipped by its column, so its text is cut to the characters
      // the column can hold and ends in an ellipsis rather than mid-word. A caption's average
      // glyph is a little over half its point size in the UI face.
      TlCellCharW = TypeCaption * 0.55;
      TlSprintDayCount =
          Max(1, Coalesce(LookUp(SprintGrid, Num = TlSprintNum).WorkDays, CountRows(TlSprintDays)));

      // Sprint: the day grid.
      TlSpShareName = 0.18;
      TlSpMinName   = 180;
      TlSpShareMeta = 0.08;
      TlSpMinMeta   = 90;
      TlSpShareDay  = 0.074;
      TlSpMinDay    = 64;
      TlSpTableMinW = TlSpMinName + TlSpMinMeta + TlSpMinDay * TlSprintDayCount;

      // Sprint overview: one column a sprint, the count the grid is spread over.
      TlSpsColCount  = Max(1, CountRows(TlSprintColumns));

      // The cell colours, one fill and one text colour a Tone (TlKindTone), so no control knows
      // which theme it is in and a legend label tints exactly the way a grid cell of the same kind
      // does. Open takes the Subtle tone: a neutral surface one step lighter than the card, so an
      // empty day reads as empty rather than as a colour. A bank holiday is not an empty day and
      // takes a slate tone of its own, so the legend's two grey rows can be told apart. Work, at
      // risk and late read the status tokens straight.
      TlKindFillSubtle      = NeutralBg3;
      TlKindTextSubtle      = NeutralFg2;
      TlKindFillHoliday     = If(IsDark, ColorValue("#2A3140"), ColorValue("#E3E8EF"));
      TlKindTextHoliday     = If(IsDark, ColorValue("#AFBACB"), ColorValue("#3D4A5C"));
      TlKindFillInformative = If(IsDark, ColorValue("#3B2E52"), ColorValue("#EDE7F6"));
      TlKindTextInformative = If(IsDark, ColorValue("#D5C2F0"), ColorValue("#4A2C7A"));
      TlKindFillImportant   = If(IsDark, ColorValue("#4A2C42"), ColorValue("#FBE9F3"));
      TlKindTextImportant   = If(IsDark, ColorValue("#F2C2DC"), ColorValue("#8A2A5C"));
      TlKindFillSuccess     = StatusGoodFill;
      TlKindTextSuccess     = StatusGood;
      TlKindFillWarning     = StatusWarnFill;
      TlKindTextWarning     = StatusWarn;
      TlKindFillDanger      = StatusBadFill;
      TlKindTextDanger      = StatusBad;

      // The legend: one row a kind the grid can draw, in reading order, each carrying the fill and
      // the text colour its tone gives it, so a legend swatch and a grid cell of the same kind can
      // never take different colours. Sick is a leave cell the grid labels "Sick", so it reads
      // leave's own tone rather than a tone of its own; open carries a swatch like the rest.
      TlLegend =
          ForAll(Table({ Kind: "open",     Label: "Open" },
                       { Kind: "leave",    Label: "Leave" },
                       { Kind: "leave",    Label: "Sick" },
                       { Kind: "training", Label: "Training" },
                       { Kind: "bankhol",  Label: "Bank holiday" },
                       { Kind: "work",     Label: "Work" },
                       { Kind: "atrisk",   Label: "At risk" },
                       { Kind: "late",     Label: "Late" }) As L,
                 With({ tone: Coalesce(LookUp(TlKindTone, Kind = L.Kind).Tone, "Subtle") },
                     { Kind: L.Kind,
                       Label: L.Label,
                       Fill: Switch(tone,
                                 "Subtle",      TlKindFillSubtle,
                                 "Holiday",     TlKindFillHoliday,
                                 "Informative", TlKindFillInformative,
                                 "Important",   TlKindFillImportant,
                                 "Success",     TlKindFillSuccess,
                                 "Warning",     TlKindFillWarning,
                                 TlKindFillDanger),
                       Ink: Switch(tone,
                                "Subtle",      TlKindTextSubtle,
                                "Holiday",     TlKindTextHoliday,
                                "Informative", TlKindTextInformative,
                                "Important",   TlKindTextImportant,
                                "Success",     TlKindTextSuccess,
                                "Warning",     TlKindTextWarning,
                                TlKindTextDanger) }));

      // The legend row's own geometry. The figures line takes half the row, so the legend holds one
      // line only while the two sit side by side; narrower than that the row wraps, and a wrapping
      // row is two lines high rather than clipped to one.
      TlLegendItemW = 96;
      TlLegendW     = TlLegendItemW * CountRows(TlLegend);
      TlBodyW       = App.Width - If(RailCollapsed, RailWidthTight, NavW) - Pad * 2;
      TlLegendMinW  = (TlLegendW + 8) * 2;
      TlLegendRowH  = If(TlBodyW < TlLegendMinW, (TypeLabelLine + 8) * 2, TypeLabelLine + 8);


      // =====================================================================
      // src/pages/Settings.tsx: the nine tabs, the lists behind four of them, and the
      // activity log. The Quarter, Money and Links forms are read straight off the
      // singleton (Waypoint) and the current quarter, so nothing is held in a collection
      // between opening the tab and saving it.
      // =====================================================================

      // The pivot. varSetTab is written by the tab list, so the screen opens on Quarter.
      SettingsTab = If(IsBlank(varSetTab), "Quarter", varSetTab);

      // The four editable lists, each in the order the workbook reads it.
      SettingsStateRows   = Sort(colStates, Order, SortOrder.Ascending);
      SettingsListRows    = Sort(colListValues, Order, SortOrder.Ascending);
      SettingsGradeRows   = Sort(colGrades, 'Business grade', SortOrder.Ascending);
      SettingsBlendRows   = Sort(colBlends, 'Blend name', SortOrder.Ascending);
      SettingsOutcomeRows = Sort(colOutcomes, Outcome, SortOrder.Ascending);

      // Activity: every entry, newest first, narrowed by the search box above the table.
      SettingsActivitySearch = If(IsBlank(varSetSearch), "", varSetSearch);
      SettingsActivityRows =
          Sort(If(SettingsActivitySearch = "",
                  colActivity,
                  Filter(colActivity,
                         SettingsActivitySearch in Label
                         || SettingsActivitySearch in Summary
                         || SettingsActivitySearch in 'Record name')),
               At, SortOrder.Descending);

      // The running total the Work register follows, as the Money tab offers it.
      SettingsRunningOptions = Table({ Value: "Latest" }, { Value: "Original" }, { Value: "Actual" });
      // Two-option columns are patched from a dropdown, so the two words are a list as well.
      SettingsYesNo = Table({ Value: "Yes" }, { Value: "No" });

      // The label column of the two-column forms, and the width one field takes.
      SetFieldLabelH = TypeLabelLine;
      SetFieldRowH   = TypeLabelLine + ControlHeight + 4;

      // =====================================================================
      // src/pages/Import.tsx: the five steps, and the runs already made.
      //
      // Reading the file is a Power Automate flow at work, not a formula: canvas has no CSV or
      // XLSX reader. The screen is the strip, the explanation and the record of what has run.
      // =====================================================================

      ImportStep = If(IsBlank(varImportStep), "Choose source", varImportStep);
      ImportStepIndex =
          Switch(ImportStep, "Choose source", 1, "Choose file", 2, "Map columns", 3,
                 "Match people", 4, "Preview", 5, 1);

      // The runs already made, newest first.
      ImportRunRows = Sort(colImportRuns, 'Run at', SortOrder.Descending);

      // The widths the runs table is laid out on; the run's own name grows.
      ImpColWhen    = 160;
      ImpColSource  = 120;
      ImpColRows    = 100;
      ImpColApplied = 100;
      ImpColBy      = 180;
      ImpRunColsW   = ImpColWhen + ImpColSource + ImpColRows + ImpColApplied + ImpColBy;

      // =====================================================================
      // Forms: the person panel on Team, and the geometry every later form repeats
      // (power/RUNBOOK.md, section 4, "Forms").
      //
      // varPersonFormOpen opens the panel; varPersonEdit is the People row being edited, blank for
      // a new person. Validation itself is not here: a named formula cannot read a control, so the
      // rules sit on the panel's own error text and on the Save button's DisplayMode.
      // =====================================================================

      FormEditing = !IsBlank(varPersonEdit);
      FormTitle   = If(FormEditing, "Edit " & varPersonEdit.'Full name', "Add person");

      // The panel's geometry. One field is its label line over a control, and the next field
      // starts a Gap below it, so a field's Y is only ever its index times the step.
      FormFieldH    = TypeLabelLine + ControlHeight + 4;
      FormFieldStep = FormFieldH + Gap;
      FormFieldTop  = Pad + TypeDisplayLine + Gap;
      // The foot: the error line over the two buttons, both measured up from the panel's bottom.
      FormFootH     = TypeLabelLine * 2 + ControlHeight + Gap + Pad;

      // The lists the panel's dropdowns read. Squads and skills are already one-column lists for
      // the work item form, so they are reused rather than written twice.
      FormEmploymentOptions = Table({ Value: "Permanent" }, { Value: "NPW" },
                                    { Value: "Open vacancy" });
      FormRegionOptions     =
          ForAll(Sort(Filter(colListValues, List = 'List (List values)'.Region), Value) As L,
                 { Value: L.Value });

      // The defaults, one per editable column. A choice is read with Text(), a lookup through its
      // own primary column, and the modifier is held as a fraction and typed as a percentage.
      FormPersonName       = Coalesce(varPersonEdit.'Full name', "");
      FormPersonRole       = Coalesce(varPersonEdit.Role, "");
      FormPersonSquad      = Coalesce(varPersonEdit.Squad.'Squad name', "");
      FormPersonGrade      = Text(varPersonEdit.'Team grade');
      FormPersonRegion     = Coalesce(varPersonEdit.Region.Value, "");
      FormPersonEmployment = Text(varPersonEdit.Employment);
      FormPersonLead       = If(FormEditing && varPersonEdit.Lead, "Yes", "No");
      FormPersonSkills     = Coalesce(varPersonEdit.Skills, "");
      FormPersonDpw        =
          If(IsBlank(varPersonEdit.'Days per week'), "",
             Text(varPersonEdit.'Days per week', "[$-en-US]#,##0.0"));
      FormPersonModifier   =
          If(IsBlank(varPersonEdit.'Modifier override'), "",
             Text(varPersonEdit.'Modifier override' * 100, "[$-en-US]#,##0"));

      // =====================================================================
      // FormAbsence: the absence panel on Team, the person form's pattern over Absences
      // (power/RUNBOOK.md, section 4, "Forms"). Non-work time of every sort is one form
      // (power/decisions.md, "Product decisions, 20 September 2026 evening").
      //
      // varAbsOpen opens the panel; varAbsEdit is the Absences row being edited, blank when the
      // panel is taking one absence for many people. A named formula cannot read a control, so
      // only the defaults, the option lists and the panel's own geometry are here: the scope's
      // effect on the people picked, the days count and the validation all read controls and sit
      // on the panel itself.
      //
      // The seed carries Leave, Training and Sickness only. Planning, Event and Change freeze are
      // still to be seeded as 'List values' rows with List = Absence type; the dropdown below
      // reads the list, so they appear the moment the data lands and nothing here changes.
      // =====================================================================

      FormAbsenceEditing = !IsBlank(varAbsEdit);
      FormAbsenceTitle   = If(FormAbsenceEditing, "Edit absence", "Add absence");

      // The one person a row being edited is for; blank for a new absence, which is what leaves
      // the people combo box empty until a scope or a name is chosen.
      FormAbsencePerson  = If(FormAbsenceEditing,
                              Coalesce(varAbsEdit.Person.'Full name', ""), "");
      FormAbsenceNote    = If(FormAbsenceEditing, Coalesce(varAbsEdit.Note, ""), "");
      FormAbsenceType    = If(FormAbsenceEditing,
                              Coalesce(varAbsEdit.'Absence type'.Value, ""), "");

      // Onshore is the UK; offshore is everyone else with a region at all. The mapping is on the
      // Region list value each person carries, not on the squad.
      FormAbsenceOnshoreRegions =
          Table({ Value: "England" }, { Value: "Wales" }, { Value: "Scotland" },
                { Value: "Northern Ireland" });

      // The people the combo box offers, each with the two things a scope is worked out from.
      FormAbsencePeopleOptions =
          ForAll(Sort(colPeople, 'Full name') As P,
                 { Value: P.'Full name',
                   Squad: Coalesce(P.Squad.'Squad name', ""),
                   Onshore: !IsBlank(LookUp(FormAbsenceOnshoreRegions,
                                            Value = P.Region.Value)) });

      // The scope dropdown above the combo box: the four standing scopes, then a row per squad.
      FormAbsenceScopeOptions =
          With({ sq: ForAll(Sort(colSquads, 'Squad name') As S, { Value: S.'Squad name' }) },
              ForAll(Sequence(CountRows(sq) + 4) As K,
                     { Value: Switch(K.Value,
                                     1, "Choose people",
                                     2, "Everyone",
                                     3, "Onshore",
                                     4, "Offshore",
                                     Index(sq, K.Value - 4).Value) }));

      // The absence types, read from the list rather than typed here, so a seeded type shows
      // without a change to the app.
      FormAbsenceTypeOptions =
          ForAll(Sort(Filter(colListValues,
                             List = 'List (List values)'.'Absence type'), Value) As L,
                 { Value: L.Value });

      // From and To are weeks, not days: there is no DatePicker in this build, so a week carries
      // its own Monday and the panel patches Monday to Friday.
      // The weeks the dropdowns offer: eight weeks before the quarter opens through to the end
      // of the horizon, so today is always one of them and a default outside the quarter still
      // resolves to a week.
      FormAbsenceWeekFirst =
          DateAdd(QuarterStart, -(Weekday(QuarterStart, StartOfWeek.Monday) - 1) - 56,
                  TimeUnit.Days);
      FormAbsenceWeekCount =
          RoundDown(Max(DateDiff(FormAbsenceWeekFirst, QuarterEnd, TimeUnit.Days),
                        DateDiff(FormAbsenceWeekFirst, Last(TimelineWeeks).Monday, TimeUnit.Days),
                        DateDiff(FormAbsenceWeekFirst, Today(), TimeUnit.Days),
                        0) / 7, 0) + 1;
      FormAbsenceWeekOptions =
          ForAll(Sequence(FormAbsenceWeekCount, 0) As K,
              With({ mon: DateAdd(FormAbsenceWeekFirst, K.Value * 7, TimeUnit.Days) },
                  { Value: "w/c " & Text(mon, "d mmm"), Mon: mon }));

      // The week a date falls in, as the label the dropdown shows. A new absence opens on the
      // week the current sprint starts, which is the week a planner is booking into; a row being
      // edited opens on its own dates.
      FormAbsenceFromDate = If(FormAbsenceEditing && !IsBlank(varAbsEdit.From),
                               varAbsEdit.From,
                               Coalesce(LookUp(SprintGrid, Num = CurrentSprint).From, Today()));
      FormAbsenceToDate   = If(FormAbsenceEditing && !IsBlank(varAbsEdit.To),
                               varAbsEdit.To, FormAbsenceFromDate);
      FormAbsenceFromWeek =
          "w/c " & Text(DateAdd(FormAbsenceFromDate,
                                -(Weekday(FormAbsenceFromDate, StartOfWeek.Monday) - 1),
                                TimeUnit.Days), "d mmm");
      FormAbsenceToWeek   =
          "w/c " & Text(DateAdd(FormAbsenceToDate,
                                -(Weekday(FormAbsenceToDate, StartOfWeek.Monday) - 1),
                                TimeUnit.Days), "d mmm");

      // The Monday each dropdown is sitting on, written once and read by the To default, the days
      // line, the validation and the save. A named formula cannot read a control, so this reads
      // varAbsFromWeek/varAbsToWeek instead of the dropdowns themselves: tmAbsFrom.OnChange and
      // tmAbsTo.OnChange keep the two in step with what is picked.
      FormAbsenceFromMonday =
          LookUp(FormAbsenceWeekOptions, Value = varAbsFromWeek).Mon;
      FormAbsenceToMonday   =
          LookUp(FormAbsenceWeekOptions, Value = varAbsToWeek).Mon;

      // The panel's own geometry, on the person form's field step: six fields, then the days
      // line, then the Remove a row being edited carries.
      FormAbsenceDaysY   = FormFieldTop + FormFieldStep * 6;
      FormAbsenceRemoveY = FormAbsenceDaysY + TypeLabelLine + Gap;
      // The error line sits under the last thing in the stack, not down in the foot.
      FormAbsenceErrorY  = FormAbsenceRemoveY + ControlHeight + Gap;

      // =====================================================================
      // FormWork: the new work item panel on Work, the person panel's pattern with the fields a
      // feature, a spike or a component is shaped with.
      //
      // varWorkFormOpen opens the panel and varWorkNewKind says which of the three it is shaping;
      // there is no record behind it, so the defaults here are the empty choice a dropdown opens
      // on rather than a row's current value. The model has no Problem or Outcome column, so the
      // common shaping text is Notes (wp_notes), the column convertSpike() already writes.
      // =====================================================================

      FormWorkKind        = Coalesce(varWorkNewKind, "Feature");
      FormWorkIsSpike     = FormWorkKind = "Spike";
      FormWorkTitle       = "New " & Lower(FormWorkKind);

      // The state a new item starts in: the first Shaping-phase state, which is the one
      // useDataset.ts convertSpike() gives the feature it makes.
      FormWorkInitialState = LookUp('Work states', State = "Identified");

      // The empty value every dropdown on the panel opens on. A Default is a record from Items,
      // never a bare string, so the blank is a record too.
      FormWorkNone = "";

      // =====================================================================
      // FormAssign: the Assign people section on the work item's Assess tab, the one place a
      // person is put on work (power/decisions.md, 20 September 2026 evening).
      //
      // Nothing opens or closes here: the section sits in the Assess card and reads varItem. Only
      // the option lists, the defaults and the sprint dates are named formulas, because a named
      // formula cannot read a control.
      // =====================================================================

      // Everyone, in the order the picker shows them: sorted on DisplayLabel, so the squad leads
      // the name and two people with the same first name are told apart.
      FormAssignPeopleOptions =
          Sort(
              ForAll(colPeople As P,
                     { Value: P.'Full name',
                       DisplayLabel: If(IsBlank(P.Squad.'Squad name'), P.'Full name',
                                        P.Squad.'Squad name' & " · " & P.'Full name') }),
              DisplayLabel);

      // The sprints of the planning horizon, as the sprint dropdowns read them.
      FormAssignSprintOptions = ForAll(Sequence(Sprints, FirstSprint) As S, { Value: "S" & S.Value });

      // The item's own span, clipped to the horizon: what the two dropdowns open on.
      FormAssignFromSprint =
          If(IsBlank(varItem.'Absolute start sprint'), TlSprintNum,
             Max(FirstSprint, Min(LastSprint, varItem.'Absolute start sprint')));
      FormAssignToSprint =
          If(IsBlank(varItem.'Absolute end sprint'), FormAssignFromSprint,
             Max(FormAssignFromSprint,
                 Max(FirstSprint, Min(LastSprint, varItem.'Absolute end sprint'))));
      FormAssignFromDefault = "S" & FormAssignFromSprint;
      FormAssignToDefault   = "S" & FormAssignToSprint;

      // The dates a sprint is assigned over: the Monday it opens on and the Friday of its last
      // week, off the sprint table. Here, and not on the screen, because the screen binder reads
      // StartOfWeek as an option set rather than the enum.
      FormAssignSprintDates =
          ForAll(SprintGrid As S,
              With({ mon: DateAdd(S.From, -(Weekday(S.From, StartOfWeek.Monday) - 1),
                                  TimeUnit.Days) },
                  { Num: S.Num,
                    From: mon,
                    To: DateAdd(S.To, -Max(0, Weekday(S.To, StartOfWeek.Monday) - 5),
                                TimeUnit.Days) }));

      // What this item already carries, for the list under the button. The rows come off the
      // collection the timeline reads, which is rebuilt from the table after every write, and
      // Remove takes a row of the data source behind it.
      FormAssignRows =
          Sort(Filter(colAssignments, 'Work item'.Title = varItem.Title), From);
      FormAssignCount = CountRows(FormAssignRows);
      FormAssignListH = RowHeight * Max(1, Min(FormAssignCount, 5));

      // =====================================================================
      // NumberTones: the one threshold table every number that carries a judgement is coloured
      // from (power/RUNBOOK.md, "Number tones"). A number that is only a fact — a modifier, a
      // rate, a count — stays neutral and reads none of this. A change to a threshold is one
      // edit to the table below.
      //
      // HigherIsWorse says which way the metric runs: true and the value is compared upwards
      // (utilisation over 100 per cent is bad), false and it is compared downwards (free member
      // weeks below zero is bad).
      //
      // Per-row values inside a gallery cannot be named formulas, so a cell's Color is written
      // inline against the same table, in this shape:
      //
      //   With({ t: LookUp(NumberTones, Metric = "utilisation") },
      //       If(t.HigherIsWorse,
      //          If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
      //          If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))))
      //
      // where v is the row's own number (ThisItem.Utilisation and the like).
      // =====================================================================

      NumberTones =
          Table({ Metric: "utilisation", WarnAt: 0.85, BadAt: 1,    HigherIsWorse: true },
                { Metric: "freeMW",      WarnAt: 2,    BadAt: 0,    HigherIsWorse: false },
                { Metric: "remaining",   WarnAt: 0.10, BadAt: 0,    HigherIsWorse: false },
                { Metric: "slip",        WarnAt: 0,    BadAt: 1,    HigherIsWorse: true },
                { Metric: "benefitGap",  WarnAt: 0.0001, BadAt: 0.10, HigherIsWorse: true },
                { Metric: "daysLeft",    WarnAt: 2,    BadAt: 0,    HigherIsWorse: false });

      // The four tones, as the theme's own status tokens: no control ever names a colour, and
      // light and dark come through the tokens themselves.
      ToneGood    = StatusGood;
      ToneWarn    = StatusWarn;
      ToneBad     = StatusBad;
      ToneNeutral = NeutralFg1;

      // The headline numbers that already exist as named formulas, toned against their row.
      RemainingTone =
          With({ t: LookUp(NumberTones, Metric = "remaining"),
                 v: If(Coalesce(NetTotal, 0) = 0, 0,
                       (Coalesce(NetTotal, 0) - Coalesce(CommittedTotal, 0) - Coalesce(ReservedTotal, 0)) / NetTotal) },
              If(t.HigherIsWorse,
                 If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                 If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))));

      // The gap is a shortfall against target: nothing short is met, and met is good.
      BenefitGapTone =
          With({ t: LookUp(NumberTones, Metric = "benefitGap"),
                 v: If(Coalesce(GbpTarget, 0) = 0, 0, Coalesce(Max(0, GbpTarget - RecordedTotal), 0) / GbpTarget) },
              If(v = 0, ToneGood,
                 If(t.HigherIsWorse,
                    If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                    If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral)))));

      DaysLeftTone =
          With({ t: LookUp(NumberTones, Metric = "daysLeft"), v: SprintDaysLeft },
              If(t.HigherIsWorse,
                 If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                 If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))));

      ItemSlipTone =
          With({ t: LookUp(NumberTones, Metric = "slip"), v: Coalesce(ItemWalkSlip, 0) },
              If(t.HigherIsWorse,
                 If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                 If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))));

      // The quarter's utilisation, as the Command band reads it: committed over net.
      UtilisationTone =
          With({ t: LookUp(NumberTones, Metric = "utilisation"),
                 v: If(NetTotal = 0, 0, CommittedTotal / NetTotal) },
              If(t.HigherIsWorse,
                 If(v >= t.BadAt, ToneBad, If(v >= t.WarnAt, ToneWarn, ToneNeutral)),
                 If(v <= t.BadAt, ToneBad, If(v <= t.WarnAt, ToneWarn, ToneNeutral))));

      // =====================================================================
      // The header search. One instance of cmpSearch sits in every screen's header band and binds
      // to the table below: the three things a person looks for by name, in one shape.
      //
      // Table() takes records rather than tables and Ungroup is not a function the offline checker
      // carries, so the three collections are walked as one Sequence and Index picks the row out of
      // whichever of them the position falls in. Kind is what the combo box's OnChange switches on.
      // =====================================================================
      SearchIndex =
          With({ np: CountRows(colPeople), ns: CountRows(colSquads) },
              ForAll(Sequence(np + ns + CountRows(colWork)) As N,
                  If(N.Value <= np,
                     With({ P: Index(colPeople, N.Value) },
                         { Kind: "Person",
                           Name: P.'Full name',
                           Sub: Coalesce(P.Squad.'Squad name', "No squad"),
                           Key: "Person|" & P.'Full name' }),
                     N.Value <= np + ns,
                     With({ S: Index(colSquads, N.Value - np) },
                         { Kind: "Squad",
                           Name: S.'Squad name',
                           Sub: Coalesce(S.Lead.'Full name', "No lead"),
                           Key: "Squad|" & S.'Squad name' }),
                     With({ W: Index(colWork, N.Value - np - ns) },
                         { Kind: "Item",
                           Name: W.Title,
                           Sub: Coalesce(W.Epic.Epic, "No epic")
                                & " · " & Coalesce(W.State.State, "No state"),
                           Key: "Item|" & W.Title }))));

      // =====================================================================
      // Scope. The header's team selector: the teams the loaded collections carry, and what the
      // selector shows. The Teams table is not connected in Studio, so every name here is read
      // through the Team lookup the connected tables already carry, never off wp_team itself.
      //
      // Table() takes records rather than tables and Ungroup is not a function the offline checker
      // carries, so the three collections are walked as one Sequence and Index picks the row out
      // of whichever of them the position falls in, the same shape as SearchIndex above.
      // =====================================================================
      // Whether the app is scoped at all. The scoped reads narrow through that same Team lookup,
      // and wp_team is not connected in Studio yet, so they are held in power/app/App.scope.yaml
      // behind includeScope in power/canvas/flags.json; that flag is what flips IncludeScope here,
      // and every cmpScope instance's Visible reads it, so no screen offers a selector that cannot
      // narrow anything (power/RUNBOOK.md, section 4, "The scope flag").
      IncludeScope = false;

      ScopeAllLabel = "All teams";

      ScopeTeamRows =
          If(IncludeScope,
             With({ np: CountRows(colPeople), ns: CountRows(colSquads) },
                 ForAll(Sequence(np + ns + CountRows(colWork)) As N,
                     If(N.Value <= np,
                        { Name: Coalesce(Index(colPeople, N.Value).Team.Team, "") },
                        N.Value <= np + ns,
                        { Name: Coalesce(Index(colSquads, N.Value - np).Team.Team, "") },
                        { Name: Coalesce(Index(colWork, N.Value - np - ns).Team.Team, "") }))),
             Filter(Table({ Name: "" }), Name <> ""));

      ScopeTeams =
          SortByColumns(Distinct(Filter(ScopeTeamRows, Name <> ""), Name),
                        "Value", SortOrder.Ascending);

      // The selector's own items, with "All teams" first: a blank varScopeTeam is every team the
      // signed-in user can see, which is what the app opens on.
      ScopeOptions =
          ForAll(Sequence(CountRows(ScopeTeams) + 1) As N,
              { Value: If(N.Value = 1, ScopeAllLabel, Index(ScopeTeams, N.Value - 1).Value) });

      ScopeLabel = If(IsBlank(varScopeTeam), ScopeAllLabel, varScopeTeam);
