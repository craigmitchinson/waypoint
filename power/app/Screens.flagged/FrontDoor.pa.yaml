            # One error line for the panel: what Dataverse refused, or the first rule
            # broken. The same condition disables Save notes.
            - fdScrError:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Parent.Height - FrontDoorScreenFootH + FormFieldStep * 3
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine * 2
                  Visible: |
                    =!IsBlank(varFrontDoorScreenError)
                     || IsBlank(Trim(fdScrFieldNotes.Text))
                  Text: |
                    =If(!IsBlank(varFrontDoorScreenError), varFrontDoorScreenError,
                        IsBlank(Trim(fdScrFieldNotes.Text)),
                        "Screening notes are required before this request moves on.",
                        "")
                  Size: =TypeCaption
                  Font: =FontUI
                  Color: =StatusBad
                  Wrap: =true
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  AutoHeight: =true
            - fdScrSpike:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =Parent.Height - ControlHeight * 2 - Gap - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Promote to spike"
                  AccessibleLabel: ="Promote this request to a spike"
                  DisplayMode: |
                    =If(IsBlank(Trim(fdScrFieldNotes.Text)),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =// One work item in Shaping at the register's first state, carrying the
                     // request's own words, its team and the owner who screened it, and saying
                     // in Source that it came through the front door
                     // (power/design-work-flow.md, section 5).
                     IfError(
                      Set(varFrontDoorPromoted,
                          Patch('Work items', Defaults('Work items'),
                                { Title: varFrontDoorScreen.Title,
                                  Kind: 'Kind (Work items)'.Spike,
                                  Phase: 'Phase (Work items)'.Shaping,
                                  Source: 'Source (Work items)'.'Front door',
                                  State: FormWorkInitialState,
                                  'Spike question': FrontDoorPromotedProblem,
                                  Notes: FrontDoorPromotedRest,
                                  Priority: FrontDoorScreenPriority,
                                  'Product owner': LookUp(People,
                                                          'Full name' = User().FullName),
                                  Team: LookUp(Teams,
                                               Team = varFrontDoorScreen.Team.Team) })),
                      Set(varFrontDoorScreenError, FirstError.Message),
                      // The request closes as Promoted and points at what it became.
                      Patch('Requests', varFrontDoorScreen,
                            { 'Request status': 'Request status (Requests)'.Promoted,
                              'Screening notes': Trim(fdScrFieldNotes.Text),
                              'Screened by': LookUp(People,
                                                    'Full name' = User().FullName),
                              'Screened on': Now(),
                              'Promoted to': varFrontDoorPromoted });
                      // The register reads the collection App.OnStart built, so it is
                      // rebuilt from the table before the panel closes.
                      ClearCollect(colWork, 'Work items');
                      Set(varFrontDoorScreenError, "");
                      Set(varFrontDoorScreenOpen, false);
                      Notify(varFrontDoorScreen.Title & " promoted to a spike.",
                             NotificationType.Success))
            - fdScrFeature:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad + (Parent.Width - Pad * 2 - Gap) / 2 + Gap
                  Y: =Parent.Height - ControlHeight * 2 - Gap - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Promote to feature"
                  AccessibleLabel: ="Promote this request to a feature"
                  DisplayMode: |
                    =If(IsBlank(Trim(fdScrFieldNotes.Text)),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =// One work item in Shaping at the register's first state, carrying the
                     // request's own words, its team and the owner who screened it, and saying
                     // in Source that it came through the front door
                     // (power/design-work-flow.md, section 5).
                     IfError(
                      Set(varFrontDoorPromoted,
                          Patch('Work items', Defaults('Work items'),
                                { Title: varFrontDoorScreen.Title,
                                  Kind: 'Kind (Work items)'.Feature,
                                  Phase: 'Phase (Work items)'.Shaping,
                                  Source: 'Source (Work items)'.'Front door',
                                  State: FormWorkInitialState,
                                  Notes: FrontDoorPromotedNotes,
                                  Priority: FrontDoorScreenPriority,
                                  'Product owner': LookUp(People,
                                                          'Full name' = User().FullName),
                                  Team: LookUp(Teams,
                                               Team = varFrontDoorScreen.Team.Team) })),
                      Set(varFrontDoorScreenError, FirstError.Message),
                      // The estimate the requester gave is the feature's first claim, when it
                      // is a number; a spike carries no claims (power/design-work-flow.md,
                      // section 4).
                      If(!IsBlank(FrontDoorClaimValue),
                         Patch('Benefit claims', Defaults('Benefit claims'),
                               { Name: varFrontDoorScreen.Title & " · "
                                       & Lower(Text(varFrontDoorScreen.'Benefit type')),
                                 'Work item': varFrontDoorPromoted,
                                 'Benefit type':
                                     Switch(Text(varFrontDoorScreen.'Benefit type'),
                                            "FTE released",
                                            'Benefit type (Benefit claims)'.'FTE released',
                                            "Cost avoidance",
                                            'Benefit type (Benefit claims)'.'Cost avoidance',
                                            "Cycle-time cut",
                                            'Benefit type (Benefit claims)'.'Cycle-time cut',
                                            "Error reduction",
                                            'Benefit type (Benefit claims)'.'Error reduction',
                                            "Throughput",
                                            'Benefit type (Benefit claims)'.Throughput,
                                            "Compliance / risk",
                                            'Benefit type (Benefit claims)'.'Compliance / risk',
                                            'Benefit type (Benefit claims)'.'CX / EX uplift'),
                                 'Claimed value': FrontDoorClaimValue });
                         ClearCollect(colClaims, 'Benefit claims'));
                      // The request closes as Promoted and points at what it became.
                      Patch('Requests', varFrontDoorScreen,
                            { 'Request status': 'Request status (Requests)'.Promoted,
                              'Screening notes': Trim(fdScrFieldNotes.Text),
                              'Screened by': LookUp(People,
                                                    'Full name' = User().FullName),
                              'Screened on': Now(),
                              'Promoted to': varFrontDoorPromoted });
                      // The register reads the collection App.OnStart built, so it is
                      // rebuilt from the table before the panel closes.
                      ClearCollect(colWork, 'Work items');
                      Set(varFrontDoorScreenError, "");
                      Set(varFrontDoorScreenOpen, false);
                      Notify(varFrontDoorScreen.Title & " promoted to a feature.",
                             NotificationType.Success))
            - fdScrSave:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =BrandBg
                  Color: =BrandFg
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Save notes"
                  AccessibleLabel: ="Save the screening notes and mark this request screened"
                  DisplayMode: |
                    =If(IsBlank(Trim(fdScrFieldNotes.Text)),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =// Screened: the notes are written, the screener and the date with them,
                     // and the decision itself is still open.
                     IfError(
                      Patch('Requests', varFrontDoorScreen,
                            { 'Request status': 'Request status (Requests)'.Screened,
                              'Screening notes': Trim(fdScrFieldNotes.Text),
                              'Screened by': LookUp(People,
                                                    'Full name' = User().FullName),
                              'Screened on': Now() }),
                      Set(varFrontDoorScreenError, FirstError.Message),
                      Set(varFrontDoorScreenError, "");
                      Set(varFrontDoorScreenOpen, false);
                      Notify(varFrontDoorScreen.Title & " screened.",
                             NotificationType.Success))
            - fdScrDecline:
                Control: ModernButton@1.0.0
                Properties:
                  X: =Pad + (Parent.Width - Pad * 2 - Gap) / 2 + Gap
                  Y: =Parent.Height - ControlHeight - Pad
                  Width: =(Parent.Width - Pad * 2 - Gap) / 2
                  Height: =ControlHeight
                  Appearance: =ButtonAppearance.Subtle
                  BasePaletteColor: =NeutralBg1
                  Color: =NeutralFg1
                  Font: =FontUI
                  Size: =TypeBodyPx
                  RadiusTopLeft: =CtrlR
                  RadiusTopRight: =CtrlR
                  RadiusBottomLeft: =CtrlR
                  RadiusBottomRight: =CtrlR
                  Text: ="Decline"
                  AccessibleLabel: ="Decline this request with a category and a reason"
                  DisplayMode: |
                    =If(IsBlank(Trim(fdScrFieldNotes.Text))
                        || IsBlank(fdScrFieldCategory.Selected.Value)
                        || IsBlank(Trim(fdScrFieldReason.Text)),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |
                    =// A decline is never bare: the category and the reason are both on the
                     // row, so the requester can be told why.
                     IfError(
                      Patch('Requests', varFrontDoorScreen,
                            { 'Request status': 'Request status (Requests)'.Declined,
                              'Decline category': fdScrFieldCategory.Selected.Value,
                              'Decline reason': Trim(fdScrFieldReason.Text) }),
                      Set(varFrontDoorScreenError, FirstError.Message),
                      // The same line the Command card's Reject writes, so a rejection reads the
                      // same in the log whichever door it was taken at.
                      Patch('Activity log', Defaults('Activity log'),
                            { Label: varFrontDoorScreen.Title & " · rejected",
                              Summary: Coalesce(ItemMeName, "Someone")
                                       & " rejected this request at the front door: "
                                       & Trim(fdScrFieldReason.Text),
                              Action: 'Action (Activity log)'.'Stage action',
                              Table: "wp_request",
                              Record: Text(varFrontDoorScreen.'Request id'),
                              'Record name': varFrontDoorScreen.Title,
                              Before: Text(varFrontDoorScreen.'Request status'),
                              After: "Declined",
                              At: Now() });
                      ClearCollect(colActivity, 'Activity log');
                      Set(varFrontDoorScreenError, "");
                      Set(varFrontDoorScreenOpen, false);
                      Notify(varFrontDoorScreen.Title & " declined.",
                             NotificationType.Success))
