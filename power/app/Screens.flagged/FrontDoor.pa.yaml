# Waypoint canvas app: the front door, the queue a product owner screens.
#
# power/design-work-flow.md, section 5: the screen is the screening queue and nothing else. The
# request form is not in Waypoint; a requester app or a SharePoint list writes wp_request, and
# this screen reads the New and Screened rows oldest first, opens one in the screening panel, and
# carries Screen, Promote to feature, Promote to spike and Decline.
#
# THIS SCREEN IS FLAG-GATED. Requests, Labs and Teams are not connected in Studio yet, so
# scripts/assemble-canvas.mjs carries neither this file nor Formulas.frontdoor.yaml into the
# build while its `includeFrontDoor` flag is false (power/RUNBOOK.md, section 4, "The front
# door flag"). Nothing here is proven in the player.
#
# The shell is scrImport's, unchanged: fdRoot is a vertical GroupContainer the size of the
# screen, holding the header and a horizontal row of the rail and the body. The panel follows the
# person panel on Team (power/RUNBOOK.md, section 4, "Forms"): the request's answers read-only
# over a foot of the notes, the decline answers, one error line and the four moves.
Screens:
  scrFrontDoor:
    Properties:
      Fill: =NeutralCanvas
      # The screening panel opens on a row, never on a screen visit.
      OnVisible: |
        =Set(varFrontDoorScreenOpen, false);
         Set(varFrontDoorScreenError, "")

    Children:

      # ---- the root: one vertical auto-layout container the size of the screen ----
      - fdRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutOverflowX: =LayoutOverflow.Hide
            LayoutOverflowY: =LayoutOverflow.Hide
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =NeutralCanvas
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
          Children:

            # ---- shell: the app header ----
            - fdHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =0
                  Height: =AppHeaderH
                  Fill: =BrandBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutGap: =Gap
                  PaddingLeft: =Pad
                  PaddingRight: =Pad
                Children:
                  - fdHeaderName:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: ="Waypoint"
                        Size: =TypeSubtitle
                        FontWeight: =FontWeight.Semibold
                        Font: =FontUI
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =BrandFg
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true
                  - fdHeaderQuarter:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width / 3
                        Height: =AppHeaderH
                        Text: =CurrentQuarter.Label & " · capacity planner"
                        Size: =TypeCaption
                        Font: =FontUI
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Color: =ColorFade(BrandFg, -0.2)
                        Wrap: =true
                        Overflow: =Overflow.Hidden
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        AutoHeight: =true

            # ---- shell: the rail, and the body beside it ----
            - fdMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutOverflowX: =LayoutOverflow.Hide
                  LayoutOverflowY: =LayoutOverflow.Hide
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                Children:

                  - fdRail:
                      Control: CanvasComponent
                      ComponentName: cmpRail
                      Properties:
                        LayoutMinWidth: =If(RailCollapsed, RailWidthTight, NavW)
                        Width: =If(RailCollapsed, RailWidthTight, NavW)
                        Height: =Parent.Height
                        Active: ="FrontDoor"

                  # ---- the body: the page head, the note and the screening queue ----
                  - fdBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowX: =LayoutOverflow.Hide
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Fill: =NeutralBg3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =Gap
                        PaddingLeft: =Pad
                        PaddingRight: =Pad
                        PaddingTop: =Pad
                        PaddingBottom: =Pad
                      Children:

                        # ---- page head: the eyebrow and the one h1 ----
                        - fdPageHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =PageHeadH
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                            Children:
                              - fdEyebrow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeKickerLine
                                    Visible: =!IsCompact
                                    Text: ="Screen what the business has asked for"
                                    Size: =TypeCaption
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - fdTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeDisplayLine
                                    Text: ="Front door"
                                    Size: =TypeTitle
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg1
                                    Wrap: =true
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    AutoHeight: =true

                        # ---- the one line about the form, which is not in Waypoint ----
                        # The request form lives in the requester app or the SharePoint list
                        # (power/design-work-flow.md, section 5): Waypoint screens what arrives.
                        - fdNote:
                            Control: Label@2.5.1
                            Properties:
                              Height: =TypeBodyLine
                              Text: |
                                ="Requests are raised in the requester app or the SharePoint list, "
                                 & "not here. " & FrontDoorNewCount & " new to screen."
                              Size: =TypeBody
                              Font: =FontUI
                              Color: =NeutralFg2
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                              Overflow: =Overflow.Hidden
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0

                        # ---- screening: the queue the product owner works, oldest first ----
                        # New and Screened requests, the lifecycle in power/design-front-door.md,
                        # section 3. A row opens the screening panel over the right of the screen.
                        - fdScreenCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutOverflowX: =LayoutOverflow.Hide
                              LayoutOverflowY: =LayoutOverflow.Hide
                              FillPortions: =0
                              Height: =FrontDoorScreenCardH
                              Visible: |
                                =// The queue is the Waypoint Team's work, and the Waypoint Team role
                                 // will gate this section once the roles are in the environment; until
                                 // then everybody who can open the front door can see it.
                                 true
                              Fill: =NeutralBg1
                              BorderColor: =NeutralStroke1
                              BorderThickness: =1
                              RadiusTopLeft: =CardR
                              RadiusTopRight: =CardR
                              RadiusBottomLeft: =CardR
                              RadiusBottomRight: =CardR
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                              PaddingLeft: =Pad
                              PaddingRight: =Pad
                              PaddingTop: =Pad
                              PaddingBottom: =Pad
                            Children:
                              - fdScreenTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =TypeBodyLine
                                    Text: ="Screening · " & FrontDoorScreenCount
                                    Size: =TypeSubtitle
                                    FontWeight: =FontWeight.Semibold
                                    Font: =FontUI
                                    Color: =NeutralFg1
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - fdScreenHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    FillPortions: =0
                                    Width: =Max(Parent.Width - Pad * 2 - 16, 898)
                                    Height: =RowHeight
                                  Children:
                                    - fdScreenHeadRequester:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Requester"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadArea:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareArea, FrontDoorScrMinArea) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Business area"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadProduct:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.Width * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareProduct, FrontDoorScrMinProduct) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Product line"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.Width * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.Width * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareTitle, FrontDoorScrMinTitle) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Request"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadUrgency:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.Width * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.Width * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                             + Max(Parent.Width * FrontDoorScrShareTitle, FrontDoorScrMinTitle)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareUrgency, FrontDoorScrMinUrgency) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Urgency"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadRaised:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised) - 8
                                          Height: =TypeLabelLine
                                          Text: ="Raised"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenHeadStatus:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.Width * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.Width * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.Width * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.Width * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                             + Max(Parent.Width * FrontDoorScrShareTitle, FrontDoorScrMinTitle)
                                             + Max(Parent.Width * FrontDoorScrShareUrgency, FrontDoorScrMinUrgency)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: =Max(Parent.Width * FrontDoorScrShareStatus, FrontDoorScrMinStatus)
                                          Height: =TypeLabelLine
                                          Text: ="Request status"
                                          Size: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - fdScreenEmpty:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =RowHeight
                                    Visible: =FrontDoorScreenCount = 0
                                    Text: ="Nothing waiting. Every request has been decided."
                                    Size: =TypeBody
                                    Font: =FontUI
                                    Color: =NeutralFg2
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    Overflow: =Overflow.Hidden
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - fdScreenList:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Width: =Max(Parent.Width - Pad * 2, 914)
                                    Height: =FrontDoorScreenListH
                                    ShowScrollbar: =true
                                    TemplatePadding: =0
                                    FillPortions: =0
                                    Visible: =FrontDoorScreenCount > 0
                                    Items: =FrontDoorScreenQueue
                                    TemplateSize: =RowHeight
                                    AccessibleLabel: |
                                      ="Screening queue: every request still New or Screened, oldest "
                                       & "first, with the date it was raised, the requester, the area, "
                                       & "the product line, the request, its urgency and its status."
                                  Children:
                                    - fdScreenRowRequester:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester) - 8
                                          Height: =TypeBodyLine
                                          Text: =ThisItem.'Requester name'
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenRowArea:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareArea, FrontDoorScrMinArea) - 8
                                          Height: =TypeBodyLine
                                          Text: =ThisItem.'Business area'
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenRowProduct:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareProduct, FrontDoorScrMinProduct) - 8
                                          Height: =TypeBodyLine
                                          Text: =Text(ThisItem.'Product line')
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenRowTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareTitle, FrontDoorScrMinTitle) - 8
                                          Height: =TypeBodyLine
                                          Text: =ThisItem.Title
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg1
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenRowUrgency:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareTitle, FrontDoorScrMinTitle)
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareUrgency, FrontDoorScrMinUrgency) - 8
                                          Height: =TypeBodyLine
                                          Text: =Text(ThisItem.Urgency)
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    - fdScreenRowRaised:
                                        Control: Label@2.5.1
                                        Properties:
                                          X: =0
                                          Y: =(RowHeight - TypeBodyLine) / 2
                                          Width: =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised) - 8
                                          Height: =TypeBodyLine
                                          Text: =Text(ThisItem.'Created On', "[$-en-US]dd mmm yyyy")
                                          Size: =TypeBody
                                          Font: =FontUI
                                          Color: =NeutralFg2
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                                          Overflow: =Overflow.Hidden
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                    # The status badge: the tone is the ThemeColor alone and the word is
                                    # beside it, so nothing is said by colour only (power/RUNBOOK.md,
                                    # section 4, "Layout calibration").
                                    - fdScreenRowStatus:
                                        Control: Badge@0.0.24
                                        Properties:
                                          X: |
                                            =Max(Parent.TemplateWidth * FrontDoorScrShareRaised, FrontDoorScrMinRaised)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareRequester, FrontDoorScrMinRequester)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareArea, FrontDoorScrMinArea)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareProduct, FrontDoorScrMinProduct)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareTitle, FrontDoorScrMinTitle)
                                             + Max(Parent.TemplateWidth * FrontDoorScrShareUrgency, FrontDoorScrMinUrgency)
                                          Y: =(RowHeight - TypeLabelLine) / 2
                                          Width: |
                                            =With({t: Text(ThisItem.'Request status')}, Min(Max(Len(t) * 7 + 20, 56), 200))
                                          Height: =TypeLabelLine
                                          Appearance: ='BadgeCanvas.Appearance'.Filled
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |
                                            =Switch(Text(ThisItem.'Request status'),
                                                    "New", 'BadgeCanvas.ThemeColor'.Brand,
                                                    'BadgeCanvas.ThemeColor'.Informative)
                                          Content: =Text(ThisItem.'Request status')
                                          FontSize: =TypeCaption
                                          FontWeight: =FontWeight.Semibold
                                          Font: =FontUI
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                    # The row is the target: the whole row opens the screening panel, as the
                                    # person rows on Team do (power/RUNBOOK.md, section 4, "Forms").
                                    - fdScreenRowHit:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          X: =2
                                          Y: =2
                                          Width: =Parent.TemplateWidth - 4
                                          Height: =RowHeight - 4
                                          Text: =""
                                          Fill: =RGBA(0, 0, 0, 0)
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          FocusedBorderThickness: =2
                                          TabIndex: =0
                                          Tooltip: ="Screen " & ThisItem.Title
                                          FocusedBorderColor: =FocusStroke
                                          OnSelect: |
                                            =Set(varFrontDoorScreen, ThisItem);
                                             Set(varFrontDoorScreenError, "");
                                             Set(varFrontDoorScreenOpen, true);
                                             // every input starts from its Default, not the last open
                                             Reset(fdScrFieldNotes);
                                             Reset(fdScrFieldCategory);
                                             Reset(fdScrFieldReason)

      # ---- screening: the scrim, then the panel over the right of the screen ----
      # The person panel's pattern (power/RUNBOOK.md, section 4, "Forms"), read-only
      # over the request's own answers, with the four moves the product owner has.
      - fdScreenScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.4)
            Visible: =varFrontDoorScreenOpen
          Children:
            # A container takes no OnSelect (Studio PA2108), so the scrim's own dismiss is
            # a transparent button over the whole of it. It closes and changes nothing.
            - fdScreenScrimHit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.Width - 4
                  Height: =Parent.Height - 4
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  TabIndex: =0
                  Tooltip: ="Close the screening panel"
                  FocusedBorderColor: =FocusStroke
                  OnSelect: =Set(varFrontDoorScreenOpen, false)
      - fdScreenPanel:
          Control: GroupContainer@1.5.0
