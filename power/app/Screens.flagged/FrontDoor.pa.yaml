            - fdScrFieldCategory:
                Control: ModernDropdown@1.0.2
                Properties:
                  X: =Pad
                  Y: =Parent.Height - FrontDoorScreenFootH + FormFieldStep + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Items: =FrontDoorDeclineCategoryOptions
                  ItemDisplayText: =ThisItem.Value
                  Font: =FontUI
                  Size: =TypeBodyPx
                  Color: =NeutralFg1
                  BasePaletteColor: =BrandBg
                  AccessibleLabel: ="Decline category, required to decline"
                  Appearance: =Appearance.Outline
                  Fill: =NeutralBg1
            - fdScrLblReason:
                Control: Label@2.5.1
                Properties:
                  X: =Pad
                  Y: =Parent.Height - FrontDoorScreenFootH + FormFieldStep * 2
                  Width: =Parent.Width - Pad * 2
                  Height: =TypeLabelLine
                  Text: ="Decline reason, required to decline"
                  Size: =TypeCaption
                  FontWeight: =FontWeight.Semibold
                  Font: =FontUI
                  Color: =NeutralFg2
                  Wrap: =false
                  Overflow: =Overflow.Hidden
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
            - fdScrFieldReason:
                Control: ModernTextInput@1.1.1
                Properties:
                  X: =Pad
                  Y: =Parent.Height - FrontDoorScreenFootH + FormFieldStep * 2 + TypeLabelLine + 4
                  Width: =Parent.Width - Pad * 2
                  Height: =ControlHeight
                  Default: =""
                  Placeholder: ="What you would tell the requester"
                  Font: =FontUI
